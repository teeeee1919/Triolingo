    sections: [
      /* ───────── 1. 복소수 ───────── */
      {
        title: '복소수',
        body: r`
<p class="lead-line">제곱해서 $-1$ 이 되는 새로운 수 $i$ 를 만들면, 실수로는 풀 수 없던 방정식도 풀 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p>실수끼리는 제곱하면 항상 $0$ 이상이라서 $x^2=-1$ 을 만족하는 실수 $x$ 는 없습니다. 그래서 <strong>제곱하여 $-1$ 이 되는 수</strong>를 하나 약속하고 <strong>허수단위 $i$</strong> 라 부릅니다.</p>
<p>$$i^2=-1,\qquad i=\sqrt{-1}$$</p>
<p><strong>복소수</strong>란 실수 $a,b$ 와 $i$ 로 만든 $a+bi$ 꼴의 수입니다. $a$ 를 <strong>실수부분</strong>, $b$ 를 <strong>허수부분</strong>이라 해요. ($bi$ 가 아니라 $b$ 입니다!)</p>
<ul>
<li>$b=0$ 이면 실수: $3+0i=3$</li>
<li>$b\ne0$ 이면 <strong>허수</strong>: $2+3i,\ -i,\ 5i$ 등</li>
<li>$a=0$, $b\ne0$ 이면 <strong>순허수</strong>: $5i,\ -2i$ (실수부분이 0인 허수)</li>
</ul>
<p>수의 포함 관계: 실수 ⊂ 복소수, 허수 ⊂ 복소수. 복소수 $=$ 실수 $+$ 허수.</p>
</div>

<div class="def"><strong class="label">복소수의 상등과 켤레복소수</strong>
<p><strong>두 복소수가 같다</strong>는 것은 실수부분끼리, 허수부분끼리 각각 같다는 뜻입니다.</p>
<div class="formula">$$a+bi=c+di \iff a=c,\ b=d\quad(a,b,c,d\text{는 실수})$$
$$a+bi=0 \iff a=0,\ b=0$$</div>
<p><strong>켤레복소수</strong>는 허수부분의 부호만 바꾼 수입니다.</p>
<div class="formula">$$\overline{a+bi}=a-bi$$</div>
</div>

<div class="formula">
$$(a+bi)+(c+di)=(a+c)+(b+d)i$$
$$(a+bi)-(c+di)=(a-c)+(b-d)i$$
$$(a+bi)(c+di)=(ac-bd)+(ad+bc)i$$
$$\frac{a+bi}{c+di}=\frac{(a+bi)(c-di)}{(c+di)(c-di)}=\frac{(ac+bd)+(bc-ad)i}{c^2+d^2}$$
</div>
<ul>
<li>덧셈·뺄셈: 실수부분끼리, 허수부분끼리 계산합니다. ($i$ 를 "문자"처럼 동류항 정리)</li>
<li>곱셈: 다항식처럼 전개한 뒤 $i^2$ 을 $-1$ 로 바꿉니다.</li>
<li>나눗셈: 분모의 <strong>켤레복소수</strong>를 분자·분모에 곱해 분모를 실수로 만듭니다.</li>
</ul>

<div class="why"><strong class="label">왜 켤레복소수를 곱할까?</strong>
<p>$(c+di)(c-di)=c^2-(di)^2=c^2-d^2i^2=c^2+d^2$ 으로 <strong>실수</strong>가 됩니다. 곱셈공식 $(a+b)(a-b)=a^2-b^2$ 에서 $i^2=-1$ 이라 마이너스가 사라지는 거예요. 분모가 실수가 되면 평소처럼 나눌 수 있습니다. (무리수 $\frac{1}{\sqrt2}$ 의 분모를 유리화하는 것과 똑같은 아이디어예요.)</p>
</div>

<div class="def"><strong class="label">음수의 제곱근</strong>
<p>$a\gt0$ 일 때 $\sqrt{-a}=\sqrt a\,i$ 로 정의합니다. 예: $\sqrt{-4}=2i,\ \sqrt{-3}=\sqrt3\,i$.</p>
<p>또한 $-a$ 의 제곱근은 $\pm\sqrt a\,i$ 두 개입니다.</p>
</div>

<div class="def"><strong class="label">$i$ 의 거듭제곱</strong>
<div class="formula">$$i^1=i,\quad i^2=-1,\quad i^3=-i,\quad i^4=1,\quad i^5=i,\ \cdots$$</div>
<p>$4$ 개마다 같은 값이 반복되고, 연속한 네 항의 합 $i+i^2+i^3+i^4=0$ 입니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$(3+2i)+(1-5i)$ 와 $(3+2i)-(1-5i)$ 를 계산하시오.</p>
<div class="exa">
<p>더하기: 실수부분 $3+1=4$, 허수부분 $2-5=-3$ → $4-3i$</p>
<p>빼기: 괄호를 풀면 $3+2i-1+5i$ (뒤 괄호 앞 마이너스는 모든 항의 부호를 바꿉니다). 실수부분 $3-1=2$, 허수부분 $2+5=7$ → $2+7i$</p>
<p><strong>답: $4-3i$, $2+7i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">$(2+3i)(4-i)$ 를 계산하시오.</p>
<div class="exa">
<p>분배법칙으로 전개합니다: $2\cdot4+2\cdot(-i)+3i\cdot4+3i\cdot(-i)=8-2i+12i-3i^2$</p>
<p>$i^2=-1$ 이므로 $-3i^2=+3$. 실수부분 $8+3=11$, 허수부분 $-2+12=10$.</p>
<p><strong>답: $11+10i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">$\dfrac{3+i}{1-2i}$ 를 $p+qi$ 꼴로 나타내시오.</p>
<div class="exa">
<p>분모 $1-2i$ 의 켤레복소수 $1+2i$ 를 분자·분모에 곱합니다.</p>
<p>분모: $(1-2i)(1+2i)=1+4=5$</p>
<p>분자: $(3+i)(1+2i)=3+6i+i+2i^2=3+7i-2=1+7i$</p>
<p>따라서 $\dfrac{1+7i}{5}=\dfrac15+\dfrac75 i$</p>
<p><strong>답: $\dfrac15+\dfrac75i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (상등 조건)</strong>
<p class="exq">실수 $x,y$ 에 대하여 $(x+y)+(x-y)i=5+i$ 일 때 $x,y$ 의 값을 구하시오.</p>
<div class="exa">
<p>실수부분끼리 같고 허수부분끼리 같아야 하므로 $x+y=5$, $x-y=1$.</p>
<p>두 식을 더하면 $2x=6$, $x=3$. 그러면 $y=2$.</p>
<p><strong>답: $x=3,\ y=2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (실수·순허수 조건)</strong>
<p class="exq">복소수 $z=(x^2-4)+(x+2)i$ ($x$ 는 실수)가 (1) 실수, (2) 순허수가 되도록 하는 $x$ 의 값을 구하시오.</p>
<div class="exa">
<p>(1) 실수이려면 허수부분이 $0$: $x+2=0$ → $x=-2$.</p>
<p>(2) 순허수이려면 실수부분 $=0$ <strong>이고</strong> 허수부분 $\ne0$: $x^2-4=0$ → $x=\pm2$, 그런데 $x+2\ne0$ 이므로 $x\ne-2$. 따라서 $x=2$.</p>
<p><strong>답: (1) $-2$ (2) $2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 ($i$ 의 거듭제곱)</strong>
<p class="exq">$i+i^2+i^3+\cdots+i^{10}$ 의 값을 구하시오.</p>
<div class="exa">
<p>연속한 4개의 합은 $0$ 입니다. $10=4\times2+2$ 이므로 처음 8개는 $0$ 이고 남는 건 $i^9+i^{10}$ 입니다.</p>
<p>$i^9=i,\ i^{10}=-1$ 이므로 합은 $i-1$.</p>
<p><strong>답: $-1+i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (켤레복소수의 활용)</strong>
<p class="exq">$z=2-3i$ 일 때 $z+\bar z$, $z\bar z$ 의 값을 구하시오.</p>
<div class="exa">
<p>$\bar z=2+3i$.</p>
<p>$z+\bar z=(2-3i)+(2+3i)=4$ (허수부분이 사라져요)</p>
<p>$z\bar z=(2-3i)(2+3i)=4-9i^2=4+9=13$</p>
<p><strong>답: $4$, $13$</strong> (일반적으로 $z+\bar z=2a$, $z\bar z=a^2+b^2$ 는 항상 실수)</p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$\sqrt{-2}\sqrt{-3}=\sqrt{6}$ 이 <strong>아닙니다</strong>. $\sqrt2i\cdot\sqrt3i=\sqrt6i^2=-\sqrt6$. 근호 안이 음수일 때는 반드시 먼저 $i$ 로 꺼낸 뒤 계산하세요.</li>
<li>허수부분은 $bi$ 가 아니라 $b$ 입니다. ($3+4i$ 의 허수부분은 $4$)</li>
<li>$i^2=-1$ 을 곱셈 뒤에 바꾸는 것을 잊고 $+3i^2$ 를 그대로 남겨두는 실수가 많아요.</li>
<li>허수끼리는 크기를 비교할 수 없습니다. $2+i\gt1+i$ 같은 표현은 쓰지 않아요. (실수일 때만 대소 비교 가능)</li>
<li>순허수 조건에서 "실수부분 $0$" 만 쓰고 "허수부분 $\ne0$" 을 빠뜨리지 마세요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>$i$ 의 거듭제곱은 4개 주기</strong>로 반복됩니다.</p>
<div class="formula">$$i,\ -1,\ -i,\ 1,\ i,\ -1,\ \cdots$$</div>
<p>지수를 <strong>4로 나눈 나머지</strong>만 보세요. 나머지가 0이면 1, 1이면 $i$, 2이면 $-1$, 3이면 $-i$ 입니다. (큰 수는 끝 두 자리만 봐도 돼요: 100은 4의 배수이므로)</p>
<p>분모에 복소수가 있으면 <strong>켤레복소수를 분모·분자에 곱해</strong> 실수로 만듭니다.</p>
<p><strong>자주 나오는 값은 외워 두세요.</strong></p>
<ul>
<li>$(1+i)^2=2i,\quad (1-i)^2=-2i$</li>
<li>$\dfrac{1+i}{1-i}=i,\quad \dfrac{1-i}{1+i}=-i$</li>
<li>$\dfrac1i=-i$ (분모·분자에 $i$ 를 곱하면 $\frac{i}{i^2}=-i$)</li>
</ul>
<p>그래서 $(1+i)^8=(2i)^4=16$, $\left(\dfrac{1+i}{1-i}\right)^{50}=i^{50}=i^2=-1$ 처럼 암산이 됩니다.</p>
<p>$z+\bar z=2a$, $z\bar z=a^2+b^2$ 은 근과 계수의 관계에서도 쓰입니다.</p>`
      },

      /* ───────── 2. 이차방정식과 판별식 ───────── */
      {
        title: '이차방정식과 판별식',
        body: r`
<p class="lead-line">근의 공식으로 이차방정식을 풀고, 판별식 $D$ 의 부호만 보면 근의 종류를 풀지 않고도 알 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>이차방정식</strong>은 $ax^2+bx+c=0$ ($a\ne0$, 계수는 실수) 꼴의 방정식이고, 이 식을 참이 되게 하는 $x$ 값을 <strong>근</strong>(해)이라 합니다. 근을 모두 구하는 것을 "방정식을 푼다"고 해요.</p>
<p>풀이 방법은 크게 세 가지입니다. ① 인수분해 ② 완전제곱식 ③ <strong>근의 공식</strong>. 어떤 이차방정식이든 근의 공식으로는 풀 수 있습니다. 복소수를 배웠으므로 이제 <strong>허근</strong>(허수인 근)까지 모두 구해요.</p>
</div>

<div class="formula">
$$ax^2+bx+c=0\ \Longrightarrow\ x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$$
$$b=2b'\ \text{일 때}\quad x=\frac{-b'\pm\sqrt{b'^2-ac}}{a}$$
</div>

<div class="why"><strong class="label">근의 공식은 어디서 나왔을까?</strong>
<p>완전제곱식 만들기를 문자로 한 것뿐이에요.</p>
<p>$ax^2+bx+c=0$ → 양변을 $a$ 로 나눔: $x^2+\dfrac ba x=-\dfrac ca$</p>
<p>양변에 $\left(\dfrac{b}{2a}\right)^2$ 을 더함: $\left(x+\dfrac b{2a}\right)^2=\dfrac{b^2-4ac}{4a^2}$</p>
<p>제곱근을 취함: $x+\dfrac b{2a}=\pm\dfrac{\sqrt{b^2-4ac}}{2a}$ → $x=\dfrac{-b\pm\sqrt{b^2-4ac}}{2a}$</p>
<p>이때 근호 안의 $b^2-4ac$ 가 근의 성질을 결정하므로 이것에 이름을 붙인 게 <strong>판별식</strong>입니다.</p>
</div>

<div class="def"><strong class="label">판별식 $D=b^2-4ac$</strong>
<p>계수가 실수일 때 다음이 성립합니다.</p>
<ul>
<li>$D\gt0$ : 서로 다른 두 <strong>실근</strong></li>
<li>$D=0$ : <strong>중근</strong> (같은 실근 두 개, $x=-\frac{b}{2a}$)</li>
<li>$D\lt0$ : 서로 다른 두 <strong>허근</strong> (서로 켤레)</li>
</ul>
<p>$D\ge0$ 이면 실근을 가진다고 표현해요. 특히 $D$ 가 <strong>완전제곱수</strong>이면(계수가 유리수일 때) 근이 유리수라서 인수분해가 됩니다.</p>
</div>

<div class="def"><strong class="label">이차함수와의 연결</strong>
<p>$y=ax^2+bx+c$ 의 그래프가 $x$ 축과 만나는 점의 $x$ 좌표가 곧 $ax^2+bx+c=0$ 의 실근입니다.</p>
<ul>
<li>$D\gt0$ : $x$ 축과 서로 다른 두 점에서 만남</li>
<li>$D=0$ : $x$ 축에 접함 (한 점)</li>
<li>$D\lt0$ : $x$ 축과 만나지 않음</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1 (인수분해)</strong>
<p class="exq">$x^2-5x+6=0$ 을 푸시오.</p>
<div class="exa">
<p>곱이 $6$, 합이 $-5$ 인 두 수는 $-2,-3$ 이므로 $(x-2)(x-3)=0$.</p>
<p>(곱이 0이면 둘 중 하나는 0) → $x=2$ 또는 $x=3$.</p>
<p><strong>답: $x=2$ 또는 $x=3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (근의 공식)</strong>
<p class="exq">$2x^2+3x-1=0$ 을 푸시오.</p>
<div class="exa">
<p>$a=2,\ b=3,\ c=-1$ 이므로 $D=9-4\cdot2\cdot(-1)=9+8=17$.</p>
<p>$x=\dfrac{-3\pm\sqrt{17}}{4}$</p>
<p><strong>답: $x=\dfrac{-3\pm\sqrt{17}}{4}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (허근)</strong>
<p class="exq">$x^2-6x+13=0$ 을 푸시오.</p>
<div class="exa">
<p>$b=-6$ 이 짝수이므로 $b'=-3$. $x=3\pm\sqrt{9-13}=3\pm\sqrt{-4}=3\pm2i$.</p>
<p><strong>답: $x=3\pm2i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (근의 종류 판별)</strong>
<p class="exq">다음 이차방정식의 근을 판별하시오. (1) $x^2-4x+4=0$ (2) $3x^2-2x+1=0$ (3) $x^2-x-1=0$</p>
<div class="exa">
<p>(1) $D=16-16=0$ → 중근 ($x=2$)</p>
<p>(2) $D=4-12=-8\lt0$ → 서로 다른 두 허근</p>
<p>(3) $D=1+4=5\gt0$ → 서로 다른 두 실근</p>
<p><strong>답: (1) 중근 (2) 허근 (3) 서로 다른 두 실근</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (중근 조건)</strong>
<p class="exq">$x^2+kx+k+3=0$ 이 중근을 갖도록 하는 실수 $k$ 의 값을 구하시오.</p>
<div class="exa">
<p>중근 조건은 $D=0$: $k^2-4(k+3)=0$ → $k^2-4k-12=0$ → $(k-6)(k+2)=0$.</p>
<p>$k=6$ 일 때 $x^2+6x+9=(x+3)^2$, $k=-2$ 일 때 $x^2-2x+1=(x-1)^2$ 로 모두 중근입니다.</p>
<p><strong>답: $k=6$ 또는 $k=-2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (근의 개수 조건)</strong>
<p class="exq">$x^2-2x+k=0$ 이 서로 다른 두 실근을 가질 때 $k$ 의 범위를 구하시오. 또 이차함수 $y=x^2-2x+k$ 의 그래프가 $x$ 축과 만나지 않을 때의 $k$ 범위는?</p>
<div class="exa">
<p>$D/4=b'^2-ac=1-k$.</p>
<p>서로 다른 두 실근: $1-k\gt0$ → $k\lt1$.</p>
<p>$x$ 축과 만나지 않음: $D\lt0$ → $1-k\lt0$ → $k\gt1$.</p>
<p><strong>답: $k\lt1$ ; $k\gt1$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (복소수 근이 주어진 경우)</strong>
<p class="exq">실수 $p,q$ 에 대하여 $x^2+px+q=0$ 의 한 근이 $2+i$ 일 때 $p+q$ 의 값을 구하시오.</p>
<div class="exa">
<p>계수가 실수이므로 켤레인 $2-i$ 도 근입니다. (허근은 켤레끼리 짝으로 나옵니다)</p>
<p>두 근의 합 $=4=-p$ → $p=-4$. 두 근의 곱 $=(2+i)(2-i)=5=q$.</p>
<p>$p+q=-4+5=1$</p>
<p><strong>답: $1$</strong></p>
<p>(다른 풀이: $2+i$ 를 대입 → $(3+4i)+p(2+i)+q=0$ → $(3+2p+q)+(4+p)i=0$ → $p=-4,\ q=5$)</p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$x^2$ 의 계수에 문자가 있을 때 "이차방정식이다"라는 조건이 없으면 $a=0$ (일차) 인 경우도 따로 살펴야 합니다.</li>
<li>"서로 다른 두 실근"은 $D\gt0$, "실근을 가진다"는 $D\ge0$ — 등호 포함 여부를 문제의 말에 맞추세요.</li>
<li>근의 공식에서 $-b$ 의 부호: $b=-6$ 이면 $-b=+6$.</li>
<li>$\pm$ 을 쓰고 약분할 때는 분자 전체를 나눠야 합니다. $\dfrac{4\pm2\sqrt3}{2}=2\pm\sqrt3$ (✕: $4\pm\sqrt3$)</li>
<li><strong>판별식은 계수가 실수일 때만</strong> 근의 종류 판정에 쓸 수 있어요. 계수에 $i$ 가 있으면 사용할 수 없습니다.</li>
<li>중근은 "근이 하나"가 아니라 "같은 근 두 개"입니다.</li>
</ul>
</div>`,
        tip: r`
<p>$b$ 가 짝수이면 <strong>$b'=b/2$</strong> 를 쓰는 공식이 계산이 훨씬 빠릅니다.</p>
<div class="formula">$$x=\frac{-b'\pm\sqrt{b'^2-ac}}{a},\qquad \frac D4=b'^2-ac$$</div>
<p>예: $x^2-6x+4=0$ 은 $b'=-3$ 이므로 $x=3\pm\sqrt{9-4}=3\pm\sqrt5$.</p>
<p>근의 공식에 대입하기 전에 <strong>먼저 인수분해가 되는지</strong> 확인하는 습관을 들이세요. ($x^2-5x+6$ 은 곱 6, 합 $-5$ 인 수를 찾으면 끝)</p>
<ul>
<li>$a+b+c=0$ 이면 $x=1$ 이 근, $a-b+c=0$ 이면 $x=-1$ 이 근입니다. ($3x^2-5x+2=0$ → $a+b+c=0$ 이므로 $x=1$, 다른 근은 $\frac ca=\frac23$)</li>
<li>분수·소수 계수는 양변에 공통분모(10, 100 등)를 곱해 <strong>정수 계수</strong>로 먼저 바꾸세요.</li>
<li>$k$ 가 들어간 문제는 <strong>$D$ 를 $k$ 에 대한 식</strong>으로 만들면 곧바로 부등식·방정식이 됩니다.</li>
</ul>`
      },

      /* ───────── 3. 근과 계수의 관계 ───────── */
      {
        title: '근과 계수의 관계',
        body: r`
<p class="lead-line">두 근을 직접 구하지 않아도, 계수만 보면 "두 근의 합과 곱"을 바로 알 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p>이차방정식 $ax^2+bx+c=0$ 의 두 근을 $\alpha,\beta$ 라 하면 <strong>두 근의 합</strong>과 <strong>두 근의 곱</strong>은 계수로 결정됩니다. 이 관계를 <strong>근과 계수의 관계</strong>라고 해요.</p>
</div>

<div class="formula">
$$\alpha+\beta=-\frac ba,\qquad \alpha\beta=\frac ca$$
$$\text{두 수 }\alpha,\beta\text{ 를 근으로 하고 }x^2\text{의 계수가 }1\text{인 방정식: } x^2-(\alpha+\beta)x+\alpha\beta=0$$
</div>

<div class="why"><strong class="label">왜 성립할까?</strong>
<p>두 근이 $\alpha,\beta$ 이면 $ax^2+bx+c=a(x-\alpha)(x-\beta)$ 로 인수분해됩니다. 오른쪽을 전개하면</p>
<p>$$a\{x^2-(\alpha+\beta)x+\alpha\beta\}=ax^2-a(\alpha+\beta)x+a\alpha\beta$$</p>
<p>왼쪽과 계수를 비교하면 $b=-a(\alpha+\beta)$, $c=a\alpha\beta$ 이므로 위 공식이 나옵니다.</p>
<p>(근의 공식으로도 확인: $\frac{-b+\sqrt D}{2a}+\frac{-b-\sqrt D}{2a}=-\frac ba$)</p>
</div>

<div class="def"><strong class="label">합과 곱으로 바꾸는 변형 공식</strong>
<div class="formula">
$$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta$$
$$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)$$
$$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$$
$$\frac1\alpha+\frac1\beta=\frac{\alpha+\beta}{\alpha\beta},\qquad \frac\alpha\beta+\frac\beta\alpha=\frac{\alpha^2+\beta^2}{\alpha\beta}$$
</div>
<p>식이 <strong>$\alpha,\beta$ 에 대해 대칭</strong>(서로 바꿔도 같은 식)이면 반드시 합과 곱만으로 나타낼 수 있습니다.</p>
</div>

<div class="def"><strong class="label">두 근의 부호 판정</strong>
<p>실근을 가지려면 $D\ge0$ 이고, 합·곱의 부호로 근의 부호를 알 수 있어요.</p>
<ul>
<li>두 근이 모두 양수: $D\ge0,\ \alpha+\beta\gt0,\ \alpha\beta\gt0$</li>
<li>두 근이 모두 음수: $D\ge0,\ \alpha+\beta\lt0,\ \alpha\beta\gt0$</li>
<li>두 근이 서로 다른 부호: $\alpha\beta\lt0$ (이때 $D$ 는 자동으로 양수)</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$2x^2-6x+3=0$ 의 두 근의 합과 곱을 구하시오.</p>
<div class="exa">
<p>$a=2,\ b=-6,\ c=3$.</p>
<p>합 $=-\dfrac ba=-\dfrac{-6}{2}=3$, 곱 $=\dfrac ca=\dfrac32$.</p>
<p><strong>답: 합 $3$, 곱 $\dfrac32$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (대칭식의 값)</strong>
<p class="exq">$x^2-5x+3=0$ 의 두 근을 $\alpha,\beta$ 라 할 때 (1) $\alpha^2+\beta^2$ (2) $\dfrac1\alpha+\dfrac1\beta$ (3) $(\alpha-\beta)^2$ (4) $\alpha^3+\beta^3$ 을 구하시오.</p>
<div class="exa">
<p>먼저 $\alpha+\beta=5,\ \alpha\beta=3$.</p>
<p>(1) $25-2\cdot3=19$</p>
<p>(2) $\dfrac{\alpha+\beta}{\alpha\beta}=\dfrac53$</p>
<p>(3) $25-4\cdot3=13$</p>
<p>(4) $5^3-3\cdot3\cdot5=125-45=80$</p>
<p><strong>답: (1) $19$ (2) $\dfrac53$ (3) $13$ (4) $80$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (방정식 만들기)</strong>
<p class="exq">두 수 $2,\ -5$ 를 근으로 하고 $x^2$ 의 계수가 $1$ 인 이차방정식을 구하시오.</p>
<div class="exa">
<p>합 $=2+(-5)=-3$, 곱 $=2\cdot(-5)=-10$.</p>
<p>$x^2-(\text{합})x+(\text{곱})=x^2-(-3)x+(-10)=x^2+3x-10$.</p>
<p><strong>답: $x^2+3x-10=0$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (무리수 근)</strong>
<p class="exq">$1+\sqrt2,\ 1-\sqrt2$ 를 두 근으로 하고 $x^2$ 의 계수가 $1$ 인 이차방정식을 구하시오.</p>
<div class="exa">
<p>합 $=2$. 곱 $=(1+\sqrt2)(1-\sqrt2)=1-2=-1$.</p>
<p><strong>답: $x^2-2x-1=0$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (새로운 두 근을 가진 방정식)</strong>
<p class="exq">$x^2-3x+1=0$ 의 두 근을 $\alpha,\beta$ 라 할 때 (1) $\alpha+1,\ \beta+1$ (2) $\alpha^2,\ \beta^2$ 을 두 근으로 하고 $x^2$ 의 계수가 $1$ 인 이차방정식을 구하시오.</p>
<div class="exa">
<p>$\alpha+\beta=3,\ \alpha\beta=1$.</p>
<p>(1) 새 합 $=(\alpha+1)+(\beta+1)=3+2=5$. 새 곱 $=(\alpha+1)(\beta+1)=\alpha\beta+(\alpha+\beta)+1=1+3+1=5$ → $x^2-5x+5=0$.</p>
<p>(2) 새 합 $=\alpha^2+\beta^2=9-2=7$. 새 곱 $=\alpha^2\beta^2=(\alpha\beta)^2=1$ → $x^2-7x+1=0$.</p>
<p><strong>답: (1) $x^2-5x+5=0$ (2) $x^2-7x+1=0$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (근의 비가 주어진 경우)</strong>
<p class="exq">$x^2-6x+k=0$ 의 두 근의 비가 $1:2$ 일 때 상수 $k$ 의 값을 구하시오.</p>
<div class="exa">
<p>두 근을 $m,\ 2m$ 이라 두면 합 $3m=6$ → $m=2$. 두 근은 $2,\ 4$.</p>
<p>곱 $k=2\cdot4=8$.</p>
<p><strong>답: $k=8$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (한 근이 허수)</strong>
<p class="exq">실수 계수 이차방정식 $x^2+px+q=0$ 의 한 근이 $1+2i$ 일 때 $p,q$ 를 구하시오.</p>
<div class="exa">
<p>다른 한 근은 켤레 $1-2i$. 합 $=2=-p$ → $p=-2$. 곱 $=(1+2i)(1-2i)=1+4=5=q$.</p>
<p><strong>답: $p=-2,\ q=5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (두 근이 모두 양수)</strong>
<p class="exq">$x^2-4x+k=0$ 이 서로 같거나 다른 두 양의 실근을 가질 때 $k$ 의 범위를 구하시오.</p>
<div class="exa">
<p>$D/4=4-k\ge0$ → $k\le4$.</p>
<p>합 $=4\gt0$ (항상 성립). 곱 $=k\gt0$.</p>
<p><strong>답: $0\lt k\le4$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>합의 부호: $\alpha+\beta=-\dfrac ba$ 에서 마이너스를 빼먹기 쉬워요. 곱은 $+\dfrac ca$ 입니다.</li>
<li>$x^2$ 의 계수가 $1$ 이 아닐 때는 $a$ 로 나누는 것을 잊지 마세요. ($2x^2-6x+3$ 의 곱은 $3$ 이 아니라 $\frac32$)</li>
<li>방정식을 만들 때 $x^2-(\text{합})x+(\text{곱})$ — 합 앞의 마이너스 주의.</li>
<li>합·곱 공식은 <strong>허근이어도</strong> 그대로 성립하지만, $\alpha^2+\beta^2\ge0$ 같은 실수 성질은 허근에서는 쓸 수 없어요.</li>
<li>두 근이 모두 양수라면서 $D\ge0$ 조건을 빠뜨리는 경우가 많습니다.</li>
</ul>
</div>`,
        tip: r`
<p>$\alpha^2+\beta^2$, $\dfrac1\alpha+\dfrac1\beta$ 같은 식은 모두 <strong>합과 곱으로 바꿔서</strong> 풉니다. 근을 직접 구해 대입하면 계산이 복잡하고 실수하기 쉬워요.</p>
<ul>
<li>$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta$</li>
<li>$\dfrac1\alpha+\dfrac1\beta=\dfrac{\alpha+\beta}{\alpha\beta}$</li>
<li>$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$</li>
<li>$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)$</li>
</ul>
<p>계수가 모두 실수인 방정식에서 한 근이 $p+qi$ 이면 <strong>켤레 $p-qi$ 도 근</strong>입니다. 이때 합 $=2p$, 곱 $=p^2+q^2$ 로 바로 정리돼요.</p>
<p>"새로운 두 근을 가진 방정식" 문제는 항상 <strong>① 원래 합·곱 구하기 → ② 새 합·곱 구하기 → ③ $x^2-(\text{새 합})x+(\text{새 곱})$</strong> 의 3단계로 풉니다.</p>
<p>두 근이 정수이고 합·곱이 주어지면 <strong>곱의 약수 쌍 중 합이 맞는 것</strong>을 찾으면 암산으로 끝나요.</p>`
      },

      /* ───────── 4. 이차부등식 ───────── */
      {
        title: '이차부등식',
        body: r`
<p class="lead-line">이차부등식은 "이차함수 그래프가 $x$ 축 위에 있는 구간 / 아래에 있는 구간"을 찾는 문제예요. 그래프를 그리면 외울 게 없습니다.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>이차부등식</strong>은 $ax^2+bx+c\gt0$ ($\ge0,\lt0,\le0$ 도 포함, $a\ne0$) 꼴의 부등식입니다. 부등식을 만족하는 $x$ 의 범위가 <strong>해</strong>예요.</p>
<p>핵심 아이디어: $y=ax^2+bx+c$ 의 그래프를 그려서</p>
<ul>
<li>$\gt0$ 의 해 → 그래프가 $x$ 축보다 <strong>위</strong>에 있는 $x$ 의 범위</li>
<li>$\lt0$ 의 해 → 그래프가 $x$ 축보다 <strong>아래</strong>에 있는 $x$ 의 범위</li>
</ul>
<p>먼저 $a\gt0$ 이 되도록 양변에 $-1$ 을 곱해(부등호 방향 반대!) 정리하면 편합니다.</p>
</div>

<div class="formula">
$$\alpha\lt\beta\ \text{일 때}\quad (x-\alpha)(x-\beta)\lt0 \iff \alpha\lt x\lt\beta$$
$$(x-\alpha)(x-\beta)\gt0 \iff x\lt\alpha\ \text{또는}\ x\gt\beta$$
</div>
<p>등호가 있는 경우($\le,\ \ge$)는 $x=\alpha,\ \beta$ 도 해에 포함합니다.</p>

<div class="def"><strong class="label">판별식에 따른 해 ($a\gt0$ 일 때)</strong>
<table>
<tr><th></th><th>$D\gt0$ (두 근 $\alpha\lt\beta$)</th><th>$D=0$ (중근 $\alpha$)</th><th>$D\lt0$</th></tr>
<tr><td>$ax^2+bx+c\gt0$</td><td>$x\lt\alpha$ 또는 $x\gt\beta$</td><td>$x\ne\alpha$ 인 모든 실수</td><td>모든 실수</td></tr>
<tr><td>$ax^2+bx+c\ge0$</td><td>$x\le\alpha$ 또는 $x\ge\beta$</td><td>모든 실수</td><td>모든 실수</td></tr>
<tr><td>$ax^2+bx+c\lt0$</td><td>$\alpha\lt x\lt\beta$</td><td>해 없음</td><td>해 없음</td></tr>
<tr><td>$ax^2+bx+c\le0$</td><td>$\alpha\le x\le\beta$</td><td>$x=\alpha$</td><td>해 없음</td></tr>
</table>
</div>

<div class="def"><strong class="label">항상 성립할 조건</strong>
<ul>
<li>모든 실수 $x$ 에 대하여 $ax^2+bx+c\gt0$ → $a\gt0$ <strong>이고</strong> $D\lt0$</li>
<li>모든 실수 $x$ 에 대하여 $ax^2+bx+c\ge0$ → $a\gt0$ 이고 $D\le0$</li>
<li>모든 실수 $x$ 에 대하여 $ax^2+bx+c\lt0$ → $a\lt0$ 이고 $D\lt0$</li>
<li>해가 존재하지 않는다 ($ax^2+bx+c\lt0$ 이 해가 없다) → 모든 $x$ 에서 $ax^2+bx+c\ge0$ 과 같으므로 $a\gt0,\ D\le0$</li>
</ul>
<p>$x^2$ 의 계수에 문자가 있으면 $a=0$ 인 경우(일차식, 상수)도 따로 확인하세요.</p>
</div>

<div class="def"><strong class="label">해가 주어진 부등식 거꾸로 만들기</strong>
<p>해가 $\alpha\lt x\lt\beta$ 이고 $x^2$ 의 계수가 $a\gt0$ 이면 부등식은 $a(x-\alpha)(x-\beta)\lt0$. 해가 $x\lt\alpha$ 또는 $x\gt\beta$ 이면 $a(x-\alpha)(x-\beta)\gt0$ ($a\gt0$).</p>
<p>해가 "두 근 사이"인 $\gt0$ 꼴이면 $a\lt0$ 입니다. 부등호 방향과 해의 모양으로 $a$ 의 부호부터 결정하세요.</p>
</div>

<div class="def"><strong class="label">연립이차부등식</strong>
<p>각 부등식의 해를 구한 뒤 <strong>수직선에서 공통부분</strong>을 찾습니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$x^2-x-6\lt0$ 의 해를 구하시오.</p>
<div class="exa">
<p>인수분해: $(x-3)(x+2)\lt0$. 두 근은 $-2,\ 3$.</p>
<p>아래로 볼록한 포물선이 $x$ 축 <strong>아래</strong>에 있는 구간 = 두 근 사이.</p>
<p><strong>답: $-2\lt x\lt3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">$x^2-4x+3\ge0$ 의 해를 구하시오.</p>
<div class="exa">
<p>$(x-1)(x-3)\ge0$. 근은 $1,\ 3$. $x$ 축 위(또는 접함) = 바깥쪽, 등호 포함.</p>
<p><strong>답: $x\le1$ 또는 $x\ge3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 ($x^2$ 의 계수가 음수)</strong>
<p class="exq">$-x^2+2x+3\gt0$ 의 해를 구하시오.</p>
<div class="exa">
<p>양변에 $-1$ 을 곱하면 부등호가 바뀝니다: $x^2-2x-3\lt0$.</p>
<p>$(x-3)(x+1)\lt0$ → $-1\lt x\lt3$.</p>
<p><strong>답: $-1\lt x\lt3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (중근)</strong>
<p class="exq">$x^2-4x+4$ 에 대하여 $\gt0,\ \ge0,\ \lt0,\ \le0$ 의 해를 각각 구하시오.</p>
<div class="exa">
<p>$x^2-4x+4=(x-2)^2\ge0$ 이고 $x=2$ 일 때만 $0$.</p>
<p>$\gt0$: $x\ne2$인 모든 실수 / $\ge0$: 모든 실수 / $\lt0$: 해 없음 / $\le0$: $x=2$</p>
<p><strong>답: 위와 같음</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 ($D\lt0$)</strong>
<p class="exq">$x^2+2x+5\gt0$ 의 해를 구하시오.</p>
<div class="exa">
<p>$D/4=1-5=-4\lt0$ 이고 $a=1\gt0$ → 그래프가 $x$ 축 위에만 있습니다. (또는 $(x+1)^2+4\gt0$)</p>
<p><strong>답: 모든 실수</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (해가 주어진 경우)</strong>
<p class="exq">$x^2+px+q\lt0$ 의 해가 $-1\lt x\lt3$ 일 때 $p+q$ 의 값을 구하시오.</p>
<div class="exa">
<p>$x^2$ 의 계수가 $1$ 이므로 $(x+1)(x-3)\lt0$, 즉 $x^2-2x-3\lt0$.</p>
<p>$p=-2,\ q=-3$ → $p+q=-5$.</p>
<p><strong>답: $-5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (해가 주어지고 $x^2$ 계수가 음수)</strong>
<p class="exq">$-x^2+ax+b\gt0$ 의 해가 $-1\lt x\lt4$ 일 때 $a+b$ 의 값을 구하시오.</p>
<div class="exa">
<p>해가 $-1\lt x\lt4$ 인 $x^2$ 계수 $1$ 의 부등식은 $(x+1)(x-4)\lt0$, 즉 $x^2-3x-4\lt0$.</p>
<p>양변에 $-1$ 을 곱하면 $-x^2+3x+4\gt0$ → $a=3,\ b=4$.</p>
<p><strong>답: $a+b=7$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (항상 성립)</strong>
<p class="exq">모든 실수 $x$ 에 대하여 $x^2-2kx+k+2\gt0$ 이 성립하도록 하는 $k$ 의 범위를 구하시오.</p>
<div class="exa">
<p>$a=1\gt0$ 이므로 $D\lt0$ 이면 됩니다. $D/4=k^2-(k+2)\lt0$.</p>
<p>$k^2-k-2\lt0$ → $(k-2)(k+1)\lt0$ → $-1\lt k\lt2$.</p>
<p><strong>답: $-1\lt k\lt2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (연립부등식)</strong>
<p class="exq">$\begin{cases}x^2-x-6\lt0\\ x^2-4\gt0\end{cases}$ 의 해를 구하시오.</p>
<div class="exa">
<p>첫째: $(x-3)(x+2)\lt0$ → $-2\lt x\lt3$.</p>
<p>둘째: $(x-2)(x+2)\gt0$ → $x\lt-2$ 또는 $x\gt2$.</p>
<p>수직선에서 겹치는 부분: $2\lt x\lt3$.</p>
<p><strong>답: $2\lt x\lt3$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$x^2$ 의 계수가 음수일 때 그대로 "아래로 볼록"이라 생각하고 해를 읽는 실수. 반드시 $a\gt0$ 로 바꾸거나 그래프의 모양을 확인하세요.</li>
<li>$-1$ 을 곱할 때 <strong>부등호 방향</strong>을 바꾸지 않는 실수.</li>
<li>$\lt0$ 의 답을 "$x\lt\alpha$ 또는 $x\gt\beta$" 로 쓰는 등 부호와 구간의 대응을 반대로 외우는 것. 그래프로 확인하세요.</li>
<li>"또는" 과 "이고(사이)" 를 혼동: 바깥쪽은 <strong>$x\lt\alpha$ 또는 $x\gt\beta$</strong> 이지 $\beta\lt x\lt\alpha$ 같은 식으로 묶을 수 없습니다.</li>
<li>항상 성립 조건에서 $D\lt0$ 만 쓰고 $a\gt0$ 을 빠뜨리는 실수.</li>
<li>연립부등식에서 두 해를 합쳐서(또는) 쓰는 실수 — 공통부분이어야 합니다.</li>
</ul>
</div>`,
        tip: r`
<p>외울 필요 없이 <strong>"아래로 볼록한 포물선을 그린다"</strong> 하나면 됩니다.</p>
<p>$\lt0$ 이면 그래프가 $x$ 축 <strong>아래</strong>인 구간(두 근 사이), $\gt0$ 이면 <strong>위</strong>인 구간(바깥쪽)입니다. 부호가 헷갈리면 그래프를 5초만 그려 보세요.</p>
<ul>
<li>$x^2$ 의 계수가 음수이면 <strong>먼저 $-1$ 을 곱해</strong> 계수를 양수로 만들고(부등호 반대) 시작하세요.</li>
<li>두 근 사이 = "$\lt$ 한 방향", 바깥 = "$\gt$ 한 방향": $(x-\alpha)(x-\beta)$ 에서 $\lt$ 면 한 구간, $\gt$ 면 두 구간.</li>
<li>해가 $\alpha\le x\le\beta$ 인 부등식 → $(x-\alpha)(x-\beta)\le0$ 으로 바로 만들 수 있어요.</li>
<li>항상 성립 문제는 <strong>$a$ 의 부호 + $D$ 의 부호</strong> 두 가지만 확인하면 끝입니다. 문제의 $\gt$ 가 $\ge$ 이면 $D\le0$ (등호 포함).</li>
<li>인수분해가 안 되면 $D$ 로 먼저 근의 유무를 체크하세요. $D\lt0$ 이면 곧바로 "모든 실수" 또는 "해 없음".</li>
</ul>`
      },

      /* ───────── 5. 이차방정식과 이차함수의 관계 ───────── */
      {
        title: '이차방정식과 이차함수의 관계',
        body: r`
<p class="lead-line">이차함수의 그래프와 $x$ 축(또는 직선)의 위치 관계는 이차방정식의 판별식으로 결정돼요.</p>

<div class="def"><strong class="label">개념</strong>
<p>이차함수 $y=ax^2+bx+c$ 의 그래프가 $x$ 축과 만나는 점의 $x$ 좌표는 이차방정식 $ax^2+bx+c=0$ 의 실근입니다. 그래서 $D=b^2-4ac$ 의 부호가 그래프와 $x$ 축의 위치 관계를 정해요.</p>
<ul>
<li>$D\gt0$ : 서로 다른 두 점에서 만난다</li>
<li>$D=0$ : 한 점에서 만난다 (<strong>접한다</strong>)</li>
<li>$D\lt0$ : 만나지 않는다</li>
</ul>
</div>

<div class="def"><strong class="label">이차함수와 직선의 위치 관계</strong>
<p>$y=ax^2+bx+c$ 와 $y=mx+n$ 의 교점의 $x$ 좌표는 $ax^2+bx+c=mx+n$, 즉 $ax^2+(b-m)x+(c-n)=0$ 의 실근입니다. 이 방정식의 판별식 $D$ 로 판단합니다. (포물선과 직선이 접할 때 $D=0$)</p>
</div>

<div class="def"><strong class="label">이차함수의 최대·최소</strong>
<p>$y=a(x-p)^2+q$ 꼴(표준형)로 바꾸면 꼭짓점이 $(p,\ q)$ 입니다.</p>
<ul>
<li>$a\gt0$ : $x=p$ 에서 최솟값 $q$ (최댓값 없음)</li>
<li>$a\lt0$ : $x=p$ 에서 최댓값 $q$ (최솟값 없음)</li>
</ul>
<p>$x$ 의 범위가 정해진 경우(예: $m\le x\le n$)에는 <strong>꼭짓점이 구간 안에 있는지</strong> 확인하고, 구간의 양 끝값과 꼭짓점 값을 비교해 최대·최소를 정합니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$y=x^2-4x+k$ 의 그래프가 $x$ 축과 서로 다른 두 점에서 만나도록 하는 $k$ 의 범위를 구하시오.</p>
<div class="exa">
<p>$D/4=4-k\gt0$ → $k\lt4$.</p>
<p><strong>답: $k\lt4$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (포물선과 직선)</strong>
<p class="exq">$y=x^2-2x+3$ 과 $y=2x+k$ 의 위치 관계를 $k$ 의 값에 따라 구하시오.</p>
<div class="exa">
<p>$x^2-2x+3=2x+k$ → $x^2-4x+(3-k)=0$. $D/4=4-(3-k)=1+k$.</p>
<p>$D\gt0$ ($k\gt-1$): 서로 다른 두 점에서 만남</p>
<p>$D=0$ ($k=-1$): 접함</p>
<p>$D\lt0$ ($k\lt-1$): 만나지 않음</p>
<p><strong>답: 위와 같음</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (최댓값·최솟값)</strong>
<p class="exq">$y=x^2-4x+1$ 의 최솟값을 구하고, $0\le x\le3$ 과 $3\le x\le5$ 에서의 최댓값·최솟값을 각각 구하시오.</p>
<div class="exa">
<p>$y=(x-2)^2-3$, 꼭짓점 $(2,\ -3)$. 전체 구간에서 최솟값은 $-3$.</p>
<p>$0\le x\le3$ : 꼭짓점($x=2$)이 구간 안. $y(0)=1,\ y(3)=-2,\ y(2)=-3$ → 최댓값 $1$, 최솟값 $-3$.</p>
<p>$3\le x\le5$ : 꼭짓점이 구간 밖(왼쪽). 이 구간에서 함수는 증가. $y(3)=-2,\ y(5)=6$ → 최솟값 $-2$, 최댓값 $6$.</p>
<p><strong>답: 최솟값 $-3$ ; (1) 최대 $1$, 최소 $-3$ (2) 최대 $6$, 최소 $-2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4</strong>
<p class="exq">$y=-x^2+2x+3$ 의 최댓값과 그때의 $x$ 를 구하시오.</p>
<div class="exa">
<p>$y=-(x^2-2x)+3=-(x-1)^2+1+3=-(x-1)^2+4$.</p>
<p>위로 볼록하므로 $x=1$ 에서 최댓값 $4$.</p>
<p><strong>답: $x=1$ 일 때 최댓값 $4$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>구간이 주어졌는데 꼭짓점의 값을 무조건 최대·최소로 쓰는 실수. 꼭짓점이 구간 밖이면 양 끝값만 비교합니다.</li>
<li>표준형 변환에서 $x^2$ 계수로 묶은 뒤 상수를 보정하지 않는 실수. ($-(x-1)^2+4$ 의 $+4$ 에 주의)</li>
<li>직선과 접하는 조건은 연립한 방정식의 $D=0$ — 그래프를 그린 눈대중으로 판단하지 마세요.</li>
</ul>
</div>`,
        tip: r`
<p>이차방정식 문제는 <strong>"그래프로 번역"</strong>하면 쉬워집니다. 실근 = $x$ 절편, 허근 = 그래프가 $x$ 축 위(또는 아래)에 떠 있음.</p>
<ul>
<li>꼭짓점 $x$ 좌표는 $-\dfrac b{2a}$ 로 바로 구합니다.</li>
<li>최솟값(또는 최댓값) $=-\dfrac{D}{4a}$ 도 외워 두면 편해요. ($y=x^2-4x+1$: $-\frac{16-4}{4}=-3$ ✓)</li>
<li>구간 최대·최소는 <strong>"구간 끝 두 값 + (구간 안이면) 꼭짓점"</strong> 세 후보 중에서 고르면 끝.</li>
</ul>`
      },

      /* ───────── 6. 삼차·사차방정식 ───────── */
      {
        title: '삼차방정식과 사차방정식',
        body: r`
<p class="lead-line">차수가 높아도 방법은 같아요. 인수분해(인수정리·조립제법)와 치환으로 이차 이하로 낮춰서 풉니다.</p>

<div class="def"><strong class="label">개념</strong>
<p>$x$ 에 대한 삼차식, 사차식이 $0$ 인 방정식을 각각 <strong>삼차방정식</strong>, <strong>사차방정식</strong>이라 합니다. 이를 <strong>고차방정식</strong>이라 하고, 복소수 범위에서 $n$ 차방정식은 (중근을 겹쳐서 세면) 항상 $n$ 개의 근을 갖습니다.</p>
<p>풀이의 큰 흐름: <strong>인수분해해서 $A\cdot B=0$ 꼴로 만들기</strong>. 곱이 $0$ 이면 어느 한 인수가 $0$ 이어야 하니까요.</p>
</div>

<div class="def"><strong class="label">풀이 방법 4가지</strong>
<ol>
<li><strong>공통인수·공식</strong>: 곱셈공식, 묶기 ($x^3-1=(x-1)(x^2+x+1)$)</li>
<li><strong>인수정리 + 조립제법</strong>: 상수항의 약수를 대입해 $f(a)=0$ 인 $a$ 를 찾고 $(x-a)$ 로 나눔</li>
<li><strong>치환</strong>: 공통 부분을 $t$ 로 바꿈 ($x^2=t$, $x^2+x=t$ 등)</li>
<li><strong>복이차식</strong>: $x^4+ax^2+b=0$ 은 $x^2=X$ 로 두고 이차방정식 풀이</li>
</ol>
</div>

<div class="def"><strong class="label">삼차방정식의 근과 계수의 관계</strong>
<p>$ax^3+bx^2+cx+d=0$ 의 세 근을 $\alpha,\beta,\gamma$ 라 하면</p>
<div class="formula">
$$\alpha+\beta+\gamma=-\frac ba,\quad \alpha\beta+\beta\gamma+\gamma\alpha=\frac ca,\quad \alpha\beta\gamma=-\frac da$$
</div>
</div>

<div class="def"><strong class="label">$x^3=1$ 의 허근 $\omega$ (오메가)</strong>
<p>$x^3-1=(x-1)(x^2+x+1)=0$ 이므로 $x^2+x+1=0$ 의 한 허근을 $\omega$ 라 하면:</p>
<div class="formula">
$$\omega^3=1,\qquad \omega^2+\omega+1=0,\qquad \omega+\bar\omega=-1,\quad \omega\bar\omega=1,\quad \bar\omega=\omega^2$$
</div>
<p>$\omega$ 의 거듭제곱은 $3$ 개씩 반복: $\omega,\ \omega^2,\ 1,\ \omega,\ \omega^2,\ 1,\ \cdots$ 이고 $1+\omega+\omega^2=0$.</p>
<div class="why"><strong class="label">왜 $\omega^3=1$ 일까?</strong>
<p>$\omega$ 는 $x^3-1=0$ 의 근이니까 $\omega^3=1$ 이고, $x\ne1$ 이므로 $(x-1)$ 쪽이 아니라 $x^2+x+1=0$ 쪽에서 $\omega^2+\omega+1=0$ 이 나옵니다.</p>
</div>
</div>

<div class="ex"><strong class="label">예시 1 (묶어서 인수분해)</strong>
<p class="exq">$x^3-x^2-4x+4=0$ 을 푸시오.</p>
<div class="exa">
<p>앞 두 항, 뒤 두 항을 묶습니다: $x^2(x-1)-4(x-1)=(x-1)(x^2-4)=(x-1)(x-2)(x+2)$.</p>
<p><strong>답: $x=1,\ 2,\ -2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (인수정리)</strong>
<p class="exq">$x^3-3x^2+x+1=0$ 을 푸시오.</p>
<div class="exa">
<p>상수항 $1$ 의 약수 $\pm1$ 을 대입: $f(1)=1-3+1+1=0$ → $(x-1)$ 이 인수.</p>
<p>조립제법(계수 $1,-3,1,1$, $k=1$): 몫의 계수 $1,\ -2,\ -1$ → $x^2-2x-1$.</p>
<p>따라서 $(x-1)(x^2-2x-1)=0$ → $x=1$ 또는 $x=1\pm\sqrt2$.</p>
<p><strong>답: $x=1,\ 1+\sqrt2,\ 1-\sqrt2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">$x^3-7x+6=0$ 을 푸시오.</p>
<div class="exa">
<p>$f(1)=1-7+6=0$ → $(x-1)$ 이 인수. 조립제법: $x^3+0x^2-7x+6$ 의 계수 $1,0,-7,6$ → 몫 $1,\ 1,\ -6$ → $x^2+x-6=(x+3)(x-2)$.</p>
<p><strong>답: $x=1,\ 2,\ -3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (복이차방정식)</strong>
<p class="exq">$x^4-5x^2+4=0$ 과 $x^4+x^2-6=0$ 을 푸시오.</p>
<div class="exa">
<p>(1) $x^2=X$ 로 두면 $X^2-5X+4=(X-1)(X-4)=0$ → $x^2=1$ 또는 $x^2=4$ → $x=\pm1,\ \pm2$.</p>
<p>(2) $X^2+X-6=(X+3)(X-2)=0$ → $x^2=2$ 또는 $x^2=-3$ → $x=\pm\sqrt2$ 또는 $x=\pm\sqrt3\,i$.</p>
<p><strong>답: (1) $\pm1,\ \pm2$ (2) $\pm\sqrt2,\ \pm\sqrt3\,i$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (치환)</strong>
<p class="exq">$(x^2+x)^2-8(x^2+x)+12=0$ 을 푸시오.</p>
<div class="exa">
<p>$x^2+x=t$ 로 치환: $t^2-8t+12=(t-2)(t-6)=0$ → $t=2$ 또는 $t=6$.</p>
<p>$x^2+x=2$ → $x^2+x-2=(x+2)(x-1)=0$ → $x=-2,\ 1$.</p>
<p>$x^2+x=6$ → $x^2+x-6=(x+3)(x-2)=0$ → $x=-3,\ 2$.</p>
<p><strong>답: $x=-3,\ -2,\ 1,\ 2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (삼차방정식의 근과 계수)</strong>
<p class="exq">$x^3-2x^2+3x-5=0$ 의 세 근을 $\alpha,\beta,\gamma$ 라 할 때 $\alpha^2+\beta^2+\gamma^2$ 의 값을 구하시오.</p>
<div class="exa">
<p>$\alpha+\beta+\gamma=2,\ \alpha\beta+\beta\gamma+\gamma\alpha=3$.</p>
<p>$\alpha^2+\beta^2+\gamma^2=(\alpha+\beta+\gamma)^2-2(\alpha\beta+\beta\gamma+\gamma\alpha)=4-6=-2$.</p>
<p><strong>답: $-2$</strong> (세 근 중에 허근이 있어서 제곱의 합이 음수가 될 수 있어요)</p>
</div></div>

<div class="ex"><strong class="label">예시 7 ($\omega$ 의 성질)</strong>
<p class="exq">$x^2+x+1=0$ 의 한 허근을 $\omega$ 라 할 때 (1) $\omega^{10}+\omega^5+1$ (2) $1+\omega+\omega^2+\cdots+\omega^{20}$ 의 값을 구하시오.</p>
<div class="exa">
<p>$\omega^3=1$ 이므로 지수를 $3$ 으로 나눈 나머지만 봅니다.</p>
<p>(1) $\omega^{10}=\omega^{1}=\omega$ ($10=3\cdot3+1$), $\omega^5=\omega^2$ ($5=3+2$) → $\omega+\omega^2+1=0$.</p>
<p>(2) 항이 $21$ 개이고 $3$ 개씩 묶으면 $(1+\omega+\omega^2)+\omega^3(1+\omega+\omega^2)+\cdots=0$ 이 $7$ 묶음.</p>
<p><strong>답: (1) $0$ (2) $0$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>조립제법에서 빠진 차수의 계수 $0$ 을 쓰지 않는 실수. ($x^3-7x+6$ → $1,\ 0,\ -7,\ 6$)</li>
<li>복이차식에서 $X=x^2$ 를 구한 뒤 $x$ 로 돌아가지 않고 끝내는 실수. (그리고 $x^2=-3$ 은 허수 $\pm\sqrt3 i$)</li>
<li>$x^3=1$ 에서 $x=1$ 하나만 쓰는 것. 허근 $\omega$ 두 개도 있습니다.</li>
<li>$\omega^2+\omega+1=0$ 은 허근 $\omega$ 일 때만 성립합니다. $x=1$ 이면 $1+1+1=3$ 이에요.</li>
<li>$x^2=-3$ 을 $x=\pm3i$ 로 쓰는 실수. 정확히는 $\pm\sqrt3\,i$.</li>
</ul>
</div>`,
        tip: r`
<p>인수 후보는 <strong>(상수항의 약수) / (최고차항 계수의 약수)</strong>. 최고차항 계수가 $1$ 이면 상수항의 약수 $\pm1,\pm2,\pm3,\cdots$ 만 대입해 보세요.</p>
<ul>
<li>계수의 합이 $0$ 이면 $x=1$ 이 근 ($f(1)=0$).</li>
<li>짝수차항의 합 $=$ 홀수차항의 합이면 $x=-1$ 이 근.</li>
<li>복이차식이 인수분해가 안 될 땐 $x^4+ax^2+b=(x^2+p)^2-(qx)^2$ 꼴로 만들어 보세요. (예: $x^4+4=(x^2+2)^2-4x^2=(x^2+2x+2)(x^2-2x+2)$)</li>
<li>$\omega$ 문제: 지수를 $3$ 으로 나눈 나머지로 줄이고, $1+\omega+\omega^2=0$ 으로 마무리.</li>
</ul>`
      },

      /* ───────── 7. 연립방정식 ───────── */
      {
        title: '연립방정식',
        body: r`
<p class="lead-line">미지수가 두 개인 연립방정식은 "한 문자를 없애서" 푸는 게 원칙이고, 이차식이 섞이면 대입이나 인수분해를 이용합니다.</p>

<div class="def"><strong class="label">개념</strong>
<p>두 개 이상의 방정식을 묶은 것을 <strong>연립방정식</strong>이라 하고, 모든 식을 동시에 만족하는 $(x,\ y)$ 의 값이 <strong>해</strong>입니다.</p>
<ul>
<li><strong>일차식 + 이차식</strong>: 일차식을 한 문자에 대해 정리해 이차식에 <strong>대입</strong> → 한 문자의 이차방정식</li>
<li><strong>이차식 + 이차식</strong>: 한쪽이 인수분해되면 일차식 두 개로 나눠서 각각 풀고, 아니면 합·곱 꼴로 정리해 이차방정식을 만듭니다.</li>
<li><strong>대칭 꼴</strong> ($x+y=s,\ xy=p$): $x,y$ 는 $t^2-st+p=0$ 의 두 근입니다.</li>
</ul>
</div>

<div class="def"><strong class="label">부정과 불능 (일차연립방정식)</strong>
<p>$\begin{cases}ax+by=c\\ a'x+b'y=c'\end{cases}$ 에서</p>
<ul>
<li>$\dfrac a{a'}\ne\dfrac b{b'}$ : 해가 <strong>오직 하나</strong></li>
<li>$\dfrac a{a'}=\dfrac b{b'}=\dfrac c{c'}$ : 해가 무수히 많음 → <strong>부정</strong></li>
<li>$\dfrac a{a'}=\dfrac b{b'}\ne\dfrac c{c'}$ : 해가 없음 → <strong>불능</strong></li>
</ul>
<p>(두 직선이 한 점에서 만남 / 겹침 / 평행 하는 경우입니다)</p>
</div>

<div class="ex"><strong class="label">예시 1 (합과 곱)</strong>
<p class="exq">$x+y=3,\ xy=2$ 를 푸시오.</p>
<div class="exa">
<p>$x,y$ 는 $t^2-3t+2=0$ 의 두 근: $(t-1)(t-2)=0$ → $t=1,\ 2$.</p>
<p><strong>답: $(x,y)=(1,2),\ (2,1)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (일차 + 이차)</strong>
<p class="exq">$x-y=1,\ x^2+y^2=13$ 을 푸시오.</p>
<div class="exa">
<p>$x=y+1$ 을 대입: $(y+1)^2+y^2=13$ → $2y^2+2y-12=0$ → $y^2+y-6=0$ → $(y+3)(y-2)=0$.</p>
<p>$y=2$ → $x=3$, $y=-3$ → $x=-2$.</p>
<p>확인: $3^2+2^2=13$ ✓, $(-2)^2+(-3)^2=13$ ✓.</p>
<p><strong>답: $(3,2),\ (-2,-3)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (곱을 이용)</strong>
<p class="exq">$x^2+y^2=10,\ xy=3$ 을 푸시오.</p>
<div class="exa">
<p>$(x+y)^2=x^2+y^2+2xy=10+6=16$ → $x+y=\pm4$.</p>
<p>$x+y=4,\ xy=3$: $t^2-4t+3=0$ → $t=1,3$ → $(1,3),\ (3,1)$.</p>
<p>$x+y=-4,\ xy=3$: $t^2+4t+3=0$ → $t=-1,-3$ → $(-1,-3),\ (-3,-1)$.</p>
<p><strong>답: $(1,3),\ (3,1),\ (-1,-3),\ (-3,-1)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (인수분해되는 식)</strong>
<p class="exq">$x^2-xy-2y^2=0,\ x^2+y^2=5$ 를 푸시오.</p>
<div class="exa">
<p>첫째 식을 인수분해: $(x-2y)(x+y)=0$ → $x=2y$ 또는 $x=-y$.</p>
<p>$x=2y$ 이면 $4y^2+y^2=5$ → $y^2=1$ → $y=\pm1$ → $(2,1),\ (-2,-1)$.</p>
<p>$x=-y$ 이면 $2y^2=5$ → $y=\pm\dfrac{\sqrt{10}}{2}$ → $\left(-\dfrac{\sqrt{10}}2,\ \dfrac{\sqrt{10}}2\right),\ \left(\dfrac{\sqrt{10}}2,\ -\dfrac{\sqrt{10}}2\right)$.</p>
<p><strong>답: 위의 네 쌍</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (부정과 불능)</strong>
<p class="exq">$x+2y=3,\ 2x+4y=6$ 과 $x+2y=3,\ 2x+4y=7$ 의 해를 각각 구하시오.</p>
<div class="exa">
<p>(1) 둘째 식은 첫째 식의 $2$ 배: $\frac12=\frac24=\frac36$ → 해가 무수히 많음 (부정).</p>
<p>(2) 둘째 식을 $2$ 로 나누면 $x+2y=\frac72$ 인데 첫째 식은 $x+2y=3$ → 모순. 해가 없음 (불능).</p>
<p><strong>답: (1) 부정 (2) 불능</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>한 문자 값만 구하고 짝(순서쌍)을 맞추지 않는 실수. 해는 $(x,y)$ <strong>쌍</strong>입니다.</li>
<li>$x^2=y^2$ 에서 $x=y$ 만 쓰는 실수. $x=y$ 또는 $x=-y$ 입니다.</li>
<li>$(x+y)^2=16$ 에서 $x+y=4$ 만 쓰는 실수. $\pm4$ 모두 고려해야 해요.</li>
<li>구한 값을 두 식에 다시 대입해 확인하지 않는 실수.</li>
</ul>
</div>`,
        tip: r`
<p>$x^2+y^2$, $xy$, $x+y$ 중 두 개가 주어지면 <strong>$(x+y)^2=x^2+y^2+2xy$, $(x-y)^2=x^2+y^2-2xy$</strong> 로 나머지 하나를 구하고 합·곱 방정식으로 바꾸세요.</p>
<ul>
<li>우변이 $0$ 인 식은 먼저 <strong>인수분해</strong>를 시도하세요. 일차식 둘로 쪼개지면 문제가 훨씬 단순해져요.</li>
<li>모든 항의 차수가 같은 식(동차식, 예: $x^2-xy-2y^2=0$)은 인수분해가 잘 됩니다.</li>
<li>대입 전에 가장 간단한 식에서 <strong>계수가 1인 문자</strong>를 골라 정리하세요.</li>
</ul>`
      },

      /* ───────── 8. 절대값을 포함한 부등식과 연립부등식 ───────── */
      {
        title: '절대값과 연립부등식',
        body: r`
<p class="lead-line">절대값은 "원점(또는 기준점)에서의 거리"라고 생각하면 식 변형이 쉬워져요.</p>

<div class="def"><strong class="label">개념</strong>
<p>실수 $a$ 의 <strong>절대값</strong> $|a|$ 는 수직선에서 원점과 $a$ 사이의 거리입니다.</p>
<div class="formula">$$|a|=\begin{cases}a&(a\ge0)\\ -a&(a\lt0)\end{cases}$$</div>
<p>$|x-a|$ 는 수직선 위에서 $x$ 와 $a$ 사이의 거리입니다.</p>
</div>

<div class="formula">
$$c\gt0\ \text{일 때}\quad |x|\lt c \iff -c\lt x\lt c$$
$$|x|\gt c \iff x\lt-c\ \text{또는}\ x\gt c$$
</div>
<ul>
<li>$|x-a|\lt c$ → $a-c\lt x\lt a+c$ (기준점에서 거리가 $c$ 보다 작은 구간)</li>
<li>$|x-a|\gt c$ → $x\lt a-c$ 또는 $x\gt a+c$</li>
</ul>

<div class="def"><strong class="label">부등식의 성질과 연립부등식</strong>
<ul>
<li>양변에 <strong>음수</strong>를 곱하거나 나누면 부등호의 방향이 바뀝니다.</li>
<li><strong>연립부등식</strong>은 각 부등식을 풀어 <strong>공통부분</strong>을 구합니다.</li>
<li>$A\lt B\lt C$ 꼴은 $A\lt B$ 와 $B\lt C$ 의 연립부등식으로 쪼개서 풉니다.</li>
</ul>
</div>

<div class="def"><strong class="label">절대값이 여러 개일 때 (구간 나누기)</strong>
<p>절댓값 안의 식이 $0$ 이 되는 $x$ 값을 기준으로 수직선을 나눈 뒤, 각 구간에서 절댓값 기호를 풀어 식을 세웁니다. 마지막에는 <strong>구한 값이 그 구간에 속하는지</strong> 반드시 확인합니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$|x-2|\lt3$ 을 푸시오.</p>
<div class="exa">
<p>$-3\lt x-2\lt3$ → 각 변에 $2$ 를 더하면 $-1\lt x\lt5$.</p>
<p>(수직선: $2$ 에서 거리가 $3$ 보다 작은 구간)</p>
<p><strong>답: $-1\lt x\lt5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">$|2x+1|\ge5$ 를 푸시오.</p>
<div class="exa">
<p>$2x+1\ge5$ 또는 $2x+1\le-5$.</p>
<p>$2x\ge4$ → $x\ge2$ / $2x\le-6$ → $x\le-3$.</p>
<p><strong>답: $x\le-3$ 또는 $x\ge2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (연립일차부등식)</strong>
<p class="exq">$\begin{cases}2x-1\gt3\\ 3x-2\le10\end{cases}$ 의 해를 구하시오.</p>
<div class="exa">
<p>첫째: $2x\gt4$ → $x\gt2$. 둘째: $3x\le12$ → $x\le4$.</p>
<p>공통부분: $2\lt x\le4$.</p>
<p><strong>답: $2\lt x\le4$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 ($A\lt B\lt C$ 꼴)</strong>
<p class="exq">$1\lt2x-1\le5$ 를 푸시오.</p>
<div class="exa">
<p>각 변에 $1$ 을 더하면 $2\lt2x\le6$, $2$ 로 나누면 $1\lt x\le3$.</p>
<p><strong>답: $1\lt x\le3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (절댓값이 두 개)</strong>
<p class="exq">$|x-1|+|x-3|=6$ 을 푸시오.</p>
<div class="exa">
<p>기준점 $x=1,\ 3$ 으로 구간을 나눕니다.</p>
<p>$x\lt1$: $(1-x)+(3-x)=4-2x=6$ → $x=-1$ ($x\lt1$ 만족)</p>
<p>$1\le x\lt3$: $(x-1)+(3-x)=2\ne6$ → 해 없음</p>
<p>$x\ge3$: $(x-1)+(x-3)=2x-4=6$ → $x=5$ ($x\ge3$ 만족)</p>
<p><strong>답: $x=-1$ 또는 $x=5$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$|x|\gt c$ 를 $-c\gt x\gt c$ 처럼 쓰는 실수. "또는"으로 이어야 합니다.</li>
<li>$c\lt0$ 일 때 $|x|\lt c$ 는 해가 없고, $|x|\gt c$ 는 모든 실수라는 점을 놓침.</li>
<li>음수를 곱하거나 나누고도 부등호를 안 바꾸는 실수.</li>
<li>구간을 나눠서 푼 뒤 <strong>구간 조건 확인</strong>을 빠뜨리는 실수.</li>
</ul>
</div>`,
        tip: r`
<p>$|x-a|$ 는 "$x$ 와 $a$ 의 거리"로 읽으세요. $|x-2|\lt3$ 은 <strong>"2에서 거리가 3 미만"</strong> → $2-3\lt x\lt2+3$ 이 바로 나옵니다.</p>
<ul>
<li>$|x-a|\le c$ → $a-c\le x\le a+c$ (등호 포함 그대로 따라감)</li>
<li>두 절댓값의 합 $|x-a|+|x-b|$ 의 <strong>최솟값은 $|a-b|$</strong> ($a$ 와 $b$ 사이에서 성립). 위 예시에서 최솟값 $2$ 였죠.</li>
<li>연립부등식은 반드시 <strong>수직선</strong>에 그려서 겹치는 부분을 찾으세요. 눈으로 확인하면 실수가 확 줄어요.</li>
</ul>`
      }
    ],
    examples: [
      {

/* 고1 수학 · 3. 경우의 수 (공통수학1) — 교과서·개념서 수준으로 확장한 개념 설명 */

      {
        title: '합의 법칙과 곱의 법칙',
        body: r`
<p class="lead-line">경우의 수의 모든 계산은 결국 "더할까, 곱할까?" 두 가지 선택입니다. "또는"이면 더하고, "그리고(차례로)"이면 곱해요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>사건</strong>: 주사위를 던져서 짝수의 눈이 나오는 것처럼, 어떤 일이 일어나는 것</li>
<li><strong>경우의 수</strong>: 어떤 사건이 일어날 수 있는 <strong>모든 가짓수</strong></li>
<li><strong>합의 법칙</strong>: 두 사건 $A,B$ 가 <em>동시에 일어나지 않을 때</em>, $A$ 가 일어나는 경우가 $m$ 가지, $B$ 가 일어나는 경우가 $n$ 가지이면 $A$ 또는 $B$ 가 일어나는 경우의 수는 $m+n$</li>
<li><strong>곱의 법칙</strong>: 사건 $A$ 가 일어나는 경우가 $m$ 가지이고, 그 각각에 대하여 사건 $B$ 가 일어나는 경우가 $n$ 가지이면 $A$ 와 $B$ 가 <em>잇달아</em> 일어나는 경우의 수는 $m\times n$</li>
</ul></div>

<div class="formula">
$$\text{합의 법칙: } m+n \qquad \text{곱의 법칙: } m\times n$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p><strong>곱의 법칙</strong>: 상의 3벌, 하의 2벌이 있을 때, 상의를 하나 고르면 그 각각에 하의 2가지가 붙으니 $3+3=3\times2=6$ 가지입니다. 곱셈은 "같은 수를 여러 번 더한 것"이에요.</p>
<p><strong>합의 법칙</strong>: 두 사건이 동시에 일어나지 않아야 하나하나 세었을 때 겹치지 않아서 단순히 더할 수 있습니다. 겹치는 경우가 있다면 중복해서 센 만큼 빼 줘야 해요.</p>
</div>

<p><strong>① 합의 법칙 — 주사위의 눈의 합</strong></p>
<p>서로 다른 두 개의 주사위를 던질 때 눈의 수의 합이 $s$ 가 되는 경우는 $(a,b)$ 순서쌍을 하나하나 적어 세면 됩니다. 두 주사위는 서로 다르므로 $(1,3)$ 과 $(3,1)$ 은 <strong>다른 경우</strong>입니다.</p>
<ul>
<li>합이 2: $(1,1)$ → 1가지, 합이 3: $(1,2),(2,1)$ → 2가지, 합이 4: 3가지, 합이 5: 4가지, 합이 6: 5가지</li>
<li>합이 7: 6가지 (가장 많음), 합이 8: 5가지, 합이 9: 4가지, 합이 10: 3가지, 합이 11: 2가지, 합이 12: 1가지</li>
</ul>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">서로 다른 두 개의 주사위를 동시에 던질 때, 나온 눈의 수의 합이 4 또는 9 인 경우의 수를 구하시오.</p>
<div class="exa">
<p>합이 4 인 경우: $(1,3),(2,2),(3,1)$ → 3가지</p>
<p>합이 9 인 경우: $(3,6),(4,5),(5,4),(6,3)$ → 4가지</p>
<p>두 사건은 동시에 일어날 수 없으므로 합의 법칙을 씁니다. $3+4=7$</p>
<p><strong>답: 7</strong></p>
</div></div>

<p><strong>② 곱의 법칙 — 동전·주사위·세트 메뉴</strong></p>
<ul>
<li>서로 다른 동전 $n$ 개를 던지면 $2\times2\times\cdots\times2=2^n$ 가지</li>
<li>동전은 앞·뒤 2가지, 주사위는 눈 6가지이므로 동전 $a$ 개와 주사위 $b$ 개를 함께 던지면 $2^a\times6^b$ 가지</li>
<li>"각각 하나씩 골라 세트를 만든다"는 문장은 곱의 법칙 신호입니다.</li>
</ul>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">서로 다른 동전 2개와 주사위 1개를 동시에 던질 때, 나오는 모든 경우의 수를 구하시오.</p>
<div class="exa">
<p>동전 하나는 2가지, 주사위는 6가지이고 모두 동시에 일어나는 사건이므로 곱합니다.</p>
<p>$2\times2\times6=24$</p>
<p><strong>답: 24</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">A 지점에서 B 지점으로 가는 길이 3가지, B 지점에서 C 지점으로 가는 길이 4가지 있고, A 지점에서 C 지점으로 바로 가는 길이 2가지 있다. A 지점에서 C 지점으로 가는 경우의 수를 구하시오.</p>
<div class="exa">
<p>① B 를 거쳐서 가는 경우: A→B 그리고 B→C 이므로 곱: $3\times4=12$</p>
<p>② 바로 가는 경우: 2</p>
<p>①과 ②는 동시에 일어나지 않으므로(또는) 합: $12+2=14$</p>
<p><strong>답: 14</strong></p>
</div></div>

<p><strong>③ 약수의 개수</strong></p>
<p>자연수 $N$ 을 소인수분해하여 $N=p^a q^b r^c$ 라고 하면, 양의 약수는 각 소수를 "몇 번 곱할지"를 정해서 만들어집니다. $p$ 는 $0,1,\cdots,a$ 번 (총 $a+1$ 가지), $q$ 는 $b+1$ 가지, $r$ 는 $c+1$ 가지를 곱할 수 있어요. 곱의 법칙으로 다음이 됩니다.</p>
<div class="formula">
$$N=p^aq^br^c\ \Rightarrow\ \text{양의 약수의 개수}=(a+1)(b+1)(c+1)$$
</div>
<ul>
<li>약수의 총합은 $(1+p+\cdots+p^a)(1+q+\cdots+q^b)(1+r+\cdots+r^c)$</li>
<li>짝수인 약수의 개수: 2 가 <strong>적어도 한 번</strong> 곱해져야 하므로 2 의 지수를 $1,\cdots,a$ 에서 고름 → $a(b+1)(c+1)$</li>
</ul>

<div class="ex"><strong class="label">예시 4</strong>
<p class="exq">$72$ 의 양의 약수의 개수와, 그중 짝수인 약수의 개수를 각각 구하시오.</p>
<div class="exa">
<p>$72=2^3\times3^2$ 입니다.</p>
<p>약수의 개수: $(3+1)(2+1)=4\times3=12$</p>
<p>짝수인 약수: 2 의 지수를 $1,2,3$ 중에서 고르고(3가지), 3 의 지수는 $0,1,2$ 중에서 고르므로(3가지) $3\times3=9$</p>
<p><strong>답: 12, 9</strong></p>
</div></div>

<p><strong>④ 수 만들기 — "맨 앞자리에 0 이 올 수 없다"</strong></p>
<p>세 자리 자연수를 만들 때는 <strong>조건이 까다로운 자리(백의 자리, 일의 자리)부터 먼저</strong> 정합니다.</p>

<div class="ex"><strong class="label">예시 5</strong>
<p class="exq">$0,1,2,3,4,5$ 의 숫자 중에서 서로 다른 숫자 3 개를 택하여 만들 수 있는 세 자리 자연수의 개수와, 그중 짝수의 개수를 구하시오.</p>
<div class="exa">
<p><strong>세 자리 자연수</strong>: 백의 자리에는 0 이 올 수 없으므로 5가지. 십의 자리는 백의 자리에 쓴 숫자를 뺀 5가지(0 은 쓸 수 있음), 일의 자리는 4가지입니다. $5\times5\times4=100$</p>
<p><strong>짝수</strong>: 일의 자리가 0, 2, 4 인 경우로 나눕니다(합의 법칙).</p>
<p>· 일의 자리가 0: 백·십의 자리는 나머지 5개 중 2개를 나열 → $5\times4=20$</p>
<p>· 일의 자리가 2 (또는 4): 백의 자리는 0 과 2 를 뺀 4가지, 십의 자리는 남은 4가지 → $4\times4=16$ 씩, 둘이므로 $32$</p>
<p>$20+32=52$</p>
<p><strong>답: 100, 52</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6</strong>
<p class="exq">$0,1,2,3,4,5$ 의 숫자를 중복하여 사용할 수 있을 때, 만들 수 있는 세 자리 자연수의 개수를 구하시오.</p>
<div class="exa">
<p>백의 자리: 0 을 뺀 5가지, 십의 자리: 6가지, 일의 자리: 6가지 (중복 가능이므로 줄어들지 않음)</p>
<p>$5\times6\times6=180$</p>
<p><strong>답: 180</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>"또는"인데 곱하거나, "그리고"인데 더하는 실수 — 먼저 문장을 읽고 <strong>동시에 일어나지 않는가(더하기) / 차례로 일어나는가(곱하기)</strong> 를 구분하세요.</li>
<li>세 자리 자연수에서 백의 자리에 0 을 넣는 실수 (0 이 맨 앞에 오면 두 자리 수)</li>
<li>두 주사위를 구별하지 않고 $(1,3)$ 과 $(3,1)$ 을 한 가지로 세는 실수</li>
<li>약수의 개수를 구할 때 지수 그대로 곱하는 실수 — 반드시 <strong>지수에 1 을 더해서</strong> 곱합니다. ($2^3\times3^2$ → $3\times2$ 가 아니라 $4\times3$)</li>
</ul></div>`,
        tip: r`
<p>문제 문장에서 <strong>"또는"이면 더하기, "그리고(동시에, 차례로)"이면 곱하기</strong>로 번역하세요.</p>
<p>"적어도 한 개", "~가 아닌" 같은 표현은 <strong>전체에서 반대 경우를 빼는 여사건</strong>이 훨씬 빠릅니다. 예) 두 주사위 곱이 짝수 = 전체 36 − 곱이 홀수 $(3\times3=9)$ $=27$</p>
<p>수를 만들 때는 <strong>제한이 있는 자리(맨 앞 0 금지, 일의 자리 짝수)부터 먼저</strong> 정하세요. 일의 자리가 0 인 경우와 0 이 아닌 경우로 나누는 것이 정석입니다.</p>
<p>합이 $s$ 인 주사위 경우의 수는 $s\le7$ 이면 $s-1$, $s\ge7$ 이면 $13-s$ 로 바로 구할 수 있습니다.</p>
<p>약수의 개수는 <strong>(지수+1)을 곱한다</strong>. 짝수인 약수는 "2 의 지수 + 1" 대신 "2 의 지수"를 곱합니다.</p>`
      },

      /* ───────────── 1. 순열 ───────────── */
      {
        title: '순열 (순서가 중요한 나열)',
        body: r`
<p class="lead-line">순열은 "뽑아서 <strong>줄을 세우는</strong>" 경우의 수입니다. 순서가 바뀌면 다른 경우로 센다는 점이 핵심이에요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>순열</strong>: 서로 다른 $n$ 개에서 $r$ 개를 택하여 <strong>일렬로 나열</strong>하는 것. 그 경우의 수를 $_nP_r$ 로 나타냅니다. ($P$ 는 Permutation)</li>
<li><strong>팩토리얼</strong> $n!$ : 1 부터 $n$ 까지 모두 곱한 수. $0!=1$ 로 약속합니다.</li>
</ul></div>

<div class="formula">
$$_nP_r=n(n-1)(n-2)\cdots(n-r+1)\quad(\text{$n$ 에서 시작해 $r$ 개를 곱함})$$
$$_nP_r=\frac{n!}{(n-r)!},\qquad {}_nP_n=n!,\qquad {}_nP_0=1,\qquad {}_nP_1=n$$
$$_nP_r=n\times{}_{n-1}P_{r-1}$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p>서로 다른 5명 중 3명을 뽑아 줄을 세워 볼까요? 첫째 자리에는 5명 모두가 올 수 있고(5가지), 둘째 자리에는 첫째에 선 사람을 뺀 4명(4가지), 셋째 자리에는 3가지가 남습니다. 곱의 법칙에 의해 $5\times4\times3=60$ 입니다. 이것이 $_5P_3$ 이에요.</p>
<p>$5\times4\times3=\dfrac{5\times4\times3\times2\times1}{2\times1}=\dfrac{5!}{2!}$ 이므로 $_nP_r=\dfrac{n!}{(n-r)!}$ 입니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$_7P_3$ 과 $6!$ 의 값을 각각 구하시오.</p>
<div class="exa">
<p>$_7P_3$ : 7 에서 시작해서 3 개를 곱합니다. $7\times6\times5=210$</p>
<p>$6!=6\times5\times4\times3\times2\times1=720$</p>
<p><strong>답: 210, 720</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">서로 다른 6권의 책 중에서 3권을 뽑아 책꽂이에 일렬로 꽂는 방법의 수를 구하시오.</p>
<div class="exa">
<p>뽑는 것뿐 아니라 꽂는 <strong>순서</strong>가 있으므로 순열입니다.</p>
<p>$_6P_3=6\times5\times4=120$</p>
<p><strong>답: 120</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">$_nP_2=56$ 을 만족시키는 자연수 $n$ 의 값을 구하시오.</p>
<div class="exa">
<p>$_nP_2=n(n-1)=56$ 이므로 $n^2-n-56=0$, $(n-8)(n+7)=0$</p>
<p>$n\ge2$ 인 자연수이므로 $n=8$ (확인: $8\times7=56$)</p>
<p><strong>답: 8</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4</strong>
<p class="exq">서로 다른 5개의 문자 중에서 3개를 택하여 일렬로 나열할 때, 특정한 문자 $a$ 를 반드시 포함하는 경우의 수를 구하시오.</p>
<div class="exa">
<p>$a$ 가 <strong>들어갈 자리</strong>를 먼저 정합니다. 3 개의 자리 중 하나 → 3가지</p>
<p>나머지 2개의 자리에는 $a$ 를 뺀 4 개 문자 중 2 개를 나열 → $_4P_2=12$</p>
<p>$3\times12=36$</p>
<p>(다른 풀이) $a$ 를 포함하여 3 개를 뽑는 방법 $_4C_2=6$ 가지, 뽑은 3 개를 나열 $3!=6$ → $6\times6=36$</p>
<p><strong>답: 36</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$_nP_r$ 에서 $r$ 개가 아니라 $n$ 개를 곱하는 실수 — 곱하는 개수는 <strong>뒤의 숫자 $r$</strong> 입니다.</li>
<li>$0!$ 을 0 으로 계산하는 실수 ($0!=1$)</li>
<li>순서가 필요 없는 문제(그냥 뽑기)에 순열을 쓰는 실수 — 그 경우는 조합입니다.</li>
<li>$(n-r)!$ 을 $n!-r!$ 로 바꾸는 실수</li>
</ul></div>`,
        tip: r`
<p>팩토리얼 공식 대신 <strong>"$n$ 에서 시작해 $r$ 개만 내려가며 곱한다"</strong> 로 외우면 가장 빠릅니다.</p>
<p>$_7P_3=7\times6\times5=210$ (3개 곱하기)</p>
<p><strong>이웃하는 경우</strong>: 이웃해야 하는 것들을 한 덩어리로 묶고 나열한 뒤, 덩어리 안의 순서를 곱합니다.</p>
<p><strong>이웃하지 않는 경우</strong>: 나머지를 먼저 세우고 그 <strong>사이사이와 양 끝</strong>에 끼워 넣습니다. 또는 (전체) − (이웃하는 경우) 로 구해도 됩니다.</p>
<p><strong>특정한 것이 맨 앞(고정)</strong>이면 그 자리는 1가지, 나머지 자리만 순열입니다.</p>`
      },

      /* ───────────── 2. 조합 ───────────── */
      {
        title: '조합 (순서가 없는 선택)',
        body: r`
<p class="lead-line">조합은 "<strong>뽑기만</strong> 하는" 경우의 수입니다. 같은 사람들을 뽑았다면 어떤 순서로 뽑든 한 가지로 세요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>조합</strong>: 서로 다른 $n$ 개에서 순서를 생각하지 않고 $r$ 개를 택하는 것. 그 경우의 수를 $_nC_r$ 로 나타냅니다. ($C$ 는 Combination)</li>
<li>순열과의 차이: {A, B, C} 를 뽑는 것은 조합으로는 1가지, 줄을 세우는 순열로는 $3!=6$ 가지 입니다.</li>
</ul></div>

<div class="formula">
$$_nC_r=\frac{{}_nP_r}{r!}=\frac{n!}{r!\,(n-r)!}$$
$$_nC_r={}_nC_{n-r},\qquad {}_nC_0={}_nC_n=1,\qquad {}_nC_1=n$$
$$_nC_r={}_{n-1}C_{r-1}+{}_{n-1}C_r\quad(1\le r\le n-1)$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p>5 명 중 3 명을 뽑아 줄을 세우면 $_5P_3=60$ 가지입니다. 그런데 같은 3 명이 뽑힌 경우를 $3!=6$ 가지의 순서로 중복해서 센 것이므로, 순서를 구별하지 않으려면 $6$ 으로 나눕니다. $_5C_3=\dfrac{60}{6}=10$</p>
<p><strong>$_nC_r={}_nC_{n-r}$</strong> : "뽑을 $r$ 명을 고르는 것"과 "뽑지 않을 $n-r$ 명을 고르는 것"은 같은 일입니다.</p>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">$_7C_3$ 과 $_{10}C_8$ 의 값을 각각 구하시오.</p>
<div class="exa">
<p>$_7C_3=\dfrac{7\times6\times5}{3\times2\times1}=35$</p>
<p>$_{10}C_8={}_{10}C_2$ ($r$ 이 크면 $n-r$ 로 바꿉니다) $=\dfrac{10\times9}{2\times1}=45$</p>
<p><strong>답: 35, 45</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">남학생 3명, 여학생 4명 중에서 남학생 2명, 여학생 2명을 뽑는 경우의 수를 구하시오.</p>
<div class="exa">
<p>남학생 2명: $_3C_2=3$, 여학생 2명: $_4C_2=6$</p>
<p>"남학생을 뽑고 그리고 여학생을 뽑는다" 이므로 곱합니다. $3\times6=18$</p>
<p><strong>답: 18</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">남학생 3명, 여학생 4명 중에서 3명을 뽑을 때, 남학생이 적어도 1명 포함되는 경우의 수를 구하시오.</p>
<div class="exa">
<p>"적어도 한 명"이므로 여사건을 이용합니다. 여사건은 남학생이 0명, 즉 모두 여학생인 경우입니다.</p>
<p>전체: $_7C_3=35$, 모두 여학생: $_4C_3=4$</p>
<p>$35-4=31$</p>
<p><strong>답: 31</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4</strong>
<p class="exq">$_nC_2=45$ 일 때, 자연수 $n$ 의 값을 구하시오.</p>
<div class="exa">
<p>$_nC_2=\dfrac{n(n-1)}{2}=45$ 이므로 $n(n-1)=90$</p>
<p>$n^2-n-90=0$, $(n-10)(n+9)=0$ → $n=10$ (확인: $10\times9/2=45$)</p>
<p><strong>답: 10</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5</strong>
<p class="exq">10명 중에서 3명의 위원을 뽑을 때, 특정한 두 사람 A, B 중 적어도 한 명이 포함되는 경우의 수를 구하시오.</p>
<div class="exa">
<p>전체: $_{10}C_3=120$</p>
<p>A, B 가 모두 뽑히지 않는 경우: 나머지 8명에서 3명 $_8C_3=56$</p>
<p>$120-56=64$</p>
<p>(확인) A만 포함 $_8C_2=28$, B만 포함 $28$, 둘 다 포함 $_8C_1=8$ → $28+28+8=64$ ✓</p>
<p><strong>답: 64</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$_nC_r$ 의 분모에 $r!$ 을 빼먹는 실수 — 순열을 구한 뒤 반드시 $r!$ 로 나눕니다.</li>
<li>순서가 있는 문제(회장·부회장 등)에 조합을 쓰는 실수. 직책이 다르면 순열입니다.</li>
<li>"특정한 사람을 반드시 포함"할 때 $r$ 을 줄이지 않는 실수 — 이미 뽑았으니 <strong>나머지에서 $r-1$ 명</strong>을 뽑습니다.</li>
<li>두 집단에서 각각 뽑을 때 더하는 실수 — "그리고"이므로 곱입니다.</li>
</ul></div>`,
        tip: r`
<p><strong>줄 세우기면 순열, 뽑기만 하면 조합</strong>입니다. 직책이 다르거나 자리가 정해져 있으면 순열, 그냥 모임·팀이면 조합이에요.</p>
<p>계산은 <strong>"분자는 $r$ 개 곱, 분모는 $r!$"</strong> 로 끝냅니다.</p>
<ul>
<li>$_7C_3=\dfrac{7\cdot6\cdot5}{3\cdot2\cdot1}=35$</li>
<li>$_{10}C_8={}_{10}C_2=\dfrac{10\cdot9}{2}=45$ ← $r$ 이 크면 $n-r$ 로 바꾸기</li>
</ul>
<p>"특정 원소를 반드시 포함"이면 그 원소는 이미 뽑았다고 보고, 나머지에서 $r-1$ 개를 뽑습니다. "특정 원소를 제외"하면 $n-1$ 개 중에서 $r$ 개를 뽑아요.</p>
<p>$_nC_2=\dfrac{n(n-1)}{2}$ 는 자주 나옵니다. 악수 횟수, 경기 수, 선분의 개수, 대각선 계산에 모두 쓰여요.</p>`
      },

      /* ───────────── 3. 순열의 여러 유형 ───────────── */
      {
        title: '순열의 여러 유형 (이웃·고정·정수 만들기)',
        body: r`
<p class="lead-line">줄 세우기 문제는 대부분 "묶기", "끼워 넣기", "자리 먼저 정하기" 세 가지 기술로 풀립니다.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>이웃하는 경우</strong>: 이웃하는 것들을 한 덩어리로 보고 나열 → 덩어리 안에서의 순서를 곱합니다.</li>
<li><strong>이웃하지 않는 경우</strong>: ① 나머지를 먼저 나열 → ② 그 사이사이와 양 끝의 빈 자리에 끼워 넣기, 또는 (전체)−(이웃하는 경우)</li>
<li><strong>자리 고정</strong>: 특정한 사람이 정해진 자리(맨 앞, 양 끝 등)에 서야 하면 그 자리부터 먼저 채웁니다.</li>
<li><strong>정수 만들기</strong>: 맨 앞자리 0 금지, 짝수는 일의 자리, 5 의 배수는 일의 자리가 0 또는 5 에 주목합니다.</li>
</ul></div>

<div class="formula">
$$\text{이웃하는 경우}=(\text{덩어리를 한 개로 보고 나열})\times(\text{덩어리 안의 순서})$$
$$\text{이웃하지 않는 경우}=(\text{전체})-(\text{이웃하는 경우})$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p>A, B 가 이웃하는 줄 세우기는 "AB" 혹은 "BA" 라는 한 덩어리가 줄 서 있는 것과 같습니다. 그래서 덩어리를 한 사람으로 보고 줄을 세운 뒤, 덩어리 안에서 AB / BA 두 가지를 곱해 주는 거예요.</p>
<p>"이웃하지 않는다"는 "이웃한다"의 반대(여사건)입니다. 전체에서 이웃하는 경우를 빼면 곧바로 구할 수 있습니다.</p>
</div>

<div class="ex"><strong class="label">예시 1 (이웃하는 경우)</strong>
<p class="exq">7명의 학생이 일렬로 설 때, 특정한 두 학생 A, B 가 이웃하여 서는 경우의 수를 구하시오.</p>
<div class="exa">
<p>A, B 를 한 덩어리로 묶으면 6개를 나열하는 경우 → $6!=720$</p>
<p>덩어리 안에서 A, B 의 순서 → $2!=2$</p>
<p>$720\times2=1440$</p>
<p><strong>답: 1440</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (이웃하지 않는 경우)</strong>
<p class="exq">7명의 학생이 일렬로 설 때, 특정한 두 학생 A, B 가 이웃하지 않는 경우의 수를 구하시오.</p>
<div class="exa">
<p>전체: $7!=5040$, A, B 가 이웃하는 경우: $1440$ (예시 1)</p>
<p>$5040-1440=3600$</p>
<p><strong>답: 3600</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (끼워 넣기)</strong>
<p class="exq">남학생 3명과 여학생 3명이 일렬로 설 때, 여학생끼리는 서로 이웃하지 않도록 서는 경우의 수를 구하시오.</p>
<div class="exa">
<p>남학생 3명을 먼저 나열: $3!=6$</p>
<p>남학생의 양 끝과 사이사이에 빈 자리가 4곳 생깁니다. ○남○남○남○</p>
<p>이 4곳 중에서 3곳에 여학생을 한 명씩 세웁니다. $_4P_3=24$</p>
<p>$6\times24=144$</p>
<p><strong>답: 144</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (자리 고정)</strong>
<p class="exq">남학생 3명과 여학생 3명이 일렬로 설 때, 양 끝에 모두 남학생이 서는 경우의 수를 구하시오.</p>
<div class="exa">
<p>양 끝의 두 자리에 남학생 3명 중 2명을 세웁니다. $_3P_2=6$</p>
<p>나머지 4명이 가운데 4자리에 서는 방법: $4!=24$</p>
<p>$6\times24=144$</p>
<p><strong>답: 144</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (특정한 사람이 맨 앞)</strong>
<p class="exq">서로 다른 6명 중에서 3명을 뽑아 일렬로 세울 때, 특정한 한 명이 맨 앞에 서는 경우의 수를 구하시오.</p>
<div class="exa">
<p>맨 앞에는 그 특정한 한 명이 서므로 1가지입니다.</p>
<p>나머지 2자리에는 남은 5명 중 2명을 나열: $_5P_2=20$</p>
<p>$1\times20=20$</p>
<p><strong>답: 20</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (정수 만들기)</strong>
<p class="exq">1, 2, 3, 4, 5 의 숫자를 한 번씩만 사용하여 세 자리 정수를 만들 때, 짝수의 개수와 5 의 배수의 개수를 각각 구하시오.</p>
<div class="exa">
<p><strong>짝수</strong>: 일의 자리가 2 또는 4 → 2가지. 나머지 두 자리는 남은 4개 숫자 중 2개를 나열 $_4P_2=12$. $2\times12=24$</p>
<p><strong>5 의 배수</strong>: 일의 자리가 5 → 1가지 (0 이 없음). 나머지 두 자리 $_4P_2=12$. $1\times12=12$</p>
<p><strong>답: 24, 12</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (몇 번째 수)</strong>
<p class="exq">1, 2, 3, 4 를 한 번씩만 사용하여 만든 네 자리 수를 작은 수부터 차례로 나열할 때, 3124 는 몇 번째 수인지 구하시오.</p>
<div class="exa">
<p>1 로 시작하는 수: $3!=6$ 개, 2 로 시작하는 수: $3!=6$ 개 → 3 으로 시작하는 수 앞에 12개</p>
<p>3 으로 시작하는 수를 작은 것부터 쓰면 3124, 3142, 3214, … 이므로 3124 는 그중 첫 번째입니다.</p>
<p>$12+1=13$ (번째)</p>
<p><strong>답: 13번째</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>이웃하는 경우에 덩어리 안의 순서(예: $2!$)를 곱하지 않는 실수</li>
<li>끼워 넣기에서 빈 자리의 수를 $n$ 으로 착각하는 실수 — 사람이 $n$ 명이면 빈 자리는 <strong>$n+1$ 곳</strong> 입니다.</li>
<li>양 끝에 서는 두 자리를 순서 없이(조합으로) 세는 실수 — 양 끝은 왼쪽/오른쪽이 다르므로 순열입니다.</li>
<li>정수 만들기에서 조건 없는 자리부터 먼저 세어서 개수가 틀리는 실수</li>
</ul></div>`,
        tip: r`
<p><strong>이웃하는 것 → 묶기, 이웃하지 않는 것 → 끼워 넣기(또는 여사건)</strong> 으로 외우세요.</p>
<p>두 가지 방법 중 하나로 구한 뒤 다른 방법으로 검산하면 실수를 거의 잡아낼 수 있습니다. 예) 7명 중 A, B 이웃하지 않음: $5!\times{}_6P_2=120\times30=3600$ 도 같은 값입니다.</p>
<p>"몇 번째 수" 문제는 <strong>맨 앞자리가 작은 수일 때의 개수를 차례로 더해</strong> 가면 됩니다. 한 자리를 정할 때마다 남은 자릿수의 팩토리얼 개씩 건너뜁니다.</p>
<p>짝수·5의 배수·홀수 문제는 <strong>일의 자리부터</strong> 정하세요. 3 의 배수는 각 자리의 합이 3 의 배수인 숫자 조합을 먼저 찾습니다.</p>`
      },

      /* ───────────── 4. 원순열과 중복순열 ───────────── */
      {
        title: '원순열·중복순열·같은 것이 있는 순열',
        body: r`
<p class="lead-line">줄 세우기가 변형된 세 가지 — 원탁에 앉기, 같은 것을 여러 번 쓰기, 똑같은 것이 섞여 있는 나열 — 를 구분하는 것이 핵심입니다.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>원순열</strong>: 서로 다른 $n$ 개를 원형으로 배열하는 것. 회전하여 같아지는 배열은 같은 것으로 봅니다.</li>
<li><strong>중복순열</strong>: 서로 다른 $n$ 개에서 중복을 허락하여 $r$ 개를 택해 일렬로 나열하는 것. $_n\Pi_r$ 로 나타냅니다.</li>
<li><strong>같은 것이 있는 순열</strong>: $n$ 개 중에 같은 것이 각각 $p$ 개, $q$ 개, $r$ 개 있을 때의 일렬 나열</li>
</ul></div>

<div class="formula">
$$\text{원순열}=(n-1)!$$
$$_n\Pi_r=n^r$$
$$\text{같은 것이 있는 순열}=\frac{n!}{p!\,q!\,r!}\quad(p+q+r=n)$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p><strong>원순열</strong>: $n$ 명을 일렬로 세우는 $n!$ 가지 중, 원탁에서는 돌려서 겹치는 $n$ 가지(시작 위치가 $n$ 곳)가 모두 같은 배열이 됩니다. 그래서 $\dfrac{n!}{n}=(n-1)!$ 입니다. (한 명을 고정하고 나머지 $n-1$ 명을 나열한다고 생각해도 같아요.)</p>
<p><strong>중복순열</strong>: 각 자리마다 $n$ 가지를 고를 수 있으므로 $n\times n\times\cdots\times n$ ($r$ 번) $=n^r$ 입니다.</p>
<p><strong>같은 것이 있는 순열</strong>: 같은 것들을 다른 것처럼 보고 줄을 세우면 $n!$ 가지인데, 같은 것끼리 바꿔도 같은 배열이므로 $p!$ 로 나눕니다.</p>
</div>

<div class="ex"><strong class="label">예시 1 (원순열)</strong>
<p class="exq">5명이 원탁에 둘러앉는 경우의 수를 구하시오.</p>
<div class="exa">
<p>$(5-1)!=4!=24$</p>
<p><strong>답: 24</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (원순열 + 이웃)</strong>
<p class="exq">6명이 원탁에 둘러앉을 때, 특정한 두 사람 A, B 가 이웃하여 앉는 경우의 수를 구하시오.</p>
<div class="exa">
<p>A, B 를 한 덩어리로 묶으면 5개의 원순열: $(5-1)!=24$</p>
<p>덩어리 안에서 A, B 의 순서: $2!=2$</p>
<p>$24\times2=48$</p>
<p><strong>답: 48</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (중복순열)</strong>
<p class="exq">숫자 1, 2, 3 을 중복하여 사용하여 만들 수 있는 네 자리 자연수의 개수를 구하시오.</p>
<div class="exa">
<p>각 자리에 1, 2, 3 의 3가지를 고를 수 있으므로 $3^4=81$</p>
<p><strong>답: 81</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (중복순열 — 우체통)</strong>
<p class="exq">서로 다른 편지 3통을 서로 다른 우체통 2개에 넣는 방법의 수를 구하시오. (한 우체통에 여러 통을 넣어도 되고, 비어 있는 우체통이 있어도 된다.)</p>
<div class="exa">
<p>"편지마다 어느 우체통에 넣을지"를 고르는 것이므로 편지 하나에 2가지, 3통이므로 $2^3=8$</p>
<p>(우체통 기준으로 $3^2=9$ 라고 하면 틀립니다. 선택하는 쪽은 <strong>편지</strong> 입니다.)</p>
<p><strong>답: 8</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (같은 것이 있는 순열)</strong>
<p class="exq">APPLE 의 다섯 글자를 모두 사용하여 일렬로 나열하는 경우의 수와, aabbc 의 다섯 글자를 모두 사용하여 일렬로 나열하는 경우의 수를 구하시오.</p>
<div class="exa">
<p>APPLE : P 가 2개 → $\dfrac{5!}{2!}=\dfrac{120}{2}=60$</p>
<p>aabbc : a 가 2개, b 가 2개 → $\dfrac{5!}{2!\,2!}=\dfrac{120}{4}=30$</p>
<p><strong>답: 60, 30</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>원순열을 $n!$ 로 계산하는 실수 — 회전해서 같으므로 $(n-1)!$ 입니다.</li>
<li>중복순열을 $_nP_r$ 로 계산하는 실수 — 중복을 허락하면 줄어들지 않고 $n^r$ 입니다.</li>
<li>중복순열에서 $n$ 과 $r$ 이 뒤바뀌는 실수 — <strong>"선택하는 대상의 가짓수가 밑, 선택 횟수가 지수"</strong></li>
<li>같은 것이 있는 순열에서 같은 것들의 팩토리얼로 나누지 않는 실수</li>
</ul></div>`,
        tip: r`
<p>원탁 문제는 <strong>한 명의 자리를 먼저 고정</strong>해서 일렬 문제로 바꾸면 쉬워집니다. 그다음 나머지는 평소처럼 줄 세우기!</p>
<p>중복순열 판단법: "<strong>~마다 몇 가지</strong>를 고르는가?" → 그 가짓수를 밑, 대상의 개수를 지수로 합니다. (편지 3통을 우체통 2개에 → 편지마다 2가지 → $2^3$)</p>
<p>중복순열로 풀 수 있는 대표 상황: 동전 $n$ 개($2^n$), 주사위 $n$ 개($6^n$), 숫자 카드 중복 사용, O/X 퀴즈 $n$ 문제($2^n$)</p>`
      },

      /* ───────────── 5. 조합의 활용 ───────────── */
      {
        title: '조합의 활용과 파스칼의 삼각형',
        body: r`
<p class="lead-line">조합은 "대표 뽑기", "도형의 개수", "분할", "최단 경로" 네 가지 상황에서 폭넓게 쓰입니다.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>대표 뽑기</strong>: 조건에 맞게 뽑을 때는 "각 집단에서 몇 명씩 뽑는지"를 정한 뒤 곱하고, 조건이 여러 가지로 갈리면 합합니다. 직책(회장·부회장)이 다르면 순열을 함께 씁니다.</li>
<li><strong>도형의 개수</strong>: 점 2개 → 직선(선분), 점 3개 → 삼각형. 단, 한 직선 위의 점들은 도형을 만들지 못하므로 따로 처리합니다.</li>
<li><strong>분할</strong>: 서로 다른 $n$ 명을 몇 개의 조로 나누는 것. 조의 구별 여부가 중요합니다.</li>
<li><strong>최단 경로</strong>: 가로로 $a$ 칸, 세로로 $b$ 칸 가는 최단 경로는 $a+b$ 번의 이동 중 가로 이동 $a$ 번을 고르는 것과 같습니다.</li>
</ul></div>

<div class="formula">
$$\text{볼록 $n$ 각형의 대각선의 수}={}_nC_2-n=\frac{n(n-3)}{2}$$
$$\text{한 직선 위의 점 $k$ 개를 포함한 $n$ 개의 점으로 만드는 삼각형}={}_nC_3-{}_kC_3$$
$$\text{최단 경로(가로 $a$, 세로 $b$)}={}_{a+b}C_a$$
$$_nC_0+{}_nC_1+\cdots+{}_nC_n=2^n$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p><strong>대각선</strong>: 볼록 $n$ 각형의 꼭짓점 $n$ 개 중 2개를 이으면 $_nC_2$ 개의 선분이 생기는데, 그중 $n$ 개는 변이므로 빼면 대각선입니다.</p>
<p><strong>삼각형</strong>: 3 점을 뽑는 방법 중 세 점이 한 직선 위에 있는 경우는 삼각형이 되지 못하므로 그만큼 뺍니다.</p>
<p><strong>$2^n$</strong>: $n$ 개 원소의 부분집합을 원소 수별로 센 것이 $_nC_0,\ _nC_1,\cdots,\ _nC_n$ 이고, 전체 부분집합의 수는 $2^n$ 입니다.</p>
</div>

<p><strong>파스칼의 삼각형</strong> — $_nC_r$ 을 늘어놓은 삼각형입니다. 양 끝은 1, 안쪽은 위의 두 수의 합이에요. ($_nC_r={}_{n-1}C_{r-1}+{}_{n-1}C_r$)</p>
<div class="formula">
$$\begin{array}{ccccccccccccc}
 & & & & & & 1 & & & & & & \\
 & & & & & 1 & & 1 & & & & & \\
 & & & & 1 & & 2 & & 1 & & & & \\
 & & & 1 & & 3 & & 3 & & 1 & & & \\
 & & 1 & & 4 & & 6 & & 4 & & 1 & & \\
 & 1 & & 5 & & 10 & & 10 & & 5 & & 1 & \\
 1 & & 6 & & 15 & & 20 & & 15 & & 6 & & 1
\end{array}$$
</div>
<ul>
<li>좌우 대칭: $_nC_r={}_nC_{n-r}$</li>
<li>각 줄의 합: $2^n$ (예: 다섯 번째 줄 $1+4+6+4+1=16=2^4$)</li>
<li>$_6C_2=15$, $_6C_3=20$ 은 맨 아랫줄에서 바로 읽을 수 있어요.</li>
</ul>

<div class="ex"><strong class="label">예시 1 (대표 뽑기)</strong>
<p class="exq">남학생 5명, 여학생 4명 중에서 대표 3명을 뽑을 때, 남학생과 여학생이 모두 포함되는 경우의 수를 구하시오.</p>
<div class="exa">
<p>전체: $_9C_3=84$</p>
<p>남학생만 3명: $_5C_3=10$, 여학생만 3명: $_4C_3=4$</p>
<p>$84-10-4=70$</p>
<p>(확인) 남2·여1: $_5C_2\times4=40$, 남1·여2: $5\times{}_4C_2=30$ → $40+30=70$ ✓</p>
<p><strong>답: 70</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (직책이 있는 대표)</strong>
<p class="exq">6명 중에서 회장 1명, 부회장 1명, 총무 1명을 뽑는 경우의 수와, 그냥 대표 3명을 뽑는 경우의 수를 각각 구하시오.</p>
<div class="exa">
<p>직책이 다르므로 순서가 있는 순열: $_6P_3=6\times5\times4=120$</p>
<p>직책 없이 3명만 뽑으면 조합: $_6C_3=20$</p>
<p><strong>답: 120, 20</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (대각선)</strong>
<p class="exq">볼록 8각형의 대각선의 개수를 구하시오.</p>
<div class="exa">
<p>$_8C_2-8=28-8=20$</p>
<p>(공식 확인) $\dfrac{8\times5}{2}=20$ ✓</p>
<p><strong>답: 20</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (삼각형·직선의 개수)</strong>
<p class="exq">평면 위에 7개의 점이 있다. 이 중 4개의 점은 한 직선 위에 있고, 그 외에는 어느 세 점도 한 직선 위에 있지 않을 때, 세 점을 꼭짓점으로 하는 삼각형의 개수와 두 점을 지나는 서로 다른 직선의 개수를 구하시오.</p>
<div class="exa">
<p><strong>삼각형</strong>: 전체 $_7C_3=35$ 에서 한 직선 위의 4 점 중 3 점을 고른 경우 $_4C_3=4$ 를 뺍니다. $35-4=31$</p>
<p><strong>직선</strong>: 전체 $_7C_2=21$ 에서, 한 직선 위의 4 점이 만드는 $_4C_2=6$ 개의 직선은 사실 모두 같은 직선 1개이므로 $6-1=5$ 를 뺍니다. $21-6+1=16$</p>
<p><strong>답: 31, 16</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (평행사변형의 개수)</strong>
<p class="exq">평행한 직선 4개와 이 직선들과 만나는 또 다른 평행한 직선 3개로 만들어지는 평행사변형의 개수를 구하시오.</p>
<div class="exa">
<p>평행사변형은 한 방향의 평행선에서 2개, 다른 방향의 평행선에서 2개를 뽑으면 하나 만들어집니다.</p>
<p>$_4C_2\times{}_3C_2=6\times3=18$</p>
<p><strong>답: 18</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (분할)</strong>
<p class="exq">서로 다른 6명을 2명씩 3개의 조로 나누는 경우의 수를 구하시오. (조의 이름은 구별하지 않는다.)</p>
<div class="exa">
<p>첫 조 $_6C_2=15$, 둘째 조 $_4C_2=6$, 셋째 조 $_2C_2=1$ → $15\times6\times1=90$</p>
<p>그런데 같은 크기의 조 3개는 순서만 다르게 센 것이 $3!=6$ 번씩 겹치므로 $6$ 으로 나눕니다.</p>
<p>$90\div6=15$</p>
<p><strong>답: 15</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (최단 경로)</strong>
<p class="exq">오른쪽으로 3칸, 위쪽으로 2칸 이동하여 $(0,0)$ 에서 $(3,2)$ 까지 가는 최단 경로의 수를 구하시오.</p>
<div class="exa">
<p>총 5번 이동하며 그중 오른쪽 이동이 3번, 위쪽 이동이 2번입니다. 5번 중 오른쪽으로 갈 3번을 고르면 경로가 정해집니다.</p>
<p>$_5C_3=10$</p>
<p><strong>답: 10</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>대각선의 개수에서 변의 개수 $n$ 을 빼지 않는 실수</li>
<li>한 직선 위의 점으로는 삼각형이 되지 않는다는 조건을 빼먹는 실수. 반대로 직선의 개수는 한 직선 위의 점들이 만드는 직선이 <strong>1개</strong> 라는 점을 놓치기 쉽습니다.</li>
<li>같은 크기로 조를 나눌 때 조의 개수의 팩토리얼($3!$ 등)로 나누지 않는 실수. 조의 이름(A조, B조…)이 구별되면 나누지 않습니다.</li>
<li>"적어도"가 들어간 문제를 직접 세다가 경우를 빠뜨리는 실수 — 여사건을 먼저 떠올리세요.</li>
</ul></div>`,
        tip: r`
<p><strong>"적어도 ~"</strong> 는 거의 항상 <strong>전체 − 반대 경우</strong> 입니다.</p>
<p>대각선의 개수는 $\dfrac{n(n-3)}{2}$ 로 암산하세요. 사각형 2, 오각형 5, 육각형 9, 칠각형 14, 팔각형 20.</p>
<p>최단 경로는 <strong>"전체 이동 횟수 중 한 방향 이동 횟수를 고르기"</strong> → $_{a+b}C_a$. 지나가야 하는 점이 있으면 경로를 나누어 곱합니다. 지나면 안 되는 점은 여사건으로 빼 주세요.</p>
<p>분할 문제는 <strong>묶음의 크기가 같으면 나누기($k!$), 이름이 있으면 나누지 않기</strong> 로 정리하세요.</p>
<p>$_nC_r$ 의 값을 빨리 구하려면 파스칼의 삼각형을 줄마다 더해 가며 만들어도 됩니다. $n\le6$ 정도는 외워 두면 편해요.</p>`
      }
    ],

  <script>
/* 고1 수학 · 4. 행렬 (공통수학1) — 교과서·개념서 수준으로 확장한 개념 설명 */
