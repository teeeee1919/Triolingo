        title: '작도',
        body: r`
<p class="lead-line">눈금 없는 자와 컴퍼스, 딱 두 가지 도구만으로 길이와 각을 똑같이 옮기고 반으로 나눌 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>작도</strong>란 <strong>눈금 없는 자</strong>와 <strong>컴퍼스</strong>만을 사용하여 도형을 그리는 것입니다.</p>
<ul>
<li><strong>눈금 없는 자</strong>: 두 점을 이어 선분이나 직선을 긋거나, 선분을 길게 늘일 때만 써요. <strong>길이를 재면 안 됩니다.</strong></li>
<li><strong>컴퍼스</strong>: 원이나 호를 그리거나, 어떤 선분의 길이를 다른 곳으로 <strong>옮길 때</strong> 써요.</li>
</ul>
<p>"각도기와 눈금자로 재서 그리면 되잖아?" 싶지만, 작도는 <strong>재지 않고도 정확하게</strong> 그릴 수 있다는 것을 보여 주는 약속이에요. 고대 그리스 사람들이 이 규칙으로 기하학을 만들었답니다.</p>
</div>

<div class="def"><strong class="label">① 길이가 같은 선분의 작도</strong>
<p>선분 $AB$ 와 길이가 같은 선분 $PQ$ 를 직선 $l$ 위에 그려 볼게요.</p>
<ol>
<li>자로 직선 $l$ 을 긋고, 그 위에 점 $P$ 를 잡습니다.</li>
<li>컴퍼스를 벌려 $A$ 와 $B$ 에 맞춰 <strong>$\overline{AB}$ 의 길이</strong>를 잽니다.</li>
<li>컴퍼스의 바늘을 $P$ 에 꽂고 원을 그려 직선 $l$ 과 만나는 점을 $Q$ 라 합니다.</li>
</ol>
<p>그러면 $\overline{PQ}=\overline{AB}$ 입니다. (컴퍼스를 벌린 폭이 그대로 길이가 돼요.)</p>
</div>

<div class="def"><strong class="label">② 크기가 같은 각의 작도</strong>
<p>$\angle XOY$ 와 크기가 같은 각을 반직선 $O'X'$ 를 한 변으로 해서 그려 볼게요.</p>
<ol>
<li>$O$ 를 중심으로 원을 그려 $\overrightarrow{OX}$, $\overrightarrow{OY}$ 와 만나는 점을 각각 $A$, $B$ 라 합니다.</li>
<li>$O'$ 를 중심으로 <strong>같은 반지름</strong>의 원을 그려 $\overrightarrow{O'X'}$ 와 만나는 점을 $A'$ 라 합니다.</li>
<li>컴퍼스로 $\overline{AB}$ 의 길이를 재어, $A'$ 를 중심으로 그 반지름의 원을 그려 앞의 원과 만나는 점을 $B'$ 라 합니다.</li>
<li>$\overrightarrow{O'B'}$ 를 그으면 $\angle X'O'B'=\angle XOY$ 입니다.</li>
</ol>
</div>

<div class="why"><strong class="label">왜 각이 같아질까?</strong>
<p>$\triangle OAB$ 와 $\triangle O'A'B'$ 를 보세요. $\overline{OA}=\overline{O'A'}$ (같은 반지름), $\overline{OB}=\overline{O'B'}$ (같은 반지름), $\overline{AB}=\overline{A'B'}$ (컴퍼스로 옮긴 길이)예요. <strong>세 변의 길이가 각각 같은 두 삼각형</strong>은 완전히 똑같은 모양(합동)이라서 대응하는 각도 같아요. 이 원리는 이 단원 마지막의 "SSS 합동"에서 자세히 배워요.</p>
</div>

<div class="def"><strong class="label">③ 각의 이등분선의 작도</strong>
<p>$\angle XOY$ 를 똑같이 둘로 나누는 반직선을 그려요.</p>
<ol>
<li>$O$ 를 중심으로 하는 원을 그려 $\overrightarrow{OX}$, $\overrightarrow{OY}$ 와의 교점을 $A$, $B$ 라 합니다.</li>
<li>$A$ 와 $B$ 를 각각 중심으로 하고 <strong>반지름이 같은</strong> 두 원을 그려 만나는 점을 $P$ 라 합니다.</li>
<li>$\overrightarrow{OP}$ 를 그으면 $\angle XOP=\angle POY$ 입니다.</li>
</ol>
</div>

<!--SVG:bisector-->

<div class="why"><strong class="label">왜 반으로 나뉠까?</strong>
<p>$\triangle OAP$ 와 $\triangle OBP$ 에서 $\overline{OA}=\overline{OB}$ (처음 원의 반지름), $\overline{AP}=\overline{BP}$ (같은 반지름의 두 원), $\overline{OP}$ 는 공통이에요. 세 변이 각각 같으니 합동이고, 따라서 $\angle AOP=\angle BOP$ 입니다.</p>
</div>

<div class="def"><strong class="label">④ 선분의 수직이등분선의 작도</strong>
<p>선분 $AB$ 의 <strong>중점</strong> $M$ 을 지나고 $AB$ 에 <strong>수직</strong>인 직선을 그려요.</p>
<ol>
<li>$A$, $B$ 를 각각 중심으로 하고 반지름이 <strong>같고 $\overline{AB}$ 의 절반보다 긴</strong> 두 원을 그려 두 점 $P$, $Q$ 에서 만나게 합니다.</li>
<li>직선 $PQ$ 를 긋고 $\overline{AB}$ 와 만나는 점을 $M$ 이라 합니다.</li>
</ol>
<p>그러면 $\overline{AM}=\overline{MB}$ 이고 $PQ\perp AB$ 입니다.</p>
</div>

<!--SVG:perp-->

<div class="formula">
$$\text{수직이등분선 위의 점 }P\text{ 에 대하여}\quad \overline{PA}=\overline{PB}$$
</div>
<p>수직이등분선 위에 있는 점은 선분 양 끝점에서 <strong>같은 거리</strong>에 있어요. (두 원의 반지름이 같기 때문이에요!)</p>

<div class="def"><strong class="label">⑤ 정삼각형의 작도</strong>
<p>선분 $AB$ 를 긋고, $A$ 와 $B$ 를 각각 중심으로 하고 반지름이 $\overline{AB}$ 인 원을 그려 교점 $C$ 를 잡아요. $\overline{AC}=\overline{AB}$, $\overline{BC}=\overline{AB}$ 이므로 세 변이 모두 같은 <strong>정삼각형</strong> $ABC$ 가 됩니다. 따라서 $\angle CAB=60^\circ$ 예요. 이 방법으로 <strong>$60^\circ$ 를 작도</strong>할 수 있고, 이등분하면 $30^\circ$, 다시 이등분하면 $15^\circ$ 도 만들 수 있어요.</p>
</div>

<div class="def"><strong class="label">⑥ 평행선의 작도</strong>
<p>직선 $l$ 밖의 점 $P$ 를 지나고 $l$ 에 평행한 직선을 그리는 방법이에요.</p>
<ol>
<li>점 $P$ 를 지나는 직선을 그어 $l$ 과 만나는 점을 $Q$ 라 합니다.</li>
<li>위의 "크기가 같은 각의 작도"로 점 $P$ 에서 <strong>동위각</strong>이 같도록 직선을 그립니다.</li>
</ol>
<p>두 직선이 한 직선과 만나서 생기는 <strong>동위각의 크기가 같으면 두 직선은 평행</strong>해요. (반대로 두 직선이 평행하면 동위각의 크기는 같아요.)</p>
<div class="formula">$$l\parallel m\iff\text{동위각의 크기가 같다}\iff\text{엇각의 크기가 같다}$$</div>
</div>

<div class="def"><strong class="label">작도를 활용한 계산 규칙</strong>
<ul>
<li>선분을 이어 붙이면 길이가 더해지고, 같은 점에서 반대 방향으로 옮기면 길이가 빼져요.</li>
<li>각의 이등분선을 한 번 작도하면 각이 절반이 되고, $n$ 번 연속하면 $\dfrac{1}{2^n}$ 이 돼요.</li>
</ul>
<div class="formula">$$\text{각의 이등분선을 }n\text{ 번 작도}\Rightarrow\ \text{처음 각}\times\left(\tfrac12\right)^n$$</div>
</div>

<div class="ex"><strong class="label">예시 1 (각의 이등분선)</strong>
<p class="exq">$\angle XOY=70^\circ$ 일 때, 각의 이등분선 $\overrightarrow{OZ}$ 를 작도하였다. $\angle XOZ$ 의 크기를 구하시오.</p>
<div class="exa">
<p>각의 이등분선은 각을 똑같이 둘로 나누므로 $\angle XOZ=\angle ZOY$ 입니다.</p>
<p>$70^\circ\div2=35^\circ$</p>
<p><strong>답: $35^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (수직이등분선과 중점)</strong>
<p class="exq">선분 $\overline{AB}=14\text{ cm}$ 의 수직이등분선을 작도하여 $\overline{AB}$ 와 만나는 점을 $M$ 이라 하였다. $\overline{AM}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>수직이등분선은 선분의 중점 $M$ 을 지나므로 $\overline{AM}=\overline{MB}=\dfrac12\overline{AB}$ 입니다.</p>
<p>$14\div2=7$</p>
<p><strong>답: $7\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (수직이등분선 위의 점)</strong>
<p class="exq">선분 $AB$ 의 수직이등분선 위의 한 점 $P$ 에 대하여 $\overline{PA}=9\text{ cm}$ 이다. $\overline{PB}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>수직이등분선 위의 점은 선분의 양 끝점에서 같은 거리에 있어요. 따라서 $\overline{PB}=\overline{PA}$.</p>
<p><strong>답: $9\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (이등분선 연속 작도)</strong>
<p class="exq">$120^\circ$ 인 각에 대하여 각의 이등분선을 연속으로 $3$ 번 작도하였다. 마지막에 얻은 각 중 하나의 크기를 구하시오.</p>
<div class="exa">
<p>한 번 작도할 때마다 절반이 됩니다: $120^\circ\to60^\circ\to30^\circ\to15^\circ$.</p>
<p>식으로는 $120^\circ\times\left(\frac12\right)^3=120^\circ\div8=15^\circ$.</p>
<p><strong>답: $15^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (정삼각형의 작도)</strong>
<p class="exq">선분 $\overline{AB}=8\text{ cm}$ 에서 점 $A$ 와 점 $B$ 를 각각 중심으로 하고 반지름이 $8\text{ cm}$ 인 원을 그려 두 원의 교점 중 하나를 $C$ 라 하였다. 삼각형 $ABC$ 의 둘레와 $\angle CAB$ 의 크기를 구하시오.</p>
<div class="exa">
<p>$\overline{AC}=\overline{BC}=8$ (원의 반지름), $\overline{AB}=8$ 이므로 세 변이 모두 같은 정삼각형입니다.</p>
<p>둘레 $=8\times3=24\text{ cm}$. 정삼각형의 세 각은 같고 합이 $180^\circ$ 이므로 $\angle CAB=180^\circ\div3=60^\circ$.</p>
<p><strong>답: $24\text{ cm}$, $60^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (선분 옮기기)</strong>
<p class="exq">반직선 $PX$ 위에 $\overline{PQ}=9\text{ cm}$ 가 되도록 점 $Q$ 를 잡고, $Q$ 에서 (가) 같은 방향으로, (나) $P$ 쪽으로 $\overline{QR}=4\text{ cm}$ 가 되도록 점 $R$ 을 작도하였다. 각각 $\overline{PR}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>(가) $P,Q,R$ 가 같은 방향으로 놓이므로 길이를 더합니다: $9+4=13$.</p>
<p>(나) $R$ 이 $P$ 쪽으로 돌아오므로 길이를 뺍니다: $9-4=5$.</p>
<p><strong>답: (가) $13\text{ cm}$, (나) $5\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (이등분선 두 번 이어서)</strong>
<p class="exq">$\angle AOB=96^\circ$ 이다. $\overrightarrow{OC}$ 는 $\angle AOB$ 의 이등분선이고 $\overrightarrow{OD}$ 는 $\angle COB$ 의 이등분선일 때, $\angle DOB$ 의 크기를 구하시오.</p>
<div class="exa">
<p>$\angle COB=96^\circ\div2=48^\circ$.</p>
<p>$\angle DOB=48^\circ\div2=24^\circ$.</p>
<p><strong>답: $24^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (각을 이어 붙이거나 겹치기)</strong>
<p class="exq">작도한 $40^\circ$ 인 각과 $55^\circ$ 인 각을 (가) 이어 붙인 각, (나) 겹쳐서 큰 각에서 작은 각을 뺀 각의 크기를 각각 구하시오.</p>
<div class="exa">
<p>(가) $40^\circ+55^\circ=95^\circ$</p>
<p>(나) $55^\circ-40^\circ=15^\circ$</p>
<p><strong>답: (가) $95^\circ$, (나) $15^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (수직이등분선과 방정식)</strong>
<p class="exq">선분 $AB$ 의 수직이등분선 위의 한 점 $P$ 에 대하여 $\overline{PA}=(3x-4)\text{ cm}$, $\overline{PB}=(x+8)\text{ cm}$ 이다. $x$ 의 값과 $\overline{PA}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>수직이등분선 위의 점이므로 $\overline{PA}=\overline{PB}$: $3x-4=x+8$.</p>
<p>$2x=12$ 이므로 $x=6$.</p>
<p>$\overline{PA}=3\times6-4=14$ (확인: $\overline{PB}=6+8=14$ ✓)</p>
<p><strong>답: $x=6$, $14\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (평행선의 작도와 동위각)</strong>
<p class="exq">직선 $l$ 과 $m$ 이 평행하고, 한 직선과 만나서 생긴 동위각의 크기가 각각 $(2x+10)^\circ$, $(3x-20)^\circ$ 이다. $x$ 의 값과 이 동위각의 크기를 구하시오.</p>
<div class="exa">
<p>평행선에서 동위각의 크기는 같으므로 $2x+10=3x-20$.</p>
<p>이항하면 $30=x$, 즉 $x=30$.</p>
<p>동위각 $=2\times30+10=70^\circ$ (확인: $3\times30-20=70$ ✓)</p>
<p><strong>답: $x=30$, $70^\circ$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>눈금 있는 자로 길이를 재거나 각도기로 각을 재서 그리면 <strong>작도가 아니에요.</strong> 자로는 선을 긋기만 합니다.</li>
<li>각의 이등분선·수직이등분선에서 $A$, $B$ 를 중심으로 하는 두 원의 <strong>반지름은 반드시 같아야</strong> 해요.</li>
<li>수직이등분선을 작도할 때 반지름이 $\overline{AB}$ 의 절반보다 짧으면 두 원이 만나지 못해요.</li>
<li>각의 이등분선을 $n$ 번 작도할 때 $\frac{n}{2}$ 배가 아니라 $\left(\frac12\right)^n$ 배예요. ($3$ 번이면 $\frac18$)</li>
<li>점 $P$ 가 수직이등분선 위에 있어도 $\overline{PA}=\overline{AB}$ 인 것은 아니에요. $\overline{PA}=\overline{PB}$ 입니다.</li>
</ul>
</div>
`,
        tip: r`
<p><strong>작도는 "원 → 교점 → 연결"</strong> 한 패턴이에요. 컴퍼스로 원(호)을 그려 교점을 만들고, 그 교점들을 자로 이어요. 문제에서 "작도 순서"를 물으면 이 흐름대로 정리하세요.</p>
<p><strong>특별한 각 만들기</strong>: 정삼각형으로 $60^\circ$ → 이등분해서 $30^\circ$, $15^\circ$. 두 각을 이어 붙여 $60^\circ+30^\circ=90^\circ$, $90^\circ+15^\circ=105^\circ$ 도 작도할 수 있어요.</p>
<p><strong>$180^\circ$ 에서 시작</strong>: 일직선(평각) $180^\circ$ 를 이등분하면 $90^\circ$ — 수직이 돼요. 이게 수직이등분선의 아이디어입니다.</p>
<p>이등분선 문제는 <strong>나눠 가며 계산</strong>하세요. 예: $\angle AOB=x$ 에서 이등분 세 번 하면 $\dfrac{x}{2},\ \dfrac{x}{4},\ \dfrac{x}{8}$ 이니 남는 각은 $x-\dfrac{x}{8}=\dfrac{7x}{8}$ 처럼 쓸 수 있어요.</p>`
      },

      /* ───────── 1. 삼각형의 작도와 결정 조건 ───────── */
      {
        title: '삼각형의 작도와 결정 조건',
        body: r`
<p class="lead-line">삼각형을 "단 하나"로 정하려면 무엇을 알아야 할까요? 그리고 세 길이가 아무렇게나 주어져도 삼각형이 만들어질까요?</p>

<div class="def"><strong class="label">개념 ― 삼각형의 변과 각의 이름</strong>
<p>삼각형 $ABC$ 에서 꼭짓점 $A$ 의 <strong>대변</strong>은 $\overline{BC}$, 꼭짓점 $B$ 의 대변은 $\overline{CA}$, 꼭짓점 $C$ 의 대변은 $\overline{AB}$ 예요. 대변은 그 꼭짓점의 <strong>맞은편 변</strong>이에요. 한 변을 양쪽에서 끼고 있는 두 각을 그 변의 <strong>양 끝각</strong>, 두 변 사이에 있는 각을 그 두 변의 <strong>끼인각</strong>이라 해요.</p>
<ul>
<li>$\overline{AB}$ 의 양 끝각: $\angle A$, $\angle B$</li>
<li>$\overline{AB}$ 와 $\overline{BC}$ 의 끼인각: $\angle B$</li>
</ul>
</div>

<div class="def"><strong class="label">삼각형이 만들어질 조건</strong>
<p>세 변의 길이 $a,\ b,\ c$ 가 주어졌을 때, <strong>가장 긴 변의 길이가 나머지 두 변의 길이의 합보다 작아야</strong> 삼각형이 만들어집니다.</p>
<div class="formula">$$\text{(가장 긴 변)}\ \lt\ \text{(나머지 두 변의 합)}$$</div>
<p>예를 들어 $3,\ 5,\ 7$ 은 $7\lt3+5=8$ 이라 삼각형이 돼요. 하지만 $3,\ 4,\ 8$ 은 $3+4=7\lt8$ 이라 삼각형이 안 돼요.</p>
</div>

<!--SVG:sticks-->

<div class="why"><strong class="label">왜 그럴까?</strong>
<p>"두 점 사이를 잇는 가장 짧은 길은 직선"이에요. 점 $B$ 에서 $C$ 로 바로 가는 길 $\overline{BC}$ 보다, $A$ 를 거쳐 가는 길 $\overline{BA}+\overline{AC}$ 가 항상 더 길어요. 그래서 한 변은 나머지 두 변의 합보다 짧아야 해요. 만약 합이 <strong>같으면</strong> 두 변이 일직선으로 눕혀져 삼각형이 아니라 선분이 되어 버려요. (예: $5,5,10$)</p>
<p>또 가장 긴 변만 확인하면 충분해요. 가장 긴 변이 조건을 만족하면 나머지 변은 자동으로 만족하니까요.</p>
</div>

<div class="def"><strong class="label">나머지 한 변의 범위</strong>
<p>두 변의 길이가 $a,\ b$ 인 삼각형에서 나머지 한 변의 길이 $x$ 는</p>
<div class="formula">$$|a-b|\ \lt\ x\ \lt\ a+b$$</div>
<p>($x$ 가 가장 긴 변일 때는 $x\lt a+b$, $a$ 나 $b$ 가 가장 긴 변일 때는 $x\gt|a-b|$ 로 나와요.) 이 범위의 <strong>자연수</strong>는 $|a-b|+1$ 부터 $a+b-1$ 까지이므로, 개수는 $2\times(\text{작은 변})-1$ 개예요.</p>
</div>

<div class="def"><strong class="label">삼각형의 작도 방법 (3가지)</strong>
<ol>
<li><strong>세 변</strong>이 주어질 때: $\overline{BC}$ 를 그리고, $B$ 에서 반지름 $c$, $C$ 에서 반지름 $b$ 인 원을 그려 만나는 점을 $A$ 로 합니다.</li>
<li><strong>두 변과 그 끼인각</strong>이 주어질 때: 각 $B$ 를 작도하고 두 변 $\overline{BA}$, $\overline{BC}$ 의 길이를 옮겨 $A$, $C$ 를 잡은 뒤 $\overline{AC}$ 를 잇습니다.</li>
<li><strong>한 변과 그 양 끝각</strong>이 주어질 때: 변 $\overline{BC}$ 를 그리고, $B$ 와 $C$ 에서 각을 옮겨 만나는 점을 $A$ 로 합니다.</li>
</ol>
</div>

<div class="def"><strong class="label">삼각형이 하나로 결정되는 조건</strong>
<p>"결정된다"는 것은 주어진 조건으로 그릴 수 있는 삼각형이 <strong>모양과 크기가 모두 같은 단 하나</strong>(서로 합동)라는 뜻이에요.</p>
<table>
<tr><th>조건</th><th>결정?</th><th>이유</th></tr>
<tr><td>세 변의 길이 (SSS)</td><td>○ (삼각형 조건 만족 시)</td><td>작도 방법 1</td></tr>
<tr><td>두 변과 그 끼인각 (SAS)</td><td>○</td><td>작도 방법 2</td></tr>
<tr><td>한 변과 그 양 끝각 (ASA)</td><td>○ (두 각의 합이 $180^\circ$ 미만)</td><td>작도 방법 3</td></tr>
<tr><td>한 변과 두 각 (끼지 않는 각 포함, AAS)</td><td>○ (두 각의 합이 $180^\circ$ 미만)</td><td>나머지 한 각을 알 수 있어 ASA 와 같아져요</td></tr>
<tr><td>두 변과 끼인각이 아닌 각 (SSA)</td><td>✕</td><td>삼각형이 두 개 그려질 수 있어요</td></tr>
<tr><td>세 각 (AAA)</td><td>✕</td><td>모양만 같고 크기가 다른 삼각형이 무수히 많아요</td></tr>
</table>
</div>

<div class="why"><strong class="label">왜 두 변과 끼인각이 "아닌" 각은 안 될까?</strong>
<p>$\overline{AB}=5$, $\overline{BC}=4$, $\angle A=30^\circ$ 를 생각해 봐요. 점 $B$ 에서 반지름 $4$ 로 원을 그리면, $A$ 에서 $30^\circ$ 방향으로 뻗은 반직선과 <strong>두 곳에서</strong> 만날 수 있어요. 그래서 서로 다른 삼각형이 두 개 생겨요. 끼인각이면 변의 길이가 모두 정해져 그런 일이 없어요.</p>
<p>세 각만 주면 어떨까요? 작은 삼각형 모양을 복사기로 크게 확대하면 각은 그대로인데 크기만 달라지죠. 그래서 크기를 정하는 <strong>변의 길이가 최소 하나는 필요</strong>해요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (삼각형이 되는 세 길이)</strong>
<p class="exq">세 변의 길이가 $3\text{ cm}$, $5\text{ cm}$, $7\text{ cm}$ 인 삼각형을 작도할 수 있는지 답하시오.</p>
<div class="exa">
<p>가장 긴 변은 $7$. 나머지 두 변의 합은 $3+5=8$.</p>
<p>$7\lt8$ 이므로 삼각형이 만들어져요.</p>
<p><strong>답: 작도할 수 있다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">세 변의 길이가 $4\text{ cm}$, $6\text{ cm}$, $11\text{ cm}$ 인 삼각형을 작도할 수 있는지 답하시오.</p>
<div class="exa">
<p>가장 긴 변 $11$, 나머지 합 $4+6=10$.</p>
<p>$11\gt10$ 이므로 두 변이 끝까지 닿지 못해요.</p>
<p><strong>답: 작도할 수 없다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (같을 때도 안 돼요)</strong>
<p class="exq">길이가 각각 $5,\ 5,\ 10$ (단위: cm) 인 세 막대로 삼각형을 만들 수 있는지 답하시오.</p>
<div class="exa">
<p>가장 긴 변 $10$, 나머지 합 $5+5=10$. 같아요.</p>
<p>합이 같으면 두 막대를 일직선으로 놓은 것과 같아서 삼각형이 되지 않아요.</p>
<p><strong>답: 만들 수 없다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (나머지 한 변의 범위)</strong>
<p class="exq">두 변의 길이가 $6\text{ cm}$, $10\text{ cm}$ 인 삼각형에서 나머지 한 변의 길이가 될 수 있는 자연수는 모두 몇 개인지 구하시오.</p>
<div class="exa">
<p>나머지 한 변을 $x$ 라 하면 $|6-10|\lt x\lt6+10$, 즉 $4\lt x\lt16$.</p>
<p>자연수는 $5,6,\cdots,15$ 이므로 $15-5+1=11$ (개). (공식: $2\times6-1=11$ ✓)</p>
<p><strong>답: $11$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (조건 판단: SSA)</strong>
<p class="exq">삼각형 $ABC$ 에서 $\overline{AB}=5\text{ cm},\ \overline{BC}=7\text{ cm},\ \angle A=40^\circ$ 가 주어졌을 때, 삼각형이 하나로 결정되는지 답하시오.</p>
<div class="exa">
<p>$\angle A$ 는 $\overline{AB}$ 와 $\overline{BC}$ 의 <strong>끼인각이 아니에요</strong>. ($\overline{AB}$, $\overline{BC}$ 의 끼인각은 $\angle B$ 입니다.)</p>
<p>따라서 서로 다른 삼각형이 만들어질 수 있어 하나로 결정되지 않아요.</p>
<p><strong>답: 결정되지 않는다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (조건 판단: ASA / AAA)</strong>
<p class="exq">(가) $\overline{AB}=6\text{ cm},\ \angle A=50^\circ,\ \angle B=70^\circ$, (나) $\angle A=50^\circ,\ \angle B=70^\circ,\ \angle C=60^\circ$ 가 각각 주어졌을 때, 삼각형이 하나로 결정되는 것의 개수를 구하시오.</p>
<div class="exa">
<p>(가) $\overline{AB}$ 와 그 양 끝각 $\angle A,\angle B$ 가 주어졌고 $50^\circ+70^\circ=120^\circ\lt180^\circ$ → 결정된다 (ASA).</p>
<p>(나) 세 각만 알면 크기를 정할 수 없어요 → 결정되지 않는다.</p>
<p><strong>답: $1$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (둘레와 가장 긴 변)</strong>
<p class="exq">둘레의 길이가 $20\text{ cm}$ 인 삼각형에서 가장 긴 변의 길이가 될 수 있는 가장 큰 정수(cm)를 구하시오.</p>
<div class="exa">
<p>가장 긴 변을 $c$ 라 하면 나머지 두 변의 합은 $20-c$ 이고, $c\lt20-c$ 에서 $c\lt10$.</p>
<p>가장 큰 정수는 $9$. (실제로 $9,\ 6,\ 5$ 처럼 $9\lt6+5$ 인 삼각형이 있어요.)</p>
<p><strong>답: $9$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (연속하는 길이)</strong>
<p class="exq">세 변의 길이가 $x,\ x+3,\ x+6$ 인 삼각형이 만들어지도록 하는 가장 작은 자연수 $x$ 를 구하시오.</p>
<div class="exa">
<p>가장 긴 변은 $x+6$. 조건: $x+6\lt x+(x+3)$.</p>
<p>정리하면 $6\lt x+3$, 즉 $x\gt3$.</p>
<p>가장 작은 자연수는 $x=4$. 확인: $4,\ 7,\ 10$ 에서 $10\lt4+7=11$ ✓ ($x=3$ 이면 $3,6,9$ 로 $9=3+6$ 이라 안 돼요.)</p>
<p><strong>답: $4$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (자연수 변의 삼각형 세어 보기)</strong>
<p class="exq">둘레의 길이가 $12\text{ cm}$ 이고 세 변의 길이가 모두 자연수인 삼각형은, 합동인 것을 같은 것으로 볼 때 모두 몇 가지인가?</p>
<div class="exa">
<p>세 변을 $a\le b\le c$ 라 하면 $a+b+c=12$ 이고 $c\lt6$ (가장 긴 변이 둘레의 절반 미만). 가장 긴 변은 $c\le5$.</p>
<p>$c=5$: $a+b=7$, $a\le b\le5$ → $(2,5,5),\ (3,4,5)$</p>
<p>$c=4$: $a+b=8$, $a\le b\le4$ → $(4,4,4)$</p>
<p>$c\le3$ 이면 $a+b+c\le9\lt12$ 이라 불가능.</p>
<p><strong>답: $3$ 가지</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (막대 고르기)</strong>
<p class="exq">길이가 각각 $2,\ 3,\ 5,\ 6,\ 8$ (단위: cm) 인 $5$ 개의 막대가 있다. 이 중 서로 다른 $3$ 개를 골라 삼각형을 만들 때, 만들 수 있는 삼각형의 개수를 구하시오.</p>
<div class="exa">
<p>작은 것부터 $p\lt q\lt s$ 로 골라 $p+q\gt s$ 인지 확인해요.</p>
<p>$(2,3,5)$ ✕ · $(2,3,6)$ ✕ · $(2,3,8)$ ✕</p>
<p>$(2,5,6)$ ✕ ($7\gt6$ ✓ → ○), 다시 확인: $2+5=7\gt6$ 이므로 ○</p>
<p>$(2,5,8)$ ✕ · $(2,6,8)$ ✕ ($2+6=8$)</p>
<p>$(3,5,6)$ ○ · $(3,5,8)$ ✕ ($3+5=8$) · $(3,6,8)$ ○ · $(5,6,8)$ ○</p>
<p>○ 인 것: $(2,5,6),\ (3,5,6),\ (3,6,8),\ (5,6,8)$ → $4$ 개</p>
<p><strong>답: $4$ 개</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>"가장 긴 변 $\lt$ 나머지 합" 에서 <strong>등호를 넣으면 안 돼요.</strong> 같을 때는 삼각형이 만들어지지 않습니다.</li>
<li>가장 긴 변이 아닌 변을 골라 비교하면 안 돼요. 꼭 <strong>가장 긴 변</strong>과 비교하세요.</li>
<li>"두 변과 한 각"이 주어졌어도 그 각이 <strong>끼인각</strong>이 아니면 결정되지 않아요 (SSA).</li>
<li>"한 변과 두 각"에서 두 각의 합이 $180^\circ$ 이상이면 삼각형 자체가 없어요.</li>
<li>세 <strong>각</strong>(AAA)을 안다고 삼각형이 결정되는 것은 아니에요.</li>
<li>범위 문제에서 "자연수의 개수"를 셀 때 양 끝 값은 포함하지 않는 점을 놓치기 쉬워요.</li>
</ul>
</div>
`,
        tip: r`
<p><strong>삼각형 조건 한 줄 요약</strong>: 가장 큰 수 $\lt$ 나머지 둘의 합. 세 수를 크기순으로 쓰고 <strong>두 작은 수를 더해서 큰 수와 비교</strong>하면 끝!</p>
<p>자연수 변의 개수 공식: 두 변이 $a,b$ 일 때 나머지 변이 될 수 있는 자연수는 $|a-b|+1$ 부터 $a+b-1$ 까지 → <strong>$2\times(\text{작은 변})-1$ 개</strong>. 예: $6,10\to11$ 개.</p>
<p>둘레가 $P$ 일 때 가장 긴 변은 항상 $\dfrac P2$ 미만. 가장 큰 정수는 $P$ 가 짝수면 $\dfrac P2-1$, 홀수면 $\dfrac{P-1}{2}$ 이에요.</p>
<p>결정 조건 암기법: <strong>"변변변 / 변각변 / 각변각"</strong> (SSS, SAS, ASA) 세 가지만 외우세요. "변변각(끼지 않음)"과 "각각각"은 ✕.</p>`
      },

      /* ───────── 2. 도형의 합동 ───────── */
      {
        title: '도형의 합동',
        body: r`
<p class="lead-line">모양과 크기가 똑같아서 포개었을 때 완전히 겹쳐지는 두 도형을 "합동"이라고 해요. 삼각형은 딱 세 가지만 확인하면 합동을 알 수 있어요.</p>

<div class="def"><strong class="label">개념 ― 합동과 대응</strong>
<p>한 도형을 옮기거나 뒤집어서 다른 도형에 <strong>완전히 포갤 수 있을 때</strong> 두 도형은 <strong>합동</strong>이라 하고, 기호 $\equiv$ 로 나타내요. 예: $\triangle ABC\equiv\triangle DEF$</p>
<p>포개었을 때 서로 겹쳐지는 점, 변, 각을 각각 <strong>대응점</strong>, <strong>대응변</strong>, <strong>대응각</strong>이라 해요. 합동인 두 도형에서는</p>
<ul>
<li><strong>대응변의 길이가 서로 같고</strong></li>
<li><strong>대응각의 크기가 서로 같아요.</strong></li>
</ul>
<p>그래서 넓이와 둘레도 같아요. (거꾸로, 넓이가 같다고 합동인 것은 아니에요. 가로 $2$, 세로 $6$ 인 직사각형과 가로 $3$, 세로 $4$ 인 직사각형은 넓이가 $12$ 로 같지만 모양이 달라요.)</p>
<p><strong>합동을 기호로 쓸 때는 대응하는 꼭짓점을 같은 순서로 써요.</strong> $\triangle ABC\equiv\triangle QRP$ 는 $A\leftrightarrow Q$, $B\leftrightarrow R$, $C\leftrightarrow P$ 라는 뜻이에요.</p>
</div>

<div class="formula">
$$\triangle ABC\equiv\triangle DEF\ \Longrightarrow\ \overline{AB}=\overline{DE},\ \overline{BC}=\overline{EF},\ \overline{CA}=\overline{FD},\quad \angle A=\angle D,\ \angle B=\angle E,\ \angle C=\angle F$$
</div>

<div class="def"><strong class="label">삼각형의 합동 조건 (3가지)</strong>
<p>두 삼각형은 아래 중 하나가 성립하면 합동이에요.</p>
<ol>
<li><strong>SSS 합동</strong>: 세 쌍의 대응변의 길이가 각각 같다.</li>
<li><strong>SAS 합동</strong>: 두 쌍의 대응변의 길이가 각각 같고, 그 <strong>끼인각</strong>의 크기가 같다.</li>
<li><strong>ASA 합동</strong>: 한 쌍의 대응변의 길이가 같고, 그 <strong>양 끝각</strong>의 크기가 각각 같다.</li>
</ol>
<p>S는 변(Side), A는 각(Angle)의 첫 글자예요. 이 세 가지는 앞 단원에서 배운 "삼각형이 하나로 결정되는 조건"과 똑같아요! 하나로 결정된다는 것이 곧 합동이라는 뜻이니까요.</p>
</div>

<!--SVG:congruent-->

<div class="why"><strong class="label">왜 SSA, AAA 는 안 될까?</strong>
<ul>
<li><strong>SSA</strong>(두 변과 끼인각이 아닌 각): 삼각형이 두 가지로 그려질 수 있어서 합동이라고 장담할 수 없어요.</li>
<li><strong>AAA</strong>(세 각): 모양은 같지만 크기가 다를 수 있어요. 작은 삼각형을 확대한 것을 떠올리면 돼요.</li>
<li><strong>AAS</strong>(한 변과 끼지 않는 각 두 개)는 나머지 한 각이 $180^\circ$ 에서 두 각을 빼서 정해지므로 결국 ASA 와 같아져서 합동이에요.</li>
</ul>
</div>

<div class="def"><strong class="label">"더 필요한 조건" 찾기</strong>
<p>$\overline{AB}=\overline{DE}$, $\angle B=\angle E$ 가 이미 주어졌을 때</p>
<ul>
<li>SAS 합동이 되려면 → $\angle B$ 를 끼고 있는 다른 변인 <strong>$\overline{BC}=\overline{EF}$</strong></li>
<li>ASA 합동이 되려면 → $\overline{AB}$ 의 다른 쪽 끝각인 <strong>$\angle A=\angle D$</strong></li>
</ul>
<p>$\angle A=\angle D$, $\overline{AB}=\overline{DE}$ 가 주어졌다면 SAS 가 되기 위해서는 $\angle A$ 를 끼고 있는 다른 변 <strong>$\overline{AC}=\overline{DF}$</strong> 가 필요해요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (대응 찾기)</strong>
<p class="exq">$\triangle ABC\equiv\triangle QRP$ 일 때, 변 $\overline{AB}$ 에 대응하는 변과 $\angle C$ 에 대응하는 각을 구하시오.</p>
<div class="exa">
<p>꼭짓점이 쓰인 순서대로 대응해요: $A\leftrightarrow Q$, $B\leftrightarrow R$, $C\leftrightarrow P$.</p>
<p>$\overline{AB}$ 는 $A,B$ 에 대응하는 $Q,R$ 를 이은 $\overline{QR}$. $\angle C$ 는 $C$ 에 대응하는 $P$ 의 각 $\angle P$.</p>
<p><strong>답: $\overline{QR}$, $\angle P$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (대응변의 길이)</strong>
<p class="exq">$\triangle ABC\equiv\triangle DEF$ 이고 $\overline{AB}=7\text{ cm}$, $\overline{BC}=9\text{ cm}$, $\overline{CA}=5\text{ cm}$ 일 때, $\overline{DE}$, $\overline{EF}$, $\overline{FD}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>합동이면 대응변의 길이가 같아요. $\overline{DE}=\overline{AB}=7$, $\overline{EF}=\overline{BC}=9$, $\overline{FD}=\overline{CA}=5$.</p>
<p><strong>답: $7\text{ cm}$, $9\text{ cm}$, $5\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (대응각의 크기)</strong>
<p class="exq">$\triangle ABC\equiv\triangle DEF$ 이고 $\angle A=50^\circ$, $\angle B=60^\circ$ 일 때, $\angle F$ 의 크기를 구하시오.</p>
<div class="exa">
<p>$\angle C=180^\circ-50^\circ-60^\circ=70^\circ$.</p>
<p>$\angle F$ 는 $\angle C$ 의 대응각이므로 $\angle F=70^\circ$.</p>
<p><strong>답: $70^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (합동 조건 말하기)</strong>
<p class="exq">$\triangle ABC$ 와 $\triangle DEF$ 에서 $\overline{AB}=\overline{DE}$, $\overline{BC}=\overline{EF}$, $\angle B=\angle E$ 가 성립한다. 어떤 합동 조건인가?</p>
<div class="exa">
<p>두 변 $\overline{AB},\overline{BC}$ 의 길이가 같고, 그 두 변의 끼인각 $\angle B$ 가 같아요.</p>
<p><strong>답: SAS 합동</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (반드시 합동일까?)</strong>
<p class="exq">$\triangle ABC$ 와 $\triangle DEF$ 에서 (가) $\angle A=\angle D,\ \angle B=\angle E,\ \angle C=\angle F$, (나) $\overline{AB}=\overline{DE},\ \overline{BC}=\overline{EF},\ \angle A=\angle D$ 일 때 각각 반드시 합동인지 답하시오.</p>
<div class="exa">
<p>(가) 세 각만 같음(AAA) → 합동이라고 할 수 없어요.</p>
<p>(나) $\angle A$ 는 $\overline{AB}$ 와 $\overline{BC}$ 의 끼인각이 아니에요(SSA) → 합동이라고 할 수 없어요.</p>
<p><strong>답: (가) 합동이라고 할 수 없다, (나) 합동이라고 할 수 없다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (더 필요한 조건)</strong>
<p class="exq">$\triangle ABC$ 와 $\triangle DEF$ 에서 $\overline{AB}=\overline{DE}$, $\angle B=\angle E$ 일 때, 두 삼각형이 SAS 합동이 되기 위해 더 필요한 조건을 하나 쓰시오.</p>
<div class="exa">
<p>$\angle B$ 가 끼인각이 되려면 $\angle B$ 를 끼고 있는 다른 변도 같아야 해요.</p>
<p><strong>답: $\overline{BC}=\overline{EF}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (합동과 방정식)</strong>
<p class="exq">$\triangle ABC\equiv\triangle DEF$ 이고 $\overline{AB}=(3x+2)\text{ cm}$, $\overline{DE}=(5x-6)\text{ cm}$ 이다. $x$ 의 값과 $\overline{AB}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>대응변은 길이가 같으므로 $3x+2=5x-6$.</p>
<p>$8=2x$ 이므로 $x=4$.</p>
<p>$\overline{AB}=3\times4+2=14$ (확인: $5\times4-6=14$ ✓)</p>
<p><strong>답: $x=4$, $14\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (둘레와 비)</strong>
<p class="exq">$\triangle ABC\equiv\triangle DEF$ 이고 $\triangle ABC$ 의 세 변의 길이의 비가 $\overline{AB}:\overline{BC}:\overline{CA}=3:4:5$ 이며 둘레의 길이는 $36\text{ cm}$ 이다. $\overline{DE}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>합동이므로 $\overline{DE}=\overline{AB}$.</p>
<p>$\overline{AB}=36\times\dfrac{3}{3+4+5}=36\times\dfrac{3}{12}=9$.</p>
<p><strong>답: $9\text{ cm}$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>합동을 기호로 쓸 때 <strong>꼭짓점의 순서를 대응에 맞게</strong> 써야 해요. $\triangle ABC\equiv\triangle DFE$ 와 $\triangle ABC\equiv\triangle DEF$ 는 전혀 다른 말이에요.</li>
<li>SAS 에서 각은 <strong>끼인각</strong>이어야 해요. 두 변 중 하나의 끝에 있는 각이 아니라 두 변 사이에 있는 각이에요.</li>
<li>ASA 에서 변은 두 각의 <strong>사이에 있는 변</strong>이어야 해요. (끼지 않았다면 두 각으로 나머지 각을 구해 ASA 로 바꿀 수 있어요.)</li>
<li>넓이가 같거나 각이 같다는 이유만으로 합동이라고 하면 안 돼요.</li>
</ul>
</div>
`,
        tip: r`
<p><strong>합동 조건 고르는 순서</strong>: 먼저 같은 <strong>변</strong>이 몇 쌍인지 세요. 세 쌍이면 SSS, 두 쌍이면 그 사이에 같은 각이 있는지(SAS), 한 쌍이면 그 양 끝에 같은 각 두 개가 있는지(ASA) 확인하세요.</p>

      /* ───────── 3. (추가) 합동의 활용과 증명 ───────── */
      {
        title: '합동의 활용과 증명 쓰는 법',
        body: r`
<p class="lead-line">합동을 이용하면 "직접 재기 어려운 길이와 각"도 구할 수 있어요. 증명은 <strong>같은 것을 찾아 줄 세우기</strong>예요.</p>

<div class="def"><strong class="label">증명 쓰는 틀</strong>
<p>서술형에서는 아래 순서로 쓰면 돼요.</p>
<ol>
<li>"$\triangle ABE$ 와 $\triangle BCF$ 에서" 로 시작해서 합동이라고 보일 두 삼각형을 밝혀요.</li>
<li>같은 변과 각을 <strong>① ② ③</strong> 으로 번호를 매겨 나열하고, 근거(가정, 공통, 정사각형의 성질 등)를 써요.</li>
<li>"따라서 ∼ 합동" 이라고 쓰고 합동 조건(SSS, SAS, ASA)을 말해요.</li>
<li>합동이므로 대응각(대응변)이 같다고 쓰고 구하려는 값을 계산해요.</li>
</ol>
</div>

<div class="ex"><strong class="label">예시 1 (정사각형)</strong>
<p class="exq">정사각형 $ABCD$ 에서 변 $BC$ 위의 점 $E$, 변 $CD$ 위의 점 $F$ 가 $\overline{BE}=\overline{CF}$ 를 만족한다. 두 선분 $\overline{AE},\ \overline{BF}$ 의 교점을 $P$ 라 하고 $\angle BAE=25^\circ$ 일 때, $\angle BPE$ 의 크기를 구하시오.</p>
<div class="exa">
<p>$\triangle ABE$ 와 $\triangle BCF$ 에서 ① $\overline{AB}=\overline{BC}$ (정사각형의 변), ② $\angle ABE=\angle BCF=90^\circ$, ③ $\overline{BE}=\overline{CF}$ → <strong>SAS 합동</strong>.</p>
<p>따라서 $\angle CBF=\angle BAE=25^\circ$ (대응각).</p>
<p>$\triangle ABE$ 에서 $\angle AEB=90^\circ-25^\circ=65^\circ$ 이므로, $\triangle PBE$ 에서 $\angle PBE=25^\circ$, $\angle PEB=65^\circ$.</p>
<p>$\angle BPE=180^\circ-25^\circ-65^\circ=90^\circ$.</p>
<p><strong>답: $90^\circ$</strong> (즉 $AE\perp BF$)</p>
</div></div>

<div class="ex"><strong class="label">예시 2 (정삼각형)</strong>
<p class="exq">정삼각형 $ABC$ 의 변 $BC$ 위의 점 $D$, 변 $CA$ 위의 점 $E$ 가 $\overline{BD}=\overline{CE}$ 를 만족한다. 두 선분 $\overline{AD},\ \overline{BE}$ 의 교점을 $P$ 라 하고 $\angle BAD=20^\circ$ 일 때, $\angle CBE$ 와 $\angle APE$ 의 크기를 차례로 구하시오.</p>
<div class="exa">
<p>$\triangle ABD$ 와 $\triangle BCE$ 에서 ① $\overline{AB}=\overline{BC}$ ② $\angle ABD=\angle BCE=60^\circ$ ③ $\overline{BD}=\overline{CE}$ → SAS 합동.</p>
<p>따라서 $\angle CBE=\angle BAD=20^\circ$.</p>
<p>$\triangle ABP$ 에서 $\angle PAB=20^\circ$, $\angle PBA=\angle ABC-\angle CBE=60^\circ-20^\circ=40^\circ$.</p>
<p>$\angle APE$ 는 $\triangle ABP$ 의 한 외각이므로 이웃하지 않는 두 내각의 합 $20^\circ+40^\circ=60^\circ$.</p>
<p><strong>답: $20^\circ$, $60^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (SSS 로 확인)</strong>
<p class="exq">$\triangle ABC$ 에서 $\overline{AB}=5,\ \overline{BC}=7,\ \overline{CA}=9$ 이고 $\triangle DEF$ 에서 $\overline{DE}=5,\ \overline{EF}=7,\ \overline{FD}=9$ 일 때, 두 삼각형이 합동인지 답하고, $\angle B=80^\circ$ 이면 $\angle E$ 를 구하시오.</p>
<div class="exa">
<p>세 쌍의 대응변이 각각 같으므로 <strong>SSS 합동</strong>입니다.</p>
<p>$\angle B$ 와 $\angle E$ 는 대응각이므로 $\angle E=80^\circ$.</p>
<p><strong>답: 합동이다, $80^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (각을 구하는 합동 활용)</strong>
<p class="exq">$\triangle ABC\equiv\triangle DEF$ 이고 $\angle A=45^\circ$, $\angle B=65^\circ$ 일 때, $\angle E$, $\angle F$ 의 크기를 구하시오.</p>
<div class="exa">
<p>$\angle D=\angle A=45^\circ$, $\angle E=\angle B=65^\circ$.</p>
<p>$\angle F=180^\circ-45^\circ-65^\circ=70^\circ$ (또는 $\angle C=70^\circ$ 의 대응각).</p>
<p><strong>답: $\angle E=65^\circ$, $\angle F=70^\circ$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>증명에서 "그림에서 같아 보인다"는 근거가 아니에요. 반드시 <strong>주어진 조건이나 성질</strong>을 근거로 써야 해요.</li>
<li>합동이 증명되기 전에 대응각이 같다고 쓰면 안 돼요. 순서는 <strong>합동 → 대응각·대응변</strong>이에요.</li>
</ul>
</div>

      {
        title: '다각형',
        body: r`
<p class="lead-line">다각형은 "삼각형 몇 개로 쪼개지나?"만 알면 끝! 내각의 합은 $180^\circ\times(n-2)$, 외각의 합은 언제나 $360^\circ$ 예요.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>다각형</strong>은 선분으로만 둘러싸인 평면도형이에요. 변이 $3$ 개면 삼각형, $4$ 개면 사각형, $n$ 개면 <strong>$n$ 각형</strong>이라고 불러요.</p>
<ul>
<li><strong>내각</strong>: 다각형의 안쪽에서 이웃한 두 변이 이루는 각.</li>
<li><strong>외각</strong>: 한 변을 길게 늘였을 때, 그 연장선과 이웃한 변이 이루는 바깥쪽 각.</li>
<li>한 꼭짓점에서 <strong>(내각) + (외각) $=180^\circ$</strong> 예요. 두 각이 합쳐서 일직선(평각)이 되기 때문이죠.</li>
<li><strong>대각선</strong>: 이웃하지 않는 두 꼭짓점을 이은 선분.</li>
<li><strong>정다각형</strong>: 모든 변의 길이가 같고, 모든 내각의 크기가 같은 다각형. (정삼각형, 정사각형, 정오각형 …)</li>
</ul>
</div>

<div class="def"><strong class="label">대각선의 개수</strong>
<p>$n$ 각형의 한 꼭짓점에서는 <strong>자기 자신과 이웃한 두 꼭짓점</strong>으로는 대각선을 그을 수 없어요. 그래서</p>
<div class="formula">
$$\text{한 꼭짓점에서 그을 수 있는 대각선의 수}=n-3$$
$$\text{그 대각선으로 나누어지는 삼각형의 수}=n-2$$
$$\text{대각선의 총 개수}=\dfrac{n(n-3)}{2}$$
</div>
<p>총 개수에서 $2$ 로 나누는 이유는, 대각선 $AC$ 를 $A$ 에서도 세고 $C$ 에서도 세어서 <strong>모든 대각선을 두 번씩</strong> 셌기 때문이에요.</p>
</div>

<svg viewBox="0 0 200 170" width="220" role="img" aria-label="오각형의 한 꼭짓점에서 대각선 2개를 그어 삼각형 3개로 나눈 그림" style="display:block;margin:10px auto;color:inherit">
<polygon points="100,15 166.6,63.4 141.2,141.6 58.8,141.6 33.4,63.4" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="100" y1="15" x2="141.2" y2="141.6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="100" y1="15" x2="58.8" y2="141.6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="100" y="10" font-size="13" text-anchor="middle" fill="currentColor">A</text>
<text x="174" y="66" font-size="13" fill="currentColor">B</text>
<text x="146" y="157" font-size="13" fill="currentColor">C</text>
<text x="48" y="157" font-size="13" fill="currentColor">D</text>
<text x="18" y="66" font-size="13" fill="currentColor">E</text>
<text x="100" y="168" font-size="12" text-anchor="middle" fill="currentColor">오각형: 대각선 2개, 삼각형 3개</text>
</svg>

<div class="formula">
$$\text{n각형의 내각의 크기의 합}=180^\circ\times(n-2)$$
$$\text{다각형의 외각의 크기의 합}=360^\circ\ (\text{항상!})$$
$$\text{정}n\text{각형의 한 외각}=\dfrac{360^\circ}{n},\qquad \text{정}n\text{각형의 한 내각}=180^\circ-\dfrac{360^\circ}{n}=\dfrac{180^\circ\times(n-2)}{n}$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p><strong>내각의 합</strong>: 한 꼭짓점에서 대각선을 모두 그으면 $n$ 각형이 $(n-2)$ 개의 삼각형으로 나뉘어요. 삼각형 한 개의 내각의 합은 $180^\circ$ 니까 전체는 $180^\circ\times(n-2)$ 예요. 사각형은 삼각형 $2$ 개라서 $360^\circ$, 오각형은 삼각형 $3$ 개라서 $540^\circ$ 가 되죠.</p>
<p><strong>외각의 합 $360^\circ$</strong>: 모든 꼭짓점에서 (내각 + 외각) $=180^\circ$ 이므로 합하면 $180^\circ\times n$. 여기서 내각의 합 $180^\circ\times(n-2)$ 를 빼면 외각의 합은 $180^\circ\times n-180^\circ\times(n-2)=360^\circ$ 예요. 다각형의 둘레를 한 바퀴 걸으면서 방향을 틀 때, 틀어진 각을 모두 더하면 제자리로 돌아오니 딱 한 바퀴($360^\circ$)가 되는 거예요. 변이 몇 개든 똑같아요!</p>
</div>

<div class="ex"><strong class="label">예시 1 (내각의 합과 대각선)</strong>
<p class="exq">칠각형의 내각의 크기의 합, 한 꼭짓점에서 그을 수 있는 대각선의 개수, 대각선의 총 개수를 구하시오.</p>
<div class="exa">
<p>$n=7$ 이에요.</p>
<p>내각의 합 $=180^\circ\times(7-2)=180^\circ\times5=900^\circ$</p>
<p>한 꼭짓점에서 그을 수 있는 대각선 $=7-3=4$ 개 (나누어지는 삼각형은 $7-2=5$ 개)</p>
<p>총 대각선 $=\dfrac{7\times4}{2}=14$ 개</p>
<p><strong>답: $900^\circ$, $4$ 개, $14$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (정다각형의 한 각)</strong>
<p class="exq">정팔각형의 한 외각과 한 내각의 크기를 각각 구하시오.</p>
<div class="exa">
<p>정다각형의 외각은 모두 같고 합이 $360^\circ$ 이므로 한 외각 $=360^\circ\div8=45^\circ$</p>
<p>한 내각 $=180^\circ-45^\circ=135^\circ$</p>
<p>(검사: 내각의 합 $180^\circ\times6=1080^\circ$, $1080^\circ\div8=135^\circ$ ✓)</p>
<p><strong>답: 한 외각 $45^\circ$, 한 내각 $135^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (몇 각형인지 거꾸로 구하기 ①)</strong>
<p class="exq">내각의 크기의 합이 $1440^\circ$ 인 다각형은 몇 각형인가?</p>
<div class="exa">
<p>$180^\circ\times(n-2)=1440^\circ$ 에서 $n-2=1440\div180=8$</p>
<p>$n=10$</p>
<p><strong>답: 십각형</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (몇 각형인지 거꾸로 구하기 ②)</strong>
<p class="exq">대각선의 총 개수가 $27$ 개인 다각형은 몇 각형인가?</p>
<div class="exa">
<p>$\dfrac{n(n-3)}{2}=27$ 에서 $n(n-3)=54$</p>
<p>연속한 차이가 $3$ 인 두 수의 곱이 $54$ 인 것을 찾아요. $9\times6=54$ 이므로 $n=9$.</p>
<p>(확인: $\dfrac{9\times6}{2}=27$ ✓)</p>
<p><strong>답: 구각형</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (한 각 구하기)</strong>
<p class="exq">오각형의 네 내각의 크기가 $100^\circ,\ 110^\circ,\ 120^\circ,\ 90^\circ$ 일 때 나머지 한 내각의 크기를 구하시오.</p>
<div class="exa">
<p>오각형의 내각의 합 $=180^\circ\times3=540^\circ$</p>
<p>나머지 한 각 $=540^\circ-(100^\circ+110^\circ+120^\circ+90^\circ)=540^\circ-420^\circ=120^\circ$</p>
<p><strong>답: $120^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (외각으로 구하기)</strong>
<p class="exq">사각형의 외각 중 세 개가 $70^\circ,\ 80^\circ,\ 90^\circ$ 일 때 나머지 한 외각의 크기를 구하시오.</p>
<div class="exa">
<p>외각의 합은 항상 $360^\circ$ 예요.</p>
<p>나머지 한 외각 $=360^\circ-(70^\circ+80^\circ+90^\circ)=120^\circ$</p>
<p><strong>답: $120^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (한 각으로 정다각형 알아내기)</strong>
<p class="exq">한 내각의 크기가 $150^\circ$ 인 정다각형은 정몇각형인가?</p>
<div class="exa">
<p>한 외각 $=180^\circ-150^\circ=30^\circ$</p>
<p>변의 수 $=360^\circ\div30^\circ=12$</p>
<p><strong>답: 정십이각형</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (비가 주어진 경우)</strong>
<p class="exq">어떤 정다각형의 한 내각과 한 외각의 크기의 비가 $5:1$ 일 때, 이 정다각형은 정몇각형인가?</p>
<div class="exa">
<p>한 내각과 한 외각의 합은 $180^\circ$ 이므로 한 외각 $=180^\circ\times\dfrac{1}{5+1}=30^\circ$</p>
<p>변의 수 $=360^\circ\div30^\circ=12$</p>
<p><strong>답: 정십이각형</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (문자가 들어간 내각)</strong>
<p class="exq">사각형의 네 내각의 크기가 $x^\circ,\ (x+20)^\circ,\ (2x-10)^\circ,\ (x+50)^\circ$ 일 때, $x$ 의 값을 구하시오.</p>
<div class="exa">
<p>사각형의 내각의 합은 $180^\circ\times2=360^\circ$ 예요.</p>
<p>$x+(x+20)+(2x-10)+(x+50)=360$ 에서 $5x+60=360$</p>
<p>$5x=300$ 이므로 $x=60$</p>
<p>(확인: $60,\ 80,\ 110,\ 110$ 의 합 $=360$ ✓)</p>
<p><strong>답: $60$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (대각선으로 내각의 합 구하기)</strong>
<p class="exq">한 꼭짓점에서 그을 수 있는 대각선의 개수가 $9$ 개인 다각형의 내각의 크기의 합을 구하시오.</p>
<div class="exa">
<p>$n-3=9$ 이므로 $n=12$ (십이각형)</p>
<p>내각의 합 $=180^\circ\times(12-2)=1800^\circ$</p>
<p><strong>답: $1800^\circ$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>내각의 합 공식에서 $180^\circ\times n$ 이나 $180^\circ\times(n-1)$ 로 쓰는 실수! 삼각형 개수는 <strong>$n-2$</strong> 예요. (삼각형 $n=3$ 이면 $1$ 개)</li>
<li>외각의 합은 변의 수와 상관없이 항상 $360^\circ$ 예요. "오각형이니까 $540^\circ$" 가 아니에요. $540^\circ$ 는 오각형의 <strong>내각</strong>의 합이에요.</li>
<li>한 꼭짓점에서 그을 수 있는 대각선은 $n-3$ 개이지 $n-2$ 개가 아니에요. $n-2$ 는 <strong>삼각형</strong>의 개수입니다.</li>
<li>대각선의 총 개수에서 $2$ 로 나누는 것을 빼먹으면 두 배가 돼요.</li>
<li>"정다각형의 한 내각"은 내각의 합을 $n$ 으로 나눈 것이에요. 합 자체가 아니에요.</li>
<li>내각과 외각의 합이 $180^\circ$ 라는 것은 <strong>한 꼭짓점에서</strong>의 이야기예요.</li>
</ul>
</div>
`,
        tip: r`
<p><strong>정다각형은 외각부터!</strong> 한 외각 $=360^\circ\div n$ 이 가장 쉬워요. 그다음 $180^\circ-$ (외각) 으로 내각을 구하세요. 반대로 "정몇각형?" 문제도 외각을 먼저 구하면 $n=360^\circ\div(\text{한 외각})$ 으로 바로 풀려요.</p>
<table>
<tr><th>정다각형</th><th>한 외각</th><th>한 내각</th></tr>
<tr><td>정삼각형</td><td>$120^\circ$</td><td>$60^\circ$</td></tr>
<tr><td>정사각형</td><td>$90^\circ$</td><td>$90^\circ$</td></tr>
<tr><td>정오각형</td><td>$72^\circ$</td><td>$108^\circ$</td></tr>

<tr><td>정십각형</td><td>$36^\circ$</td><td>$144^\circ$</td></tr>
<tr><td>정십이각형</td><td>$30^\circ$</td><td>$150^\circ$</td></tr>

<p><strong>대각선 개수 외우기</strong>: 사각형 $2$, 오각형 $5$, 육각형 $9$, 칠각형 $14$, 팔각형 $20$, 구각형 $27$, 십각형 $35$. 하나 늘 때마다 $3, 4, 5, 6, 7, 8$ 씩 늘어나요.</p>
<p><strong>거꾸로 구하기 요령</strong>: $n(n-3)=2\times(\text{대각선 수})$ 에서 $n$ 과 $n-3$ 은 차이가 $3$ 인 두 수예요. $10\times7,\ 9\times6,\ 8\times5,\ 7\times4,\ 6\times3$ 처럼 차이 $3$ 인 곱을 떠올리면 금방 찾아요.</p>`

      {
        title: '원과 부채꼴',
        body: r`
<p class="lead-line">부채꼴은 "피자 한 조각"! 조각이 원의 몇 분의 몇인지($\dfrac{x}{360}$)만 구하면 호의 길이도 넓이도 그만큼만 가져오면 돼요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>원</strong>: 한 점(중심)에서 같은 거리에 있는 점들을 이은 곡선이에요. 중심에서 원 위의 점까지의 거리가 <strong>반지름</strong>, 중심을 지나는 현이 <strong>지름</strong>(반지름의 $2$ 배).</li>
<li><strong>호 $AB$</strong> ($\overset{\frown}{AB}$): 원 위의 두 점 $A$, $B$ 사이의 원의 일부(곡선 부분).</li>
<li><strong>현 $AB$</strong> ($\overline{AB}$): 원 위의 두 점 $A$, $B$ 를 곧게 이은 선분.</li>
<li><strong>부채꼴 $AOB$</strong>: 두 반지름 $OA$, $OB$ 와 호 $AB$ 로 둘러싸인 도형. 이때 $\angle AOB$ 를 호 $AB$ 에 대한 <strong>중심각</strong>이라고 해요.</li>
<li><strong>활꼴</strong>: 호와 현으로 둘러싸인 도형.</li>
</ul>
</div>

<svg viewBox="0 0 200 130" width="240" role="img" aria-label="중심각 60도인 부채꼴 AOB와 현 AB" style="display:block;margin:10px auto;color:inherit">
<path d="M 40 110 L 120 110 A 80 80 0 0 0 80 40.7 Z" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="120" y1="110" x2="80" y2="40.7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="26" y="118" font-size="13" fill="currentColor">O</text>
<text x="124" y="118" font-size="13" fill="currentColor">A</text>
<text x="76" y="34" font-size="13" fill="currentColor">B</text>
<text x="62" y="104" font-size="11" fill="currentColor">x°</text>
<text x="112" y="62" font-size="11" fill="currentColor">호 AB</text>
<text x="70" y="84" font-size="11" fill="currentColor">부채꼴</text>
</svg>

<div class="def"><strong class="label">원의 둘레와 넓이</strong>
<p>반지름이 $r$ 인 원에서</p>
<div class="formula">
$$\text{둘레}\ l=2\pi r,\qquad \text{넓이}\ S=\pi r^2$$
</div>
<p>$\pi$(파이, 원주율)는 (원의 둘레) $\div$ (지름) 이에요. 약 $3.14159\cdots$ 로 끝없이 계속되는 수여서, 답에는 $\pi$ 를 그대로 써요. 예: 반지름 $3$ 이면 둘레 $6\pi$, 넓이 $9\pi$.</p>
</div>

<div class="def"><strong class="label">부채꼴의 호의 길이와 넓이</strong>
<p>반지름이 $r$, 중심각의 크기가 $x^\circ$ 인 부채꼴은 원의 $\dfrac{x}{360}$ 만큼이에요. 그래서</p>
<div class="formula">
$$\text{호의 길이}\ l=2\pi r\times\dfrac{x}{360}$$
$$\text{부채꼴의 넓이}\ S=\pi r^2\times\dfrac{x}{360}=\dfrac12 rl$$
</div>
<p><strong>부채꼴의 둘레</strong>는 호의 길이만이 아니에요! (호의 길이) $+$ (반지름) $\times2$ 예요. 곧은 두 반지름도 둘레에 들어가거든요.</p>
</div>

<div class="why"><strong class="label">왜 $S=\dfrac12 rl$ 일까?</strong>
<p>부채꼴 넓이 $=\pi r^2\times\dfrac{x}{360}$ 이고, 호의 길이 $l=2\pi r\times\dfrac{x}{360}$ 이에요. 그러면 $\pi r\times\dfrac{x}{360}=\dfrac{l}{2}$ 이므로 $S=r\times\pi r\times\dfrac{x}{360}=r\times\dfrac{l}{2}=\dfrac12 rl$ 이 돼요. 이 식은 "삼각형의 넓이 $=\dfrac12\times(\text{밑변})\times(\text{높이})$" 와 닮았죠? 부채꼴을 아주 얇게 잘라 이으면 밑변이 $l$, 높이가 $r$ 인 삼각형처럼 보이기 때문이에요. 중심각 대신 <strong>호의 길이</strong>가 주어졌을 때 편리해요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (원의 둘레와 넓이)</strong>
<p class="exq">지름이 $14\text{ cm}$ 인 원의 둘레와 넓이를 구하시오.</p>
<div class="exa">
<p>반지름 $=14\div2=7\text{ cm}$ (지름이 주어졌을 때 반지름으로 바꾸는 것이 첫걸음이에요)</p>
<p>둘레 $=2\pi\times7=14\pi$, 넓이 $=\pi\times7^2=49\pi$</p>
<p><strong>답: $14\pi\text{ cm}$, $49\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (호의 길이와 넓이)</strong>
<p class="exq">반지름이 $9\text{ cm}$ 이고 중심각의 크기가 $120^\circ$ 인 부채꼴의 호의 길이와 넓이를 구하시오.</p>
<div class="exa">
<p>$\dfrac{120}{360}=\dfrac13$ 이므로 원의 $\dfrac13$ 이에요.</p>
<p>호의 길이 $=2\pi\times9\times\dfrac13=6\pi$</p>
<p>넓이 $=\pi\times9^2\times\dfrac13=27\pi$</p>
<p>(검사: $\dfrac12 rl=\dfrac12\times9\times6\pi=27\pi$ ✓)</p>
<p><strong>답: $6\pi\text{ cm}$, $27\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (중심각 거꾸로 구하기)</strong>
<p class="exq">반지름이 $10\text{ cm}$ 이고 호의 길이가 $4\pi\text{ cm}$ 인 부채꼴의 중심각의 크기를 구하시오.</p>
<div class="exa">
<p>$2\pi\times10\times\dfrac{x}{360}=4\pi$ 에서 $20\pi\times\dfrac{x}{360}=4\pi$</p>
<p>양변을 $\pi$ 로 나누면 $\dfrac{20x}{360}=4$ 이므로 $x=4\times18=72$</p>
<p>(확인: 원의 $\dfrac{72}{360}=\dfrac15$ 이고 원의 둘레 $20\pi$ 의 $\dfrac15$ 는 $4\pi$ ✓)</p>
<p><strong>답: $72^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (부채꼴의 둘레)</strong>
<p class="exq">반지름이 $6\text{ cm}$ 이고 중심각이 $60^\circ$ 인 부채꼴의 둘레의 길이를 구하시오.</p>
<div class="exa">
<p>호의 길이 $=2\pi\times6\times\dfrac{60}{360}=2\pi$</p>
<p>둘레 $=$ (호) $+$ (반지름 $2$ 개) $=2\pi+6\times2=2\pi+12$</p>
<p><strong>답: $(2\pi+12)\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 ($S=\tfrac12 rl$ 이용)</strong>
<p class="exq">반지름이 $8\text{ cm}$ 이고 호의 길이가 $5\pi\text{ cm}$ 인 부채꼴의 넓이를 구하시오.</p>
<div class="exa">
<p>중심각을 구하지 않고 바로 $S=\dfrac12 rl$ 을 써요.</p>
<p>$S=\dfrac12\times8\times5\pi=20\pi$</p>
<p><strong>답: $20\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (넓이로 반지름 구하기)</strong>
<p class="exq">중심각이 $90^\circ$ 이고 넓이가 $25\pi\text{ cm}^2$ 인 부채꼴의 반지름의 길이를 구하시오.</p>
<div class="exa">
<p>$\pi r^2\times\dfrac{90}{360}=25\pi$ 에서 $\dfrac{\pi r^2}{4}=25\pi$</p>
<p>$r^2=100$ 이고 $r\gt0$ 이므로 $r=10$</p>
<p><strong>답: $10\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (비례 관계)</strong>
<p class="exq">같은 원에서 중심각이 $40^\circ$ 인 부채꼴의 호의 길이가 $5\pi\text{ cm}$ 일 때, 중심각이 $120^\circ$ 인 부채꼴의 호의 길이를 구하시오.</p>
<div class="exa">
<p>같은 원에서 호의 길이는 중심각의 크기에 <strong>정비례</strong>해요. $40^\circ\to120^\circ$ 로 $3$ 배가 되었으니 호의 길이도 $3$ 배예요.</p>
<p>$5\pi\times3=15\pi$</p>
<p><strong>답: $15\pi\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (띠 모양의 넓이, 심화)</strong>
<p class="exq">중심이 같고 반지름이 $4\text{ cm}$, $7\text{ cm}$ 인 두 원에서 중심각이 $90^\circ$ 인 두 부채꼴 사이의 부분(띠 모양)의 넓이를 구하시오.</p>
<div class="exa">
<p>(큰 부채꼴) $-$ (작은 부채꼴) 이에요.</p>
<p>$\pi\times7^2\times\dfrac14-\pi\times4^2\times\dfrac14=\dfrac{49\pi-16\pi}{4}=\dfrac{33\pi}{4}$</p>
<p><strong>답: $\dfrac{33}{4}\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (활꼴의 넓이, 심화)</strong>
<p class="exq">반지름이 $6\text{ cm}$ 인 원에서 중심각이 $90^\circ$ 인 부채꼴 $OAB$ 가 있다. 현 $AB$ 와 호 $AB$ 로 둘러싸인 활꼴의 넓이를 구하시오.</p>
<div class="exa">
<p>활꼴 $=$ 부채꼴 $-$ 삼각형 $OAB$</p>
<p>부채꼴 $=\pi\times6^2\times\dfrac14=9\pi$</p>
<p>삼각형 $OAB$ 는 $\overline{OA}=\overline{OB}=6$ 인 직각삼각형이므로 $\dfrac12\times6\times6=18$</p>
<p><strong>답: $(9\pi-18)\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (넓이의 배수)</strong>
<p class="exq">반지름이 $4\text{ cm}$ 인 원과 반지름이 $12\text{ cm}$ 인 원이 있다. 큰 원의 넓이는 작은 원의 넓이의 몇 배인가?</p>
<div class="exa">
<p>작은 원 $=16\pi$, 큰 원 $=144\pi$ 이므로 $144\pi\div16\pi=9$</p>
<p>반지름이 $3$ 배가 되면 넓이는 $3^2=9$ 배가 돼요.</p>
<p><strong>답: $9$ 배</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li><strong>지름을 반지름으로 착각</strong>하기. "지름이 $10$" 이면 반지름은 $5$ 예요. 공식에는 반드시 반지름 $r$ 을 넣어요.</li>
<li>넓이 단위는 $\text{cm}^2$, 길이 단위는 $\text{cm}$! 둘레와 넓이의 단위를 섞지 마세요.</li>
<li><strong>부채꼴의 둘레</strong>에 반지름 $2$ 개를 빼먹는 실수. 둘레 $=$ 호 $+2r$.</li>
<li>$\pi$ 에 $3.14$ 를 곱해 소수로 바꾸는 실수. 문제에서 따로 말이 없으면 $\pi$ 를 그대로 쓴 $12\pi$ 꼴이 정답이에요.</li>
<li>$\dfrac{x}{360}$ 대신 $\dfrac{x}{180}$ 이나 $\dfrac{x}{100}$ 으로 나누는 실수. 원 한 바퀴는 $360^\circ$ 예요.</li>
<li>호의 길이는 중심각에 비례하지만, <strong>현의 길이는 비례하지 않아요.</strong> (아래 "추가 개념"에서 자세히 배워요)</li>
</ul>
</div>
`,
        tip: r`
<p><strong>분수부터 만들자!</strong> 부채꼴 문제는 먼저 $\dfrac{x}{360}$ 을 약분해서 "원의 몇 분의 몇"인지 정해요. $90^\circ=\dfrac14$, $60^\circ=\dfrac16$, $120^\circ=\dfrac13$, $180^\circ=\dfrac12$, $45^\circ=\dfrac18$, $30^\circ=\dfrac1{12}$. 그다음 원의 둘레($2\pi r$)나 넓이($\pi r^2$)에 그 분수를 곱하면 끝이에요.</p>
<p><strong>$\pi$ 는 문자처럼</strong> 다뤄요. $3\pi+5\pi=8\pi$, $2\times6\pi=12\pi$. $\pi$ 의 값을 계산할 필요가 없으니 오히려 쉬워요.</p>
<p><strong>선택 공식</strong>: 중심각이 주어졌으면 $\dfrac{x}{360}$ 공식, 호의 길이가 주어졌으면 $S=\dfrac12 rl$. 이 한 줄이 계산 시간을 확 줄여 줘요.</p>
<p><strong>역으로 구할 때</strong>는 양변의 $\pi$ 를 먼저 지워서 식을 간단하게 만드세요. 예: $2\pi\times10\times\dfrac{x}{360}=4\pi \Rightarrow 20\times\dfrac{x}{360}=4$.</p>`
      },

      /* ───────── 2. 평면도형의 둘레와 넓이 활용 ───────── */
      {
        title: '평면도형의 둘레와 넓이 활용',
        body: r`
<p class="lead-line">모양이 복잡해도 걱정 마세요. "더하고 빼기"와 "합쳐서 원 한 개 만들기"로 거의 다 풀려요.</p>

<div class="def"><strong class="label">기본 도형의 넓이 공식 (복습)</strong>
<div class="formula">
$$\text{직사각형}=(\text{가로})\times(\text{세로})\qquad \text{평행사변형}=(\text{밑변})\times(\text{높이})$$
$$\text{삼각형}=\dfrac12\times(\text{밑변})\times(\text{높이})\qquad \text{사다리꼴}=\dfrac12\times\{(\text{윗변})+(\text{아랫변})\}\times(\text{높이})$$
$$\text{마름모}=\dfrac12\times(\text{한 대각선})\times(\text{다른 대각선})\qquad \text{원}=\pi r^2,\ \text{반원}=\dfrac12\pi r^2,\ \text{사분원}=\dfrac14\pi r^2$$
</div>
<p><strong>사분원</strong>은 중심각이 $90^\circ$ 인 부채꼴로 원의 $\dfrac14$ 이고, <strong>반원</strong>은 원의 $\dfrac12$ 예요. 반원의 둘레는 <strong>(원의 둘레의 절반) + (지름)</strong> 임을 기억하세요. 곧은 지름 부분도 둘레에 들어가요.</p>
</div>

<div class="def"><strong class="label">복잡한 도형을 푸는 세 가지 전략</strong>
<ul>
<li><strong>더하기</strong>: 도형을 간단한 도형 여러 개로 나누어 각각 구해 더해요.</li>
<li><strong>빼기</strong>: 큰 도형에서 필요 없는 부분을 빼요. (색칠한 부분 $=$ 전체 $-$ 안쪽)</li>
<li><strong>옮기기·합치기</strong>: 같은 모양의 조각(반원 두 개, 사분원 네 개 등)을 합쳐서 <strong>원 한 개</strong>로 만들어요. 모양을 옮겨서 구하기 쉬운 도형으로 바꿔요.</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1 (기본 도형 넓이)</strong>
<p class="exq">(1) 밑변 $10\text{ cm}$, 높이 $7\text{ cm}$ 인 삼각형 (2) 윗변 $6\text{ cm}$, 아랫변 $10\text{ cm}$, 높이 $5\text{ cm}$ 인 사다리꼴 (3) 두 대각선이 $8\text{ cm}$, $12\text{ cm}$ 인 마름모의 넓이를 각각 구하시오.</p>
<div class="exa">
<p>(1) $\dfrac12\times10\times7=35$</p>
<p>(2) $\dfrac12\times(6+10)\times5=\dfrac12\times16\times5=40$</p>
<p>(3) $\dfrac12\times8\times12=48$</p>
<p><strong>답: (1) $35\text{ cm}^2$ (2) $40\text{ cm}^2$ (3) $48\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (반원의 넓이와 둘레)</strong>
<p class="exq">반지름이 $5\text{ cm}$ 인 반원의 넓이와 둘레의 길이를 구하시오.</p>
<div class="exa">
<p>넓이 $=\dfrac12\times\pi\times5^2=\dfrac{25}{2}\pi$</p>
<p>둘레 $=$ (원의 둘레의 절반) $+$ (지름) $=\pi\times5+10=5\pi+10$ &nbsp;($2\pi r\div2=\pi r$)</p>
<p><strong>답: 넓이 $\dfrac{25}{2}\pi\text{ cm}^2$, 둘레 $(5\pi+10)\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (정사각형에서 사분원 빼기)</strong>
<p class="exq">한 변의 길이가 $8\text{ cm}$ 인 정사각형 $ABCD$ 에서 꼭짓점 $A$ 를 중심으로 하고 반지름이 $8\text{ cm}$ 인 사분원을 그렸다. 정사각형에서 사분원을 뺀 부분의 넓이를 구하시오.</p>
<div class="exa">
<p>정사각형 $=8^2=64$</p>
<p>사분원 $=\dfrac14\times\pi\times8^2=16\pi$</p>
<p>색칠한 부분 $=64-16\pi$</p>
<p><strong>답: $(64-16\pi)\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (트랙 모양)</strong>
<p class="exq">가로가 $10\text{ cm}$, 세로가 $6\text{ cm}$ 인 직사각형의 세로 변 양쪽에 지름이 $6\text{ cm}$ 인 반원을 붙여 만든 트랙 모양의 둘레의 길이와 넓이를 구하시오.</p>
<div class="exa">
<p>반원의 지름이 $6$ 이므로 반지름은 $3$ 이에요. 두 반원을 합치면 <strong>반지름 $3$ 인 원 하나</strong>가 돼요.</p>
<p>둘레 $=$ (가로 변 $2$ 개) $+$ (원 하나의 둘레) $=2\times10+2\pi\times3=20+6\pi$</p>
<p>넓이 $=$ (직사각형) $+$ (원 하나) $=10\times6+\pi\times3^2=60+9\pi$</p>
<p><strong>답: 둘레 $(20+6\pi)\text{ cm}$, 넓이 $(60+9\pi)\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (큰 원에서 작은 원 빼기)</strong>
<p class="exq">지름이 $10\text{ cm}$ 인 큰 원 안에 지름이 각각 $4\text{ cm}$, $6\text{ cm}$ 인 두 원이 큰 원의 지름 위에 놓여 있다. 큰 원에서 두 작은 원을 뺀 부분의 넓이를 구하시오.</p>
<div class="exa">
<p>큰 원의 반지름 $5$, 작은 원의 반지름 $2$, $3$ (그리고 $4+6=10$ 이라서 딱 맞게 들어가요).</p>
<p>큰 원 $=25\pi$, 작은 원 $=4\pi,\ 9\pi$</p>
<p>색칠한 부분 $=25\pi-4\pi-9\pi=12\pi$</p>
<p><strong>답: $12\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (끈의 길이)</strong>
<p class="exq">반지름이 $2\text{ cm}$ 인 원 모양의 통 $3$ 개를 한 줄로 나란히 세워 끈으로 한 바퀴 둘러 묶었다. 끈의 최소 길이를 구하시오. (매듭의 길이는 생각하지 않는다)</p>
<div class="exa">
<p>끈은 <strong>곧은 부분</strong>과 <strong>휘어진 부분</strong>으로 나눠 생각해요.</p>
<p>곧은 부분: 위, 아래 두 줄이고 한 줄의 길이는 중심 사이 거리 $2\times(\text{지름})=2\times4=8$. 두 줄이므로 $16$.</p>
<p>휘어진 부분: 양 끝 통에서 각각 반 바퀴씩이니 모으면 한 바퀴. $2\pi\times2=4\pi$</p>
<p>끈의 길이 $=16+4\pi$</p>
<p><strong>답: $(16+4\pi)\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (정사각형과 내접원)</strong>
<p class="exq">한 변의 길이가 $12\text{ cm}$ 인 정사각형 안에 지름이 $12\text{ cm}$ 인 원이 꼭 맞게 들어 있다. 정사각형에서 원을 뺀 부분의 넓이와 원의 둘레를 구하시오.</p>
<div class="exa">
<p>원의 반지름 $=6$</p>
<p>정사각형 $-$ 원 $=144-36\pi$</p>
<p>원의 둘레 $=2\pi\times6=12\pi$</p>
<p><strong>답: $(144-36\pi)\text{ cm}^2$, $12\pi\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (원에 내접하는 정사각형, 심화)</strong>
<p class="exq">반지름이 $6\text{ cm}$ 인 원에 내접하는 정사각형이 있다. 원에서 정사각형을 뺀 부분의 넓이를 구하시오. (정사각형의 대각선은 원의 지름)</p>
<div class="exa">
<p>정사각형의 대각선의 길이는 원의 지름 $12$ 예요. 정사각형은 마름모이기도 하므로 넓이 $=\dfrac12\times12\times12=72$</p>
<p>원의 넓이 $=36\pi$</p>
<p>색칠한 부분 $=36\pi-72$</p>
<p><strong>답: $(36\pi-72)\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (사분원 네 개 합치기, 심화)</strong>
<p class="exq">한 변의 길이가 $10\text{ cm}$ 인 정사각형의 네 꼭짓점을 각각 중심으로 하고 반지름이 $5\text{ cm}$ 인 사분원 $4$ 개를 정사각형 안에 그렸다. 정사각형에서 사분원들을 뺀 부분의 넓이를 구하시오.</p>
<div class="exa">
<p>사분원 $4$ 개를 합치면 반지름 $5$ 인 원 $1$ 개와 같아요: $\pi\times5^2=25\pi$</p>
<p>정사각형 $=10^2=100$</p>
<p>색칠한 부분 $=100-25\pi$</p>
<p><strong>답: $(100-25\pi)\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (히포크라테스의 달, 심화)</strong>
<p class="exq">$\angle C=90^\circ$ 인 직각삼각형 $ABC$ 에서 $\overline{AC}=6\text{ cm}$, $\overline{BC}=8\text{ cm}$, $\overline{AB}=10\text{ cm}$ 이다. 세 변을 각각 지름으로 하는 반원을 그렸을 때 (두 작은 반원은 삼각형 바깥쪽, 큰 반원은 $C$ 를 지나도록 삼각형 쪽), 두 달 모양의 넓이의 합을 구하시오.</p>
<div class="exa">
<p>(두 달 모양) $=$ (작은 반원 둘) $+$ (삼각형) $-$ (큰 반원)</p>
<p>작은 반원 둘 $=\dfrac12\pi\times3^2+\dfrac12\pi\times4^2=\dfrac{25}{2}\pi$, 큰 반원 $=\dfrac12\pi\times5^2=\dfrac{25}{2}\pi$</p>
<p>두 값이 같아서 서로 사라져요! (피타고라스 정리 $6^2+8^2=10^2$ 때문이에요. 중2에서 배워요.) 남는 것은 삼각형의 넓이뿐이에요.</p>
<p>삼각형 $=\dfrac12\times6\times8=24$</p>
<p><strong>답: $24\text{ cm}^2$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>

<li>반원의 둘레에서 <strong>지름(곧은 부분)</strong>을 빼먹는 실수. 반원의 둘레 $=\pi r+2r$.</li>
<li>색칠한 부분의 둘레에서 <strong>안쪽 경계선</strong>까지 넣어야 하는지 헷갈리는 실수. 색칠한 부분을 둘러싼 모든 선(바깥 테두리와 구멍의 테두리)이 둘레예요.</li>
<li>트랙·띠 모양에서 반원 두 개를 따로 계산하다 틀리기. 두 반원을 <strong>합치면 원 한 개</strong>임을 이용하세요.</li>
<li>삼각형 넓이의 $\dfrac12$ 를 빼먹기, 사다리꼴 넓이에서 윗변과 아랫변을 더하는 것을 빼먹기.</li>
<li>$\pi$ 가 들어간 항과 수만 있는 항을 합쳐 버리기. $64-16\pi$ 를 $48\pi$ 라고 쓰면 안 돼요. 다른 종류의 항이라서 더 이상 합쳐지지 않아요.</li>
</ul>
</div>
`,

      /* ───────── 3. (추가) 부채꼴의 호·현·중심각 ───────── */
      {
        title: '호, 현, 중심각의 관계',
        body: r`
<p class="lead-line">같은 원에서 중심각이 같으면 호도, 현도, 부채꼴 넓이도 같아요. 하지만 호의 길이와 넓이는 중심각에 비례하고, <strong>현의 길이는 비례하지 않아요!</strong></p>

<div class="def"><strong class="label">개념</strong>
<p>한 원(또는 합동인 원)에서 다음이 성립해요.</p>
<ul>
<li>중심각의 크기가 같은 두 부채꼴은 <strong>호의 길이도, 넓이도, 현의 길이도 같아요.</strong></li>
<li>부채꼴의 <strong>호의 길이와 넓이</strong>는 중심각의 크기에 <strong>정비례</strong>해요. 중심각이 $2$ 배, $3$ 배가 되면 호의 길이와 넓이도 $2$ 배, $3$ 배가 돼요.</li>
<li>하지만 <strong>현의 길이는 중심각의 크기에 정비례하지 않아요.</strong> 중심각이 $2$ 배가 되어도 현의 길이는 $2$ 배보다 작아요.</li>
</ul>
<div class="formula">
$$\angle AOB=\angle COD\ \Longleftrightarrow\ \overset{\frown}{AB}=\overset{\frown}{CD}\ \Longleftrightarrow\ \overline{AB}=\overline{CD}$$
$$\angle AOB:\angle COD=\overset{\frown}{AB}:\overset{\frown}{CD}=(\text{부채꼴 }AOB\text{의 넓이}):(\text{부채꼴 }COD\text{의 넓이})$$
</div>
</div>

<div class="why"><strong class="label">왜 현은 비례하지 않을까?</strong>
<p>중심각이 $60^\circ$ 일 때와 $120^\circ$ 일 때를 비교해 봐요. 호의 길이는 중심각이 $2$ 배가 되면 정확히 $2$ 배예요. 하지만 현은 두 점을 <strong>곧게</strong> 이은 선분이라 호보다 짧아요. 중심각이 $120^\circ$ 인 현 $AC$ 와, $60^\circ$ 인 현 $AB$, $BC$ 를 비교하면 삼각형에서 $\overline{AC}\lt\overline{AB}+\overline{BC}$ (한 변은 나머지 두 변의 합보다 짧다) 이므로 $\overline{AC}\lt2\overline{AB}$ 가 돼요. 즉 중심각이 $2$ 배인 현은 $2$ 배보다 짧아요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (호의 길이 비례)</strong>
<p class="exq">같은 원에서 중심각이 $45^\circ$ 인 부채꼴의 호의 길이가 $6\text{ cm}$ 일 때, 중심각이 $135^\circ$ 인 부채꼴의 호의 길이를 구하시오.</p>
<div class="exa">
<p>$135^\circ=45^\circ\times3$ 이므로 호의 길이도 $3$ 배예요.</p>
<p>$6\times3=18$</p>
<p><strong>답: $18\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (넓이 비례)</strong>
<p class="exq">같은 원에서 중심각이 $60^\circ$ 인 부채꼴의 넓이가 $12\pi\text{ cm}^2$ 일 때, 중심각이 $180^\circ$ 인 부채꼴의 넓이를 구하시오.</p>
<div class="exa">
<p>$180^\circ=60^\circ\times3$ 이므로 넓이도 $3$ 배예요.</p>
<p>$12\pi\times3=36\pi$ (원 전체는 $6$ 배인 $72\pi$ 이고 반원은 그 절반이에요.)</p>
<p><strong>답: $36\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (현의 길이는 같다)</strong>
<p class="exq">한 원에서 $\angle AOB=\angle COD=50^\circ$ 이고 $\overline{AB}=7\text{ cm}$ 일 때, $\overline{CD}$ 의 길이를 구하시오.</p>
<div class="exa">
<p>중심각이 같으면 현의 길이도 같아요. (두 이등변삼각형 $OAB$, $OCD$ 가 합동이기 때문이에요.)</p>
<p>$\overline{CD}=\overline{AB}=7$</p>
<p><strong>답: $7\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (함정 문제)</strong>
<p class="exq">한 원에서 중심각이 $40^\circ$ 인 현 $AB$ 의 길이가 $4\text{ cm}$ 일 때, 중심각이 $80^\circ$ 인 현 $CD$ 의 길이가 $8\text{ cm}$ 라고 할 수 있는지 답하시오.</p>

<p><strong>답: 없다 ($8\text{ cm}$ 보다 짧다)</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>

</ul>
</div>
`,

<p class="lead-line">다면체는 "평평한 면으로만 둘러싸인 입체"예요. 각기둥·각뿔·각뿔대는 밑면이 $n$ 각형이라는 것만 알면 면·모서리·꼭짓점의 개수를 공식 없이도 바로 셀 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>다면체</strong>는 여러 개의 평면(다각형)으로만 둘러싸인 입체도형이에요. 주사위, 벽돌, 피라미드 모양이 모두 다면체예요. (공이나 컵처럼 곡면이 있으면 다면체가 아니에요.)</p>
<ul>
<li><strong>면</strong>: 다면체를 둘러싼 다각형.</li>
<li><strong>모서리</strong>: 면과 면이 만나는 선분.</li>
<li><strong>꼭짓점</strong>: 모서리와 모서리가 만나는 점.</li>
<li><strong>$n$ 면체</strong>: 면이 $n$ 개인 다면체. 면이 $4$ 개면 사면체, $5$ 개면 오면체, $6$ 개면 육면체라고 불러요.</li>
</ul>
</div>

<div class="def"><strong class="label">각기둥 · 각뿔 · 각뿔대</strong>
<ul>
<li><strong>각기둥</strong>: 서로 평행하고 합동인 두 다각형(<strong>밑면</strong>)과 그 사이를 이은 직사각형(<strong>옆면</strong>)으로 이루어진 다면체. 밑면이 $n$ 각형이면 $n$ 각기둥.</li>
<li><strong>각뿔</strong>: 밑면은 다각형 $1$ 개, 옆면은 모두 삼각형이고 한 점(<strong>꼭짓점</strong>, 뿔의 꼭대기)에 모이는 다면체.</li>
<li><strong>각뿔대</strong>: 각뿔을 밑면에 평행한 평면으로 잘라 위쪽의 작은 뿔을 떼어 낸 아랫부분. 밑면이 $2$ 개(크기는 달라요), 옆면은 모두 사다리꼴.</li>
</ul>
</div>

<div class="formula">

<tr><td>$n$ 각기둥</td><td>$2$ 개 ($n$ 각형)</td><td>직사각형 $n$ 개</td><td>$n+2$</td><td>$3n$</td><td>$2n$</td></tr>
<tr><td>$n$ 각뿔</td><td>$1$ 개 ($n$ 각형)</td><td>삼각형 $n$ 개</td><td>$n+1$</td><td>$2n$</td><td>$n+1$</td></tr>

<p>외울 필요 없이 만드는 방법만 기억하면 돼요.</p>
<ul>
<li><strong>면</strong> = 밑면 + 옆면 ($n$ 개). 기둥·뿔대는 밑면이 $2$ 개, 뿔은 $1$ 개.</li>
<li><strong>모서리</strong> = (위 밑면의 변 $n$) + (아래 밑면의 변 $n$) + (옆으로 세운 모서리 $n$) $=3n$. 뿔은 밑면의 변 $n$ + 꼭대기로 올라가는 모서리 $n$ $=2n$.</li>
<li><strong>꼭짓점</strong> = 기둥·뿔대는 위·아래 $n$ 개씩 $=2n$, 뿔은 밑면 $n$ 개 + 꼭대기 $1$ 개 $=n+1$.</li>
</ul>

<div class="def"><strong class="label">정다면체</strong>
<p><strong>정다면체</strong>는 ① 모든 면이 합동인 <strong>정다각형</strong>이고 ② 각 꼭짓점에 모인 면의 개수가 <strong>모두 같은</strong> 다면체예요. 이 조건을 만족하는 정다면체는 놀랍게도 <strong>단 $5$ 가지</strong>뿐이에요.</p>
<table>
<tr><th>이름</th><th>면의 모양</th><th>한 꼭짓점에 모인 면</th><th>면</th><th>모서리</th><th>꼭짓점</th></tr>
<tr><td>정사면체</td><td>정삼각형</td><td>$3$ 개</td><td>$4$</td><td>$6$</td><td>$4$</td></tr>
<tr><td>정육면체</td><td>정사각형</td><td>$3$ 개</td><td>$6$</td><td>$12$</td><td>$8$</td></tr>
<tr><td>정팔면체</td><td>정삼각형</td><td>$4$ 개</td><td>$8$</td><td>$12$</td><td>$6$</td></tr>
<tr><td>정십이면체</td><td>정오각형</td><td>$3$ 개</td><td>$12$</td><td>$30$</td><td>$20$</td></tr>
<tr><td>정이십면체</td><td>정삼각형</td><td>$5$ 개</td><td>$20$</td><td>$30$</td><td>$12$</td></tr>
</table>
</div>

<div class="why"><strong class="label">왜 정다면체는 5가지뿐일까?</strong>
<p>입체의 한 꼭짓점에는 <strong>면이 $3$ 개 이상</strong> 모여야 하고, 그 면들의 각의 합은 <strong>$360^\circ$ 보다 작아야</strong> 해요. ($360^\circ$ 이면 납작한 평면이 되어 버려요.)</p>
<ul>
<li>정삼각형(한 각 $60^\circ$): $3$ 개 $=180^\circ$, $4$ 개 $=240^\circ$, $5$ 개 $=300^\circ$ 는 가능! $6$ 개는 $360^\circ$ 라서 불가능 → 정사면체, 정팔면체, 정이십면체</li>
<li>정사각형(한 각 $90^\circ$): $3$ 개 $=270^\circ$ 가능, $4$ 개는 $360^\circ$ 불가 → 정육면체</li>
<li>정오각형(한 각 $108^\circ$): $3$ 개 $=324^\circ$ 가능, $4$ 개는 $432^\circ$ 불가 → 정십이면체</li>
<li>정육각형(한 각 $120^\circ$): $3$ 개만 모여도 $360^\circ$ → 불가능</li>
</ul>
<p>그래서 모두 합쳐 $3+1+1=5$ 가지가 돼요.</p>
</div>

<div class="def"><strong class="label">오일러의 공식</strong>
<p>구멍이 뚫리지 않은 다면체에서는 <strong>(꼭짓점의 수) $-$ (모서리의 수) $+$ (면의 수) $=2$</strong> 가 항상 성립해요.</p>
<div class="formula">
$$v-e+f=2$$
</div>
<p>삼각기둥: $6-9+5=2$ ✓ &nbsp;/&nbsp; 정육면체: $8-12+6=2$ ✓ &nbsp;/&nbsp; 사각뿔: $5-8+5=2$ ✓. 세 개만 알면 나머지 하나를 구할 수 있어요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (각기둥의 면·모서리·꼭짓점)</strong>
<p class="exq">육각기둥의 면, 모서리, 꼭짓점의 개수를 구하시오.</p>
<div class="exa">
<p>밑면이 육각형이므로 $n=6$ 이에요.</p>
<p>면: 밑면 $2$ 개 + 옆면 $6$ 개 $=6+2=8$ (개)</p>
<p>모서리: $3\times6=18$ (개) &nbsp;(위 $6$ + 아래 $6$ + 옆 $6$)</p>
<p>꼭짓점: $2\times6=12$ (개)</p>
<p>(검사: $12-18+8=2$ ✓)</p>
<p><strong>답: 면 $8$ 개, 모서리 $18$ 개, 꼭짓점 $12$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (면의 수로 거꾸로 이름 찾기)</strong>
<p class="exq">면이 $9$ 개인 각뿔의 이름과 모서리의 개수를 구하시오.</p>
<div class="exa">
<p>$n$ 각뿔의 면의 수는 $n+1$ 이므로 $n+1=9$, $n=8$.</p>
<p>밑면이 팔각형이므로 <strong>팔각뿔</strong>이에요.</p>
<p>모서리는 $2\times8=16$ (개)</p>
<p><strong>답: 팔각뿔, $16$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (각뿔대와 오일러의 공식)</strong>
<p class="exq">오각뿔대의 면, 모서리, 꼭짓점의 개수를 구하고 오일러의 공식이 성립하는지 확인하시오.</p>
<div class="exa">
<p>$n=5$: 면 $=5+2=7$, 모서리 $=3\times5=15$, 꼭짓점 $=2\times5=10$</p>
<p>$v-e+f=10-15+7=2$ ✓ 성립해요.</p>
<p><strong>답: 면 $7$ 개, 모서리 $15$ 개, 꼭짓점 $10$ 개, 오일러의 공식 성립</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (오일러의 공식으로 모서리 구하기)</strong>
<p class="exq">어떤 다면체의 면이 $12$ 개, 꼭짓점이 $20$ 개일 때 모서리의 개수를 구하시오.</p>
<div class="exa">
<p>오일러의 공식 $v-e+f=2$ 에 대입하면 $20-e+12=2$.</p>
<p>$e=20+12-2=30$ (개)</p>
<p>(참고: 면이 $12$ 개이고 꼭짓점이 $20$ 개인 정다면체는 정십이면체이고 모서리는 $30$ 개예요.)</p>
<p><strong>답: $30$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (합이 주어진 경우)</strong>
<p class="exq">면의 수, 모서리의 수, 꼭짓점의 수를 모두 더한 값이 $38$ 인 각기둥은 몇 각기둥인가?</p>
<div class="exa">
<p>$n$ 각기둥: 면 $n+2$, 모서리 $3n$, 꼭짓점 $2n$ 이므로 합은 $(n+2)+3n+2n=6n+2$.</p>
<p>$6n+2=38$ 에서 $6n=36$, $n=6$.</p>
<p>(각뿔이라면 합이 $(n+1)+2n+(n+1)=4n+2$ 가 돼요.)</p>
<p><strong>답: 육각기둥</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (두 다면체 연결하기)</strong>
<p class="exq">삼각기둥의 면의 개수와 같은 꼭짓점의 개수를 갖는 각뿔의 모서리의 개수와, 삼각기둥의 모서리의 개수의 합을 구하시오.</p>
<div class="exa">
<p>삼각기둥의 면은 $3+2=5$ 개, 모서리는 $3\times3=9$ 개.</p>
<p>$m$ 각뿔의 꼭짓점은 $m+1$ 개이므로 $m+1=5$, $m=4$ (사각뿔). 사각뿔의 모서리는 $2\times4=8$ 개.</p>
<p>$8+9=17$ (개)</p>
<p><strong>답: $17$ 개</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>각뿔의 면의 수를 $n+2$ 로 세는 실수. 뿔은 밑면이 <strong>하나</strong>라서 $n+1$ 이에요.</li>
<li>각뿔의 꼭짓점을 $n$ 개로만 세는 실수. 꼭대기 점 $1$ 개를 더해서 $n+1$.</li>
<li>"삼각뿔대의 옆면은 삼각형"이라고 착각하기. 뿔대의 옆면은 <strong>사다리꼴</strong>이에요.</li>
<li>정다면체의 조건 하나만 보고 판단하기. "면이 모두 정삼각형"이어도 한 꼭짓점에 모인 면의 수가 다르면 정다면체가 아니에요. (정삼각형인 정다면체는 $3, 4, 5$ 개씩 모이는 세 종류!)</li>
<li>$v-e+f=2$ 에서 부호를 틀리는 실수. <strong>꼭짓점 $-$ 모서리 $+$ 면</strong> (모서리만 빼기).</li>
</ul>
</div>`,
        tip: r`
<p><strong>정다면체 표는 규칙으로 외워요.</strong></p>
<ul>
<li>면이 $4, 6, 8, 12, 20$ → 사면체, 육면체, 팔면체, 십이면체, 이십면체.</li>
<li>모서리는 $6,\ 12,\ 12,\ 30,\ 30$. 정육면체↔정팔면체, 정십이면체↔정이십면체는 <strong>모서리 수가 같고 면과 꼭짓점의 수가 서로 바뀌어</strong> 있어요. (정육면체: 면 $6$, 꼭짓점 $8$ / 정팔면체: 면 $8$, 꼭짓점 $6$)</li>
<li>정사면체는 혼자 면 $4$, 꼭짓점 $4$ (자기 자신과 짝).</li>
</ul>
<p><strong>세어 볼 땐 밑면부터!</strong> "밑면이 몇 각형인가?"를 먼저 결정하면 $n$ 만 나오고, 표의 $n+2,\ 3n,\ 2n$ (기둥·뿔대)과 $n+1,\ 2n,\ n+1$ (뿔)으로 바로 끝나요.</p>
<p><strong>검산은 오일러로</strong>: 구한 세 개수를 $v-e+f$ 에 넣어서 $2$ 가 되는지 보면 틀린 계산을 바로 잡아낼 수 있어요.</p>`
      },

      /* ───────── 1. 회전체 ───────── */
      {
        title: '회전체',
        body: r`
<p class="lead-line">평면도형을 한 직선(축)을 중심으로 빙글 돌리면 입체가 만들어져요. 도자기를 물레로 빚는 모양을 떠올리면 쉬워요!</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>회전체</strong>: 평면도형을 한 직선을 축으로 $1$ 회전(한 바퀴)시켜 만든 입체도형.</li>
<li><strong>회전축</strong>: 도는 기준이 되는 직선.</li>
<li><strong>모선</strong>: 회전체의 옆면(곡면)을 만드는 선분. 원뿔의 <strong>모선</strong>은 꼭짓점에서 밑면 둘레의 한 점까지의 선분이에요.</li>
</ul>
</div>

<div class="formula">
<table>
<tr><th>돌리는 평면도형</th><th>축</th><th>만들어지는 회전체</th></tr>
<tr><td>직사각형</td><td>한 변</td><td><strong>원기둥</strong></td></tr>
<tr><td>직각삼각형</td><td>직각을 낀 한 변</td><td><strong>원뿔</strong></td></tr>
<tr><td>직각사다리꼴</td><td>밑변에 수직인 변</td><td><strong>원뿔대</strong></td></tr>
<tr><td>반원</td><td>지름</td><td><strong>구</strong></td></tr>
<tr><td>원</td><td>지름</td><td><strong>구</strong></td></tr>
</table>
</div>

<svg viewBox="0 0 280 150" width="300" role="img" aria-label="직사각형을 한 변을 축으로 회전하면 원기둥이 된다" style="display:block;margin:10px auto;color:inherit">
<rect x="30" y="30" width="30" height="80" fill="none" stroke="currentColor" stroke-width="2"/>

<text x="30" y="135" font-size="12" text-anchor="middle" fill="currentColor">축</text>
<text x="105" y="75" font-size="22" text-anchor="middle" fill="currentColor">→</text>
<ellipse cx="190" cy="35" rx="40" ry="12" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M150,35 L150,110 A40,12 0 0 0 230,110 L230,35" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M150,110 A40,12 0 0 1 230,110" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="190" y1="25" x2="190" y2="122" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="190" y="142" font-size="12" text-anchor="middle" fill="currentColor">원기둥</text>
</svg>

<div class="def"><strong class="label">회전체를 잘랐을 때의 단면</strong>
<ul>
<li><strong>회전축에 수직인 평면</strong>으로 자르면 단면은 항상 <strong>원</strong>이에요. (자르는 위치에 따라 크기만 달라져요.) 원기둥은 어디를 잘라도 같은 크기의 원!</li>
<li><strong>회전축을 포함하는 평면</strong>으로 자르면 단면은 회전축을 기준으로 <strong>선대칭도형</strong>이 돼요.</li>
</ul>
<table>
<tr><th>회전체</th><th>축에 수직으로 자른 단면</th><th>축을 포함하여 자른 단면</th></tr>
<tr><td>원기둥</td><td>원 (크기 모두 같음)</td><td>직사각형</td></tr>
<tr><td>원뿔</td><td>원 (꼭짓점에서 멀수록 큼)</td><td>이등변삼각형</td></tr>
<tr><td>원뿔대</td><td>원 (크기가 달라짐)</td><td>(등변)사다리꼴</td></tr>
<tr><td>구</td><td>원</td><td>원 (가장 큰 원)</td></tr>
</table>
</div>

<div class="def"><strong class="label">구의 단면</strong>
<p>구는 <strong>어떤 평면으로 잘라도 단면이 원</strong>이에요. 구의 중심을 지나게 자르면 단면이 가장 크고(반지름이 구의 반지름과 같아요), 중심에서 멀어질수록 작아져요.</p>
<p>구의 반지름이 $R$, 자르는 평면이 중심에서 $d$ 만큼 떨어져 있으면, 직각삼각형(피타고라스 정리)으로 단면인 원의 반지름은</p>
<div class="formula">
$$\text{단면의 반지름}=\sqrt{R^2-d^2}$$
</div>
</div>

<div class="why"><strong class="label">왜 $\sqrt{R^2-d^2}$ 일까?</strong>
<p>구의 중심 $O$, 단면의 중심 $H$, 단면 원 위의 한 점 $P$ 를 이으면 $OH\perp HP$ 인 직각삼각형이 생겨요. 빗변 $OP$ 는 구의 반지름 $R$, 한 변 $OH=d$ 이므로 $HP^2=R^2-d^2$ 이에요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (회전체의 이름)</strong>
<p class="exq">다음 평면도형을 직선 $l$ 을 축으로 $1$ 회전시킬 때 생기는 입체도형의 이름을 쓰시오. (1) 직각삼각형, 직각을 낀 한 변이 축 (2) 반원, 지름이 축 (3) 직각사다리꼴, 수직인 변이 축</p>
<div class="exa">
<p>(1) 빗변이 모선이 되는 뾰족한 모양 → 원뿔</p>
<p>(2) 반원이 돌며 공 모양 → 구</p>
<p>(3) 윗부분이 잘린 원뿔 → 원뿔대</p>
<p><strong>답: (1) 원뿔 (2) 구 (3) 원뿔대</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (원기둥의 단면)</strong>
<p class="exq">밑면의 반지름이 $5\text{ cm}$, 높이가 $8\text{ cm}$ 인 원기둥을 (1) 회전축을 포함하는 평면으로 자를 때, (2) 회전축에 수직인 평면으로 자를 때 생기는 단면의 넓이를 각각 구하시오.</p>
<div class="exa">
<p>(1) 단면은 가로 $2\times5=10$, 세로 $8$ 인 직사각형이에요. 넓이 $=10\times8=80\ (\text{cm}^2)$</p>
<p>(2) 단면은 밑면과 합동인 원이에요. 넓이 $=\pi\times5^2=25\pi\ (\text{cm}^2)$</p>
<p><strong>답: (1) $80\text{ cm}^2$ (2) $25\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (원뿔의 단면)</strong>
<p class="exq">밑변의 길이가 $10\text{ cm}$, 높이가 $6\text{ cm}$ 인 이등변삼각형의 높이를 축으로 $1$ 회전시킬 때 생기는 회전체를 회전축을 포함하는 평면으로 자른 단면의 넓이를 구하시오.</p>
<div class="exa">
<p>이등변삼각형의 높이를 축으로 돌리면 <strong>원뿔</strong>이 되고, 회전축을 포함한 단면은 처음의 이등변삼각형과 같아요.</p>
<p>넓이 $=\dfrac12\times10\times6=30\ (\text{cm}^2)$</p>
<p><strong>답: $30\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (구의 단면)</strong>
<p class="exq">반지름이 $13\text{ cm}$ 인 구를 중심에서 $5\text{ cm}$ 떨어진 평면으로 자를 때 생기는 단면의 넓이와 둘레의 길이를 구하시오.</p>
<div class="exa">
<p>단면인 원의 반지름 $=\sqrt{13^2-5^2}=\sqrt{144}=12\ (\text{cm})$ &nbsp;($5,12,13$ 직각삼각형!)</p>
<p>넓이 $=\pi\times12^2=144\pi$, 둘레 $=2\pi\times12=24\pi$</p>
<p><strong>답: 넓이 $144\pi\text{ cm}^2$, 둘레 $24\pi\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (축을 바꾸면?)</strong>
<p class="exq">가로 $3\text{ cm}$, 세로 $5\text{ cm}$ 인 직사각형을 (가) 가로를 축으로, (나) 세로를 축으로 $1$ 회전시킨 두 회전체의 부피의 차를 구하시오. (원기둥의 부피 $V=\pi r^2h$)</p>
<div class="exa">
<p>(가) 가로($3$)가 축이면 높이 $3$, 반지름은 세로 $5$: $V=\pi\times5^2\times3=75\pi$</p>
<p>(나) 세로($5$)가 축이면 높이 $5$, 반지름은 가로 $3$: $V=\pi\times3^2\times5=45\pi$</p>
<p>차 $=75\pi-45\pi=30\pi$</p>
<p><strong>답: $30\pi\text{ cm}^3$</strong> (축이 짧은 쪽이 반지름이 커져서 더 뚱뚱한 원기둥이 돼요.)</p>
</div></div>

<div class="ex"><strong class="label">예시 6 (직각삼각형을 두 가지로 돌리기)</strong>
<p class="exq">직각을 낀 두 변의 길이가 $3\text{ cm}$, $4\text{ cm}$ 인 직각삼각형을 각각의 변을 축으로 $1$ 회전시킬 때 생기는 두 원뿔의 부피의 차를 구하시오. (원뿔의 부피 $V=\dfrac13\pi r^2h$)</p>
<div class="exa">
<p>길이 $3$ 인 변이 축: 반지름 $4$, 높이 $3$ → $V=\dfrac13\pi\times4^2\times3=16\pi$</p>
<p>길이 $4$ 인 변이 축: 반지름 $3$, 높이 $4$ → $V=\dfrac13\pi\times3^2\times4=12\pi$</p>
<p>차 $=16\pi-12\pi=4\pi$</p>
<p><strong>답: $4\pi\text{ cm}^3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (반원을 돌리면)</strong>
<p class="exq">반지름이 $3\text{ cm}$ 인 반원을 지름을 축으로 $1$ 회전시킨 회전체의 부피와, 이 회전체를 회전축에 수직으로 자른 가장 큰 단면의 넓이의 합을 구하시오. (구의 부피 $V=\dfrac43\pi r^3$)</p>
<div class="exa">
<p>회전체는 반지름이 $3$ 인 구예요. 부피 $=\dfrac43\pi\times3^3=36\pi$</p>
<p>가장 큰 단면은 중심을 지나는 단면으로 반지름 $3$ 인 원이므로 넓이 $=\pi\times3^2=9\pi$</p>
<p>합 $=36\pi+9\pi=45\pi$</p>
<p><strong>답: 부피 $36\pi\text{ cm}^3$, 단면의 넓이 $9\pi\text{ cm}^2$ → 값의 합 $45\pi$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>"회전체의 단면은 모두 원"이라고 일반화하기. <strong>축에 수직</strong>일 때만 원이고, 축을 포함하면 직사각형·삼각형·사다리꼴이에요.</li>
<li>원뿔을 축을 포함해 자른 단면을 <strong>정삼각형</strong>이라고 쓰기. 정삼각형이 아니라 <strong>이등변삼각형</strong>이에요. (모선의 길이와 밑면의 지름이 같을 때만 정삼각형)</li>
<li>직사각형을 가로로 돌릴지 세로로 돌릴지 헷갈려 반지름과 높이를 서로 바꿔 쓰기. <strong>축으로 쓴 변이 높이</strong>, 나머지 변이 반지름이에요.</li>
<li>구의 단면에서 반지름을 $R-d$ 로 계산하기. 꼭 피타고라스 정리 $\sqrt{R^2-d^2}$ 를 써요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>"축에 수직 → 원, 축을 포함 → 선대칭"</strong> 이 두 문장이면 단면 문제는 끝이에요. 그림이 없으면 머릿속에서 원기둥을 눕혀서 세로로 반 가르는 장면을 떠올려 보세요 (직사각형).</p>
<p><strong>구의 단면 자주 나오는 숫자</strong>: $(R,d,\text{단면 반지름})$ 이 $(5,3,4),\ (13,5,12),\ (10,6,8),\ (15,9,12),\ (17,8,15),\ (25,7,24)$ 처럼 피타고라스 수로 떨어져요. 이 조합을 알면 루트 계산을 안 해도 돼요.</p>
<p><strong>부피를 비교할 땐 $\pi$ 는 그대로 두기</strong>: $75\pi$ 와 $45\pi$ 의 차는 $\pi$ 를 곱하지 않고 $30\pi$ 로 쓰면 계산 실수가 줄어요.</p>`
      },

      /* ───────── 2. 입체도형의 겉넓이와 부피 ───────── */
      {
        title: '입체도형의 겉넓이와 부피',
        body: r`
<p class="lead-line">겉넓이는 "껍질을 펼친 넓이", 부피는 "안을 채우는 양"이에요. 기둥은 (밑넓이)$\times$(높이), 뿔은 그것의 $\frac13$, 구는 $\frac43\pi r^3$ — 세 가지 흐름만 잡으면 돼요.</p>

<div class="def"><strong class="label">겉넓이와 부피란?</strong>
<ul>
<li><strong>겉넓이</strong>: 입체도형의 겉면 전체의 넓이 $=$ (밑넓이)$\times$(밑면의 수) $+$ (옆넓이). 전개도(펼친 그림)의 넓이와 같아요.</li>
<li><strong>부피</strong>: 입체도형이 차지하는 공간의 크기. 단위는 $\text{cm}^3$ 같은 세제곱 단위예요.</li>
</ul>
</div>

<div class="formula">
$$\text{기둥: }V=Sh,\qquad \text{겉넓이}=2S+(\text{밑면의 둘레})\times h$$
$$\text{뿔: }V=\dfrac13Sh,\qquad \text{겉넓이}=S+(\text{옆넓이})$$
$$\text{구: }V=\dfrac43\pi r^3,\qquad \text{겉넓이}=4\pi r^2$$
</div>
<p>($S$ 는 밑넓이, $h$ 는 높이)</p>

<div class="def"><strong class="label">기둥</strong>
<ul>
<li><strong>직육면체</strong> (가로 $a$, 세로 $b$, 높이 $c$): $V=abc$, 겉넓이 $=2(ab+bc+ca)$</li>
<li><strong>정육면체</strong> (한 모서리 $a$): $V=a^3$, 겉넓이 $=6a^2$</li>
<li><strong>원기둥</strong> (반지름 $r$, 높이 $h$): $V=\pi r^2h$, 겉넓이 $=2\pi r^2+2\pi rh$ &nbsp;(옆면을 펼치면 가로 $2\pi r$, 세로 $h$ 인 직사각형)</li>
</ul>
</div>

<div class="def"><strong class="label">뿔</strong>
<ul>
<li><strong>각뿔</strong>: $V=\dfrac13\times(\text{밑넓이})\times(\text{높이})$, 겉넓이 $=$ (밑넓이) $+$ (옆면 삼각형 넓이의 합)</li>
<li><strong>원뿔</strong> (반지름 $r$, 높이 $h$, 모선 $l$): $V=\dfrac13\pi r^2h$, 겉넓이 $=\pi r^2+\pi rl$ &nbsp;(옆넓이 $=\pi rl$)</li>
<li>원뿔은 $r,\ h,\ l$ 사이에 피타고라스 정리 $l^2=r^2+h^2$ 가 성립해요.</li>
</ul>
</div>

<div class="why"><strong class="label">왜 뿔은 $\frac13$ 일까?</strong>
<p>밑면과 높이가 같은 기둥 모양 그릇과 뿔 모양 그릇이 있을 때, 뿔 그릇에 물을 가득 채워 기둥 그릇에 옮겨 부으면 <strong>딱 $3$ 번</strong> 부어야 기둥이 가득 차요. 그래서 뿔의 부피는 기둥의 $\dfrac13$ 이에요.</p>
</div>

<div class="def"><strong class="label">원뿔의 전개도</strong>
<p>원뿔을 펼치면 <strong>밑면(원)</strong>과 <strong>옆면(부채꼴)</strong>이 나와요. 부채꼴의 반지름은 모선의 길이 $l$ 이고, 부채꼴의 호의 길이는 밑면인 원의 둘레 $2\pi r$ 와 같아요. 부채꼴의 중심각을 $x^\circ$ 라 하면</p>
<div class="formula">
$$2\pi l\times\dfrac{x}{360}=2\pi r\quad\Longrightarrow\quad x=360\times\dfrac{r}{l}$$
</div>
<p>부채꼴의 넓이는 $\dfrac12\times l\times(\text{호의 길이})=\dfrac12\times l\times2\pi r=\pi rl$ 로 옆넓이 공식이 나와요.</p>
</div>

<div class="def"><strong class="label">구와 반구</strong>
<ul>
<li>구: $V=\dfrac43\pi r^3$, 겉넓이 $S=4\pi r^2$ (구의 겉넓이는 가장 큰 단면인 원의 넓이의 $4$ 배!)</li>
<li>반구: $V=\dfrac23\pi r^3$, 겉넓이 $=$ (곡면) $2\pi r^2$ $+$ (평평한 단면) $\pi r^2$ $=3\pi r^2$</li>
</ul>
</div>

<div class="def"><strong class="label">원뿔대</strong>
<p>원뿔대의 부피는 <strong>(큰 원뿔) $-$ (작은 원뿔)</strong> 로 구해요. 잘라 낸 작은 원뿔은 큰 원뿔과 모양이 같은(닮은) 원뿔이라, 반지름과 높이의 비를 이용하면 돼요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (직육면체)</strong>
<p class="exq">가로 $3\text{ cm}$, 세로 $4\text{ cm}$, 높이 $5\text{ cm}$ 인 직육면체의 부피와 겉넓이를 구하시오.</p>
<div class="exa">
<p>부피 $=3\times4\times5=60$</p>
<p>겉넓이 $=2(3\times4+4\times5+5\times3)=2(12+20+15)=2\times47=94$</p>
<p><strong>답: 부피 $60\text{ cm}^3$, 겉넓이 $94\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (원기둥)</strong>
<p class="exq">밑면의 반지름이 $3\text{ cm}$, 높이가 $5\text{ cm}$ 인 원기둥의 부피와 겉넓이를 구하시오.</p>
<div class="exa">
<p>부피 $=\pi\times3^2\times5=45\pi$</p>
<p>밑넓이 $2$ 개 $=2\times\pi\times3^2=18\pi$, 옆넓이 $=2\pi\times3\times5=30\pi$</p>
<p>겉넓이 $=18\pi+30\pi=48\pi$</p>
<p><strong>답: 부피 $45\pi\text{ cm}^3$, 겉넓이 $48\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (사각뿔의 부피)</strong>
<p class="exq">밑면이 한 변의 길이가 $6\text{ cm}$ 인 정사각형이고 높이가 $9\text{ cm}$ 인 사각뿔의 부피를 구하시오.</p>
<div class="exa">
<p>밑넓이 $=6\times6=36$</p>
<p>$V=\dfrac13\times36\times9=108$</p>
<p><strong>답: $108\text{ cm}^3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (원뿔의 부피와 겉넓이)</strong>
<p class="exq">밑면의 반지름이 $3\text{ cm}$, 모선의 길이가 $5\text{ cm}$ 인 원뿔의 부피와 겉넓이를 구하시오.</p>
<div class="exa">
<p>높이는 피타고라스 정리로: $h=\sqrt{5^2-3^2}=\sqrt{16}=4$</p>
<p>부피 $V=\dfrac13\pi\times3^2\times4=12\pi$</p>
<p>밑넓이 $=\pi\times3^2=9\pi$, 옆넓이 $=\pi\times3\times5=15\pi$ → 겉넓이 $=24\pi$</p>
<p><strong>답: 부피 $12\pi\text{ cm}^3$, 겉넓이 $24\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (원뿔의 전개도)</strong>
<p class="exq">밑면의 반지름이 $4\text{ cm}$, 모선의 길이가 $10\text{ cm}$ 인 원뿔의 전개도에서 옆면인 부채꼴의 중심각의 크기를 구하시오.</p>
<div class="exa">
<p>부채꼴의 호의 길이 $=$ 밑면의 둘레 $=2\pi\times4=8\pi$</p>
<p>중심각을 $x^\circ$ 라 하면 $2\pi\times10\times\dfrac{x}{360}=8\pi$ → $x=\dfrac{8\times360}{20}=144$</p>
<p>(공식으로: $x=360\times\dfrac{4}{10}=144$)</p>
<p><strong>답: $144^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (구와 반구)</strong>
<p class="exq">반지름이 $6\text{ cm}$ 인 구의 부피와 겉넓이, 그리고 같은 반지름의 반구의 부피와 겉넓이를 구하시오.</p>
<div class="exa">
<p>구의 부피 $=\dfrac43\pi\times6^3=\dfrac43\pi\times216=288\pi$</p>
<p>구의 겉넓이 $=4\pi\times6^2=144\pi$</p>
<p>반구의 부피 $=288\pi\div2=144\pi$</p>
<p>반구의 겉넓이 $=$ 곡면 $\dfrac12\times144\pi=72\pi$ $+$ 단면 $\pi\times6^2=36\pi$ $=108\pi$ &nbsp;($=3\pi r^2=3\pi\times36$ ✓)</p>
<p><strong>답: 구 $288\pi\text{ cm}^3,\ 144\pi\text{ cm}^2$ / 반구 $144\pi\text{ cm}^3,\ 108\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (원뿔대의 부피)</strong>
<p class="exq">밑면의 반지름이 $6\text{ cm}$, 높이가 $12\text{ cm}$ 인 큰 원뿔에서, 꼭짓점에서 $6\text{ cm}$ 높이를 이루는 윗부분(반지름 $3\text{ cm}$, 높이 $6\text{ cm}$ 인 작은 원뿔)을 잘라 낸 원뿔대의 부피를 구하시오.</p>
<div class="exa">
<p>큰 원뿔 $=\dfrac13\pi\times6^2\times12=144\pi$</p>
<p>작은 원뿔 $=\dfrac13\pi\times3^2\times6=18\pi$</p>
<p>원뿔대 $=144\pi-18\pi=126\pi$</p>
<p><strong>답: $126\pi\text{ cm}^3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (물에 구슬을 넣으면)</strong>
<p class="exq">밑면의 반지름이 $6\text{ cm}$ 인 원기둥 모양의 그릇에 물이 $10\text{ cm}$ 높이로 들어 있다. 반지름이 $3\text{ cm}$ 인 쇠구슬을 완전히 잠기도록 넣으면 물의 높이는 몇 $\text{cm}$ 가 되는가?</p>
<div class="exa">
<p>구슬의 부피 $=\dfrac43\pi\times3^3=36\pi$. 이만큼 물의 부피가 늘어나요.</p>
<p>올라간 높이를 $x$ 라 하면 $\pi\times6^2\times x=36\pi$ → $x=1$</p>
<p>물의 높이 $=10+1=11$</p>
<p><strong>답: $11\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (구가 원기둥에 꼭 맞을 때)</strong>
<p class="exq">반지름이 $3\text{ cm}$ 인 구가 원기둥 안에 꼭 맞게 들어 있다. 원기둥의 부피에서 구의 부피를 뺀 값을 구하시오.</p>
<div class="exa">
<p>원기둥은 반지름 $3$, 높이 $6$ (구의 지름). 부피 $=\pi\times3^2\times6=54\pi$</p>
<p>구의 부피 $=\dfrac43\pi\times27=36\pi$</p>
<p>차 $=54\pi-36\pi=18\pi$</p>
<p><strong>답: $18\pi\text{ cm}^3$</strong> (구 : 원기둥 $=36\pi:54\pi=2:3$)</p>
</div></div>

<div class="ex"><strong class="label">예시 10 (부피로 거꾸로)</strong>
<p class="exq">부피가 $27\text{ cm}^3$ 인 정육면체의 겉넓이를 구하시오.</p>
<div class="exa">
<p>한 모서리를 $x$ 라 하면 $x^3=27$ → $x=3$.</p>
<p>겉넓이 $=6\times3^2=54$</p>
<p><strong>답: $54\text{ cm}^2$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>뿔의 부피에서 $\dfrac13$ 을 빠뜨리기. 뿔은 반드시 $\dfrac13$!</li>
<li>원뿔의 높이 $h$ 와 모선 $l$ 을 헷갈리기. 부피는 <strong>높이</strong>, 옆넓이는 <strong>모선</strong>을 써요. 모선만 주어지면 $h=\sqrt{l^2-r^2}$ 로 먼저 구해요.</li>
<li>원기둥 겉넓이에서 밑넓이를 $1$ 개만 세기. 밑면은 위·아래 <strong>$2$ 개</strong>예요.</li>
<li>반구의 겉넓이를 $2\pi r^2$ 로만 쓰기. 평평한 단면 $\pi r^2$ 까지 더해서 $3\pi r^2$.</li>
<li>지름이 주어졌는데 그대로 $r$ 에 넣기. 반지름 $=$ 지름 $\div2$.</li>
<li>구슬을 넣을 때 "구슬의 부피 $=$ 늘어난 물의 부피"를 잊고 구슬이 차지하는 높이를 그대로 더하기.</li>
</ul>
</div>`,
        tip: r`
<p><strong>$\pi$ 는 숫자 뒤에 그대로 붙여 두세요.</strong> $\pi\times3^2\times5=45\pi$ 처럼 $\pi$ 는 마지막에 쓰면 되고, 곱셈·덧셈은 숫자끼리만 계산해요.</p>
<p><strong>원뿔 : 구 : 원기둥 $=1:2:3$.</strong> 반지름 $r$ 이고 높이가 $2r$ (구의 지름과 같음)일 때 원뿔 $\dfrac23\pi r^3$, 구 $\dfrac43\pi r^3$, 원기둥 $2\pi r^3$. 분모를 $3$ 으로 맞추면 $2:4:6=1:2:3$ 이에요.</p>
<p><strong>원뿔의 $(r,h,l)$ 은 피타고라스 수로 자주 나와요</strong>: $(3,4,5),\ (6,8,10),\ (5,12,13),\ (8,15,17)$. $h$ 가 $3$ 의 배수이면 $\dfrac13$ 이 깔끔히 약분돼서 계산이 쉬워요.</p>
<p><strong>전개도 중심각 $x=360\times\dfrac{r}{l}$</strong> 하나만 기억하세요. 모선이 밑면 반지름의 $2$ 배이면 $x=180^\circ$ (반원), $3$ 배이면 $120^\circ$ 예요.</p>
<p><strong>구의 부피·겉넓이 헷갈리지 않기</strong>: 겉넓이는 넓이라서 $r$ 이 <strong>2번</strong>($4\pi r^2$), 부피는 공간이라서 $r$ 이 <strong>3번</strong>($\dfrac43\pi r^3$) 곱해져요. 지름이 주어지면 꼭 반으로 나눈 뒤 넣으세요.</p>`
      },

      /* ───────── 3. (추가) 부피와 겉넓이 활용 ───────── */
      {
        title: '입체도형의 활용 (합성 입체와 비교)',
        body: r`
<p class="lead-line">두 개 이상의 입체를 붙이거나 파낸 도형도 "기본 도형의 부피를 더하고 빼기"로 풀 수 있어요. 겉넓이는 "겉으로 드러난 면만" 세는 것이 핵심이에요.</p>

<div class="def"><strong class="label">합성 입체의 부피와 겉넓이</strong>
<ul>
<li><strong>부피</strong>: 붙인 것은 더하고, 파낸 것은 빼요.</li>
<li><strong>겉넓이</strong>: 붙인 곳(접착면)은 겉으로 드러나지 않으므로 <strong>세지 않아요</strong>. 겉으로 보이는 면만 모두 더해요.</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1 (반구 위에 원뿔)</strong>
<p class="exq">밑면의 반지름이 $3\text{ cm}$ 인 반구 위에, 밑면이 반구의 평평한 면과 꼭 맞는 원뿔(모선의 길이 $5\text{ cm}$)을 붙인 입체의 겉넓이를 구하시오.</p>
<div class="exa">
<p>원뿔의 밑면과 반구의 평평한 면은 붙어 있으므로 겉넓이에서 빠져요.</p>
<p>원뿔의 옆넓이 $=\pi\times3\times5=15\pi$</p>
<p>반구의 곡면 $=\dfrac12\times4\pi\times3^2=18\pi$</p>
<p>겉넓이 $=15\pi+18\pi=33\pi$</p>
<p><strong>답: $33\pi\text{ cm}^2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (원기둥에서 원기둥을 파내기)</strong>
<p class="exq">밑면의 반지름이 $4\text{ cm}$, 높이가 $10\text{ cm}$ 인 원기둥에서 가운데를 반지름 $2\text{ cm}$ 인 원기둥 모양으로 완전히 뚫어 파냈을 때 남은 입체의 부피를 구하시오.</p>
<div class="exa">
<p>큰 원기둥 $=\pi\times4^2\times10=160\pi$</p>
<p>뚫은 원기둥 $=\pi\times2^2\times10=40\pi$</p>
<p>남은 부피 $=160\pi-40\pi=120\pi$</p>
<p><strong>답: $120\pi\text{ cm}^3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (정육면체를 쌓기)</strong>
<p class="exq">한 모서리의 길이가 $2\text{ cm}$ 인 정육면체 $3$ 개를 한 줄로 붙여서 만든 직육면체의 겉넓이를 구하시오.</p>
<div class="exa">
<p>만들어진 직육면체는 가로 $6$, 세로 $2$, 높이 $2$ 예요.</p>
<p>겉넓이 $=2(6\times2+2\times2+2\times6)=2(12+4+12)=56$</p>
<p>(검사: 따로 $6\times4\times3=72$ 에서 붙은 면 $4$ 개 $\times$ $4\ \text{cm}^2=16$ 을 빼면 $56$ ✓)</p>
<p><strong>답: $56\text{ cm}^2$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>합성 입체의 겉넓이를 구할 때 접착면을 빼지 않기.</li>
<li>구멍을 뚫은 입체의 겉넓이를 구할 때 구멍 안쪽 면(옆면)을 빠뜨리기. 구멍 안쪽도 겉면이에요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>합성 입체 풀이 3단계</strong>: ① 어떤 기본 입체들로 이루어졌는지 쪼개기 → ② 각 입체의 부피(또는 겉넓이)를 구하기 → ③ 붙은 면은 빼고(겉넓이), 파낸 것은 빼기(부피).</p>
<p>겉넓이는 접착면을 세다 헷갈리면, 위·앞·옆에서 본 모양을 각각 세어 <strong>(위+아래) $+$ (앞+뒤) $+$ (좌+우)</strong> 로 구하는 방법도 있어요.</p>`
      }

      {
        q: r`칠각기둥과 칠각뿔의 모서리의 개수의 차를 구하시오.`,
        a: r`<p>칠각기둥: $3\times7=21$ (개), 칠각뿔: $2\times7=14$ (개)</p><p>차 $=21-14=7$</p><p><strong>답: $7$ 개</strong></p>`
      },

        a: r`<p>$v-e+f=2$ 에서 $e=v+f-2$ 이므로 $e=14-2=12$</p><p>(예: 정육면체는 면 $6$, 꼭짓점 $8$ 로 합이 $14$, 모서리 $12$ 개 ✓)</p><p><strong>답: $12$ 개</strong></p>`
      },
      {
        q: r`반지름이 $10\text{ cm}$ 인 구를 중심에서 $6\text{ cm}$ 떨어진 평면으로 자를 때 생기는 단면의 넓이를 구하시오.`,
        a: r`<p>단면의 반지름 $=\sqrt{10^2-6^2}=\sqrt{64}=8$</p><p>넓이 $=\pi\times8^2=64\pi$</p><p><strong>답: $64\pi\text{ cm}^2$</strong></p>`
      },
      {
        q: r`밑면의 반지름이 $4\text{ cm}$, 높이가 $9\text{ cm}$ 인 원뿔의 부피를 구하시오.`,
        a: r`<p>$V=\dfrac13\pi\times4^2\times9=\dfrac13\pi\times144=48\pi$</p><p><strong>답: $48\pi\text{ cm}^3$</strong></p>`

      {

        a: r`<p>반지름 $=12\div2=6$</p><p>부피 $=\dfrac43\pi\times6^3=288\pi$, 겉넓이 $=4\pi\times6^2=144\pi$</p><p><strong>답: 부피 $288\pi\text{ cm}^3$, 겉넓이 $144\pi\text{ cm}^2$</strong></p>`
      },
      {
        q: r`밑면의 반지름이 $9\text{ cm}$, 모선의 길이가 $15\text{ cm}$ 인 원뿔의 전개도에서 옆면인 부채꼴의 중심각의 크기와 원뿔의 겉넓이를 구하시오.`,
        a: r`<p>중심각 $=360^\circ\times\dfrac{9}{15}=216^\circ$</p><p>겉넓이 $=\pi\times9^2+\pi\times9\times15=81\pi+135\pi=216\pi$</p><p><strong>답: 중심각 $216^\circ$, 겉넓이 $216\pi\text{ cm}^2$</strong></p>`
      }
    ]

})();

  <script>
(function () {
  const r = String.raw;
