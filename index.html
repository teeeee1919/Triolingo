    id: 'linear', no: 4, part: '문자와 식', title: '일차방정식',
    summary: '방정식과 항등식, 일차방정식의 풀이, 분수·소수 계수, 활용',
    sections: [
      /* ───────── 0. 방정식과 항등식, 등식의 성질 ───────── */
      {
        title: '방정식과 항등식, 등식의 성질',
        body: r`
<p class="lead-line">방정식은 <strong>"$x$ 가 얼마일 때 양쪽이 같아질까?"</strong> 를 묻는 식이에요. 양쪽이 균형을 이루는 <strong>천칭저울</strong>을 떠올리면 이해가 쉬워요.</p>

<div class="def"><strong class="label">개념 ① 등식</strong>
<p><strong>등식</strong>은 등호 $=$ 를 사용해서 두 식이 같음을 나타낸 식이에요. 등호의 왼쪽을 <strong>좌변</strong>, 오른쪽을 <strong>우변</strong>, 양쪽을 합쳐 <strong>양변</strong>이라고 불러요.</p>
<div class="formula">$$\underbrace{2x+3}_{\text{좌변}}=\underbrace{9}_{\text{우변}}$$</div>
<p>$3+4=7$ 처럼 문자가 없는 등식도 있어요. 등식은 참일 수도 있고 거짓일 수도 있어요. ($3+4=8$ 도 등식이지만 거짓)</p>
</div>

<div class="def"><strong class="label">개념 ② 방정식과 해</strong>
<ul>
<li><strong>방정식</strong>: 미지수(모르는 수 $x$) 의 값에 따라 <strong>참이 되기도 하고 거짓이 되기도 하는 등식</strong>.</li>
<li><strong>해(근)</strong>: 방정식을 <strong>참이 되게 하는 $x$ 의 값</strong>.</li>
<li><strong>방정식을 푼다</strong>: 해를 구하는 것.</li>
</ul>
<p>예) $2x+3=9$ 는 $x=3$ 일 때 $2\times3+3=9$ 로 참, $x=1$ 일 때 $5=9$ 로 거짓. 그래서 해는 $x=3$.</p>
</div>

<div class="def"><strong class="label">개념 ③ 항등식</strong>
<p><strong>항등식</strong>은 $x$ 에 <strong>어떤 값을 넣어도 항상 참</strong>인 등식이에요.</p>
<div class="formula">$$2(x+1)=2x+2,\qquad x+3=3+x$$</div>
<p>정리하면 양변이 완전히 똑같아지는 식이에요. 항등식은 해가 무수히 많아요.</p>
<p>그 반대로 <strong>어떤 $x$ 를 넣어도 거짓</strong>인 식(예: $x+1=x+2$)은 <strong>해가 없는</strong> 방정식이에요.</p>
</div>

<div class="def"><strong class="label">개념 ④ 등식의 성질 (천칭저울의 법칙)</strong>
<svg viewBox="0 0 340 150" width="100%" style="max-width:340px;display:block;margin:8px auto" role="img" aria-label="양쪽 균형이 맞는 천칭저울: 왼쪽 x 더하기 3, 오른쪽 7">
<line x1="170" y1="30" x2="170" y2="132" stroke="currentColor" stroke-width="3"/>
<line x1="100" y1="132" x2="240" y2="132" stroke="currentColor" stroke-width="3"/>
<line x1="60" y1="30" x2="280" y2="30" stroke="currentColor" stroke-width="3"/>
<line x1="60" y1="30" x2="35" y2="82" stroke="currentColor" stroke-width="1.5"/>
<line x1="60" y1="30" x2="85" y2="82" stroke="currentColor" stroke-width="1.5"/>
<line x1="28" y1="82" x2="92" y2="82" stroke="currentColor" stroke-width="3"/>
<line x1="280" y1="30" x2="255" y2="82" stroke="currentColor" stroke-width="1.5"/>
<line x1="280" y1="30" x2="305" y2="82" stroke="currentColor" stroke-width="1.5"/>
<line x1="248" y1="82" x2="312" y2="82" stroke="currentColor" stroke-width="3"/>
<text x="60" y="72" text-anchor="middle" font-size="16" fill="currentColor">x+3</text>
<text x="280" y="72" text-anchor="middle" font-size="16" fill="currentColor">7</text>
<text x="170" y="20" text-anchor="middle" font-size="12" fill="currentColor">균형 (=)</text>
</svg>
<p>양쪽에 똑같은 일을 하면 균형은 깨지지 않아요. 이것이 <strong>등식의 성질</strong>이에요.</p>
<div class="formula">$$a=b\ \Rightarrow\ a+c=b+c$$
$$a=b\ \Rightarrow\ a-c=b-c$$
$$a=b\ \Rightarrow\ ac=bc$$
$$a=b\ \Rightarrow\ \frac ac=\frac bc\quad(c\ne0)$$</div>
<ul>
<li>양변에 <strong>같은 수를 더해도</strong> 등식은 성립해요.</li>
<li>양변에서 <strong>같은 수를 빼도</strong> 성립해요.</li>
<li>양변에 <strong>같은 수를 곱해도</strong> 성립해요.</li>
<li>양변을 <strong>$0$ 이 아닌 같은 수로 나눠도</strong> 성립해요. ($0$ 으로 나누기는 안 돼요!)</li>
</ul>
</div>

<div class="def"><strong class="label">개념 ⑤ 이항과 일차방정식</strong>
<p><strong>이항</strong>은 등식의 성질을 이용해 <strong>한 변에 있는 항을 부호를 바꿔서 다른 변으로 옮기는 것</strong>이에요.</p>
<div class="formula">$$x+5=12\ \Rightarrow\ x=12-5$$</div>
<p>우변의 모든 항을 좌변으로 이항해서 정리했을 때 <strong>$ax+b=0$ ($a\ne0$)</strong> 꼴이 되는 방정식을 <strong>일차방정식</strong>이라고 해요.</p>
<ul>
<li>$3x-6=0$ ✓ 일차방정식</li>
<li>$x^2+x=x^2+2$ : 정리하면 $x-2=0$ ✓ 일차방정식 ($x^2$ 이 사라져요)</li>
<li>$x+3=3+x$ : 정리하면 $0=0$ → <strong>항등식</strong> (일차방정식 아님)</li>
<li>$2x+5=2x+3$ : 정리하면 $2=0$ (거짓) → <strong>해가 없음</strong> (일차방정식 아님)</li>
</ul>
</div>

<div class="why"><strong class="label">왜 이항하면 부호가 바뀔까?</strong>
<p>$x+5=12$ 의 양변에서 $5$ 를 빼면 $x+5-5=12-5$, 즉 $x=12-5$ 가 돼요. 좌변의 $+5$ 가 사라지고 우변에 $-5$ 가 생긴 거죠. 그래서 "항이 반대편으로 건너가면 부호가 바뀐다"라고 편하게 말하는 거예요.</p>
</div>

<div class="def"><strong class="label">개념 ⑥ 항등식의 조건</strong>
<p>$ax+b=cx+d$ 가 $x$ 에 대한 항등식이 되려면 <strong>양변의 $x$ 의 계수끼리, 상수항끼리 같아야</strong> 해요.</p>
<div class="formula">$$ax+b=cx+d\ \text{가 항등식}\iff a=c,\ \ b=d$$</div>
<p>해가 <strong>없으려면</strong> $a=c$ 이면서 $b\ne d$ 여야 하고, 일차방정식이려면 $a\ne c$ 여야 해요. (정리하면 $(a-c)x=d-b$)</p>
</div>

<div class="ex"><strong class="label">예시 1 (해 고르기)</strong>
<p class="exq">$x=-1$ 이 해인 방정식을 모두 고르세요. ① $3x+2=-1$ ② $2x-1=1$ ③ $4-x=5$</p>
<div class="exa">
<p>$x=-1$ 을 넣어 양변이 같은지 확인해요.</p>
<p>① $3\times(-1)+2=-1$ → 우변 $-1$ 과 같아요 ✓</p>
<p>② $2\times(-1)-1=-3$ → 우변 $1$ 과 달라요 ✗</p>
<p>③ $4-(-1)=5$ → 우변 $5$ 와 같아요 ✓</p>
<p><strong>답: ①, ③</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (등식의 성질 이용)</strong>
<p class="exq">등식의 성질을 이용해 $x+5=12$ 를 풀어 보세요. 또 $3x=15$ 를 풀어 보세요.</p>
<div class="exa">
<p>$x+5=12$: 양변에서 $5$ 를 빼면 $x=7$</p>
<p>$3x=15$: 양변을 $3$ 으로 나누면 $x=5$</p>
<p>검산: $7+5=12$ ✓, $3\times5=15$ ✓</p>
<p><strong>답: $x=7$, $x=5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (항등식 고르기)</strong>
<p class="exq">다음 중 항등식인 것을 고르세요. ① $3x+1=x+7$ ② $2(x-1)=2x-2$ ③ $x+4=x+5$</p>
<div class="exa">
<p>① 정리: $2x=6$ → 해가 $x=3$ 하나뿐, 일차방정식</p>
<p>② 우변과 좌변이 $2x-2$ 로 똑같아요 → <strong>항등식</strong></p>
<p>③ 정리: $4=5$ (거짓) → 해가 없어요</p>
<p><strong>답: ②</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (항등식이 되는 상수)</strong>
<p class="exq">$(a-2)x+3=5x+b$ 가 $x$ 에 대한 항등식일 때, $a,\ b$ 의 값을 구하세요.</p>
<div class="exa">
<p>항등식이면 $x$ 의 계수끼리, 상수항끼리 같아요.</p>
<p>$a-2=5\Rightarrow a=7$ , $b=3$</p>
<p>검산: $a=7$ 이면 $5x+3=5x+3$ ✓</p>
<p><strong>답: $a=7,\ b=3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (일차방정식이 될 조건)</strong>
<p class="exq">$(a-3)x+4=7$ 이 $x$ 에 대한 일차방정식이 되기 위한 $a$ 의 조건을 구하세요.</p>
<div class="exa">
<p>$x$ 의 계수 $a-3$ 이 $0$ 이면 $0\times x+4=7$ 이 되어 $x$ 가 사라져요.</p>
<p>일차방정식이려면 $a-3\ne0$ 이어야 해요.</p>
<p><strong>답: $a\ne3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (해가 없을 조건)</strong>
<p class="exq">$(a-1)x+5=2x+3$ 의 해가 없을 때, $a$ 의 값을 구하세요.</p>
<div class="exa">
<p>$(a-1-2)x=3-5$, 즉 $(a-3)x=-2$ 로 정리돼요.</p>
<p>해가 없으려면 $x$ 의 계수 $a-3=0$ 이어야 해요 (그러면 $0\times x=-2$ 라서 거짓). 그래서 $a=3$</p>
<p>검산: $a=3$ 이면 $2x+5=2x+3$ → $5=3$ (거짓) ✓ 해가 없음</p>
<p><strong>답: $a=3$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>이항할 때 부호를 안 바꾸기: $x+5=12\Rightarrow x=12+5$ ✗ → $x=12-5$ ✓</li>
<li>항등식과 방정식을 구분하지 않기: 방정식은 <strong>특정한 값에서만</strong> 참, 항등식은 <strong>모든 값에서</strong> 참.</li>
<li>양변을 $0$ 으로 나누기. 문자가 들어 있는 수로 나눌 땐 그 수가 $0$ 이 아닌지 확인해야 해요.</li>
<li>해를 검산할 때 <strong>원래 식</strong>이 아니라 이미 변형한 식에 넣어 보기</li>
</ul>
</div>`,
        tip: r`
<p><strong>검산은 "해를 원래 식에 넣어서 좌변 $=$ 우변" 확인!</strong> 어떤 풀이를 썼든 이 한 번으로 실수를 잡을 수 있어요.</p>
<ul>
<li>항등식 문제는 <strong>"계수끼리, 상수끼리 같다"</strong> 한 줄이면 끝!</li>
<li>해가 없음 / 해가 무수히 많음은 <strong>$(\text{계수})\times x=(\text{수})$</strong> 꼴로 정리해서 판단해요.<br>$0\times x=0$ → 항등식, $0\times x=\text{(0이 아닌 수)}$ → 해 없음</li>
<li>식 안의 $x^2$ 같은 항이 양변에서 사라지는지 먼저 보세요. 사라지면 일차방정식이 돼요.</li>
</ul>`
      },

      /* ───────── 1. 일차방정식의 풀이 (이항·괄호) ───────── */
      {
        title: '일차방정식의 풀이 (이항·괄호)',
        body: r`
<p class="lead-line">일차방정식은 <strong>"$x$ 는 왼쪽, 숫자는 오른쪽"</strong>으로 정리한 다음 계수로 나누면 끝이에요. 순서만 외우면 모든 문제가 같은 틀로 풀려요.</p>

<div class="def"><strong class="label">풀이 6단계</strong>
<ol>
<li><strong>괄호가 있으면 분배법칙으로 푼다.</strong></li>
<li>(분수·소수가 있으면 계수를 정수로 바꾼다. → 다음 단원)</li>
<li><strong>$x$ 항은 좌변으로, 상수항은 우변으로 이항한다.</strong></li>
<li><strong>동류항을 정리해</strong> $ax=b$ 꼴로 만든다.</li>
<li><strong>양변을 $a$ 로 나눈다</strong> ($a\ne0$): $x=\dfrac ba$.</li>
<li><strong>검산한다</strong>: 원래 식에 넣어 양변이 같은지 확인.</li>
</ol>
</div>

<div class="why"><strong class="label">왜 이 순서일까?</strong>
<p>목표는 "$x=\square$" 꼴을 만드는 거예요. 천칭저울에서 $x$ 가 든 상자를 한쪽 접시에 모으고(이항), 남은 숫자를 한쪽에 모아서(정리), $x$ 상자 하나의 무게를 구하는(나눗셈) 과정이에요. 괄호는 안에 무엇이 들었는지 모르면 정리할 수 없으니 먼저 풀어요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (이항)</strong>
<p class="exq">$3x-7=2x+5$ 를 푸세요.</p>
<div class="exa">
<p>$x$ 항은 좌변, 상수항은 우변으로 이항해요. $3x-2x=5+7$</p>
<p>정리하면 $x=12$</p>
<p>검산: 좌변 $3\times12-7=29$, 우변 $2\times12+5=29$ ✓</p>
<p><strong>답: $x=12$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (괄호 풀기)</strong>
<p class="exq">$2(x-3)=x+4$ 를 푸세요.</p>
<div class="exa">
<p>괄호를 풀면 $2x-6=x+4$</p>
<p>이항: $2x-x=4+6$ → $x=10$</p>
<p>검산: 좌변 $2\times(10-3)=14$, 우변 $10+4=14$ ✓</p>
<p><strong>답: $x=10$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (괄호가 두 번)</strong>
<p class="exq">$5(x+2)-3(2x-1)=4$ 를 푸세요.</p>
<div class="exa">
<p>괄호를 풀어요: $5x+10-6x+3=4$</p>
<p>좌변 동류항 정리: $-x+13=4$</p>
<p>이항: $-x=4-13=-9$ → 양변에 $-1$ 을 곱해서 $x=9$</p>
<p>검산: $5\times(9+2)-3\times(18-1)=55-51=4$ ✓</p>
<p><strong>답: $x=9$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (음수 계수)</strong>
<p class="exq">$-3(x-2)=2x+11$ 을 푸세요.</p>
<div class="exa">
<p>괄호를 풀면 $-3x+6=2x+11$ ($-3$ 을 상수항 $-2$ 에도 곱했어요)</p>
<p>이항: $-3x-2x=11-6$ → $-5x=5$</p>
<p>양변을 $-5$ 로 나누면 $x=-1$</p>
<p>검산: 좌변 $-3\times(-1-2)=9$, 우변 $2\times(-1)+11=9$ ✓</p>
<p><strong>답: $x=-1$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (같은 항이 약분되는 경우)</strong>
<p class="exq">$4x-3(x+2)=-1$ 을 푸세요.</p>
<div class="exa">
<p>$4x-3x-6=-1$ → $x-6=-1$ → $x=5$</p>
<p>검산: $4\times5-3\times7=20-21=-1$ ✓</p>
<p><strong>답: $x=5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (두 방정식의 해가 같을 때)</strong>
<p class="exq">두 방정식 $2x+a=x+5$ 와 $3x-1=8$ 의 해가 같을 때, 상수 $a$ 의 값을 구하세요.</p>
<div class="exa">
<p>해를 알 수 있는 쪽부터 풀어요. $3x-1=8\Rightarrow3x=9\Rightarrow x=3$</p>
<p>$x=3$ 을 다른 식에 넣어요. $2\times3+a=3+5$ → $6+a=8$</p>
<p>$a=2$</p>
<p>검산: $2x+2=x+5$ 를 풀면 $x=3$ ✓</p>
<p><strong>답: $a=2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (해에서 상수 구하기)</strong>
<p class="exq">방정식 $2x+m=5x-1$ 의 해가 $x=2$ 일 때, 상수 $m$ 의 값을 구하세요.</p>
<div class="exa">
<p>$x=2$ 를 방정식에 넣으면 $2\times2+m=5\times2-1$ → $4+m=9$</p>
<p>$m=5$</p>
<p>검산: $2x+5=5x-1$ 에서 $6=3x$, $x=2$ ✓</p>
<p><strong>답: $m=5$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>괄호 앞에 음수가 있는데 <strong>첫 항에만</strong> 곱하기: $-3(x-2)=-3x-6$ ✗ → $-3x+6$ ✓</li>
<li>이항 후 $-5x=5$ 에서 $x=5$ 로 쓰기 ✗ → 계수 $-5$ 로 나눠서 $x=-1$ ✓</li>
<li>$3x=12$ 에서 $x=12-3$ 으로 계산하기 ✗ → 곱해진 수는 <strong>나눠야</strong> 해요. $x=12\div3=4$ ✓</li>
<li>이항하기 전에 동류항을 정리하다 항을 빠뜨리기. 하나씩 줄을 바꿔서 차분히 써 보세요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>계수가 음수일 때는 양변에 $-1$ 을 곱해서</strong> $x$ 의 계수를 양수로 만들면 실수가 줄어요.</p>
<div class="formula">$$-x=-9\ \Rightarrow\ x=9,\qquad -5x=5\ \Rightarrow\ x=-1$$</div>
<ul>
<li>식을 풀 때 <strong>등호를 세로로 맞춰 쓰면</strong> 한 줄씩 변하는 과정이 보여서 실수가 줄어요.</li>
<li>$x$ 항이 양변에 있으면 <strong>계수가 큰 쪽의 $x$ 항을 그대로 두는 쪽</strong>으로 이항하면 음수 계수가 덜 나와요.</li>
<li>해가 소수나 분수여도 놀라지 마세요. $x=\dfrac{b}{a}$ 가 기약분수가 되도록 약분만 해 주면 돼요.</li>
</ul>`
      },

      /* ───────── 2. 분수·소수 계수, 비례식 ───────── */
      {
        title: '분수·소수 계수의 방정식과 비례식',
        body: r`
<p class="lead-line">분수나 소수가 있으면 계산이 까다로워요. 그럴 땐 <strong>양변에 적당한 수를 곱해서 계수를 모두 정수로</strong> 바꿔 주면 간단해져요.</p>

<div class="def"><strong class="label">개념 ① 분수가 있는 방정식</strong>
<p>양변에 <strong>분모들의 최소공배수</strong>를 곱해 분모를 없애요. 이때 <strong>정수인 항에도 빠짐없이</strong> 곱해야 해요.</p>
<div class="formula">$$\frac x2+\frac x3=5\ \xrightarrow{\ \times6\ }\ 3x+2x=30$$</div>
</div>

<div class="def"><strong class="label">개념 ② 소수가 있는 방정식</strong>
<p>양변에 $10,\ 100,\ 1000$ 을 곱해서 소수를 정수로 만들어요. 소수점 아래 자릿수가 가장 많은 쪽에 맞춰요.</p>
<div class="formula">$$0.3x-0.5=0.1x+0.7\ \xrightarrow{\ \times10\ }\ 3x-5=x+7$$</div>
</div>

<div class="def"><strong class="label">개념 ③ 비례식을 포함한 방정식</strong>
<p>비례식 $a:b=c:d$ 에서 바깥쪽 두 항(<strong>외항</strong>) $a,\ d$ 의 곱과 안쪽 두 항(<strong>내항</strong>) $b,\ c$ 의 곱은 같아요.</p>
<div class="formula">$$a:b=c:d\ \Rightarrow\ ad=bc$$</div>
</div>

<div class="why"><strong class="label">왜 "외항의 곱 $=$ 내항의 곱"일까?</strong>
<p>$a:b=c:d$ 는 $\dfrac ab=\dfrac cd$ 와 같은 말이에요. 양변에 $bd$ 를 곱하면 $\dfrac ab\times bd=\dfrac cd\times bd$ 에서 $ad=bc$ 가 나와요. 비례식은 결국 분수 방정식이라서 같은 방법이 통해요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (분수 계수)</strong>
<p class="exq">$\dfrac x2+\dfrac x3=5$ 를 푸세요.</p>
<div class="exa">
<p>$2$ 와 $3$ 의 최소공배수는 $6$. 양변에 $6$ 을 곱해요.</p>
<p>$6\times\dfrac x2+6\times\dfrac x3=6\times5$ → $3x+2x=30$ → $5x=30$ → $x=6$</p>
<p>검산: $\dfrac62+\dfrac63=3+2=5$ ✓</p>
<p><strong>답: $x=6$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (정수항에도 곱하기)</strong>
<p class="exq">$\dfrac{x+1}{2}=\dfrac{x-1}{3}+1$ 을 푸세요.</p>
<div class="exa">
<p>양변에 $6$ 을 곱해요. 우변의 $1$ 에도 곱해야 해요! $3(x+1)=2(x-1)+6$</p>
<p>괄호를 풀면 $3x+3=2x-2+6=2x+4$</p>
<p>이항: $3x-2x=4-3$ → $x=1$</p>
<p>검산: 좌변 $\dfrac22=1$, 우변 $\dfrac03+1=1$ ✓</p>
<p><strong>답: $x=1$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (소수 계수)</strong>
<p class="exq">$0.3x-0.5=0.1x+0.7$ 을 푸세요.</p>
<div class="exa">
<p>소수 첫째 자리까지 있으므로 양변에 $10$ 을 곱해요. $3x-5=x+7$</p>
<p>$3x-x=7+5$ → $2x=12$ → $x=6$</p>
<p>검산: 좌변 $0.3\times6-0.5=1.8-0.5=1.3$, 우변 $0.1\times6+0.7=1.3$ ✓</p>
<p><strong>답: $x=6$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (소수 둘째 자리)</strong>
<p class="exq">$0.25x-0.1=0.15x+0.3$ 을 푸세요.</p>
<div class="exa">
<p>소수 둘째 자리까지 있으므로 양변에 $100$ 을 곱해요. $25x-10=15x+30$</p>
<p>$10x=40$ → $x=4$</p>
<p>검산: 좌변 $0.25\times4-0.1=0.9$, 우변 $0.15\times4+0.3=0.9$ ✓</p>
<p><strong>답: $x=4$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (소수와 분수가 섞인 경우)</strong>
<p class="exq">$0.3x-\dfrac12=\dfrac x5$ 를 푸세요.</p>
<div class="exa">
<p>$0.3x=\dfrac{3}{10}x$ 이므로 분모의 최소공배수는 $10$. 양변에 $10$ 을 곱해요.</p>
<p>$3x-5=2x$ → $x=5$</p>
<p>검산: 좌변 $0.3\times5-0.5=1$, 우변 $\dfrac55=1$ ✓</p>
<p><strong>답: $x=5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (비례식)</strong>
<p class="exq">(1) $x:6=4:3$ 을 푸세요. (2) $(x+2):5=(x+1):4$ 를 푸세요.</p>
<div class="exa">
<p>(1) 외항의 곱 $=$ 내항의 곱: $3x=24$ → $x=8$</p>
<p>(2) $4(x+2)=5(x+1)$ → $4x+8=5x+5$ → $x=3$</p>
<p>검산 (2): $5:5=4:4$ ✓</p>
<p><strong>답: (1) $x=8$ (2) $x=3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (비율이 같다는 조건)</strong>
<p class="exq">$(x+1):(x-1)=3:1$ 일 때 $x$ 의 값을 구하세요.</p>
<div class="exa">
<p>외항의 곱 $=$ 내항의 곱: $(x+1)\times1=3(x-1)$</p>
<p>$x+1=3x-3$ → $4=2x$ → $x=2$</p>
<p>검산: $3:1=3:1$ ✓</p>
<p><strong>답: $x=2$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>분모를 없애려고 곱할 때 <strong>정수 항에는 곱하지 않기</strong>: $\dfrac{x+1}{2}=\dfrac{x-1}{3}+1$ 에서 $3(x+1)=2(x-1)+1$ ✗ → $+6$ ✓</li>
<li>분자가 두 항일 때 <strong>괄호</strong>를 안 치기: $6\times\dfrac{x-1}{3}=2x-1$ ✗ → $2(x-1)$ ✓</li>
<li>소수와 정수가 섞였을 때 소수에만 $10$ 곱하고 정수에는 곱하지 않기</li>
<li>비례식에서 외항·내항을 헷갈려 <strong>대각선이 아닌 위치</strong>끼리 곱하기</li>
</ul>
</div>`,
        tip: r`
<p><strong>분모가 여러 개면 최소공배수!</strong> 최소공배수를 곱하면 한 번에 모든 분모가 사라져요. (너무 큰 수를 곱해도 정답은 같지만 계산이 힘들어져요.)</p>
<ul>
<li>소수 → 분수가 쉽게 보이면(예: $0.5=\dfrac12$) 분수로 바꿔서 같은 분모를 만들어도 좋아요.</li>
<li>$(x+a)/p=(cx+d)/q$ 꼴은 <strong>가위질(교차곱)</strong>: $q(x+a)=p(cx+d)$ 로 바로 정리해도 같은 결과예요.</li>
<li>분수 방정식에서 계산이 틀리지 않았는지 확인하는 가장 빠른 방법은 <strong>$x$ 를 원래 식에 넣어 양변이 같은지 보는 것</strong>이에요.</li>
</ul>`
      },

      /* ───────── 3. 일차방정식의 활용 ───────── */
      {
        title: '일차방정식의 활용',
        body: r`
<p class="lead-line">문장으로 된 문제를 <strong>식으로 번역</strong>하는 것이 핵심이에요. "구하려는 것을 $x$ 로 놓고, 같은 것 두 개를 찾아서 $=$ 로 연결"하세요.</p>

<div class="def"><strong class="label">풀이 5단계</strong>
<ol>
<li><strong>미지수 정하기</strong>: 구하려는 것을 $x$ 로 놓는다. (단위를 같이 생각하기)</li>
<li><strong>방정식 세우기</strong>: 문제에서 <strong>같은 양을 두 가지로 나타내</strong> 등호로 연결한다.</li>
<li><strong>방정식 풀기</strong>.</li>
<li><strong>검토하기</strong>: 구한 해가 문제의 조건(자연수, 양수, 정수 등)에 맞는지 확인한다.</li>
<li><strong>답 쓰기</strong>: 단위와 함께.</li>
</ol>
</div>

<div class="def"><strong class="label">자주 나오는 관계식</strong>
<table>
<tr><th>유형</th><th>핵심 관계</th></tr>
<tr><td>어떤 수</td><td>"어떤 수의 3배에서 5를 뺀 수" $\Rightarrow 3x-5$</td></tr>
<tr><td>물건값</td><td>(단가) $\times$ (개수) 의 합 $=$ 전체 금액</td></tr>
<tr><td>나이</td><td>$x$ 년 후: (현재 나이) $+\ x$</td></tr>
<tr><td>과부족</td><td>학생 수 $x$ 에 대해 (나누어 준 수) $+$ 남은 수 $=$ 전체</td></tr>
<tr><td>도형</td><td>둘레·넓이 공식</td></tr>
<tr><td>거리·속력·시간</td><td>$\text{거리}=\text{속력}\times\text{시간},\ \text{시간}=\dfrac{\text{거리}}{\text{속력}}$</td></tr>
<tr><td>일의 양</td><td>전체 일의 양을 $1$ 로 놓고 하루에 하는 일의 양을 분수로</td></tr>
<tr><td>원가·정가</td><td>정가 $=$ 원가 $\times\left(1+\dfrac{p}{100}\right)$, 할인가 $=$ 정가 $\times\left(1-\dfrac{q}{100}\right)$</td></tr>
</table>
</div>

<div class="ex"><strong class="label">예시 1 (어떤 수)</strong>
<p class="exq">어떤 수의 $3$ 배에서 $5$ 를 뺀 값이 $16$ 이에요. 어떤 수를 구하세요.</p>
<div class="exa">
<p>어떤 수를 $x$ 라 하면 $3x-5=16$</p>
<p>$3x=21$ → $x=7$</p>
<p>검산: $3\times7-5=16$ ✓</p>
<p><strong>답: $7$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (물건값)</strong>
<p class="exq">한 자루에 $500$ 원인 연필 $x$ 자루와 한 개에 $300$ 원인 지우개 $4$ 개를 샀더니 모두 $3700$ 원이었어요. 연필은 몇 자루를 샀나요?</p>
<div class="exa">
<p>$500x+300\times4=3700$ → $500x+1200=3700$</p>
<p>$500x=2500$ → $x=5$</p>
<p>검산: $500\times5+1200=3700$ ✓</p>
<p><strong>답: $5$ 자루</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (나이)</strong>
<p class="exq">현재 아버지의 나이는 $42$ 세, 아들의 나이는 $12$ 세예요. 몇 년 후에 아버지의 나이가 아들의 나이의 $3$ 배가 될까요?</p>
<div class="exa">
<p>$x$ 년 후라 하면 아버지 $42+x$, 아들 $12+x$ 이므로 $42+x=3(12+x)$</p>
<p>$42+x=36+3x$ → $6=2x$ → $x=3$</p>
<p>검산: $3$ 년 후 아버지 $45$ 세, 아들 $15$ 세 → $45=3\times15$ ✓</p>
<p><strong>답: $3$ 년 후</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (과부족)</strong>
<p class="exq">학생들에게 공책을 $3$ 권씩 나누어 주면 $8$ 권이 남고, $5$ 권씩 나누어 주면 $4$ 권이 부족해요. 학생 수를 구하세요.</p>
<div class="exa">
<p>학생 수를 $x$ 명이라 하고, 전체 공책 수를 두 가지로 나타내요.</p>
<p>$3x+8=5x-4$ (남으면 더하고, 부족하면 빼요)</p>
<p>$12=2x$ → $x=6$</p>
<p>검산: 공책 $3\times6+8=26$ 권, $5\times6-4=26$ 권 ✓</p>
<p><strong>답: $6$ 명</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (도형)</strong>
<p class="exq">가로의 길이가 세로의 길이보다 $4$ cm 더 긴 직사각형의 둘레의 길이가 $36$ cm 일 때, 가로의 길이를 구하세요.</p>
<div class="exa">
<p>세로를 $x$ cm 라 하면 가로는 $(x+4)$ cm. 둘레: $2\{x+(x+4)\}=36$</p>
<p>$2(2x+4)=36$ → $4x+8=36$ → $x=7$</p>
<p>세로 $7$ cm, 가로는 $7+4=11$ cm. 검산: $2(7+11)=36$ ✓</p>
<p><strong>답: $11$ cm</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (같은 개수)</strong>
<p class="exq">한 개에 $300$ 원인 과자와 한 개에 $200$ 원인 사탕을 같은 개수만큼 샀더니 $2500$ 원이었어요. 과자는 몇 개 샀나요?</p>
<div class="exa">
<p>같은 개수를 $x$ 라 하면 $300x+200x=2500$ → $500x=2500$ → $x=5$</p>
<p><strong>답: $5$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (속력: 왕복)</strong>
<p class="exq">등산을 하는데 올라갈 때는 시속 $2$ km, 내려올 때는 같은 길을 시속 $3$ km 로 걸어서 모두 $5$ 시간이 걸렸어요. 올라간 거리를 구하세요.</p>
<div class="exa">
<p>올라간 거리를 $x$ km 라 하면 시간 $=\dfrac{\text{거리}}{\text{속력}}$ 이므로</p>
<p>올라갈 때 $\dfrac x2$ 시간, 내려올 때 $\dfrac x3$ 시간 → $\dfrac x2+\dfrac x3=5$</p>
<p>양변에 $6$ 을 곱하면 $3x+2x=30$ → $x=6$</p>
<p>검산: $\dfrac62+\dfrac63=3+2=5$ ✓</p>
<p><strong>답: $6$ km</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (일의 양)</strong>
<p class="exq">어떤 일을 하는 데 갑은 $6$ 일, 을은 $3$ 일이 걸려요. 두 사람이 함께 하면 며칠이 걸리나요?</p>
<div class="exa">
<p>전체 일의 양을 $1$ 이라 하면 하루에 갑은 $\dfrac16$, 을은 $\dfrac13$ 만큼 해요.</p>
<p>함께 $x$ 일 걸린다고 하면 $\left(\dfrac16+\dfrac13\right)x=1$ → $\dfrac12x=1$ → $x=2$</p>
<p><strong>답: $2$ 일</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (원가·정가)</strong>
<p class="exq">원가가 $x$ 원인 물건에 $30\%$ 의 이익을 붙여 정가를 정하고, 정가에서 $2000$ 원을 할인하여 팔았더니 원가의 $10\%$ 의 이익이 생겼어요. 원가를 구하세요.</p>
<div class="exa">
<p>정가 $=x\left(1+\dfrac{30}{100}\right)=1.3x$ (원)</p>
<p>판매 가격 $=1.3x-2000$, 이것이 원가의 $1.1$ 배이므로 $1.3x-2000=1.1x$</p>
<p>$0.2x=2000$ → $x=10000$</p>
<p>검산: 정가 $13000$ 원, 판매 $11000$ 원 $=10000\times1.1$ ✓</p>
<p><strong>답: $10000$ 원</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (마주 보고 출발)</strong>
<p class="exq">$840$ m 떨어진 두 지점에서 철수와 영희가 서로 마주 보고 동시에 출발해요. 철수는 분속 $60$ m, 영희는 분속 $80$ m 로 걸을 때, 두 사람은 몇 분 후에 만나나요?</p>
<div class="exa">
<p>만날 때까지 $x$ 분이 걸린다고 하면 철수가 간 거리 $60x$, 영희가 간 거리 $80x$.</p>
<p>둘이 간 거리의 합이 $840$ m 이므로 $60x+80x=840$ → $140x=840$ → $x=6$</p>
<p>검산: $60\times6+80\times6=360+480=840$ ✓</p>
<p><strong>답: $6$ 분 후</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 11 (따라잡기)</strong>
<p class="exq">동생이 분속 $50$ m 로 집을 출발한 지 $10$ 분 후에 형이 같은 길을 분속 $75$ m 로 따라갔어요. 형이 출발한 지 몇 분 후에 동생을 만날까요?</p>
<div class="exa">
<p>형이 출발한 지 $x$ 분 후에 만난다고 하면 형이 간 거리는 $75x$, 동생은 $(x+10)$ 분 동안 걸었으니 $50(x+10)$.</p>
<p>같은 지점에서 만나므로 $75x=50(x+10)$ → $75x=50x+500$ → $25x=500$ → $x=20$</p>
<p>검산: 형 $75\times20=1500$ m, 동생 $50\times30=1500$ m ✓</p>
<p><strong>답: $20$ 분 후</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>미지수를 정할 때 <strong>무엇을 $x$ 로 놓았는지 쓰지 않아서</strong> 답을 구할 때 헷갈리기 (예: $x$ 가 세로인데 가로를 답으로 쓰기)</li>
<li>속력·시간·거리의 <strong>단위 통일</strong>을 하지 않기: 분과 시간, m 와 km 를 섞지 마세요.</li>
<li>과부족에서 <strong>남을 때와 부족할 때의 부호</strong>를 반대로 쓰기</li>
<li>구한 해가 <strong>자연수가 아닌데도</strong> (예: $2.5$ 명) 답으로 쓰기. 검토 단계를 빼먹지 마세요.</li>
<li>비율($\%$)을 소수로 바꿀 때 실수하기: $30\%=0.3$, $5\%=0.05$</li>
</ul>
</div>`,
        tip: r`
<p><strong>"같은 것 두 개 찾기"</strong>가 방정식의 열쇠예요.</p>
<ul>
<li>과부족: <strong>전체 개수를 두 방법으로</strong> 나타내기</li>
<li>마주 보고 출발: <strong>간 거리의 합 $=$ 전체 거리</strong></li>
<li>따라잡기: <strong>두 사람이 간 거리 $=$ 같다</strong></li>
<li>왕복: <strong>가는 시간 $+$ 오는 시간 $=$ 전체 시간</strong>, 또는 거리가 같다</li>
<li>일의 양: <strong>(한 사람이 하루에 하는 일의 양) $\times$ (일한 날수) 의 합 $=1$</strong></li>
</ul>
<p>표를 그려서 정리하면 식 세우기가 훨씬 쉬워져요.</p>
<table>

<table>

<div class="ex"><strong class="label">예시 1 (한꺼번에 나오는 유형)</strong>

<div class="warn"><strong class="label">자주 하는 실수</strong>

(function () {

    id: 'coordinate', no: 5, part: '좌표평면과 그래프', title: '좌표평면과 그래프',
    summary: '순서쌍과 좌표평면, 그래프 읽기, 정비례 y=ax 와 반비례 y=a/x',
    sections: [
      /* ───────── 0. 순서쌍과 좌표평면 ───────── */
      {
        title: '순서쌍과 좌표평면',
        body: r`
<p class="lead-line">좌표는 "주소"예요. $x$ 좌표(가로)를 먼저, $y$ 좌표(세로)를 나중에 쓴 $(x,\ y)$ 만 알면 평면 위의 어떤 점도 정확히 찾을 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<p>영화관에서 "C열 7번"이라고 하면 좌석이 딱 한 곳으로 정해지죠? 평면 위의 점도 두 수를 짝지어 위치를 말할 수 있어요.</p>
<ul>
<li><strong>순서쌍</strong>: 순서를 생각해서 두 수를 짝지어 $(a,\ b)$ 로 나타낸 것. 순서가 중요해서 $(2,\ 5)$ 와 $(5,\ 2)$ 는 서로 <strong>다른</strong> 점이에요.</li>
<li><strong>좌표축</strong>: 가로로 놓인 수직선을 <strong>$x$ 축</strong>, 세로로 놓인 수직선을 <strong>$y$ 축</strong>이라 하고, 두 축이 만나는 점을 <strong>원점</strong> $O$ 라 해요. 원점의 좌표는 $(0,\ 0)$ 이에요.</li>
<li><strong>좌표평면</strong>: 좌표축이 그려져 있는 평면.</li>
<li><strong>점의 좌표</strong>: 점 $P$ 에서 $x$ 축에 수직으로 내린 선이 가리키는 수 $a$ 를 $x$ 좌표, $y$ 축에 수직으로 내린 선이 가리키는 수 $b$ 를 $y$ 좌표라 하고, $P(a,\ b)$ 로 써요.</li>
</ul>
</div>

<div class="def"><strong class="label">사분면</strong>
<p>좌표축은 좌표평면을 <strong>네 부분</strong>으로 나눠요. 오른쪽 위부터 반시계 방향으로 제1, 2, 3, 4 사분면이라 불러요. <strong>좌표축 위의 점은 어느 사분면에도 속하지 않아요.</strong></p>
</div>

<svg viewBox="0 0 240 220" width="260" role="img" aria-label="네 사분면과 각 사분면에서 x, y 좌표의 부호" style="display:block;margin:10px auto;color:inherit">
<line x1="10" y1="110" x2="230" y2="110" stroke="currentColor" stroke-width="1.6"/>
<line x1="120" y1="10" x2="120" y2="210" stroke="currentColor" stroke-width="1.6"/>
<polygon points="230,110 222,106 222,114" fill="currentColor"/>
<polygon points="120,10 116,18 124,18" fill="currentColor"/>
<text x="232" y="126" font-size="13" fill="currentColor">x</text>
<text x="126" y="16" font-size="13" fill="currentColor">y</text>
<text x="106" y="124" font-size="12" fill="currentColor">O</text>
<text x="170" y="60" font-size="13" text-anchor="middle" fill="currentColor">제1사분면</text>
<text x="170" y="78" font-size="12" text-anchor="middle" fill="currentColor">(+, +)</text>
<text x="70" y="60" font-size="13" text-anchor="middle" fill="currentColor">제2사분면</text>
<text x="70" y="78" font-size="12" text-anchor="middle" fill="currentColor">(−, +)</text>
<text x="70" y="160" font-size="13" text-anchor="middle" fill="currentColor">제3사분면</text>
<text x="70" y="178" font-size="12" text-anchor="middle" fill="currentColor">(−, −)</text>
<text x="170" y="160" font-size="13" text-anchor="middle" fill="currentColor">제4사분면</text>
<text x="170" y="178" font-size="12" text-anchor="middle" fill="currentColor">(+, −)</text>
</svg>

<div class="formula">
$$\text{제1사분면: } x\gt0,\ y\gt0\qquad \text{제2사분면: } x\lt0,\ y\gt0$$
$$\text{제3사분면: } x\lt0,\ y\lt0\qquad \text{제4사분면: } x\gt0,\ y\lt0$$
$$x\text{ 축 위의 점: } (a,\ 0)\qquad y\text{ 축 위의 점: } (0,\ b)$$
</div>
<ul>
<li>$x$ 축 위의 점은 높이가 $0$ 이라 $y$ 좌표가 $0$, $y$ 축 위의 점은 $x$ 좌표가 $0$ 이에요. 헷갈리면 "$x$ 축 위에 있으면 $y=0$" 이라고 외우세요.</li>
</ul>

<div class="def"><strong class="label">대칭이동</strong>
<p>점을 "거울"에 비춘 점의 좌표는 규칙이 아주 간단해요. <strong>바뀌는 것만</strong> 부호가 바뀌어요.</p>
<table>
<tr><th>대칭의 기준</th><th>점 $(a,\ b)$ 의 대칭점</th><th>바뀌는 것</th></tr>
<tr><td>$x$ 축</td><td>$(a,\ -b)$</td><td>$y$ 좌표의 부호</td></tr>
<tr><td>$y$ 축</td><td>$(-a,\ b)$</td><td>$x$ 좌표의 부호</td></tr>
<tr><td>원점</td><td>$(-a,\ -b)$</td><td>둘 다</td></tr>
</table>
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p>$x$ 축을 거울이라고 생각해 봐요. 거울에 비친 점은 거울에서 같은 거리만큼 반대쪽에 있어요. 그러니 가로 위치($x$ 좌표)는 그대로이고, 세로 위치만 위아래가 뒤집혀서 $y$ 좌표의 부호가 바뀌어요. 원점에 대한 대칭은 $x$ 축 대칭을 한 뒤 $y$ 축 대칭을 또 한 것과 같아서 두 부호가 모두 바뀌고요.</p>
</div>

<div class="def"><strong class="label">거리와 넓이 구하기</strong>
<ul>
<li>두 점의 $y$ 좌표가 같으면 (가로 선) 거리 $=|x\text{ 좌표의 차}|$, $x$ 좌표가 같으면 (세로 선) 거리 $=|y\text{ 좌표의 차}|$.</li>
<li>점 $(a,\ b)$ 에서 <strong>$x$ 축까지의 거리는 $|b|$</strong>, <strong>$y$ 축까지의 거리는 $|a|$</strong> 예요. (축까지의 거리는 "<em>다른 쪽</em>" 좌표의 절댓값!)</li>
<li>변이 좌표축에 평행한 도형은 <strong>가로·세로 길이</strong>를 좌표의 차로 구해서 넓이 공식을 쓰면 돼요.</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1 (사분면 찾기)</strong>
<p class="exq">점 $(3,\ -2)$ 는 제몇 사분면 위의 점인가요?</p>
<div class="exa">
<p>$x=3\gt0$, $y=-2\lt0$ 이므로 부호가 $(+,\ -)$ 예요.</p>
<p><strong>답: 제4사분면</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (축 위의 점)</strong>
<p class="exq">점 $(0,\ -5)$ 는 어느 축 위의 점인가요?</p>
<div class="exa">
<p>$x$ 좌표가 $0$ 이면 옆으로 움직이지 않고 세로로만 이동한 점이므로 $y$ 축 위에 있어요.</p>
<p><strong>답: $y$ 축 (어느 사분면에도 속하지 않아요)</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (대칭이동)</strong>
<p class="exq">점 $P(-4,\ 3)$ 을 $x$ 축, $y$ 축, 원점에 대하여 대칭이동한 점의 좌표를 각각 구하세요.</p>
<div class="exa">
<p>$x$ 축 대칭: $y$ 좌표의 부호만 바꿔요 → $(-4,\ -3)$</p>
<p>$y$ 축 대칭: $x$ 좌표의 부호만 바꿔요 → $(4,\ 3)$</p>
<p>원점 대칭: 둘 다 바꿔요 → $(4,\ -3)$</p>
<p><strong>답: $(-4,\ -3)$, $(4,\ 3)$, $(4,\ -3)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (문자의 부호로 사분면 찾기)</strong>
<p class="exq">$a\gt0,\ b\lt0$ 일 때, 점 $(-a,\ ab)$ 는 제몇 사분면 위의 점인가요?</p>
<div class="exa">
<p>$a\gt0$ 이므로 $-a\lt0$ 이에요. 그리고 (양수)$\times$(음수)는 음수라서 $ab\lt0$ 이에요.</p>
<p>점의 부호는 $(-,\ -)$ 이므로 제3사분면이에요.</p>
<p><strong>답: 제3사분면</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (대칭이동에서 미지수 구하기)</strong>
<p class="exq">점 $(a,\ -2)$ 를 $y$ 축에 대하여 대칭이동한 점이 $(5,\ b)$ 일 때, $a+b$ 의 값을 구하세요.</p>
<div class="exa">
<p>$y$ 축 대칭은 $x$ 좌표의 부호만 바꾸므로 $(a,\ -2)\to(-a,\ -2)$ 예요.</p>
<p>$(-a,\ -2)=(5,\ b)$ 이므로 $-a=5$, 즉 $a=-5$ 이고 $b=-2$ 예요.</p>
<p>$a+b=-5+(-2)=-7$</p>
<p><strong>답: $-7$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (거리)</strong>
<p class="exq">두 점 $A(-3,\ 2)$, $B(4,\ 2)$ 사이의 거리와, 점 $C(-6,\ 4)$ 에서 $x$ 축, $y$ 축까지의 거리를 각각 구하세요.</p>
<div class="exa">
<p>두 점의 $y$ 좌표가 같으므로 $x$ 좌표의 차를 구해요. $|-3-4|=7$</p>
<p>점 $C$ 에서 $x$ 축까지의 거리는 $|y\text{ 좌표}|=|4|=4$, $y$ 축까지의 거리는 $|x\text{ 좌표}|=|-6|=6$ 이에요.</p>
<p><strong>답: $\overline{AB}=7$, $x$ 축까지 $4$, $y$ 축까지 $6$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (직사각형의 꼭짓점)</strong>
<p class="exq">세 점 $A(-2,\ 1)$, $B(3,\ 1)$, $C(3,\ 4)$ 를 꼭짓점으로 하고 변이 좌표축에 평행한 직사각형 $ABCD$ 의 꼭짓점 $D$ 의 좌표를 구하세요.</p>
<div class="exa">
<p>$A$ 와 $B$ 의 $y$ 좌표가 같아서 $\overline{AB}$ 는 가로 변이고, $B$ 와 $C$ 의 $x$ 좌표가 같아서 $\overline{BC}$ 는 세로 변이에요.</p>
<p>$D$ 는 $A$ 와 같은 $x$ 좌표($-2$), $C$ 와 같은 $y$ 좌표($4$)를 가져요.</p>
<p><strong>답: $D(-2,\ 4)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (삼각형의 넓이)</strong>
<p class="exq">세 점 $A(1,\ 1)$, $B(5,\ 1)$, $C(3,\ 6)$ 을 꼭짓점으로 하는 삼각형 $ABC$ 의 넓이를 구하세요.</p>
<div class="exa">
<p>$A$ 와 $B$ 의 $y$ 좌표가 같으니 $\overline{AB}$ 를 밑변으로 잡으면 길이는 $|1-5|=4$ 예요.</p>
<p>높이는 $C$ 에서 직선 $AB$ 까지의 거리 $|6-1|=5$ 예요.</p>
<p>넓이 $=\dfrac12\times4\times5=10$</p>
<p><strong>답: $10$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (사다리꼴의 넓이)</strong>
<p class="exq">네 점 $A(-1,\ 0)$, $B(5,\ 0)$, $C(4,\ 3)$, $D(0,\ 3)$ 을 꼭짓점으로 하는 사각형 $ABCD$ 의 넓이를 구하세요.</p>
<div class="exa">
<p>$\overline{AB}$ 와 $\overline{DC}$ 는 $x$ 축에 평행해요. 아랫변 $\overline{AB}=|-1-5|=6$, 윗변 $\overline{DC}=|0-4|=4$ 이에요.</p>
<p>높이는 두 변의 $y$ 좌표의 차 $3-0=3$ 이에요.</p>
<p>넓이 $=\dfrac12\times(6+4)\times3=15$</p>
<p><strong>답: $15$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$(a,\ b)$ 의 순서를 바꿔 쓰는 것. <strong>$x$ 먼저, $y$ 나중</strong>이에요. ("가로로 먼저 가고 세로로 올라간다.")</li>
<li>축 위의 점을 사분면에 넣는 것. $(3,\ 0)$ 은 $x$ 축 위의 점이지 제1사분면이 아니에요.</li>
<li>거리를 구할 때 부호를 그대로 빼서 음수가 나오는 것. 거리는 <strong>절댓값</strong>(항상 $0$ 이상)이에요.</li>
<li>"$x$ 축까지의 거리"를 $x$ 좌표로 착각하는 것. $x$ 축까지의 거리는 <strong>$y$ 좌표의 절댓값</strong>이에요.</li>
<li>$x$ 축 대칭과 $y$ 축 대칭의 부호를 거꾸로 바꾸는 것.</li>
</ul>
</div>`,
        tip: r`
<p><strong>대칭이동은 "무엇이 변하지 않는지" 부터 보세요.</strong> $x$ 축에 대한 대칭에서는 점이 위아래로만 뒤집히니 $x$ 좌표는 그대로예요. $y$ 축 대칭은 좌우로 뒤집히니 $y$ 좌표가 그대로예요.</p>
<p><strong>사분면 문제에서 문자의 부호가 주어지면</strong> 좌표의 부호를 표로 적어 보세요. 예를 들어 $a\gt0,\ b\lt0$ 이면 $a\to+$, $b\to-$, $-a\to-$, $-b\to+$, $ab\to-$, $\dfrac{a}{b}\to-$ 처럼 한 줄씩 정리하면 실수가 없어요.</p>
<p><strong>도형의 넓이</strong>는 좌표를 보고 "축에 평행한 변"을 먼저 찾으세요. 그 변을 밑변으로 잡으면 높이는 나머지 점의 좌표 차로 바로 나와요.</p>
<p><strong>두 번 대칭이동</strong>은 한 번에 정리할 수 있어요. $x$ 축 대칭 후 $y$ 축 대칭 $=$ 원점 대칭, 같은 축으로 두 번 대칭하면 제자리로 돌아와요.</p>`

      /* ───────── 1. 그래프의 해석 ───────── */
      {
        title: '그래프의 해석',
        body: r`
<p class="lead-line">그래프는 "그림으로 쓴 표"예요. 가로축은 보통 시간, 세로축은 거리나 양이고, <strong>선이 오르면 늘어나고, 평평하면 변화 없음, 내려가면 줄어든다</strong>고 읽으면 돼요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>변수</strong>: $x$, $y$ 처럼 여러 가지로 변하는 값을 나타내는 문자.</li>
<li>두 변수 $x$, $y$ 의 관계는 <strong>표, 순서쌍, 식, 그래프</strong>로 나타낼 수 있어요. 예를 들어 "시간 $x$ 분 동안 걸은 거리 $y$ m"가 $(0,\ 0),\ (1,\ 60),\ (2,\ 120)$ 이면 $x$ 가 $1$ 늘 때마다 $y$ 는 $60$ 씩 늘어요.</li>
<li><strong>그래프</strong>: 순서쌍 $(x,\ y)$ 를 좌표평면 위에 점으로 나타낸 것을 모두 모은 그림.</li>
</ul>
</div>

<div class="def"><strong class="label">그래프 읽는 법</strong>
<table>
<tr><th>그래프의 모양</th><th>뜻</th></tr>
<tr><td>오른쪽 위로 올라가는 선</td><td>시간이 지나면서 값이 <strong>증가</strong> (멀어진다, 물이 찬다)</td></tr>
<tr><td>$x$ 축에 평행한 선 (수평)</td><td>값이 <strong>변하지 않음</strong> (멈춰 있다, 쉬는 중)</td></tr>
<tr><td>오른쪽 아래로 내려가는 선</td><td>값이 <strong>감소</strong> (돌아온다, 물이 빠진다)</td></tr>
<tr><td>더 가파른 선</td><td>변하는 속도가 <strong>더 빠르다</strong> (속력이 크다)</td></tr>
</table>
</div>

<svg viewBox="0 0 260 170" width="300" role="img" aria-label="집에서 도서관까지 걸어가 쉬고 돌아오는 거리-시간 그래프" style="display:block;margin:10px auto;color:inherit">
<line x1="35" y1="140" x2="250" y2="140" stroke="currentColor" stroke-width="1.5"/>
<line x1="35" y1="140" x2="35" y2="12" stroke="currentColor" stroke-width="1.5"/>
<polyline points="35,140 80,50 150,50 195,140" fill="none" stroke="currentColor" stroke-width="2.4"/>
<line x1="35" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
<text x="30" y="54" font-size="11" text-anchor="end" fill="currentColor">300</text>
<text x="80" y="155" font-size="11" text-anchor="middle" fill="currentColor">5</text>
<text x="150" y="155" font-size="11" text-anchor="middle" fill="currentColor">15</text>
<text x="195" y="155" font-size="11" text-anchor="middle" fill="currentColor">18</text>
<text x="252" y="156" font-size="11" fill="currentColor">시간(분)</text>
<text x="40" y="12" font-size="11" fill="currentColor">거리(m)</text>
<text x="46" y="92" font-size="11" fill="currentColor">걸어감</text>
<text x="98" y="42" font-size="11" fill="currentColor">쉬는 중</text>
<text x="175" y="92" font-size="11" fill="currentColor">돌아옴</text>
</svg>

<div class="formula">
$$\text{속력}=\dfrac{\text{거리}}{\text{시간}}\qquad \text{평균 속력}=\dfrac{\text{전체 이동 거리}}{\text{전체 걸린 시간}}$$
$$\text{(일정하게 변하는 양)}=\text{처음 값}+\text{(1 단위당 변화량)}\times x$$
</div>
<ul>
<li>그래프에서 <strong>$x$ 가 $1$ 늘어날 때 $y$ 가 변하는 양</strong>은 속력(거리-시간 그래프), 물이 차는 빠르기(물의 양-시간 그래프)를 뜻해요.</li>
<li>쉬는 동안은 시간만 가고 거리는 그대로이므로 <strong>평균 속력을 구할 때 쉬는 시간도 전체 시간에 포함</strong>해요.</li>
</ul>

<div class="why"><strong class="label">왜 평평한 선이 "쉬는 중"일까?</strong>
<p>가로축이 시간, 세로축이 집에서부터의 거리라면, 시간이 흘러도($x$ 가 커져도) 거리($y$)가 그대로라는 건 제자리에 서 있다는 뜻이에요. 그래서 시간 축에 평행한 구간은 "멈춤"이에요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (표·순서쌍 읽기)</strong>
<p class="exq">시간 $x$ 시간과 걸은 거리 $y$ km 의 관계가 순서쌍 $(0,\ 0),\ (1,\ 3),\ (2,\ 6),\ (3,\ 9)$ 로 나타나 있어요. $x=2$ 일 때 $y$ 의 값과, $y=9$ 일 때 $x$ 의 값을 구하세요.</p>
<div class="exa">
<p>$x=2$ 인 순서쌍은 $(2,\ 6)$ 이므로 $y=6$.</p>
<p>$y=9$ 인 순서쌍은 $(3,\ 9)$ 이므로 $x=3$.</p>
<p><strong>답: $y=6$, $x=3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (물통에 물 채우기)</strong>
<p class="exq">처음에 $4\text{ L}$ 의 물이 들어 있는 물통에 매분 $3\text{ L}$ 씩 일정하게 물을 넣어요. $x$ 분 후 물의 양을 $y\text{ L}$ 라 할 때, $x=5$ 일 때 $y$ 의 값과, 물의 양이 $31\text{ L}$ 가 되는 때는 물을 넣은 지 몇 분 후인지 구하세요.</p>
<div class="exa">
<p>식: $y=4+3x$ (처음 양 $+$ 1분당 증가량 $\times$ 시간)</p>
<p>$x=5$ 이면 $y=4+3\times5=19$</p>
<p>$y=31$ 이면 $4+3x=31$, $3x=27$, $x=9$</p>
<p><strong>답: $19\text{ L}$, $9$ 분 후</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (도서관 다녀오기)</strong>
<p class="exq">집에서 분속 $60\text{ m}$ 로 걸어 $300\text{ m}$ 떨어진 도서관에 가서 $10$ 분을 머문 뒤, 분속 $100\text{ m}$ 로 같은 길을 걸어 집에 돌아왔어요. 집에서 출발한 지 몇 분 후에 집에 도착하나요?</p>
<div class="exa">
<p>가는 데 걸린 시간: $300\div60=5$ (분)</p>
<p>머문 시간: $10$ 분 (그래프에서 평평한 구간)</p>
<p>돌아오는 데 걸린 시간: $300\div100=3$ (분)</p>
<p>합: $5+10+3=18$</p>
<p><strong>답: $18$ 분 후</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (그래프에서 변화량 구하기)</strong>
<p class="exq">그래프가 두 점 $(2,\ 5)$, $(5,\ 14)$ 를 지나는 직선일 때, $x$ 가 $1$ 늘어날 때마다 $y$ 는 얼마씩 변하나요?</p>
<div class="exa">
<p>$x$ 는 $5-2=3$ 늘었고, $y$ 는 $14-5=9$ 늘었어요.</p>
<p>$x$ 가 $1$ 늘 때 $y$ 의 변화량 $=9\div3=3$</p>
<p><strong>답: $3$ 씩 증가</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (평균 속력)</strong>
<p class="exq">분속 $60\text{ m}$ 로 $4$ 분 걷고, 이어서 분속 $120\text{ m}$ 로 $2$ 분 걸었어요. 출발해서 $6$ 분 동안의 평균 속력은 분속 몇 m 인가요?</p>
<div class="exa">
<p>이동 거리: $60\times4+120\times2=240+240=480\text{ (m)}$</p>
<p>걸린 시간: $4+2=6$ (분)</p>
<p>평균 속력 $=480\div6=80$</p>
<p><strong>답: 분속 $80\text{ m}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (쉬는 시간이 있는 그래프)</strong>
<p class="exq">형은 분속 $50\text{ m}$ 로 먼저 출발했고, 동생은 $6$ 분 뒤에 같은 곳에서 같은 방향으로 분속 $80\text{ m}$ 로 따라가요. 동생이 형을 따라잡는 것은 동생이 출발한 지 몇 분 후인가요?</p>
<div class="exa">
<p>동생이 출발할 때 형은 이미 $50\times6=300\text{ (m)}$ 앞서 있어요.</p>
<p>1분마다 동생이 형보다 $80-50=30\text{ (m)}$ 씩 더 가까워져요.</p>
<p>따라잡는 시간 $=300\div30=10$ (분)</p>
<p><strong>답: $10$ 분 후</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>평평한 구간을 "계속 가고 있다"고 읽는 것. 평평하면 <strong>거리가 변하지 않으니 멈춰 있는 거예요</strong>.</li>
<li>평균 속력을 "속력들의 평균"으로 구하는 것. 평균 속력은 <strong>전체 거리 $\div$ 전체 시간</strong>이에요. (예시 5에서 $(60+120)\div2=90$ 이 아니에요.)</li>
<li>쉬는 시간을 빼고 시간을 계산하는 것.</li>
<li>가로축·세로축이 무엇을 나타내는지 확인하지 않고 읽는 것. 항상 축의 이름과 단위부터 보세요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>그래프 문제는 "꺾이는 점"의 좌표를 먼저 읽으세요.</strong> 꺾이는 점 사이는 모두 직선이라서, 구간마다 (거리 변화)$\div$(시간 변화)로 속력을 바로 구할 수 있어요.</p>
<p><strong>"일정하게 변한다"</strong>는 말이 나오면 식 $y=(\text{처음 값})+(\text{변화량})\times x$ 로 바꾸세요. 물이 줄어들면 변화량이 음수예요.</p>
<p><strong>따라잡기 문제</strong>는 "처음 간격 $\div$ 속력 차이"예요. 마주 보고 가며 만날 때는 "처음 간격 $\div$ 속력의 합"이고요.</p>`
      },

      /* ───────── 2. 정비례 y=ax ───────── */
      {
        title: '정비례 y=ax',
        body: r`
<p class="lead-line">$x$ 가 $2$ 배, $3$ 배가 되면 $y$ 도 $2$ 배, $3$ 배가 되는 관계가 <strong>정비례</strong>예요. 식은 $y=ax$ ($a\ne0$), 그래프는 <strong>원점을 지나는 직선</strong>이에요.</p>

<div class="def"><strong class="label">개념</strong>
<p>$x$ 의 값이 $2$ 배, $3$ 배, $4$ 배, $\cdots$ 가 될 때 $y$ 의 값도 $2$ 배, $3$ 배, $4$ 배, $\cdots$ 가 되는 관계를 "$y$ 는 $x$ 에 <strong>정비례</strong>한다"고 해요.</p>
<p>예) 한 개에 $500$ 원짜리 사탕 $x$ 개의 값 $y$ 원: $y=500x$. 사탕을 2배 사면 값도 2배죠.</p>
<ul>
<li>정비례 관계의 식은 $y=ax$ ($a$ 는 $0$ 이 아닌 상수)이고, $a$ 를 <strong>비례상수</strong>라 해요.</li>
<li>$\dfrac{y}{x}=a$ 로 일정해요. (그래서 $x\ne0$ 일 때 $y\div x$ 가 항상 같아요.)</li>
</ul>
</div>

<div class="formula">
$$y=ax\ (a\ne0)\qquad \Longleftrightarrow\qquad \dfrac{y}{x}=a\ (\text{일정})$$
$$\text{그래프가 점 }(p,\ q)\text{ 를 지나면 } a=\dfrac{q}{p}$$
</div>

<div class="def"><strong class="label">정비례 y=ax 의 그래프</strong>
<ul>
<li>항상 <strong>원점 $(0,\ 0)$ 을 지나는 직선</strong>이에요. ($x=0$ 이면 $y=0$)</li>
<li>$a\gt0$ 이면 <strong>제1사분면과 제3사분면</strong>을 지나고, 오른쪽 위로 올라가요. ($x$ 가 커지면 $y$ 도 커져요.)</li>
<li>$a\lt0$ 이면 <strong>제2사분면과 제4사분면</strong>을 지나고, 오른쪽 아래로 내려가요. ($x$ 가 커지면 $y$ 는 작아져요.)</li>
<li><strong>$|a|$ 가 클수록 $y$ 축에 가깝고 가팔라요.</strong> $|a|$ 가 작을수록 $x$ 축에 가까워요.</li>
</ul>
</div>

<svg viewBox="0 0 250 220" width="280" role="img" aria-label="정비례 y=2x, y=x, y=-x 의 그래프" style="display:block;margin:10px auto;color:inherit">
<line x1="10" y1="110" x2="240" y2="110" stroke="currentColor" stroke-width="1.4"/>
<line x1="125" y1="8" x2="125" y2="212" stroke="currentColor" stroke-width="1.4"/>
<line x1="150" y1="10" x2="100" y2="210" stroke="currentColor" stroke-width="2.2"/>
<line x1="35" y1="210" x2="215" y2="30" stroke="currentColor" stroke-width="2.2" stroke-dasharray="6 3"/>
<line x1="35" y1="30" x2="215" y2="190" stroke="currentColor" stroke-width="2.2" stroke-dasharray="2 3"/>
<text x="242" y="124" font-size="12" fill="currentColor">x</text>
<text x="130" y="16" font-size="12" fill="currentColor">y</text>
<text x="153" y="22" font-size="12" fill="currentColor">y=2x</text>
<text x="196" y="40" font-size="12" fill="currentColor">y=x</text>
<text x="38" y="26" font-size="12" fill="currentColor">y=−x</text>
</svg>

<div class="why"><strong class="label">왜 직선이고 원점을 지날까?</strong>
<p>$y=ax$ 에서 $x$ 가 $1$ 늘 때마다 $y$ 는 항상 $a$ 씩 변해요. 일정하게 변하니까 점들이 한 줄(직선)로 늘어서요. 그리고 $x=0$ 을 넣으면 $y=a\times0=0$ 이라 $(0,\ 0)$ 을 지나요.</p>
<p>$|a|$ 가 클수록 $x$ 가 $1$ 늘 때 $y$ 가 많이 변하니까 더 가파르고($y$ 축에 가깝고), $|a|$ 가 작으면 완만해서 $x$ 축에 가까워요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (식 구하기)</strong>
<p class="exq">$y$ 가 $x$ 에 정비례하고, $x=3$ 일 때 $y=12$ 예요. $y$ 를 $x$ 에 대한 식으로 나타내세요.</p>
<div class="exa">
<p>$y=ax$ 에 $x=3$, $y=12$ 를 넣으면 $12=3a$, 즉 $a=4$.</p>
<p><strong>답: $y=4x$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (값 구하기)</strong>
<p class="exq">정비례 관계 $y=-2x$ 에서 $x=5$ 일 때와 $x=-3$ 일 때 $y$ 의 값을 각각 구하세요.</p>
<div class="exa">
<p>$x=5$: $y=-2\times5=-10$</p>
<p>$x=-3$: $y=-2\times(-3)=6$</p>
<p><strong>답: $-10$, $6$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (그래프 위의 점으로 a 구하기)</strong>
<p class="exq">정비례 관계 $y=ax$ 의 그래프가 점 $(4,\ -12)$ 를 지날 때, 상수 $a$ 의 값을 구하세요.</p>
<div class="exa">
<p>그래프가 그 점을 지나면 좌표가 식을 만족해요. $-12=a\times4$ 이므로 $a=-3$.</p>
<p><strong>답: $-3$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (그래프의 모양)</strong>
<p class="exq">정비례 관계 $y=-\dfrac23x$ 의 그래프가 지나는 사분면을 모두 쓰고, $x$ 의 값이 커질 때 $y$ 의 값이 커지는지 작아지는지 말하세요.</p>
<div class="exa">
<p>$a=-\dfrac23\lt0$ 이므로 제2사분면과 제4사분면을 지나요.</p>
<p>오른쪽 아래로 내려가는 직선이라서 $x$ 가 커지면 $y$ 는 작아져요.</p>
<p><strong>답: 제2, 4사분면 / $y$ 는 작아진다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (어느 그래프가 x 축에 가까울까)</strong>
<p class="exq">세 정비례 관계 $y=2x$, $y=-3x$, $y=\dfrac12x$ 의 그래프 중 $x$ 축에 가장 가까운 것은 어느 것인가요?</p>
<div class="exa">
<p>비례상수의 절댓값을 비교해요: $|2|=2$, $|-3|=3$, $\left|\dfrac12\right|=\dfrac12$</p>
<p>절댓값이 가장 작은 것이 $x$ 축에 가장 가까워요.</p>
<p><strong>답: $y=\dfrac12x$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (비례 관계를 이용한 활용)</strong>
<p class="exq">철사의 길이 $x\text{ cm}$ 와 무게 $y\text{ g}$ 은 정비례해요. 길이 $5\text{ cm}$ 의 무게가 $20\text{ g}$ 일 때, 길이 $12\text{ cm}$ 의 무게는 몇 g 인가요?</p>
<div class="exa">
<p>$y=ax$ 에 $x=5$, $y=20$: $a=20\div5=4$ 이므로 $y=4x$.</p>
<p>$x=12$ 이면 $y=4\times12=48$.</p>
<p><strong>답: $48\text{ g}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (두 그래프와 직선으로 둘러싸인 삼각형)</strong>
<p class="exq">두 정비례 관계 $y=3x$, $y=x$ 의 그래프와 직선 $x=4$ 로 둘러싸인 삼각형의 넓이를 구하세요.</p>
<div class="exa">
<p>세 꼭짓점은 원점 $(0,\ 0)$, $x=4$ 일 때의 $(4,\ 12)$ 와 $(4,\ 4)$ 예요.</p>
<p>직선 $x=4$ 위의 변의 길이: $12-4=8$ (밑변), 높이: 원점에서 이 직선까지 거리 $4$.</p>
<p>넓이 $=\dfrac12\times8\times4=16$</p>
<p><strong>답: $16$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (두 점을 지나는 그래프)</strong>
<p class="exq">정비례 관계 $y=ax$ 의 그래프가 두 점 $(2,\ 6)$, $(5,\ b)$ 를 지날 때, $a+b$ 의 값을 구하세요.</p>
<div class="exa">
<p>$(2,\ 6)$ 에서 $a=6\div2=3$, 식은 $y=3x$.</p>
<p>$(5,\ b)$ 에서 $b=3\times5=15$.</p>
<p>$a+b=3+15=18$</p>
<p><strong>답: $18$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (정비례 고르기)</strong>
<p class="exq">다음 중 $y$ 가 $x$ 에 정비례하는 것을 모두 고르세요. ① $y=2x+1$ ② $y=\dfrac{x}{3}$ ③ $y=\dfrac{5}{x}$ ④ $y=-4x$</p>
<div class="exa">
<p>$y=ax$ 꼴인지 확인해요. ①은 $+1$ 이 붙어서 아니에요(원점을 지나지 않아요). ②는 $y=\dfrac13x$ 로 $a=\dfrac13$, 정비례. ③은 $y=\dfrac5x$ 라서 반비례. ④는 $a=-4$, 정비례.</p>
<p><strong>답: ②, ④</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$y=2x+1$ 처럼 상수항이 붙은 식을 정비례로 착각하는 것. 정비례는 $x=0$ 일 때 $y=0$ 이어야 해요.</li>
<li>"$x$ 가 늘면 $y$ 도 는다"만 보고 정비례라고 하는 것. 정비례는 <strong>같은 배수로</strong> 변해야 해요.</li>
<li>비례상수의 부호를 놓치는 것. $a\lt0$ 이면 그래프는 제2·4사분면, 값은 줄어요.</li>
<li>$|a|$ 가 클수록 $x$ 축에 가깝다고 생각하는 것. 반대로 $y$ 축에 가까워요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>"비" 한 줄로 끝내기</strong>: 정비례는 $\dfrac{y}{x}=a$ 가 일정하니, 모르는 값은 $\dfrac{y_1}{x_1}=\dfrac{y_2}{x_2}$ 로 한 번에 구해요. 예) $x=6\to y=15$ 일 때 $x=10$ 이면 $y=\dfrac{15}{6}\times10=25$.</p>
<p><strong>점 하나만 알면 식이 나와요.</strong> 원점은 이미 지나니까 점 $(p,\ q)$ 한 개로 $a=\dfrac qp$ 가 결정돼요.</p>
<p><strong>그래프 모양은 $a$ 만 보면 돼요.</strong> 부호 → 어느 사분면, 절댓값 → 가파른 정도.</p>
<p><strong>두 그래프 사이의 삼각형</strong> ($y=ax$, $y=bx$, $x=k$)의 넓이는 공식 $\dfrac12|a-b|k^2$ 으로 바로 구해요. (예시 7: $\dfrac12\times2\times16=16$)</p>`
      },

      /* ───────── 3. 반비례 y=a/x ───────── */
      {
        title: '반비례 y=a/x',
        body: r`
<p class="lead-line">$x$ 가 $2$ 배, $3$ 배가 되면 $y$ 는 $\dfrac12$ 배, $\dfrac13$ 배가 되는 관계가 <strong>반비례</strong>예요. 식은 $y=\dfrac ax$ ($a\ne0$), $x$ 와 $y$ 를 곱하면 항상 $a$ 예요.</p>

<div class="def"><strong class="label">개념</strong>
<p>$x$ 의 값이 $2$ 배, $3$ 배, $\cdots$ 가 될 때 $y$ 의 값이 $\dfrac12$ 배, $\dfrac13$ 배, $\cdots$ 가 되는 관계를 "$y$ 는 $x$ 에 <strong>반비례</strong>한다"고 해요.</p>
<p>예) 거리 $24\text{ km}$ 를 시속 $x\text{ km}$ 로 가는 데 $y$ 시간 걸린다면 $y=\dfrac{24}{x}$. 속력을 2배로 하면 시간은 절반이죠.</p>
<ul>
<li>식: $y=\dfrac ax$ ($a\ne0$). $a$ 는 비례상수이고, $xy=a$ 로 <strong>곱이 일정</strong>해요.</li>
</ul>
</div>

<div class="formula">
$$y=\dfrac ax\ (a\ne0)\qquad \Longleftrightarrow\qquad xy=a\ (\text{일정})$$
$$\text{그래프가 점 }(p,\ q)\text{ 를 지나면 } a=pq$$
</div>

<div class="def"><strong class="label">반비례 y=a/x 의 그래프</strong>
<ul>
<li>두 개의 <strong>매끄러운 곡선</strong>(쌍곡선)이고, 원점을 지나지 않아요. ($x=0$ 은 분모가 $0$ 이라 값이 없어요.)</li>
<li>$a\gt0$ 이면 <strong>제1사분면과 제3사분면</strong>, $a\lt0$ 이면 <strong>제2사분면과 제4사분면</strong>에 있어요.</li>
<li>각 사분면에서 $x$ 가 커지면 $y$ 는 $0$ 에 가까워지지만 <strong>축과 만나지는 않아요</strong>.</li>
<li>$|a|$ 가 클수록 원점에서 더 멀리 떨어져 있어요.</li>
<li>그래프는 원점에 대하여 대칭이에요. 점 $(p,\ q)$ 가 있으면 $(-p,\ -q)$ 도 있어요.</li>
</ul>
</div>

<svg viewBox="0 0 250 220" width="280" role="img" aria-label="반비례 y=4/x 의 그래프 (제1, 3사분면 곡선)" style="display:block;margin:10px auto;color:inherit">
<line x1="10" y1="110" x2="240" y2="110" stroke="currentColor" stroke-width="1.4"/>
<line x1="125" y1="8" x2="125" y2="212" stroke="currentColor" stroke-width="1.4"/>
<path d="M 133,12 Q 137,92 150,98 Q 165,105 235,107" fill="none" stroke="currentColor" stroke-width="2.4"/>
<path d="M 117,208 Q 113,128 100,122 Q 85,115 15,113" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="242" y="124" font-size="12" fill="currentColor">x</text>
<text x="130" y="16" font-size="12" fill="currentColor">y</text>
<text x="175" y="70" font-size="12" fill="currentColor">y = a/x (a&gt;0)</text>
</svg>

<div class="why"><strong class="label">왜 x 와 y 의 곱이 일정할까?</strong>
<p>$y=\dfrac ax$ 의 양변에 $x$ 를 곱하면 $xy=a$ 예요. 그러니 $x$ 가 $2$ 배가 되면 곱이 그대로이려면 $y$ 는 $\dfrac12$ 배가 되어야 하죠.</p>
<p>또 그래프 위의 점 $P(p,\ q)$ 에서 두 축에 내린 수선과 두 축이 만드는 <strong>직사각형의 넓이는 가로 $|p|$ $\times$ 세로 $|q|$ $=|pq|=|a|$</strong> 로 점의 위치와 상관없이 항상 같아요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (식 구하기)</strong>
<p class="exq">$y$ 가 $x$ 에 반비례하고 $x=3$ 일 때 $y=8$ 이에요. $y$ 를 $x$ 에 대한 식으로 나타내세요.</p>
<div class="exa">
<p>$a=xy=3\times8=24$ 이므로 $y=\dfrac{24}{x}$.</p>
<p><strong>답: $y=\dfrac{24}{x}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (값 구하기)</strong>
<p class="exq">반비례 관계 $y=-\dfrac{12}{x}$ 에서 $x=4$ 일 때와 $x=-6$ 일 때 $y$ 의 값을 구하세요.</p>
<div class="exa">
<p>$x=4$: $y=-\dfrac{12}{4}=-3$</p>
<p>$x=-6$: $y=-\dfrac{12}{-6}=2$</p>
<p><strong>답: $-3$, $2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (그래프 위의 점으로 a 구하기)</strong>
<p class="exq">반비례 관계 $y=\dfrac ax$ 의 그래프가 점 $(-3,\ -4)$ 를 지날 때 $a$ 의 값을 구하세요.</p>
<div class="exa">
<p>$a=xy=(-3)\times(-4)=12$</p>
<p><strong>답: $12$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (그래프의 모양)</strong>
<p class="exq">반비례 관계 $y=-\dfrac6x$ 의 그래프가 지나는 사분면을 모두 쓰세요.</p>
<div class="exa">
<p>$a=-6\lt0$ 이므로 제2사분면과 제4사분면을 지나요.</p>
<p><strong>답: 제2, 4사분면</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (그래프 위의 점의 개수)</strong>
<p class="exq">반비례 관계 $y=\dfrac{12}{x}$ 의 그래프 위의 점 중에서 $x$ 좌표와 $y$ 좌표가 모두 자연수인 점은 모두 몇 개인가요? 모두 정수인 점은요?</p>
<div class="exa">
<p>$xy=12$ 이므로 $x$ 는 $12$ 의 약수예요. $12$ 의 약수는 $1,\ 2,\ 3,\ 4,\ 6,\ 12$ 로 $6$ 개.</p>
<p>점: $(1,\ 12),\ (2,\ 6),\ (3,\ 4),\ (4,\ 3),\ (6,\ 2),\ (12,\ 1)$</p>
<p>정수까지 넓히면 음수 약수도 가능하므로 $6\times2=12$ 개예요.</p>
<p><strong>답: 자연수인 점 $6$ 개, 정수인 점 $12$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (톱니바퀴)</strong>
<p class="exq">톱니가 $24$ 개인 톱니바퀴 $A$ 가 $1$ 분에 $10$ 번 회전해요. $A$ 와 맞물려 도는 톱니가 $15$ 개인 톱니바퀴 $B$ 는 $1$ 분에 몇 번 회전하나요?</p>
<div class="exa">
<p>맞물려 돌면 (톱니 수)$\times$(회전수)가 같아요. 톱니가 적을수록 더 많이 돌아서 반비례해요.</p>
<p>$24\times10=15\times y$, $240=15y$, $y=16$</p>
<p><strong>답: $16$ 번</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (속력과 시간)</strong>
<p class="exq">$24\text{ km}$ 떨어진 곳을 가는데, 시속 $x\text{ km}$ 로 가면 $y$ 시간이 걸려요. 시속 $8\text{ km}$ 일 때 걸리는 시간과, $6$ 시간 걸리려면 시속 몇 km 로 가야 하는지 구하세요.</p>
<div class="exa">
<p>$y=\dfrac{24}{x}$ ($xy=24$)</p>
<p>$x=8$: $y=24\div8=3$ (시간)</p>
<p>$y=6$: $x=24\div6=4$ (km/h)</p>
<p><strong>답: $3$ 시간, 시속 $4\text{ km}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (직사각형의 넓이로 a 구하기)</strong>
<p class="exq">반비례 관계 $y=\dfrac ax$ 의 그래프가 제1사분면에서 점 $P$ 를 지나요. $P$ 에서 $x$ 축, $y$ 축에 내린 수선의 발을 각각 $A,\ B$ 라 하고 원점을 $O$ 라 할 때, 직사각형 $OAPB$ 의 넓이가 $6$ 이면 $a$ 의 값은?</p>
<div class="exa">
<p>$P(p,\ q)$ 라 하면 $OA=p$, $OB=q$ 이므로 직사각형의 넓이는 $pq$ 예요.</p>
<p>$P$ 는 그래프 위의 점이라 $pq=a$ 이므로 $a=6$.</p>
<p><strong>답: $6$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (비례 관계가 바뀔 때)</strong>
<p class="exq">반비례 관계에서 $x$ 의 값이 $2$ 에서 $6$ 으로 바뀔 때, 처음 $y$ 의 값이 $9$ 였다면 바뀐 $y$ 의 값은?</p>
<div class="exa">
<p>$a=xy=2\times9=18$ 이므로 $y=\dfrac{18}{x}$.</p>
<p>$x=6$ 이면 $y=18\div6=3$.</p>
<p><strong>답: $3$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$y=\dfrac ax$ 의 그래프를 직선으로 그리는 것. 반비례 그래프는 <strong>곡선</strong>이고 축에 닿지 않아요.</li>
<li>반비례를 "$x$ 가 늘면 $y$ 가 줄어든다"만으로 판단하는 것. $y=10-x$ 도 줄어들지만 반비례가 아니에요. <strong>곱이 일정</strong>해야 해요.</li>
<li>$a=\dfrac yx$ 로 구하는 것. 반비례는 $a=\boldsymbol{xy}$ 예요.</li>
<li>점의 개수를 셀 때 음수 약수를 빠뜨리는 것. "정수"인 점이면 부호가 같은 쌍을 제3사분면에서도 세요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>정비례는 나누고, 반비례는 곱해요.</strong> 정비례 $\to\dfrac yx=a$, 반비례 $\to xy=a$. 표에 있는 한 쌍으로 $a$ 를 구하고 나머지를 계산하세요.</p>
<p><strong>"한 사분면 안에서 $x$ 가 커지면 $y$ 는 작아진다"</strong>가 $a\gt0$ 인 반비례의 특징이에요. ($a\lt0$ 이면 한 사분면 안에서 $y$ 의 절댓값이 작아지면서 $0$ 에 다가가요.)</p>
<p><strong>식을 세우는 말 신호</strong>: "하루에 일하는 양을 늘리면 걸리는 날이 줄어든다", "속력을 높이면 시간이 줄어든다" → $xy=$ (전체 일의 양, 전체 거리) 로 일정.</p>
<p><strong>정수인 점 세기</strong>는 $|a|$ 의 약수 개수로: 자연수인 점은 (약수 개수), 정수인 점은 그 $2$ 배.</p>`
      },

      /* ───────── 4. 정비례·반비례 종합 (생성기 없음) ───────── */
      {
        title: '정비례·반비례 종합과 활용',
        body: r`
<p class="lead-line">두 관계를 비교하고, 한 문제 안에서 함께 쓰는 연습을 해요. 포인트는 <strong>"나누면 일정(정비례) / 곱하면 일정(반비례)"</strong> 이에요.</p>

<div class="def"><strong class="label">정비례와 반비례 한눈에 비교</strong>
<table>
<tr><th></th><th>정비례 $y=ax$</th><th>반비례 $y=\dfrac ax$</th></tr>
<tr><td>$x$ 가 2배면 $y$ 는</td><td>2배</td><td>$\dfrac12$ 배</td></tr>
<tr><td>일정한 값</td><td>$\dfrac yx=a$</td><td>$xy=a$</td></tr>
<tr><td>그래프</td><td>원점을 지나는 직선</td><td>원점을 지나지 않는 한 쌍의 곡선</td></tr>
<tr><td>$a\gt0$</td><td>제1·3사분면</td><td>제1·3사분면</td></tr>
<tr><td>$a\lt0$</td><td>제2·4사분면</td><td>제2·4사분면</td></tr>
<tr><td>대표 상황</td><td>(단가)$\times$(개수)</td><td>(전체 일)$\div$(인원), (거리)$\div$(속력)</td></tr>
</table>
</div>

<div class="ex"><strong class="label">예시 1 (정비례와 반비례의 교점)</strong>
<p class="exq">정비례 관계 $y=2x$ 의 그래프와 반비례 관계 $y=\dfrac bx$ 의 그래프가 점 $(3,\ q)$ 에서 만나요. $b+q$ 의 값을 구하세요.</p>
<div class="exa">
<p>점 $(3,\ q)$ 는 $y=2x$ 위의 점이므로 $q=2\times3=6$.</p>
<p>또 $y=\dfrac bx$ 위의 점이므로 $b=3\times6=18$.</p>
<p>$b+q=18+6=24$</p>
<p><strong>답: $24$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (일의 양)</strong>
<p class="exq">$6$ 명이 하면 $10$ 일 걸리는 일을 $x$ 명이 하면 $y$ 일이 걸린다고 해요. $y$ 를 $x$ 에 대한 식으로 나타내고, $15$ 명이 하면 며칠 걸리는지 구하세요. (모두 같은 속도로 일해요.)</p>
<div class="exa">
<p>전체 일의 양은 일정하므로 $xy=6\times10=60$, 즉 $y=\dfrac{60}{x}$.</p>
<p>$x=15$ 이면 $y=60\div15=4$.</p>
<p><strong>답: $y=\dfrac{60}{x}$, $4$ 일</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (두 관계가 섞인 문제)</strong>
<p class="exq">한 개에 $300$ 원인 지우개 $x$ 개의 값을 $y$ 원이라 하고, $1200$ 원으로 한 개에 $z$ 원인 연필을 산 개수를 $w$ 라 해요. $y$ 와 $x$, $w$ 와 $z$ 의 관계는 각각 무엇인가요?</p>

<p>$y=300x$: $\dfrac yx=300$ 일정 → <strong>정비례</strong></p>
<p>$zw=1200$: $z$ 가 커질수록 $w$ 는 작아지고 곱이 일정 → $w=\dfrac{1200}{z}$, <strong>반비례</strong></p>
<p><strong>답: $y$ 는 $x$ 에 정비례, $w$ 는 $z$ 에 반비례</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>

</ul>
</div>`,

        title: '점·선·면·각',
        body: r`
<p class="lead-line">도형의 가장 기본 재료는 <strong>점 → 선 → 면</strong>이에요. 점이 움직이면 선, 선이 움직이면 면이 되고, 이 재료들이 만나는 곳이 교점과 교선이에요.</p>

<div class="def"><strong class="label">점, 선, 면과 교점·교선</strong>
<ul>
<li><strong>점</strong>은 위치만 있고 크기가 없어요. <strong>선</strong>은 점이 움직인 자취, <strong>면</strong>은 선이 움직인 자취예요.</li>
<li>선에는 <strong>직선</strong>과 <strong>곡선</strong>, 면에는 <strong>평면</strong>과 <strong>곡면</strong>이 있어요.</li>
<li><strong>교점</strong>: 선과 선, 또는 선과 면이 만나서 생기는 <strong>점</strong>. (입체도형에서는 <strong>꼭짓점</strong>이 교점이에요.)</li>
<li><strong>교선</strong>: 면과 면이 만나서 생기는 <strong>선</strong>. (입체도형에서는 <strong>모서리</strong>가 교선이에요.)</li>
</ul>
<table>
<tr><th>입체도형</th><th>교점(꼭짓점)</th><th>교선(모서리)</th></tr>
<tr><td>$n$ 각기둥</td><td>$2n$</td><td>$3n$</td></tr>
<tr><td>$n$ 각뿔</td><td>$n+1$</td><td>$2n$</td></tr>
<tr><td>$n$ 각뿔대</td><td>$2n$</td><td>$3n$</td></tr>
</table>
</div>

<div class="def"><strong class="label">직선, 반직선, 선분</strong>
<table>
<tr><th>이름</th><th>기호</th><th>뜻</th></tr>
<tr><td>직선 $AB$</td><td>$\overleftrightarrow{AB}$</td><td>두 점 $A$, $B$ 를 지나며 양쪽으로 끝없이 뻗은 선</td></tr>
<tr><td>반직선 $AB$</td><td>$\overrightarrow{AB}$</td><td>$A$ 에서 시작하여 $B$ 쪽으로만 끝없이 뻗은 선</td></tr>
<tr><td>선분 $AB$</td><td>$\overline{AB}$</td><td>직선 $AB$ 위의 $A$ 에서 $B$ 까지의 부분</td></tr>
</table>
<ul>
<li>$\overleftrightarrow{AB}=\overleftrightarrow{BA}$, $\overline{AB}=\overline{BA}$ 이지만 <strong>$\overrightarrow{AB}\ne\overrightarrow{BA}$</strong> (시작점과 방향이 달라요).</li>
<li><strong>두 점 사이의 거리</strong>는 두 점을 이은 선분 $\overline{AB}$ 의 길이이고, 이것이 가장 짧은 경로예요.</li>
<li><strong>중점</strong>: 선분을 이등분하는 점 $M$. $\overline{AM}=\overline{MB}=\dfrac12\overline{AB}$.</li>
</ul>
</div>

<div class="formula">
$$\text{점 }n\text{ 개 (어느 세 점도 한 직선 위에 있지 않음): 직선 }\dfrac{n(n-1)}{2}\text{ 개, 선분 }\dfrac{n(n-1)}{2}\text{ 개, 반직선 }n(n-1)\text{ 개}$$
$$\text{직선 }n\text{ 개 (어느 둘도 평행하지 않고 어느 세 직선도 한 점에서 만나지 않음): 교점 }\dfrac{n(n-1)}{2}\text{ 개}$$
</div>

<div class="why"><strong class="label">왜 이런 식이 나올까?</strong>
<p>점 $n$ 개 중 두 점을 고르는 방법은 $n\times(n-1)$ 가지인데, $\{A,\ B\}$ 와 $\{B,\ A\}$ 는 같은 직선이므로 $2$ 로 나눠요. 반직선은 $\overrightarrow{AB}$ 와 $\overrightarrow{BA}$ 가 서로 다르니까 나누지 않고 $n(n-1)$ 개예요.</p>
<p>한 직선 위에 $k$ 개의 점이 있으면 그 $k$ 개 중 두 점을 이어서 얻는 $\dfrac{k(k-1)}{2}$ 개는 사실 <strong>같은 직선 하나</strong>예요. 그래서 직선의 수는 $\dfrac{n(n-1)}{2}-\dfrac{k(k-1)}{2}+1$. 직선의 교점도 마찬가지로, 서로 평행한 직선 $k$ 개는 서로 만나지 않으므로 $\dfrac{k(k-1)}{2}$ 개를 빼요.</p>
</div>

<div class="def"><strong class="label">각</strong>
<ul>
<li><strong>각</strong> $\angle AOB$: 한 점 $O$ 에서 시작하는 두 반직선 $OA$, $OB$ 가 이루는 도형. $O$ 는 꼭짓점이에요.</li>
<li>크기에 따라: <strong>예각</strong>($0^\circ$ 보다 크고 $90^\circ$ 보다 작은 각), <strong>직각</strong>($90^\circ$), <strong>둔각</strong>($90^\circ$ 보다 크고 $180^\circ$ 보다 작은 각), <strong>평각</strong>($180^\circ$, 일직선).</li>
<li><strong>여각</strong>: 두 각의 합이 $90^\circ$ 일 때 서로 여각. $x$ 의 여각 $=90^\circ-x$.</li>
<li><strong>보각</strong>: 두 각의 합이 $180^\circ$ 일 때 서로 보각. $x$ 의 보각 $=180^\circ-x$.</li>
<li><strong>맞꼭지각</strong>: 두 직선이 한 점에서 만날 때 생기는 네 각 중 서로 마주 보는 두 각. <strong>맞꼭지각의 크기는 같아요.</strong></li>
</ul>
</div>

<svg viewBox="0 0 220 150" width="250" role="img" aria-label="두 직선이 만나 생기는 맞꼭지각 a, b, c, d" style="display:block;margin:10px auto;color:inherit">
<line x1="20" y1="120" x2="200" y2="30" stroke="currentColor" stroke-width="2"/>
<line x1="30" y1="35" x2="190" y2="115" stroke="currentColor" stroke-width="2"/>
<text x="107" y="55" font-size="13" text-anchor="middle" fill="currentColor">a</text>
<text x="107" y="105" font-size="13" text-anchor="middle" fill="currentColor">c</text>
<text x="150" y="80" font-size="13" text-anchor="middle" fill="currentColor">b</text>
<text x="66" y="80" font-size="13" text-anchor="middle" fill="currentColor">d</text>
<text x="110" y="142" font-size="11" text-anchor="middle" fill="currentColor">a 와 c, b 와 d 는 맞꼭지각 (크기가 같음)</text>
</svg>

<div class="why"><strong class="label">왜 맞꼭지각은 같을까?</strong>
<p>위 그림에서 $\angle a+\angle b=180^\circ$ (평각)이고, $\angle b+\angle c=180^\circ$ (평각)이에요. 두 식에서 $\angle b$ 를 지우면 $\angle a=\angle c$ 가 돼요. $\angle b$ 와 $\angle d$ 도 같은 방법으로 같다는 것을 알 수 있어요.</p>
</div>

<div class="def"><strong class="label">직선 위의 각, 그리고 한 점에서 생긴 각</strong>
<ul>
<li>한 직선 위의 한 점에서 이웃한 여러 각의 합은 <strong>$180^\circ$</strong> 예요.</li>
<li>한 점에서 모든 방향의 각을 한 바퀴 합하면 <strong>$360^\circ$</strong> 예요.</li>
<li>세 직선이 한 점에서 만나 생긴 <strong>여섯 개의 각</strong>은, 이웃한 세 각의 합이 $180^\circ$ (마주 보는 각은 맞꼭지각)이에요.</li>
</ul>
</div>

<div class="def"><strong class="label">수직과 수직이등분선</strong>
<ul>
<li>두 직선이 이루는 각이 직각이면 <strong>서로 수직</strong>이고, $AB\perp CD$ 로 써요. 이때 한 직선을 다른 직선의 <strong>수선</strong>이라 해요.</li>
<li>직선 $l$ 밖의 점 $P$ 에서 $l$ 에 수선을 그을 때 만나는 점 $H$ 를 <strong>수선의 발</strong>이라 하고, 선분 $PH$ 의 길이를 <strong>점 $P$ 와 직선 $l$ 사이의 거리</strong>라고 해요. (가장 짧은 거리!)</li>
<li>선분 $AB$ 의 중점 $M$ 을 지나면서 $AB$ 에 수직인 직선을 선분 $AB$ 의 <strong>수직이등분선</strong>이라 해요. 이 직선 위의 모든 점은 $A$ 와 $B$ 에서 같은 거리에 있어요.</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1 (교점과 교선의 개수)</strong>
<p class="exq">칠각기둥의 교점의 개수와 교선의 개수를 구하세요. 또 오각뿔의 교점과 교선의 개수도 구하세요.</p>
<div class="exa">
<p>교점은 <strong>꼭짓점</strong>, 교선은 <strong>모서리</strong>예요.</p>
<p>칠각기둥: 꼭짓점 $7\times2=14$, 모서리 $7\times3=21$.</p>
<p>오각뿔: 꼭짓점 $5+1=6$, 모서리 $5\times2=10$.</p>
<p><strong>답: 칠각기둥 교점 $14$, 교선 $21$ / 오각뿔 교점 $6$, 교선 $10$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (점으로 만드는 직선·반직선·선분)</strong>
<p class="exq">한 평면 위에 어느 세 점도 한 직선 위에 있지 않은 점이 $6$ 개 있어요. 이 중 두 점을 이어서 만들 수 있는 서로 다른 직선, 선분, 반직선은 각각 몇 개인가요?</p>
<div class="exa">
<p>직선: $\dfrac{6\times5}{2}=15$ (개)</p>
<p>선분: 직선과 같은 방법으로 $15$ (개)</p>
<p>반직선: 두 점 $A$, $B$ 마다 $\overrightarrow{AB}$, $\overrightarrow{BA}$ 두 개이므로 $6\times5=30$ (개)</p>
<p><strong>답: 직선 $15$ 개, 선분 $15$ 개, 반직선 $30$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (한 직선 위에 있는 점이 포함된 경우)</strong>
<p class="exq">한 평면 위에 점 $7$ 개가 있고, 이 중 $4$ 개는 한 직선 위에 있으며 나머지 점들은 어느 세 점도 한 직선 위에 있지 않아요. 두 점을 이어서 만들 수 있는 서로 다른 직선은 모두 몇 개인가요?</p>
<div class="exa">
<p>어느 세 점도 한 직선 위에 없다고 할 때는 $\dfrac{7\times6}{2}=21$ 개.</p>
<p>그런데 한 직선 위의 $4$ 개 점에서는 $\dfrac{4\times3}{2}=6$ 개가 모두 같은 직선 하나예요. $6$ 개를 $1$ 개로 줄이니 $21-6+1$.</p>
<p>$21-6+1=16$</p>
<p><strong>답: $16$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (중점의 길이)</strong>
<p class="exq">선분 $AB$ 의 중점을 $M$, 선분 $MB$ 의 중점을 $N$ 이라 해요. $\overline{AB}=18\text{ cm}$ 일 때 $\overline{AN}$ 의 길이를 구하세요.</p>
<div class="exa">
<p>$\overline{MB}=\dfrac12\times18=9$.</p>
<p>$N$ 은 $\overline{MB}$ 의 중점이라 $\overline{MN}=\dfrac12\times9=4.5$.</p>
<p>$\overline{AN}=\overline{AM}+\overline{MN}=9+4.5=13.5$ (또는 $\overline{AB}\times\dfrac34$)</p>
<p><strong>답: $13.5\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (비례와 두 중점 사이의 길이)</strong>
<p class="exq">선분 $AB$ 위의 점 $C$ 에 대하여 $\overline{AC}:\overline{CB}=2:3$ 이고, $M$ 은 $\overline{AC}$ 의 중점, $N$ 은 $\overline{CB}$ 의 중점이에요. $\overline{AB}=20\text{ cm}$ 일 때 $\overline{MN}$ 의 길이를 구하세요.</p>
<div class="exa">
<p>$\overline{AC}=20\times\dfrac25=8$, $\overline{CB}=20\times\dfrac35=12$.</p>
<p>$\overline{MC}=\dfrac12\overline{AC}=4$, $\overline{CN}=\dfrac12\overline{CB}=6$.</p>
<p>$\overline{MN}=\overline{MC}+\overline{CN}=4+6=10$</p>
<p>(비율을 몰라도 $\overline{MN}=\dfrac12(\overline{AC}+\overline{CB})=\dfrac12\overline{AB}$ 로 항상 $10$ 이에요.)</p>
<p><strong>답: $10\text{ cm}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (여각과 보각)</strong>
<p class="exq">$35^\circ$ 의 여각과 보각의 크기를 각각 구하세요.</p>
<div class="exa">
<p>여각: $90^\circ-35^\circ=55^\circ$</p>
<p>보각: $180^\circ-35^\circ=145^\circ$</p>
<p><strong>답: $55^\circ$, $145^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (직선 위의 각에서 x 구하기)</strong>
<p class="exq">한 직선 위의 한 점에서 이웃한 세 각의 크기가 $(x+10)^\circ$, $(2x-5)^\circ$, $(3x+25)^\circ$ 일 때, $x$ 의 값을 구하세요.</p>
<div class="exa">
<p>세 각의 합이 평각 $180^\circ$ 이므로 $(x+10)+(2x-5)+(3x+25)=180$.</p>
<p>$6x+30=180$, $6x=150$, $x=25$.</p>
<p>확인: $35^\circ+45^\circ+100^\circ=180^\circ$ ✓</p>
<p><strong>답: $x=25$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (세 직선이 한 점에서 만날 때)</strong>
<p class="exq">세 직선이 한 점 $O$ 에서 만나 여섯 개의 각이 생겼어요. 이웃한 세 각의 크기가 $(2x+10)^\circ$, $(3x-5)^\circ$, $(x+25)^\circ$ 일 때, $x$ 의 값을 구하세요.</p>
<div class="exa">
<p>세 각 $+$ 그 맞꼭지각 세 개가 한 바퀴($360^\circ$)이고, 맞꼭지각은 같으므로 이웃한 세 각의 합은 $180^\circ$ 예요.</p>
<p>$(2x+10)+(3x-5)+(x+25)=180$, $6x+30=180$, $x=25$.</p>
<p>세 각은 $60^\circ$, $70^\circ$, $50^\circ$ 로 합이 $180^\circ$ ✓</p>
<p><strong>답: $x=25$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 9 (직선의 교점의 개수)</strong>
<p class="exq">한 평면 위에 서로 다른 직선 $5$ 개가 있어요. 이 중 $2$ 개만 서로 평행하고 나머지는 어느 둘도 평행하지 않으며 어느 세 직선도 한 점에서 만나지 않을 때, 교점은 모두 몇 개인가요?</p>
<div class="exa">
<p>평행한 것이 없다면 $\dfrac{5\times4}{2}=10$ 개.</p>
<p>평행한 두 직선은 만나지 않으니 $\dfrac{2\times1}{2}=1$ 개를 빼요. $10-1=9$.</p>
<p><strong>답: $9$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 10 (시계의 각)</strong>
<p class="exq">시계가 $4$ 시 $20$ 분을 가리킬 때, 시침과 분침이 이루는 각(작은 쪽)의 크기를 구하세요.</p>
<div class="exa">
<p>시침은 $1$ 시간에 $30^\circ$, $1$ 분에 $0.5^\circ$ 움직여요. $12$ 시 기준 $30\times4+0.5\times20=130^\circ$.</p>
<p>분침은 $1$ 분에 $6^\circ$ 움직여요. $6\times20=120^\circ$.</p>
<p>두 각의 차: $130^\circ-120^\circ=10^\circ$ (작은 쪽 각)</p>
<p><strong>답: $10^\circ$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>$\overrightarrow{AB}$ 와 $\overrightarrow{BA}$ 를 같은 반직선으로 세는 것. 시작점이 달라서 <strong>서로 달라요</strong>.</li>
<li>한 직선 위에 3점 이상이 있는데도 $\dfrac{n(n-1)}{2}$ 를 그대로 쓰는 것. 같은 직선이 여러 번 세어져요.</li>
<li>여각($90^\circ$)과 보각($180^\circ$)을 헷갈리는 것. "여(어)섯" 아니고 "여각 $=90$": 여각은 <strong>작은 직각 짝꿍</strong>이에요.</li>
<li>시계 문제에서 시침이 정각에만 움직인다고 생각하는 것. 시침도 $1$ 분에 $0.5^\circ$ 씩 움직여요.</li>
<li>교점 = 꼭짓점, 교선 = 모서리를 거꾸로 외우는 것. 점은 점끼리(교점-꼭짓점), 선은 선끼리(교선-모서리).</li>
</ul>
</div>`,
        tip: r`
<p><strong>"여각은 $90$, 보각은 $180$"</strong> — 여각의 "여"는 "<strong>여</strong>기 직각($90^\circ$)", 보각의 "보"는 "<strong>보</strong>통 일직선($180^\circ$)"으로 묶어 외워 보세요.</p>
<p><strong>각 구하기는 방정식으로!</strong> "한 직선 위"이면 합이 $180$, "한 점에서 한 바퀴"이면 합이 $360$. 식을 세워 한 번에 풀면 돼요.</p>
<p><strong>직선·교점 개수</strong>는 공식 $\dfrac{n(n-1)}{2}$ 하나로 시작해서 "겹치는 것"만 보정하세요. 평행한 $k$ 개가 있으면 $-\dfrac{k(k-1)}{2}$, 한 직선 위에 $k$ 점이면 $-\dfrac{k(k-1)}{2}+1$.</p>
<p><strong>시계의 각</strong>: $|30h-5.5m|$ 로 바로 구해요. ($h$ 시 $m$ 분, $180^\circ$ 를 넘으면 $360^\circ$ 에서 빼요.) 예) $4$ 시 $20$ 분: $|120-110|=10^\circ$.</p>`
      },

      {
        title: '위치 관계',
        body: r`
<p class="lead-line">점·직선·평면이 서로 "만나나? 안 만나나? 평행한가? 꼬였나?" 를 구분하는 것이 핵심이에요. 특히 공간에서는 <strong>꼬인 위치</strong>가 새로 등장해요.</p>

<div class="def"><strong class="label">점과 직선, 점과 평면</strong>
<ul>
<li>점 $A$ 가 직선 $l$ 위에 <strong>있다</strong>(직선이 점을 지난다), 또는 직선 $l$ 위에 <strong>있지 않다</strong>(직선 밖에 있다).</li>
<li>점이 평면 위에 있을 수도 있고, 평면 밖에 있을 수도 있어요.</li>
</ul>
</div>

<div class="def"><strong class="label">평면에서 두 직선의 위치 관계</strong>
<ul>
<li><strong>한 점에서 만난다</strong> (교점이 $1$ 개)</li>
<li><strong>평행하다</strong>: 만나지 않는다. $l\parallel m$ 로 써요. (평행한 두 직선은 어디까지 늘려도 만나지 않아요.)</li>
<li><strong>일치한다</strong>: 두 직선이 완전히 겹친다.</li>
</ul>
</div>

<div class="def"><strong class="label">공간에서 두 직선의 위치 관계</strong>
<ul>
<li><strong>한 점에서 만난다</strong></li>
<li><strong>평행하다</strong></li>
<li><strong>꼬인 위치에 있다</strong>: <strong>만나지도 않고 평행하지도 않은</strong> 관계. 꼬인 위치에 있는 두 직선은 <strong>한 평면 위에 있지 않아요</strong>.</li>
</ul>
<p>한 평면 위에 있는 두 직선은 만나거나 평행하기만 하니, "꼬인 위치"는 공간에서만 생겨요.</p>
</div>

<div class="def"><strong class="label">직선과 평면의 위치 관계</strong>
<ul>
<li><strong>포함된다</strong>: 직선이 평면 위에 완전히 놓여 있다.</li>
<li><strong>한 점에서 만난다</strong>: 직선이 평면을 뚫고 지나간다. (특히 평면 위의 모든 직선에 수직이면 <strong>수직</strong>)</li>
<li><strong>평행하다</strong>: 직선과 평면이 만나지 않는다.</li>
</ul>
</div>

<div class="def"><strong class="label">두 평면의 위치 관계</strong>
<ul>
<li><strong>한 직선에서 만난다</strong>: 그 직선이 <strong>교선</strong>. (두 평면이 직각이면 <strong>수직</strong>)</li>
<li><strong>평행하다</strong>: 만나지 않는다. 일치하는 경우는 같은 평면이에요.</li>
</ul>
</div>

<div class="def"><strong class="label">직육면체 ABCD-EFGH 로 연습하기 (밑면 ABCD, 윗면 EFGH, 옆 모서리 AE, BF, CG, DH)</strong>
<p>모서리 $\overline{AB}$ 를 기준으로 나머지 $11$ 개의 모서리를 나눠 보면:</p>
<table>
<tr><th>관계</th><th>모서리</th><th>개수</th></tr>
<tr><td>평행</td><td>$\overline{CD},\ \overline{EF},\ \overline{GH}$</td><td>$3$</td></tr>
<tr><td>한 점에서 만남</td><td>$\overline{BC},\ \overline{DA},\ \overline{AE},\ \overline{BF}$</td><td>$4$</td></tr>
<tr><td>꼬인 위치</td><td>$\overline{CG},\ \overline{DH},\ \overline{FG},\ \overline{HE}$</td><td>$4$</td></tr>
</table>
<p>합: $3+4+4=11$ ✓ (자기 자신은 제외)</p>
<p>모서리 $\overline{AB}$ 와 면의 관계: 포함된 면 <strong>$ABCD,\ ABFE$</strong> ($2$ 개), 평행한 면 <strong>$CDHG,\ EFGH$</strong> ($2$ 개), 한 점에서 만나는 면 <strong>$BCGF,\ DAEH$</strong> ($2$ 개).</p>
<p>면 $ABCD$ 와 평행한 면은 $EFGH$ ($1$ 개), 수직으로 만나는 면은 나머지 $4$ 개예요.</p>
</div>

<div class="why"><strong class="label">왜 이렇게 세면 될까?</strong>
<p>직육면체의 한 꼭짓점에서는 모서리가 $3$ 개 만나요. 기준 모서리 $\overline{AB}$ 의 양 끝($A$, $B$)에서 만나는 모서리는 각각 $2$ 개씩 모두 $4$ 개(<strong>만남</strong>)이고, 같은 방향으로 평행한 모서리는 $3$ 개, 나머지 $4$ 개가 꼬인 위치예요. 같은 구조가 모든 모서리에 똑같이 적용되니까 직육면체에서 쌍의 개수는 평행한 쌍 $12\times3\div2=18$, 만나는 쌍 $12\times4\div2=24$, 꼬인 쌍 $12\times4\div2=24$ 예요. ($18+24+24=66=\dfrac{12\times11}{2}$ ✓)</p>
</div>

<div class="ex"><strong class="label">예시 1 (직육면체에서 모서리 세기)</strong>
<p class="exq">직육면체 $ABCD-EFGH$ 에서 모서리 $\overline{AB}$ 와 꼬인 위치에 있는 모서리를 모두 구하세요.</p>
<div class="exa">
<p>$\overline{AB}$ 와 만나는 모서리는 $A$ 또는 $B$ 를 지나는 $\overline{BC},\ \overline{DA},\ \overline{AE},\ \overline{BF}$, 평행한 모서리는 $\overline{CD},\ \overline{EF},\ \overline{GH}$ 예요.</p>
<p>남은 것: $\overline{CG},\ \overline{DH},\ \overline{FG},\ \overline{HE}$. 만나지도 않고 평행하지도 않으므로 꼬인 위치예요.</p>
<p><strong>답: $\overline{CG},\ \overline{DH},\ \overline{FG},\ \overline{HE}$ ($4$ 개)</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (모서리와 면의 위치 관계)</strong>
<p class="exq">직육면체 $ABCD-EFGH$ 에서 모서리 $\overline{AE}$ 와 평행한 면, 모서리 $\overline{AE}$ 를 포함한 면의 개수를 각각 구하세요.</p>
<div class="exa">
<p>$\overline{AE}$ 는 옆 모서리라서 포함된 면은 $ABFE$, $DAEH$ 로 $2$ 개예요.</p>
<p>평행한 면은 $\overline{AE}$ 가 지나지 않는 면 중 만나지 않는 $BCGF$, $CDHG$ 로 $2$ 개예요.</p>
<p>(한 점에서 만나는 면은 $ABCD$, $EFGH$ 로 $2$ 개)</p>
<p><strong>답: 평행한 면 $2$ 개, 포함한 면 $2$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (삼각기둥에서 꼬인 위치)</strong>
<p class="exq">삼각기둥 $ABC-DEF$ (밑면 $ABC$, 윗면 $DEF$, 옆 모서리 $\overline{AD},\ \overline{BE},\ \overline{CF}$) 에서 모서리 $\overline{AB}$ 와 꼬인 위치에 있는 모서리의 개수를 구하세요.</p>
<div class="exa">
<p>$\overline{AB}$ 와 만나는 모서리: $\overline{BC},\ \overline{CA},\ \overline{AD},\ \overline{BE}$ ($4$ 개). 평행한 모서리: $\overline{DE}$ ($1$ 개).</p>
<p>전체 모서리는 $9$ 개이고 자기 자신을 빼면 $8$ 개이므로 꼬인 위치는 $8-4-1=3$ 개예요. 구체적으로 $\overline{EF},\ \overline{FD},\ \overline{CF}$ 예요.</p>
<p><strong>답: $3$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (사각뿔에서 위치 관계)</strong>
<p class="exq">사각뿔 $P-ABCD$ (밑면 $ABCD$ 는 직사각형) 에서 모서리 $\overline{AB}$ 와 꼬인 위치에 있는 모서리를 구하세요.</p>
<div class="exa">
<p>$\overline{AB}$ 와 만나는 모서리: $\overline{BC},\ \overline{DA},\ \overline{PA},\ \overline{PB}$. 평행한 모서리: $\overline{CD}$.</p>
<p>남은 모서리 $\overline{PC},\ \overline{PD}$ 는 만나지도 평행하지도 않아요.</p>
<p><strong>답: $\overline{PC},\ \overline{PD}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (두 조건을 동시에 만족하는 모서리)</strong>
<p class="exq">직육면체 $ABCD-EFGH$ 에서 모서리 $\overline{AB}$ 와 꼬인 위치에 있고, 동시에 면 $ABCD$ 와 평행한 모서리를 모두 구하세요.</p>
<div class="exa">
<p>$\overline{AB}$ 와 꼬인 모서리: $\overline{CG},\ \overline{DH},\ \overline{FG},\ \overline{HE}$.</p>
<p>면 $ABCD$ 와 평행한 모서리는 윗면 $EFGH$ 에 있는 모서리들이에요. 위 네 개 중에서는 $\overline{FG},\ \overline{HE}$.</p>
<p>($\overline{CG},\ \overline{DH}$ 는 면 $ABCD$ 와 한 점에서 만나요.)</p>
<p><strong>답: $\overline{FG},\ \overline{HE}$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (옳은 설명의 개수)</strong>
<p class="exq">다음 중 옳은 것을 모두 고르세요. (모두 공간에 있는 서로 다른 직선·평면)<br>① 한 평면에 평행한 두 직선은 서로 평행하다.<br>② 평행한 두 직선은 만나지 않는다.<br>③ 만나지 않는 두 직선은 평행하다.<br>④ 한 직선에 수직인 두 직선은 평행하다.<br>⑤ 평행한 두 평면은 만나지 않는다.</p>
<div class="exa">
<p>① 거짓: 같은 평면에 평행하더라도 두 직선이 서로 꼬인 위치일 수 있어요.</p>
<p>② 참: 평행의 정의.</p>
<p>③ 거짓: 공간에서는 만나지 않아도 <strong>꼬인 위치</strong>일 수 있어요.</p>
<p>④ 거짓: 한 직선에 수직인 직선은 여러 방향으로 돌아가며 만들 수 있어서 평행하지 않을 수 있어요. (평면에서는 참)</p>
<p>⑤ 참: 평행의 정의.</p>
<p><strong>답: ②, ⑤ (옳은 것은 $2$ 개)</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (쌍의 개수)</strong>
<p class="exq">직육면체의 $12$ 개 모서리 중 서로 꼬인 위치에 있는 모서리의 쌍은 모두 몇 쌍인가요? (순서가 다른 쌍은 같은 쌍으로 셉니다.)</p>
<div class="exa">
<p>각 모서리와 꼬인 위치에 있는 모서리는 $4$ 개씩이에요.</p>
<p>$12\times4=48$ 인데, 한 쌍을 두 번(양쪽에서) 센 것이므로 $2$ 로 나눠요.</p>
<p>$48\div2=24$</p>
<p><strong>답: $24$ 쌍</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>"만나지 않으면 평행"이라고 말하는 것. <strong>공간에서는 꼬인 위치</strong>도 있어요.</li>
<li>꼬인 위치를 센다면서 평행한 것을 같이 세는 것. 만남, 평행, 꼬임을 따로 센 다음 합이 (전체 $-1$) 인지 확인하세요.</li>
<li>입체도형이 직육면체가 아닌데 직육면체의 규칙을 그대로 쓰는 것. 삼각기둥이나 사각뿔은 꼭짓점에서 만나는 모서리 수가 달라요.</li>
<li>모서리가 "포함된다"와 "한 점에서 만난다"를 혼동하는 것. 선분의 <strong>양 끝점이 모두</strong> 면 위에 있으면 포함이에요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>세 칸 표 전략</strong>: 기준 모서리를 정하고 나머지를 <strong>"만남 / 평행 / 꼬임"</strong> 세 칸에 나눠 적어요. 합이 (전체 모서리 $-1$) 이면 빠진 게 없는 거예요.</p>
<p><strong>꼬인 위치 찾는 순서</strong>: ① 같은 꼭짓점을 가진 모서리 → 만남. ② 같은 방향으로 나란한 모서리 → 평행. ③ 남은 것 → 꼬임. (같은 평면 위에 있지 않아요)</p>
<p><strong>직육면체 암기용</strong>: 한 모서리당 평행 $3$, 만남 $4$, 꼬임 $4$. 면과의 관계는 포함 $2$, 평행 $2$, 한 점에서 만남 $2$. 면 하나당 평행한 면 $1$, 수직인 면 $4$.</p>
<p><strong>"참/거짓" 문제</strong>는 반례 하나만 찾으면 거짓이에요. 직육면체 안에서 직접 확인해 보세요.</p>`
      },

      /* ───────── 2. 평행선의 성질 ───────── */
      {
        title: '평행선의 성질',
        body: r`
<p class="lead-line">두 직선이 평행하면 <strong>동위각과 엇각의 크기가 같고, 동측내각의 합은 $180^\circ$</strong> 예요. 거꾸로, 동위각이나 엇각이 같으면 두 직선은 평행해요.</p>

<div class="def"><strong class="label">동위각과 엇각</strong>
<p>두 직선 $l$, $m$ 이 다른 한 직선과 만나면 $8$ 개의 각이 생겨요.</p>
<ul>
<li><strong>동위각</strong>: 같은 위치에 있는 두 각 (위쪽 왼쪽끼리, 아래쪽 오른쪽끼리 등)</li>
<li><strong>엇각</strong>: 두 직선 안쪽에서 <strong>엇갈린</strong> 위치에 있는 두 각 (Z 모양)</li>
<li><strong>동측내각</strong>: 두 직선 안쪽에서 <strong>같은 쪽</strong>에 있는 두 각 (ㄷ 모양, 합이 $180^\circ$)</li>
</ul>
</div>

<svg viewBox="0 0 240 190" width="270" role="img" aria-label="평행한 두 직선 l, m 과 한 직선이 만나서 생긴 8개의 각 a~h" style="display:block;margin:10px auto;color:inherit">
<line x1="15" y1="55" x2="225" y2="55" stroke="currentColor" stroke-width="2"/>
<line x1="15" y1="135" x2="225" y2="135" stroke="currentColor" stroke-width="2"/>
<line x1="140" y1="8" x2="88" y2="182" stroke="currentColor" stroke-width="2"/>
<text x="20" y="48" font-size="12" fill="currentColor">l</text>
<text x="20" y="128" font-size="12" fill="currentColor">m</text>
<text x="122" y="46" font-size="12" fill="currentColor">a</text>
<text x="146" y="46" font-size="12" fill="currentColor">b</text>
<text x="116" y="72" font-size="12" fill="currentColor">c</text>
<text x="144" y="72" font-size="12" fill="currentColor">d</text>
<text x="70" y="126" font-size="12" fill="currentColor">e</text>
<text x="98" y="126" font-size="12" fill="currentColor">f</text>
<text x="66" y="152" font-size="12" fill="currentColor">g</text>
<text x="96" y="152" font-size="12" fill="currentColor">h</text>
</svg>

<div class="formula">
$$l\parallel m\ \Longrightarrow\ \text{동위각 }(a=e,\ b=f,\ c=g,\ d=h)\text{ 은 같다}$$
$$l\parallel m\ \Longrightarrow\ \text{엇각 }(c=f,\ d=e)\text{ 은 같다}$$
$$l\parallel m\ \Longrightarrow\ \text{동측내각의 합 }(c+e=180^\circ,\ d+f=180^\circ)$$
$$\text{동위각(또는 엇각)이 같으면 }l\parallel m$$
</div>

<div class="why"><strong class="label">왜 그럴까?</strong>
<p><strong>동위각이 같다</strong>: $l\parallel m$ 이면 한 직선을 평행이동하는 것처럼 $l$ 위의 각을 $m$ 위로 그대로 옮길 수 있어서, 같은 위치의 각(동위각)은 같아요.</p>
<p><strong>엇각이 같다</strong>: 위 그림에서 $\angle c$ 와 $\angle b$ 는 맞꼭지각이라 같고, $\angle b$ 와 $\angle f$ 는 동위각이라 같아요. 그러니 $\angle c=\angle f$ (엇각) 예요.</p>
<p><strong>동측내각의 합이 $180^\circ$</strong>: $\angle e$ 의 동위각이 $\angle a$ 이고 $\angle a+\angle c=180^\circ$ (일직선) 이니까 $\angle c+\angle e=180^\circ$ 예요.</p>
</div>

<div class="def"><strong class="label">꺾인 선과 보조선</strong>
<p>평행한 두 직선 사이에서 선이 꺾이는 점 $P$ 가 있으면, <strong>$P$ 를 지나 두 직선에 평행한 보조선</strong>을 그어요. 그러면 엇각이 생겨서</p>
<div class="formula">
$$\angle APB=\angle a+\angle b$$
</div>
<p>(보조선 위쪽 각 $=l$ 쪽 엇각, 아래쪽 각 $=m$ 쪽 엇각)</p>
</div>

<div class="def"><strong class="label">삼각형과 평행선</strong>
<p>삼각형 $ABC$ 의 꼭짓점 $A$ 를 지나고 $\overline{BC}$ 에 평행한 직선을 그으면, 엇각을 이용해 $\angle B+\angle A+\angle C=180^\circ$ (삼각형의 내각의 합)을 바로 설명할 수 있어요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (동위각, 엇각, 동측내각)</strong>
<p class="exq">$l\parallel m$ 이고 $\angle a=70^\circ$ 일 때, $\angle a$ 의 동위각, 엇각, 동측내각의 크기를 각각 구하세요.</p>
<div class="exa">
<p>동위각 $=$ 엇각 $=\angle a=70^\circ$ (평행선에서 같아요).</p>
<p>동측내각은 합이 $180^\circ$ 이므로 $180^\circ-70^\circ=110^\circ$.</p>
<p><strong>답: 동위각 $70^\circ$, 엇각 $70^\circ$, 동측내각 $110^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (동측내각)</strong>
<p class="exq">$l\parallel m$ 이고 두 직선과 한 직선이 만나서 생긴 두 동측내각 중 한 각이 $115^\circ$ 일 때, 다른 한 각의 크기를 구하세요.</p>
<div class="exa">
<p>동측내각의 합은 $180^\circ$ 이므로 $180^\circ-115^\circ=65^\circ$.</p>
<p><strong>답: $65^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (평행 판별)</strong>
<p class="exq">두 직선 $l$, $m$ 이 다른 한 직선과 만나서 생긴 동위각이 각각 $75^\circ$, $75^\circ$ 이면 평행한가요? 엇각이 각각 $80^\circ$, $85^\circ$ 이면요?</p>
<div class="exa">
<p>동위각이 같으므로 $l\parallel m$ <strong>평행</strong>해요.</p>
<p>엇각이 $80^\circ\ne85^\circ$ 로 다르므로 <strong>평행하지 않아요</strong>.</p>
<p><strong>답: 평행하다 / 평행하지 않다</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (방정식으로 x 구하기: 엇각)</strong>
<p class="exq">$l\parallel m$ 이고 엇각인 $\angle a=(2x+10)^\circ$, $\angle b=(3x-20)^\circ$ 일 때, $x$ 의 값과 $\angle a$ 의 크기를 구하세요.</p>
<div class="exa">
<p>엇각은 같으므로 $2x+10=3x-20$, $30=x$.</p>
<p>$\angle a=2\times30+10=70^\circ$ (확인: $\angle b=3\times30-20=70^\circ$ ✓)</p>
<p><strong>답: $x=30$, $\angle a=70^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (방정식으로 x 구하기: 동측내각)</strong>
<p class="exq">$l\parallel m$ 이고 동측내각인 $\angle a=(x+40)^\circ$, $\angle b=(2x+20)^\circ$ 일 때, $\angle a$ 의 크기를 구하세요.</p>
<div class="exa">
<p>동측내각의 합이 $180^\circ$ 이므로 $(x+40)+(2x+20)=180$.</p>
<p>$3x+60=180$, $3x=120$, $x=40$.</p>
<p>$\angle a=40+40=80^\circ$ (그리고 $\angle b=100^\circ$, 합 $180^\circ$ ✓)</p>
<p><strong>답: $80^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (꺾인 선)</strong>
<p class="exq">$l\parallel m$ 이고 두 직선 사이의 점 $P$ 에서 꺾인 $\angle APB=85^\circ$ 예요. 점 $P$ 를 지나 $l$ 에 평행한 직선을 그었을 때 $l$ 쪽의 엇각이 $35^\circ$ 이면, $m$ 쪽의 엇각은 몇 도인가요?</p>
<div class="exa">
<p>$\angle APB$ 는 보조선으로 위·아래 두 각으로 나뉘고, 각각은 $l$ 쪽 엇각, $m$ 쪽 엇각과 같아요.</p>
<p>$35^\circ+\angle b=85^\circ$ 이므로 $\angle b=50^\circ$.</p>
<p><strong>답: $50^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (삼각형과 평행선)</strong>
<p class="exq">삼각형 $ABC$ 에서 꼭짓점 $A$ 를 지나고 $\overline{BC}$ 에 평행한 직선 위에 점 $D$ ($B$ 쪽), $E$ ($C$ 쪽)를 잡았어요. $\angle DAB=50^\circ$, $\angle EAC=60^\circ$ 일 때 $\angle BAC$ 의 크기를 구하세요.</p>
<div class="exa">
<p>$\angle DAB$ 와 $\angle ABC$ 는 엇각이라 $\angle ABC=50^\circ$, $\angle EAC$ 와 $\angle ACB$ 도 엇각이라 $\angle ACB=60^\circ$.</p>
<p>$D,\ A,\ E$ 가 한 직선 위에 있으므로 $50^\circ+\angle BAC+60^\circ=180^\circ$, $\angle BAC=70^\circ$.</p>
<p>(삼각형 내각의 합 $50+60+70=180$ ✓)</p>
<p><strong>답: $70^\circ$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (여러 각을 따라가며 구하기)</strong>
<p class="exq">$l\parallel m$ 이고 $\angle a=65^\circ$ 예요. $\angle b$ 는 $\angle a$ 의 엇각이고, $\angle c$ 는 $\angle b$ 와 합이 $180^\circ$ 인 이웃한 각일 때, $\angle c$ 의 크기를 구하세요.</p>
<div class="exa">
<p>$\angle b=\angle a=65^\circ$ (엇각).</p>
<p>$\angle c=180^\circ-65^\circ=115^\circ$.</p>
<p><strong>답: $115^\circ$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li><strong>두 직선이 평행하다는 조건 없이</strong> 동위각·엇각이 같다고 쓰는 것. 평행하지 않으면 같지 않아요.</li>
<li>동측내각을 "크기가 같다"로 쓰는 것. 같은 게 아니라 <strong>합이 $180^\circ$</strong> 예요.</li>
<li>엇각을 바깥쪽에서 찾는 것. 엇각은 두 직선 <strong>사이(안쪽)</strong>에서 엇갈린 각이에요.</li>
<li>꺾인 선 문제에서 보조선 없이 풀려는 것. 꺾인 점을 지나는 평행선을 그어 보세요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>글자 모양으로 찾기</strong>: 동위각은 <strong>F</strong> 모양, 엇각은 <strong>Z</strong> 모양, 동측내각은 <strong>ㄷ(C)</strong> 모양이에요. Z는 같고(엇각), F도 같고(동위각), C는 합이 $180^\circ$ 예요.</p>
<p><strong>각 문제의 필승 순서</strong>: ① 평행선 표시 확인 → ② 모르는 각과 가까운 아는 각을 찾기 → ③ 맞꼭지각 / 동위각 / 엇각으로 옮기기 → ④ 일직선이면 $180^\circ$ 로 마무리.</p>
<p><strong>꺾인 점 $P$ 가 여러 개</strong>이면 각 꺾인 점마다 보조선을 긋거나, "왼쪽으로 꺾인 각의 합 $=$ 오른쪽으로 꺾인 각의 합"을 써요.</p>
<p><strong>식으로 풀 때</strong>: 엇각·동위각이면 "$=$", 동측내각이면 "$+\ \cdots=180$" 으로 식을 세우세요.</p>`
      },

      /* ───────── 3. 수직과 거리 (생성기 없음) ───────── */
      {
        title: '수직과 거리',
        body: r`
<p class="lead-line">"가장 짧은 거리"는 언제나 <strong>수직으로 내린 선</strong>이에요. 점과 직선 사이의 거리, 평행선 사이의 거리가 모두 이 아이디어예요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li>직선 $l$ 밖의 한 점 $P$ 에서 $l$ 에 내린 수선의 발 $H$ 까지의 거리 $\overline{PH}$ 가 <strong>점 $P$ 와 직선 $l$ 사이의 거리</strong>. 점 $P$ 에서 $l$ 위의 다른 점까지의 거리는 모두 이보다 길어요.</li>
<li>평행한 두 직선 사이의 거리는 한 직선 위의 아무 점에서 다른 직선에 내린 수선의 길이로, 어디서 재도 항상 같아요.</li>
<li>선분 $AB$ 의 수직이등분선 위의 점은 $A$, $B$ 에서 <strong>같은 거리</strong>에 있어요.</li>
</ul>
</div>

<div class="ex"><strong class="label">예시 1</strong>
<p class="exq">직각삼각형 $ABC$ ($\angle B=90^\circ$) 에서 $\overline{AB}=6$, $\overline{BC}=8$, $\overline{AC}=10$ 일 때, 점 $B$ 와 직선 $AC$ 사이의 거리를 구하세요.</p>
<div class="exa">
<p>삼각형의 넓이를 두 가지로 구해요. $\dfrac12\times6\times8=24$.</p>
<p>점 $B$ 에서 $\overline{AC}$ 에 내린 수선의 길이를 $h$ 라 하면 넓이는 $\dfrac12\times10\times h=5h$.</p>
<p>$5h=24$, $h=\dfrac{24}{5}=4.8$</p>
<p><strong>답: $4.8$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2</strong>
<p class="exq">좌표평면에서 점 $P(3,\ 5)$ 와 $x$ 축 사이의 거리를 구하세요.</p>
<div class="exa">
<p>$x$ 축에 내린 수선의 발은 $(3,\ 0)$ 이고, 거리는 $y$ 좌표의 절댓값 $|5|=5$ 예요.</p>
<p><strong>답: $5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3</strong>
<p class="exq">선분 $AB$ 의 수직이등분선 위의 점 $P$ 에서 $\overline{PA}=7\text{ cm}$ 일 때, $\overline{PB}$ 의 길이를 구하세요.</p>
<div class="exa">
<p>수직이등분선 위의 점은 두 끝점에서 같은 거리에 있으므로 $\overline{PB}=\overline{PA}=7\text{ cm}$.</p>
<p><strong>답: $7\text{ cm}$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>점과 직선 사이의 거리를 비스듬한 선분으로 재는 것. 반드시 <strong>수직으로</strong> 내린 선분이에요.</li>
<li>수직이등분선과 이등분선을 혼동하는 것. 수직이등분선은 <strong>수직 + 이등분(중점을 지남)</strong> 둘 다 만족해요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>삼각형의 넓이를 두 방법으로 구하면</strong> 직각삼각형의 빗변에 내린 수선의 길이 (예: $\dfrac{ab}{c}$)도 쉽게 구해요.</p>
<p><strong>좌표평면에서</strong> $x$ 축까지의 거리는 $|y|$, $y$ 축까지의 거리는 $|x|$ 예요.</p>`
      }
    ],
    examples: [
      {

        a: r`<p>일반적인 경우의 직선 수: $\dfrac{6\times5}{2}=15$.</p>
<p>한 직선 위의 $3$ 점에서는 $\dfrac{3\times2}{2}=3$ 개가 모두 같은 직선이므로 $3$ 개를 $1$ 개로 줄여요.</p>

      },
