    id: 'statistics', no: 10, part: '통계', title: '통계',
    summary: '줄기와 잎 그림, 도수분포표, 히스토그램과 도수분포다각형, 상대도수, 대푯값',
    sections: [
      /* ───────── 0. 줄기와 잎 그림 ───────── */
      {
        title: '줄기와 잎 그림',
        body: r`
<p class="lead-line">줄기와 잎 그림은 자료를 "십의 자리(줄기)"와 "일의 자리(잎)"로 나누어 적은 그림이에요. 자료의 원래 값이 그대로 남아 있어서 가장 큰 값, 가장 작은 값, 평균까지 한눈에 구할 수 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>변량</strong>: 키, 점수, 몸무게처럼 조사한 자료의 값.</li>
<li><strong>줄기</strong>: 변량을 둘로 나눌 때 앞쪽 수(주로 십의 자리 이상).</li>
<li><strong>잎</strong>: 변량을 둘로 나눌 때 뒤쪽 수(주로 일의 자리).</li>
<li><strong>줄기와 잎 그림</strong>: 줄기는 세로선 왼쪽에 크기순으로, 잎은 오른쪽에 크기순으로 적은 그림.</li>
</ul>
</div>

<div class="def"><strong class="label">그리는 방법</strong>
<ol>
<li>변량을 줄기와 잎으로 나눠요. 예) $73\to$ 줄기 $7$, 잎 $3$</li>
<li>줄기를 작은 수부터 세로로 적고 세로선을 그어요. <strong>같은 줄기는 한 번만</strong> 써요.</li>
<li>각 줄기의 오른쪽에 잎을 작은 수부터 차례로 적어요. <strong>같은 잎은 중복해서 모두</strong> 써요.</li>
<li>"$5\,|\,2$ 는 $52$ 점"처럼 <strong>읽는 방법(범례)</strong>을 꼭 적어요.</li>
</ol>
</div>

<div class="formula">
<table>
<tr><th>줄기</th><th>잎</th></tr>
<tr><td>5</td><td>2 5 8</td></tr>
<tr><td>6</td><td>0 3 4 7 9</td></tr>
<tr><td>7</td><td>1 1 5 6 8 9</td></tr>
<tr><td>8</td><td>0 2 4 7</td></tr>
<tr><td>9</td><td>3 6</td></tr>
</table>
<p>($5\,|\,2$ 는 $52$ 점) — 학생 $20$ 명의 수학 수행평가 점수</p>
</div>

<div class="def"><strong class="label">그림에서 알 수 있는 것</strong>
<ul>
<li><strong>전체 자료의 수</strong> = 잎의 개수를 모두 센 값 ($3+5+6+4+2=20$)</li>
<li><strong>가장 큰 값 / 가장 작은 값</strong> = 맨 아래 줄기의 가장 오른쪽 잎 / 맨 위 줄기의 가장 왼쪽 잎 ($96$ / $52$)</li>
<li><strong>잎이 가장 많은 줄기</strong> = 자료가 가장 많이 몰려 있는 구간 (줄기 $7$, 잎 $6$ 개)</li>
<li><strong>어떤 값 이상(이하)인 자료의 수</strong> = 해당하는 잎을 세어요.</li>
<li><strong>$k$ 번째로 큰(작은) 값</strong> = 끝(처음)부터 $k$ 번째 잎을 읽어요.</li>
<li><strong>평균</strong> = (변량의 총합) $\div$ (자료의 수)</li>
</ul>
</div>

<div class="why"><strong class="label">왜 줄기와 잎 그림을 쓸까?</strong>
<p>도수분포표나 막대그래프는 구간으로 묶으면서 <strong>원래 값이 사라져요</strong>. 하지만 줄기와 잎 그림은 자료를 크기순으로 정리하면서도 <strong>모든 값을 그대로 보여 줘서</strong> 자료의 분포와 정확한 값을 동시에 알 수 있어요. 가로로 눕히면 막대그래프(히스토그램)처럼 보이기도 해요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (자료의 수, 최대·최소, 범위)</strong>
<p class="exq">위의 줄기와 잎 그림에서 전체 학생 수, 가장 높은 점수와 가장 낮은 점수, 그리고 두 점수의 차를 구하시오.</p>
<div class="exa">
<p>잎의 개수: $3+5+6+4+2=20$ (명)</p>
<p>가장 큰 값: 줄기 $9$ 의 마지막 잎 $6$ → $96$ 점 / 가장 작은 값: 줄기 $5$ 의 첫 잎 $2$ → $52$ 점</p>
<p>차 $=96-52=44$ (점)</p>
<p><strong>답: $20$ 명, 최고 $96$ 점, 최저 $52$ 점, 차 $44$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (잎이 가장 많은 줄기 · 줄기별 개수)</strong>
<p class="exq">잎이 가장 많은 줄기와, 줄기가 $8$ 인 자료의 개수를 구하시오.</p>
<div class="exa">
<p>줄기별 잎의 수: $5\to3,\ 6\to5,\ 7\to6,\ 8\to4,\ 9\to2$</p>
<p>가장 많은 줄기는 $7$, 줄기 $8$ 의 잎은 $0,2,4,7$ 로 $4$ 개예요.</p>
<p><strong>답: 줄기 $7$, $4$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (이상인 자료의 비율)</strong>
<p class="exq">$80$ 점 이상인 학생은 전체의 몇 $\%$ 인가?</p>
<div class="exa">
<p>$80$ 점 이상은 줄기 $8$ 의 $4$ 개 + 줄기 $9$ 의 $2$ 개 $=6$ (명)</p>
<p>$\dfrac{6}{20}\times100=30\ (\%)$</p>
<p><strong>답: $30\%$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (k번째 큰 값, 차)</strong>
<p class="exq">$2$ 번째로 높은 점수와 $2$ 번째로 낮은 점수의 차를 구하시오.</p>
<div class="exa">
<p>높은 점수부터: $96,\ 93,\ \cdots$ → $2$ 번째로 높은 점수는 $93$</p>
<p>낮은 점수부터: $52,\ 55,\ \cdots$ → $2$ 번째로 낮은 점수는 $55$</p>
<p>차 $=93-55=38$</p>
<p><strong>답: $38$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (평균)</strong>
<p class="exq">전체 학생의 평균 점수를 구하시오.</p>
<div class="exa">
<p>모든 변량의 합을 구해요. 줄기별로 먼저 더하면:</p>
<p>줄기 $5$: $52+55+58=165$</p>
<p>줄기 $6$: $60+63+64+67+69=323$</p>
<p>줄기 $7$: $71+71+75+76+78+79=450$</p>
<p>줄기 $8$: $80+82+84+87=333$</p>
<p>줄기 $9$: $93+96=189$</p>
<p>총합 $=165+323+450+333+189=1460$, 평균 $=1460\div20=73$ (점)</p>
<p><strong>답: $73$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (가려진 잎의 개수)</strong>
<p class="exq">학생 $20$ 명의 기록을 줄기와 잎 그림으로 나타냈는데 줄기 $7$ 의 잎이 가려졌다. 보이는 잎이 줄기 $5$ 에 $3$ 개, 줄기 $6$ 에 $5$ 개, 줄기 $8$ 에 $4$ 개, 줄기 $9$ 에 $2$ 개일 때 가려진 잎은 몇 개인가?</p>
<div class="exa">
<p>보이는 잎: $3+5+4+2=14$ (개)</p>
<p>가려진 잎 $=20-14=6$ (개)</p>
<p><strong>답: $6$ 개</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (모든 값이 같이 변할 때 평균)</strong>
<p class="exq">위 학생들이 재시험을 보아 모든 학생의 점수가 $5$ 점씩 올랐다면 새로운 평균은?</p>
<div class="exa">
<p>모든 변량에 $5$ 를 더하면 합이 $5\times20=100$ 늘어나고, 평균도 $\dfrac{100}{20}=5$ 만큼 올라요.</p>
<p>새 평균 $=73+5=78$ (점)</p>
<p><strong>답: $78$ 점</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>같은 값이 여러 개일 때 잎을 한 번만 쓰기. 두 학생이 $71$ 점이면 줄기 $7$ 에 잎 $1$ 을 <strong>두 번</strong> 써요.</li>
<li>범례(예: $5\,|\,2$ 는 $52$ 점)를 빼먹기. 줄기·잎이 어느 자리인지 알 수 없어요.</li>
<li>줄기를 연속해서 적지 않기. 자료가 없는 줄기도 빈칸으로 두고 줄기는 이어서 적어야 해요.</li>
<li>잎을 크기순으로 쓰지 않기. 순위(몇 번째로 큰 값) 문제가 틀려져요.</li>
<li>가려진 잎을 구할 때 "줄기의 수"를 개수로 착각하기. 개수는 <strong>잎의 수</strong>예요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>평균은 가평균으로 쉽게!</strong> 값들이 $70$ 근처에 모여 있으면 각 값에서 $70$ 을 빼서 더한 뒤 자료의 수로 나눠 평균에 더해요. 위 자료의 경우 $70$ 을 기준으로 한 차이의 합은 $1460-70\times20=60$, 평균은 $70+\dfrac{60}{20}=73$ 이에요.</p>
<p><strong>"이상 / 이하 / 초과 / 미만"</strong>: 이상·이하는 그 값을 <strong>포함</strong>, 초과·미만은 <strong>포함하지 않아요</strong>. 줄기와 잎 그림에서 개수를 셀 때 경계 값을 포함하는지 꼭 확인하세요.</p>
<p><strong>비율(%)은 분수로</strong>: (해당 개수) $\div$ (전체 개수) $\times100$. 자료의 수가 $20,\ 25,\ 40,\ 50$ 이면 $100$ 으로 나누어떨어져서 계산이 깔끔해져요.</p>`
      },

      /* ───────── 1. 도수분포표 ───────── */
      {
        title: '도수분포표',
        body: r`
<p class="lead-line">자료가 너무 많아서 하나하나 보기 힘들 때는 "구간별로 몇 명인지"만 세어 표로 정리해요. 이 표가 도수분포표예요.</p>

<div class="def"><strong class="label">용어</strong>
<ul>
<li><strong>계급</strong>: 변량을 일정한 간격으로 나눈 구간. 예) $60$ 점 이상 $70$ 점 미만</li>
<li><strong>계급의 크기</strong>: 구간의 너비 (양 끝 값의 차). 예) $70-60=10$</li>
<li><strong>계급의 개수</strong>: 구간의 수</li>
<li><strong>도수</strong>: 각 계급에 속하는 자료의 개수 (몇 명인지)</li>
<li><strong>계급값</strong>: 계급을 대표하는 값 = 그 계급의 <strong>가운데 값</strong></li>
<li><strong>도수분포표</strong>: 계급과 도수를 표로 나타낸 것</li>
</ul>
<div class="formula">
$$\text{계급값}=\dfrac{(\text{계급의 양 끝 값의 합})}{2}$$
</div>
</div>

<div class="def"><strong class="label">도수분포표 만드는 방법</strong>
<ol>
<li>자료의 <strong>가장 큰 값과 가장 작은 값</strong>을 찾아요. (범위)</li>
<li><strong>계급의 크기</strong>를 정해요. (보통 $5$, $10$ 처럼 깔끔한 수)</li>
<li>가장 작은 값이 들어가도록 첫 계급을 정하고, 일정한 크기로 계급을 이어서 만들어요.</li>
<li>각 계급에 속하는 자료의 개수를 <strong>세어요</strong>. 세다가 놓치지 않도록 <strong>바를 정(正) 자 표시</strong>(tally)를 쓰면 편해요.</li>
<li>도수의 합이 전체 자료의 수와 같은지 <strong>검산</strong>해요.</li>
</ol>
</div>

<div class="formula">
<table>
<tr><th>계급 (점)</th><th>도수 (명)</th><th>계급값</th></tr>
<tr><td>40 이상 ~ 50 미만</td><td>3</td><td>45</td></tr>
<tr><td>50 이상 ~ 60 미만</td><td>6</td><td>55</td></tr>
<tr><td>60 이상 ~ 70 미만</td><td>9</td><td>65</td></tr>
<tr><td>70 이상 ~ 80 미만</td><td>5</td><td>75</td></tr>
<tr><td>80 이상 ~ 90 미만</td><td>2</td><td>85</td></tr>
<tr><td>합계</td><td>25</td><td></td></tr>
</table>
<p>계급의 크기 $=10$ 점, 계급의 개수 $=5$ 개</p>
</div>

<div class="def"><strong class="label">도수분포표에서 평균 구하기</strong>
<p>도수분포표에서는 원래 값을 모르므로 <strong>각 계급의 모든 변량이 계급값과 같다</strong>고 보고 평균을 구해요.</p>
<div class="formula">
$$\text{평균}=\dfrac{\sum(\text{계급값}\times\text{도수})}{(\text{도수의 총합})}$$
</div>
</div>

<div class="why"><strong class="label">왜 계급값을 쓸까?</strong>
<p>$60$ 이상 $70$ 미만 계급의 $9$ 명은 점수가 제각각이지만, 정확한 점수를 모르니 "중간쯤인 $65$ 점"이라고 대표값으로 삼는 거예요. 그래서 평균은 <strong>실제 평균과 조금 다를 수 있어요</strong>.</p>
</div>

<div class="ex"><strong class="label">예시 1 (계급의 크기·개수·계급값)</strong>
<p class="exq">위 도수분포표에서 계급의 크기, 계급의 개수, 세 번째 계급의 계급값을 구하시오.</p>
<div class="exa">
<p>계급의 크기 $=50-40=10$ (점)</p>
<p>계급은 $40\sim50,\ 50\sim60,\ 60\sim70,\ 70\sim80,\ 80\sim90$ 으로 $5$ 개</p>
<p>세 번째 계급 $60$ 이상 $70$ 미만의 계급값 $=\dfrac{60+70}{2}=65$</p>
<p><strong>답: 계급의 크기 $10$ 점, 계급의 개수 $5$ 개, 계급값 $65$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (자료에서 도수 세기)</strong>
<p class="exq">학생 $15$ 명의 점수가 다음과 같다. 계급의 크기를 $10$ 점으로 하여 $60$ 점 이상 $70$ 점 미만인 계급의 도수를 구하시오.<br>$42,\ 47,\ 55,\ 58,\ 61,\ 63,\ 64,\ 67,\ 68,\ 72,\ 75,\ 77,\ 81,\ 88,\ 90$</p>
<div class="exa">
<p>$60$ 이상 $70$ 미만인 점수를 찾아요: $61,\ 63,\ 64,\ 67,\ 68$</p>
<p>모두 $5$ 개예요. (참고: $40$대 $2$, $50$대 $2$, $60$대 $5$, $70$대 $3$, $80$대 $2$, $90$대 $1$ → 합 $15$ ✓)</p>
<p><strong>답: $5$ 명</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (모르는 도수 구하기)</strong>
<p class="exq">총 $30$ 명을 조사한 도수분포표에서 도수가 차례로 $4,\ 7,\ A,\ 9,\ 3$ 일 때 $A$ 를 구하시오.</p>
<div class="exa">
<p>도수의 합은 전체와 같아요: $4+7+A+9+3=30$</p>
<p>$23+A=30$ 이므로 $A=7$</p>
<p><strong>답: $A=7$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (이상인 인원 · 비율)</strong>
<p class="exq">위의 도수분포표(합계 $25$ 명)에서 $70$ 점 이상인 학생은 몇 명이며 전체의 몇 $\%$ 인가?</p>
<div class="exa">
<p>$70\sim80$ 계급 $5$ 명 + $80\sim90$ 계급 $2$ 명 $=7$ (명)</p>
<p>$\dfrac{7}{25}\times100=28\ (\%)$</p>
<p><strong>답: $7$ 명, $28\%$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (도수가 가장 큰 계급의 계급값)</strong>
<p class="exq">도수가 가장 큰 계급과 그 계급의 계급값을 구하시오.</p>
<div class="exa">
<p>도수 $3,6,9,5,2$ 중 가장 큰 것은 $9$ → $60$ 점 이상 $70$ 점 미만</p>
<p>계급값 $=\dfrac{60+70}{2}=65$</p>
<p><strong>답: $60$ 이상 $70$ 미만, 계급값 $65$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (평균)</strong>
<p class="exq">위 도수분포표에서 계급값을 이용하여 평균을 구하시오.</p>
<div class="exa">
<p>(계급값)$\times$(도수): $45\times3=135,\ 55\times6=330,\ 65\times9=585,\ 75\times5=375,\ 85\times2=170$</p>
<p>합 $=135+330+585+375+170=1595$</p>
<p>평균 $=\dfrac{1595}{25}=63.8$ (점)</p>
<p><strong>답: $63.8$ 점</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (높은 순서로 몇 번째가 속한 계급)</strong>
<p class="exq">위 도수분포표에서 점수가 높은 순서로 $3$ 번째인 학생이 속한 계급을 구하시오.</p>
<div class="exa">
<p>높은 계급부터 도수를 더해요. $80\sim90$: $2$ 명 (누적 $2$) → 아직 $3$ 번째에 못 미쳐요.</p>
<p>$70\sim80$: $5$ 명 (누적 $7$) → $3\sim7$ 번째가 이 계급이에요.</p>
<p><strong>답: $70$ 점 이상 $80$ 점 미만</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (도수끼리 몇 배)</strong>
<p class="exq">$60$ 점 이상 $70$ 점 미만 계급의 도수는 $80$ 점 이상 $90$ 점 미만 계급의 도수의 몇 배인가?</p>
<div class="exa">
<p>$9\div2=4.5$ (배)</p>
<p><strong>답: $4.5$ 배</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li><strong>경계값 처리</strong>: $60$ 점은 "$50$ 이상 $60$ 미만"이 아니라 "$60$ 이상 $70$ 미만" 계급에 들어가요. "이상 ~ 미만"에서 아래 값은 포함, 위 값은 제외!</li>
<li>계급의 크기를 "계급의 개수"와 혼동하기.</li>
<li>계급값을 구할 때 양 끝 값의 합을 $2$ 로 나누지 않고 끝 값 하나를 쓰기.</li>
<li>평균을 구할 때 <strong>(계급값) $\times$ (도수)</strong> 대신 그냥 계급값들만 더해 계급의 수로 나누기. 인원수가 다르면 가중해야 해요.</li>
<li>도수의 합을 검산하지 않아 하나를 빼먹기.</li>
</ul>
</div>`,
        tip: r`
<p><strong>계급값은 첫 값에 크기의 절반을 더한 것</strong>: $60$ 이상 $70$ 미만이면 $60+5=65$. 계급의 크기가 $10$ 이면 $\dfrac{10}{2}=5$ 를 더하면 끝!</p>
<p><strong>계급값은 등차수열</strong>처럼 일정하게 늘어나요: $45,\ 55,\ 65,\ 75,\ 85$ (계급의 크기만큼씩). 하나만 구하면 나머지는 더하기만 하면 돼요.</p>
<p><strong>평균은 가평균으로</strong>: 계급값 $65$ 를 기준으로 각 계급값과의 차 $(-20,-10,0,+10,+20)$ 에 도수를 곱해 더하면 $-60-60+0+50+40=-30$. 평균 $=65+\dfrac{-30}{25}=63.8$. 큰 곱셈을 피할 수 있어요.</p>
<p><strong>"몇 배"</strong> 문제는 $\dfrac{\text{구하는 도수}}{\text{기준 도수}}$ 로 쓰세요. "$A$ 는 $B$ 의 몇 배" → $A\div B$.</p>`
      },

      /* ───────── 2. 히스토그램과 도수분포다각형 ───────── */
      {
        title: '히스토그램과 도수분포다각형',
        body: r`
<p class="lead-line">도수분포표를 그림으로 바꾸면 분포가 한눈에 보여요. 히스토그램은 "막대 모양", 도수분포다각형은 "꺾은선 모양"이에요.</p>

<div class="def"><strong class="label">히스토그램</strong>
<p>도수분포표를 그래프로 나타낸 것. 가로축에는 <strong>계급</strong>, 세로축에는 <strong>도수</strong>를 놓고 각 계급의 크기를 가로, 도수를 세로로 하는 <strong>직사각형</strong>을 서로 붙여 그려요.</p>
<ul>
<li>직사각형의 수 = 계급의 개수</li>
<li>직사각형의 가로 = 계급의 크기, 세로(높이) = 도수</li>
<li>막대그래프와 달리 직사각형 사이에 <strong>간격이 없어요</strong>. (연속된 구간이기 때문)</li>
</ul>
</div>

<div class="def"><strong class="label">도수분포다각형</strong>
<p>히스토그램의 각 직사각형의 <strong>윗변의 가운데 점(계급값, 도수)</strong>을 선분으로 이어 만든 다각형 모양의 그래프. 양 끝에는 도수가 $0$ 인 계급이 하나씩 더 있다고 생각하고 가로축 위의 점과도 이어요.</p>
<ul>
<li>그래프 위의 점의 개수 = (계급의 개수) $+2$</li>
<li>여러 자료를 한 그림에 겹쳐 그려 비교하기 쉬워요.</li>
</ul>
</div>

<div class="formula">
$$\text{직사각형 하나의 넓이}=(\text{계급의 크기})\times(\text{도수})$$
$$\text{히스토그램의 직사각형의 넓이의 합}=(\text{계급의 크기})\times(\text{도수의 총합})$$
$$\text{도수분포다각형과 가로축으로 둘러싸인 넓이}=\text{히스토그램의 넓이의 합}$$
</div>

<div class="why"><strong class="label">왜 두 넓이가 같을까?</strong>
<p>도수분포다각형은 직사각형의 윗변 가운데 점들을 이은 선이에요. 각 직사각형에서 선 위로 튀어나온 삼각형과 선 아래로 비는 삼각형이 <strong>합동</strong>이라 서로 채워져요. 그래서 다각형의 넓이와 히스토그램의 넓이가 같아요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (읽기)</strong>
<p class="exq">위의 그림에서 직사각형은 몇 개이고, 가장 높은 직사각형이 나타내는 계급과 각 직사각형의 가로의 길이를 구하시오.</p>
<div class="exa">
<p>계급이 $5$ 개이므로 직사각형은 $5$ 개.</p>
<p>가장 높은 직사각형은 도수 $9$ → $60$ 점 이상 $70$ 점 미만 계급.</p>
<p>가로의 길이는 계급의 크기 $10$ 점.</p>
<p><strong>답: $5$ 개, $60$ 이상 $70$ 미만, 가로 $10$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (도수분포다각형의 점)</strong>
<p class="exq">$70$ 점 이상 $80$ 점 미만 계급에 해당하는 도수분포다각형의 점의 좌표를 (계급값, 도수)로 쓰시오.</p>
<div class="exa">
<p>계급값 $=\dfrac{70+80}{2}=75$, 도수 $=5$ → $(75,\ 5)$</p>
<p><strong>답: $(75,\ 5)$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (직사각형의 넓이의 합)</strong>
<p class="exq">위 히스토그램에서 직사각형의 넓이의 합을 구하시오.</p>
<div class="exa">
<p>(계급의 크기) $\times$ (도수의 총합) $=10\times25=250$</p>
<p>(하나씩 더해도 $10\times3+10\times6+10\times9+10\times5+10\times2=250$ ✓)</p>
<p><strong>답: $250$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (두 직사각형의 넓이의 비)</strong>
<p class="exq">$60$ 이상 $70$ 미만 직사각형과 $80$ 이상 $90$ 미만 직사각형의 넓이의 비를 구하시오.</p>
<div class="exa">
<p>가로가 같으므로 넓이의 비 $=$ 도수의 비 $=9:2$</p>
<p><strong>답: $9:2$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (도수분포다각형의 점 개수와 넓이)</strong>
<p class="exq">양 끝에 도수가 $0$ 인 계급을 하나씩 추가하여 그린 도수분포다각형 위의 점은 모두 몇 개이며, 이 다각형과 가로축으로 둘러싸인 넓이는?</p>
<div class="exa">
<p>점의 개수 $=5+2=7$ (개)</p>
<p>넓이 $=$ 히스토그램의 넓이의 합 $=10\times25=250$</p>
<p><strong>답: $7$ 개, 넓이 $250$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (일부 넓이의 비율)</strong>
<p class="exq">$70$ 점 이상인 계급의 직사각형의 넓이의 합은 전체 직사각형의 넓이의 합의 몇 $\%$ 인가?</p>
<div class="exa">
<p>$70$ 점 이상의 직사각형 넓이의 합 $=10\times(5+2)=70$, 전체 $=250$</p>
<p>$\dfrac{70}{250}\times100=28\ (\%)$ (도수의 비율 $\dfrac{7}{25}=28\%$ 와 같아요.)</p>
<p><strong>답: $28\%$</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>히스토그램의 높이를 <strong>계급값</strong>으로 읽기. 높이는 도수예요.</li>
<li>도수분포다각형의 점을 직사각형의 <strong>모서리</strong>에 찍기. 윗변의 <strong>가운데</strong>(계급값)예요.</li>
<li>점의 개수를 계급의 개수로만 세기. 양 끝에 도수가 $0$ 인 점 $2$ 개를 더해서 (계급의 개수) $+2$ 예요.</li>
<li>넓이를 "도수의 합"으로만 답하기. <strong>계급의 크기를 곱해야</strong> 해요.</li>
<li>막대그래프처럼 막대 사이를 띄우기.</li>
</ul>
</div>`,
        tip: r`
<p><strong>"넓이 = 계급의 크기 × 도수"</strong>. 계급의 크기가 같으니 두 직사각형의 넓이의 비는 그냥 <strong>도수의 비</strong>, 부분 넓이가 전체에서 차지하는 비율은 <strong>도수의 비율</strong>과 같아요. 긴 곱셈 없이 도수만 계산하세요.</p>
<p><strong>점 세기</strong>: 도수분포다각형은 (계급의 개수) $+2$ 개의 점으로 이루어져 있어요. 계급이 $6$ 개면 점은 $8$ 개!</p>
<p><strong>비교</strong>: 두 도수분포다각형을 겹쳐 그렸을 때 <strong>오른쪽으로 치우친 쪽</strong>이 변량이 더 큰(점수가 높은) 집단이에요. 단, 자료의 총수가 다르면 상대도수로 비교해야 해요(다음 시간).</p>`
      },

      /* ───────── 3. 상대도수 ───────── */
      {
        title: '상대도수',
        body: r`
<p class="lead-line">상대도수는 "전체 중에서 얼마나 차지하는가"를 나타내는 비율이에요. 인원수가 다른 두 집단을 공평하게 비교할 때 꼭 필요해요.</p>

<div class="def"><strong class="label">개념</strong>
<p><strong>상대도수</strong> $=\dfrac{(\text{그 계급의 도수})}{(\text{도수의 총합})}$</p>
<ul>
<li>각 계급의 상대도수는 $0$ 이상 $1$ 이하예요.</li>
<li><strong>상대도수의 총합은 항상 $1$</strong> 이에요.</li>
<li>상대도수에 $100$ 을 곱하면 <strong>백분율(%)</strong>이 돼요.</li>
<li><strong>상대도수의 분포표</strong>: 도수분포표에 상대도수 칸을 추가한 표.</li>
</ul>
<div class="formula">
$$(\text{상대도수})=\dfrac{(\text{도수})}{(\text{도수의 총합})}$$
$$(\text{도수})=(\text{상대도수})\times(\text{도수의 총합})$$
$$(\text{도수의 총합})=\dfrac{(\text{도수})}{(\text{상대도수})}$$
</div>
</div>

<div class="formula">
<table>
<tr><th>계급 (점)</th><th>도수 (명)</th><th>상대도수</th></tr>
<tr><td>40 이상 ~ 50 미만</td><td>3</td><td>0.12</td></tr>
<tr><td>50 이상 ~ 60 미만</td><td>6</td><td>0.24</td></tr>
<tr><td>60 이상 ~ 70 미만</td><td>9</td><td>0.36</td></tr>
<tr><td>70 이상 ~ 80 미만</td><td>5</td><td>0.20</td></tr>
<tr><td>80 이상 ~ 90 미만</td><td>2</td><td>0.08</td></tr>
<tr><td>합계</td><td>25</td><td>1</td></tr>
</table>
</div>

<div class="why"><strong class="label">왜 상대도수로 비교할까?</strong>
<p>A반은 $30$ 명 중 $12$ 명, B반은 $50$ 명 중 $15$ 명이 합격했다고 해요. 합격자 수만 보면 B반이 더 많지만 <strong>반 전체 인원이 달라서</strong> 공평하지 않아요. 비율로 보면 A반은 $\dfrac{12}{30}=0.4$, B반은 $\dfrac{15}{50}=0.3$ 이라 A반이 더 높아요. 이렇게 <strong>전체의 수가 다른 두 집단을 비교할 때</strong> 상대도수를 써요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (상대도수 구하기)</strong>
<p class="exq">위 도수분포표에서 $60$ 점 이상 $70$ 점 미만 계급의 상대도수를 구하시오.</p>
<div class="exa">
<p>$\dfrac{9}{25}=0.36$</p>
<p><strong>답: $0.36$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (백분율로)</strong>
<p class="exq">$70$ 점 이상인 학생은 전체의 몇 $\%$ 인가? (상대도수를 이용)</p>
<div class="exa">
<p>$70$ 점 이상 계급의 상대도수의 합 $=0.20+0.08=0.28$</p>
<p>$0.28\times100=28\ (\%)$</p>
<p><strong>답: $28\%$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (도수 구하기)</strong>
<p class="exq">도수의 총합이 $40$ 이고 어떤 계급의 상대도수가 $0.35$ 일 때 이 계급의 도수를 구하시오.</p>
<div class="exa">
<p>(도수) $=$ (상대도수) $\times$ (도수의 총합) $=0.35\times40=14$</p>
<p><strong>답: $14$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 4 (도수의 총합 구하기)</strong>
<p class="exq">어떤 계급의 도수가 $12$ 이고 상대도수가 $0.3$ 일 때 도수의 총합을 구하시오.</p>
<div class="exa">
<p>(도수의 총합) $=\dfrac{12}{0.3}=40$</p>
<p><strong>답: $40$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 5 (총합이 1임을 이용)</strong>
<p class="exq">네 계급의 상대도수가 $0.14,\ 0.26,\ 0.30,\ 0.12$ 일 때 나머지 한 계급의 상대도수를 구하시오.</p>
<div class="exa">
<p>합 $=0.14+0.26+0.30+0.12=0.82$</p>
<p>나머지 $=1-0.82=0.18$</p>
<p><strong>답: $0.18$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 6 (총합을 이용해 다른 계급의 상대도수)</strong>
<p class="exq">어떤 계급의 도수가 $12$ 이고 상대도수가 $0.15$ 이다. 도수가 $20$ 인 다른 계급의 상대도수를 구하시오.</p>
<div class="exa">
<p>도수의 총합 $=\dfrac{12}{0.15}=80$</p>
<p>도수가 $20$ 인 계급의 상대도수 $=\dfrac{20}{80}=0.25$</p>
<p><strong>답: $0.25$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 7 (두 집단 비교)</strong>
<p class="exq">수학 점수가 $80$ 점 이상인 학생이 A반은 $30$ 명 중 $12$ 명, B반은 $50$ 명 중 $15$ 명이다. 어느 반의 비율이 더 높으며 그 상대도수의 차는 얼마인가?</p>
<div class="exa">
<p>A반: $\dfrac{12}{30}=0.4$, B반: $\dfrac{15}{50}=0.3$</p>
<p>A반이 더 높고, 차는 $0.4-0.3=0.1$</p>
<p><strong>답: A반, $0.1$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 8 (상대도수로 학생 수 비교)</strong>
<p class="exq">A집단(총 $40$ 명)에서 어떤 계급의 상대도수는 $0.25$, B집단(총 $20$ 명)에서 같은 계급의 상대도수는 $0.4$ 이다. 이 계급에 속한 학생은 어느 집단이 몇 명 더 많은가?</p>
<div class="exa">
<p>A집단: $0.25\times40=10$ (명), B집단: $0.4\times20=8$ (명)</p>
<p>$10-8=2$</p>
<p><strong>답: A집단이 $2$ 명 더 많다</strong> (상대도수는 B가 더 크지만 학생 수는 A가 더 많아요!)</p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>"상대도수가 크면 학생 수도 많다"고 생각하기. 상대도수는 <strong>비율</strong>이라서 총 인원이 다르면 도수는 달라질 수 있어요.</li>
<li>상대도수를 구할 때 분모에 <strong>그 계급의 도수</strong>를 쓰기. 분모는 <strong>도수의 총합</strong>이에요.</li>
<li>상대도수의 총합이 $1$ 이 아닌데 그냥 넘어가기. 반올림 때문이 아니라면 어딘가 틀린 거예요.</li>
<li>백분율로 바꿀 때 $100$ 을 곱하지 않기. $0.28\to28\%$.</li>
</ul>
</div>`,
        tip: r`
<p><strong>삼각형 기억법</strong>: 도수 = 상대도수 $\times$ 총합. 세 값 중 두 개를 알면 나머지를 구해요. 위에 "도수", 아래에 "상대도수 · 총합" 을 놓고 가리고 싶은 것을 손으로 가리면 식이 나와요.</p>
<p><strong>$0.25,\ 0.2,\ 0.5$ 는 분수로 바꿔 계산</strong>: $0.25=\dfrac14$, $0.2=\dfrac15$, $0.5=\dfrac12$, $0.4=\dfrac25$. 총합을 구할 때 편해요.</p>
<p><strong>상대도수의 합 $=1$</strong> 을 이용하면 계산 하나를 줄일 수 있어요. 마지막 계급은 $1$ 에서 나머지를 빼면 돼요.</p>
<p><strong>비교할 때는 "비율"인지 "개수"인지</strong> 문제를 먼저 확인하세요. "비율이 더 높은 쪽"은 상대도수, "몇 명 더 많은지"는 상대도수 $\times$ 총합으로 도수를 구해서 비교해요.</p>`
      },

      /* ───────── 4. (추가) 대푯값 ───────── */
      {
        title: '대푯값: 평균, 중앙값, 최빈값',
        body: r`
<p class="lead-line">자료 전체를 한 숫자로 대표해서 말하고 싶을 때 쓰는 값이 대푯값이에요. 대표적으로 평균, 중앙값, 최빈값이 있어요.</p>

<div class="def"><strong class="label">개념</strong>
<ul>
<li><strong>평균</strong> $=\dfrac{(\text{변량의 총합})}{(\text{변량의 개수})}$</li>
<li><strong>중앙값</strong>: 변량을 크기순으로 늘어놓았을 때 <strong>가운데에 있는 값</strong>. 변량의 개수가 홀수면 가운데 값 하나, <strong>짝수면 가운데 두 값의 평균</strong>.</li>
<li><strong>최빈값</strong>: 자료에서 <strong>가장 많이 나타나는 값</strong> (여러 개일 수도 있어요).</li>
</ul>
</div>

<div class="why"><strong class="label">어떤 대푯값이 좋을까?</strong>
<p>한 학생의 점수만 아주 크거나 작아도 <strong>평균은 크게 변해요</strong>. 이런 극단적인 값이 있을 땐 중앙값이 더 믿을 만해요. 신발 가게에서 가장 많이 팔리는 치수를 알고 싶다면 최빈값이 필요하고요.</p>
</div>

<div class="ex"><strong class="label">예시 1 (홀수 개)</strong>
<p class="exq">$3,\ 5,\ 5,\ 7,\ 9$ 의 평균, 중앙값, 최빈값을 구하시오.</p>
<div class="exa">
<p>평균 $=\dfrac{3+5+5+7+9}{5}=\dfrac{29}{5}=5.8$</p>
<p>중앙값: 이미 크기순이고 $3$ 번째 값 $=5$</p>
<p>최빈값: $5$ 가 $2$ 번으로 가장 많아요.</p>
<p><strong>답: 평균 $5.8$, 중앙값 $5$, 최빈값 $5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 2 (짝수 개)</strong>
<p class="exq">$2,\ 4,\ 6,\ 10$ 의 중앙값을 구하시오.</p>
<div class="exa">
<p>변량이 $4$ 개(짝수)이므로 가운데 두 값 $4,\ 6$ 의 평균을 구해요.</p>
<p>$\dfrac{4+6}{2}=5$</p>
<p><strong>답: $5$</strong></p>
</div></div>

<div class="ex"><strong class="label">예시 3 (극단적인 값의 영향)</strong>
<p class="exq">$4,\ 5,\ 6,\ 7,\ 8$ 에 $50$ 을 추가한 자료에서 평균과 중앙값은 각각 어떻게 변하는가?</p>
<div class="exa">
<p>처음: 평균 $=\dfrac{30}{5}=6$, 중앙값 $=6$</p>
<p>추가 후: $4,5,6,7,8,50$ → 평균 $=\dfrac{80}{6}\approx13.3$, 중앙값 $=\dfrac{6+7}{2}=6.5$</p>
<p><strong>답: 평균은 $6$ 에서 약 $13.3$ 으로 크게 변하고, 중앙값은 $6$ 에서 $6.5$ 로 조금만 변해요.</strong></p>
</div></div>

<div class="warn"><strong class="label">자주 하는 실수</strong>
<ul>
<li>중앙값을 구할 때 <strong>크기순으로 정렬하지 않기</strong>.</li>
<li>변량이 짝수 개일 때 가운데 두 값 중 하나만 고르기. 두 값의 <strong>평균</strong>을 구해요.</li>
<li>최빈값을 "가장 큰 값"으로 착각하기. 가장 <strong>많이 나온</strong> 값이에요.</li>
</ul>
</div>`,
        tip: r`
<p><strong>중앙값 위치 찾기</strong>: 변량이 $n$ 개일 때 $n$ 이 홀수면 $\dfrac{n+1}{2}$ 번째 값, $n$ 이 짝수면 $\dfrac{n}{2}$ 번째와 $\left(\dfrac{n}{2}+1\right)$ 번째 값의 평균이에요.</p>
<p><strong>평균이 정수가 아니어도 걱정 마세요</strong>: 평균은 분수나 소수가 될 수 있어요. 반올림 지시가 없으면 분수나 소수로 그대로 써요.</p>`
      }
    ],
    examples: [
      {
        q: r`줄기 $4$ 에 잎 $1,\ 5,\ 7$, 줄기 $5$ 에 잎 $0,\ 3,\ 3,\ 8$ 인 줄기와 잎 그림이 있다. 자료의 수와 평균을 구하시오. ($4\,|\,1$ 은 $41$ 점)`,
        a: r`<p>자료의 수 $=3+4=7$</p><p>변량: $41,\ 45,\ 47,\ 50,\ 53,\ 53,\ 58$ → 합 $=347$</p><p>평균 $=\dfrac{347}{7}\approx49.6$ (점)</p><p><strong>답: $7$ 명, 평균 약 $49.6$ 점</strong></p>`
      },
      {
        q: r`도수분포표에서 계급의 크기가 $5$ 이고 어떤 계급이 $20$ 이상 $25$ 미만일 때, 이 계급의 계급값을 구하시오.`,
        a: r`<p>계급값 $=\dfrac{20+25}{2}=22.5$</p><p><strong>답: $22.5$</strong></p>`
      },
      {
        q: r`도수의 총합이 $50$ 이고 어떤 계급의 도수가 $15$ 일 때 이 계급의 상대도수와 백분율을 구하시오.`,
        a: r`<p>상대도수 $=\dfrac{15}{50}=0.3$, 백분율 $=0.3\times100=30\%$</p><p><strong>답: $0.3$, $30\%$</strong></p>`
      },

          a: sol([r`조립제법에서 $x=${k}$ 를 이용하면 계수는 $${c.join(',\ ')}\ \to\ ${s.join(',\ ')}$ 입니다.`, r`마지막 수가 나머지, 앞의 수들이 몫의 계수입니다.`], r`몫 $${poly(qt)}$, 나머지 $${rem}$`, true) };

    ],
    3: [
      () => {
        const [r1, r2] = distinct(-3, 4, 2).sort((x, y) => x - y), a = nz(-4, 4), b = R(-5, 5);
        const m1 = a * r1 + b, m2 = a * r2 + b;
        return { q: r`다항식 $f(x)$ 를 $${fac('x', r1)}$ 로 나눈 나머지가 $${m1}$, $${fac('x', r2)}$ 로 나눈 나머지가 $${m2}$ 일 때, $f(x)$ 를 $${fac('x', r1)}${fac('x', r2)}$ 로 나눈 나머지를 구하시오.`,

      }
    ]
  };

  /* 인수분해 */
  const P2 = {
    1: [
      () => {
        const p = nz(-8, 8), q = nz(-8, 8);
        return { q: r`$${poly([1, p + q, p * q])}$ 을 인수분해하시오.`,
          a: sol([r`합이 $${p + q}$, 곱이 $${p * q}$ 인 두 수는 $${p},\ ${q}$ 입니다.`], facs([-p, -q])) };
      },
      () => {
        const k = R(2, 5), m = R(2, 6);
        return { q: r`$${poly([k, 0, -k * m * m])}$ 을 인수분해하시오.`,
          a: sol([r`공통인수 $${k}$ 로 묶으면 $${k}(x^2-${m * m})$`, r`$x^2-${m}^2=(x+${m})(x-${m})$`], `${k}${facs([m, -m])}`) };
      }
    ],
    2: [
      () => {
        let a, b, p, q;

        const c = [a * b, a * q + b * p, p * q];
        return { q: r`$${poly(c)}$ 을 인수분해하시오.`,
          a: sol([r`$${a * b}=${a}\times${b}$, $${p * q}=${p}\times${q}$ 로 놓고 교차해서 곱한 합이 $${c[1]}$ 이 되는 조합을 찾습니다.`], `(${lin(a, p)})(${lin(b, q)})`) };
      },

        const fails = tried.slice(0, -1).map(x => `f(${x})\\ne0`).join(',\\ ');

        return { q: r`$${poly(c)}$ 을 인수분해하시오.`,
          a: sol([r`$f(x)=${poly(c)}$ 로 놓고 상수항의 약수를 대입합니다.` + (fails ? r` $${fails}$ 이고` : '') + r` $f(${first})=0$ 이므로 $(${lin(1, -first)})$ 가 인수입니다.`,
            r`조립제법으로 나누면 몫은 $${qt}$ 입니다.`], facs(roots)) };
      },
      () => {
        const p = R(1, 3), q = R(1, 3), s = pick([1, -1]);
        return { q: r`$${expr([[p ** 3, 'x^3'], [s * q ** 3, '']])}$ 을 인수분해하시오.`,
          a: sol([r`$a^3${s > 0 ? '+' : '-'}b^3=(a${s > 0 ? '+' : '-'}b)(a^2${s > 0 ? '-' : '+'}ab+b^2)$ 에 $a=${p}x,\ b=${q}$ 를 대입합니다.`], `(${lin(p, s * q)})(${poly([p * p, -s * p * q, q * q])})`) };
      }
    ],
    3: [
      () => {
        const b = R(1, 3), ts = distinct(b + 1, b + 4, 2), p1 = ts[0] * (ts[0] - b), p2 = ts[1] * (ts[1] - b), A = poly([1, b, 0]);
        const roots = [-ts[0], -(b - ts[0]), -ts[1], -(b - ts[1])];
        return { q: r`$(${A})^2-${p1 + p2}(${A})+${p1 * p2}$ 을 인수분해하시오.`,

            r`$${A}-${p1}=${fac('x', -ts[0])}${fac('x', -(b - ts[0]))}$,　$${A}-${p2}=${fac('x', -ts[1])}${fac('x', -(b - ts[1]))}$`], facs(roots)) };
      },
      () => {
        const roots = distinct(-4, 4, 4, true), c = fromRoots(roots), order = [1, -1, 2, -2, 3, -3, 4, -4];

            r`$=(x^2-${a * a})(x^2-${b * b})$ 이고 각각 다시 인수분해합니다.`], facs([a, -a, b, -b])) };
      }
    ]
  };

  /* ───────── 2. 방정식과 부등식 ───────── */

  /* 복소수 */
  const UNIT = ['1', 'i', '-1', '-i'];
  const E0 = {
    1: [
      () => {
        const n = R(5, 60), qn = Math.floor(n / 4), m = n % 4, ans = UNIT[m];
        return { q: r`$i^{${n}}$ 의 값을 구하시오. (단, $i=\sqrt{-1}$)`,

      },
      () => {
        const [a, b, c, d] = [R(-5, 5), nz(-5, 5), R(-5, 5), nz(-5, 5)], m = Math.random() < 0.5;

        return { q: r`$(${cx(a, b)})${m ? '+' : '-'}(${cx(c, d)})$ 을 계산하시오.`,
          a: sol([r`실수부분은 실수부분끼리, 허수부분은 허수부분끼리 계산합니다.`, r`실수부분: $${a}${m ? '+' : '-'}${par(c)}=${re}$,　허수부분: $${b}${m ? '+' : '-'}${par(d)}=${im}$`], cx(re, im)) };
      },
      () => {
        const [a, b, c, d] = [nz(-4, 4), nz(-4, 4), nz(-4, 4), nz(-4, 4)];
        const re = a * c - b * d, im = a * d + b * c;
        return { q: r`$(${cx(a, b)})(${cx(c, d)})$ 을 계산하시오.`,
          a: sol([r`$i^2=-1$ 임을 이용하여 전개합니다.`, r`$=${a * c}${sg(a * d)}i${sg(b * c)}i${sg(b * d)}i^2=${a * c}${sg(-b * d)}${sg(a * d + b * c)}i$`], cx(re, im)) };
      }
    ],
    2: [
      () => {
        const a = R(-4, 5), b = nz(-4, 4), c = nz(-3, 3), d = nz(-3, 3), den = c * c + d * d;
        const re = F(a * c + b * d, den), im = F(b * c - a * d, den);
        return { q: r`$\dfrac{${cx(a, b)}}{${cx(c, d)}}$ 를 $p+qi$ 꼴로 나타내시오. ($p,q$ 는 실수)`,
          a: sol([r`분모의 켤레복소수 $${cx(c, -d)}$ 를 분모·분자에 곱합니다.`, r`분모: $(${cx(c, d)})(${cx(c, -d)})=${c}^2+${d}^2=${den}$`, r`분자: $(${cx(a, b)})(${cx(c, -d)})=${cx(a * c + b * d, b * c - a * d)}$`], cxF(re, im)) };
      },
      () => {
        const x = R(-5, 6), y = R(-5, 6), s = x + y, t = x - y;
        return { q: r`$(x+y)+(x-y)i=${cx(s, t)}$ 일 때, 실수 $x,\ y$ 의 값을 구하시오.`,
          a: sol([r`복소수가 서로 같을 조건에서 $x+y=${s},\ x-y=${t}$`, r`두 식을 더하면 $2x=${s + t}$, 빼면 $2y=${s - t}$`], `x=${x},\ y=${y}`) };
      },
      () => {
        const a = nz(-4, 4), b = nz(-4, 4);
        return { q: r`$(${cx(a, b)})^2$ 을 계산하시오.`,
          a: sol([r`$(${cx(a, b)})^2=${a * a}${sg(2 * a * b)}i${sg(b * b)}i^2$`, r`$i^2=-1$ 이므로 $=${a * a - b * b}${sg(2 * a * b)}i$`], cx(a * a - b * b, 2 * a * b)) };
      }
    ],
    3: [
      () => {
        const n = R(10, 100), m = n % 4, ans = ['0', 'i', 'i-1', '-1'][m];
        return { q: r`$i+i^2+i^3+\cdots+i^{${n}}$ 의 값을 구하시오.`,
          a: sol([r`$i+i^2+i^3+i^4=i-1-i+1=0$ 이므로 연속한 4개의 합은 $0$ 입니다.`, r`$${n}=4\times${Math.floor(n / 4)}+${m}$ 이므로 남는 ${m}개의 항만 더하면 됩니다.`], ans) };
      },
      () => {

      },
      () => {
        const n = R(2, 6), m = n % 4, v = 2 ** n, [re, im] = [[v, 0], [0, v], [-v, 0], [0, -v]][m];

          a: sol([r`$(1+i)^2=2i$ 이므로 $(1+i)^{${2 * n}}=(2i)^{${n}}=2^{${n}}\cdot i^{${n}}$`, r`$i^{${n}}=${UNIT[m]}$ 이므로 $${v}\cdot(${UNIT[m]})$`], cx(re, im)) };
      },
      () => {
        const a = nz(-3, 3), b = nz(-3, 3), c = nz(-3, 3), real = Math.random() < 0.5;

          a: sol([r`$z=(${reP})+(${imP})i$ 로 정리됩니다.`, real ? r`실수가 되려면 허수부분이 $0$: $${imP}=0$` : r`순허수가 되려면 실수부분이 $0$: $${reP}=0$ (이때 허수부분은 $0$ 이 아님)`], `x=${ftex(x)}`) };
      }
    ]
  };

  /* 이차방정식과 판별식 */
  const E1 = {
    1: [
      () => {
        const [p, q] = [nz(-6, 6), nz(-6, 6)];
        return { q: r`이차방정식 $${poly([1, p + q, p * q])}=0$ 을 푸시오.`,
          a: sol([r`좌변을 인수분해하면 $${facs([-p, -q])}=0$`], p === q ? `x=${-p}` : `x=${-p}\\text{ 또는 }x=${-q}`) };
      },
      () => {

        else if (t < 0.6) { c = Math.abs(c) + 1; b = R(-2, 2); }

        const kind = D > 0 ? '서로 다른 두 실근' : D === 0 ? '중근(실근)' : '서로 다른 두 허근';

      }
    ],
    2: [
      () => {
        const a = R(1, 3), b = 2 * R(-4, 4), c = R(-5, 4), res = quadSol(a, b, c);
        return { q: r`이차방정식 $${poly([a, b, c])}=0$ 을 푸시오.`,
          a: sol([r`$D=b^2-4ac=${par(b)}^2-4\cdot${par(a)}\cdot${par(c)}=${res.D}$`, r`근의 공식 $x=\dfrac{-b\pm\sqrt{D}}{2a}$ 를 이용합니다.`], res.t) };
      },
      () => {
        const p = nz(-4, 4), kind = pick([0, 1, 2]), p2 = p * p;

        const ans = [`k<${p2}`, `k=${p2}`, `k>${p2}`][kind];
        const cond = ['D/4>0', 'D/4=0', 'D/4<0'][kind];

          a: sol([r`$\dfrac{D}{4}=${par(p)}^2-k=${p2}-k$`, r`$${cond}$ 에서 $${p2}-k$ 의 부호를 따집니다.`], ans) };
      }
    ],
    3: [
      () => {
        const c1 = pick([1, 2, 3, -1, -2]), u = R(1, 3), c0 = u * u - c1 * c1, k1 = 2 * c1 - 2 * u, k2 = 2 * c1 + 2 * u;

          a: sol([r`$D=k^2-4(${kk})=${cat('k^2', expr([[-4 * c1, 'k'], [-4 * c0, '']]))}=0$`, r`$${facs([k1, k2], 'k')}=0$ 이므로 $k=${lo}$ 또는 $k=${hi}$`], `k=${lo}\\text{ 또는 }k=${hi}`) };
      },
      () => {
        const a = nz(-4, 4), b = nz(-4, 4), p = -2 * a, q = a * a + b * b;
        return { q: r`실수 $p,q$ 에 대하여 이차방정식 $x^2+px+q=0$ 의 한 근이 $${cx(a, b)}$ 일 때, $p+q$ 의 값을 구하시오.`,
          a: sol([r`계수가 실수이므로 켤레복소수 $${cx(a, -b)}$ 도 근입니다.`, r`근과 계수의 관계: $-p=${a}+${par(a)}=${2 * a}$ 이므로 $p=${p}$`, r`$q=(${cx(a, b)})(${cx(a, -b)})=${a}^2+${b}^2=${q}$`], p + q) };
      },
      () => {
        const p = nz(-3, 3), p2 = p * p, eq = cat(poly([1, -2 * p, 0]), 'k');
        return { q: r`이차함수 $y=${eq}$ 의 그래프가 $x$ 축과 만나지 않도록 하는 실수 $k$ 의 값의 범위를 구하시오.`,
          a: sol([r`$x$ 축과 만나지 않으므로 $${eq}=0$ 이 허근을 가져야 합니다.`, r`$\dfrac{D}{4}=${par(-p)}^2-k=${p2}-k<0$`], `k>${p2}`) };
      }
    ]
  };

  /* 근과 계수의 관계 */
  const E2 = {
    1: [
      () => {
        const a = R(1, 3), b = R(-6, 6), c = R(-6, 6);
        return { q: r`이차방정식 $${poly([a, b, c])}=0$ 의 두 근을 $\alpha,\ \beta$ 라 할 때, $\alpha+\beta$ 와 $\alpha\beta$ 의 값을 구하시오.`,

      },
      () => {
        const [p, q] = [R(-5, 6), R(-5, 6)];
        return { q: r`두 수 $${p},\ ${q}$ 를 근으로 하고 $x^2$ 의 계수가 $1$ 인 이차방정식을 구하시오.`,
          a: sol([r`합 $${p}+${par(q)}=${p + q}$, 곱 $${p}\cdot${par(q)}=${p * q}$`, r`$x^2-(\text{합})x+(\text{곱})=0$ 에 대입합니다.`], poly([1, -(p + q), p * q]) + '=0') };
      }
    ],

      () => {
        const n = R(4, 6), v = fact(n) - 2 * fact(n - 1);
        return { q: r`${n}명의 학생이 일렬로 설 때, 특정한 두 학생 A, B 가 이웃하지 않는 경우의 수를 구하시오.`,
          a: sol([r`(전체) $-$ (A, B 가 이웃하는 경우) 로 구합니다.`, r`전체: $${n}!=${fact(n)}$,　이웃하는 경우: $${n - 1}!\times2=${2 * fact(n - 1)}$`, r`$${fact(n)}-${2 * fact(n - 1)}=${v}$`], v) };
      },
      () => {
        const n = R(5, 8), k = R(3, 4), v = P(n - 1, k - 1);
        return { q: r`서로 다른 ${n}명 중에서 ${k}명을 뽑아 일렬로 세울 때, 특정한 한 명이 맨 앞에 서는 경우의 수를 구하시오.`,
          a: sol([r`맨 앞은 특정한 한 명으로 정해졌으므로 나머지 $${n - 1}$ 명 중 $${k - 1}$ 명을 뽑아 나열합니다.`, r`$${nPr(n - 1, k - 1)}=${v}$`], v) };
      },
      () => {
        const m = R(2, 4), f = R(2, 4), v = fact(m) * fact(f + 1);
        return { q: r`남학생 ${m}명과 여학생 ${f}명이 일렬로 설 때, 남학생끼리 이웃하여 서는 경우의 수를 구하시오.`,
          a: sol([r`남학생 $${m}$ 명을 한 묶음으로 보면 (묶음 1개 + 여학생 ${f}명) $=${f + 1}$ 개를 나열: $${f + 1}!=${fact(f + 1)}$`, r`묶음 안에서 남학생끼리 자리를 바꾸는 경우: $${m}!=${fact(m)}$`, r`$${fact(f + 1)}\times${fact(m)}=${v}$`], v) };
      }
    ],
    3: [
      () => {
        const a = R(3, 5), b = R(2, 4), v = fact(a) * P(a + 1, b);
        return { q: r`남학생 ${a}명과 여학생 ${b}명이 일렬로 설 때, 여학생끼리는 서로 이웃하지 않도록 서는 경우의 수를 구하시오.`,
          a: sol([r`남학생 $${a}$ 명을 먼저 세웁니다: $${a}!=${fact(a)}$`, r`남학생 사이사이와 양 끝, 모두 $${a + 1}$ 곳 중 $${b}$ 곳에 여학생을 세웁니다: $${nPr(a + 1, b)}=${P(a + 1, b)}$`, r`$${fact(a)}\times${P(a + 1, b)}=${v}$`], v) };
      },
      () => {
        const a = R(3, 5), b = R(2, 4), v = P(a, 2) * fact(a + b - 2);
        return { q: r`남학생 ${a}명과 여학생 ${b}명이 일렬로 설 때, 양 끝에 모두 남학생이 서는 경우의 수를 구하시오.`,
          a: sol([r`양 끝에 설 남학생을 뽑아 세웁니다: $${nPr(a, 2)}=${P(a, 2)}$`, r`나머지 $${a + b - 2}$ 명을 가운데에 세웁니다: $${a + b - 2}!=${fact(a + b - 2)}$`, r`$${P(a, 2)}\times${fact(a + b - 2)}=${v}$`], v) };
      },
      () => {
        const n = R(5, 9), k = R(3, 4), v = C(n - 1, k - 1) * fact(k);
        return { q: r`서로 다른 ${n}개의 문자 중에서 ${k}개를 택하여 일렬로 나열할 때, 특정한 문자 a 를 반드시 포함하는 경우의 수를 구하시오.`,
          a: sol([r`a 를 포함하여 ${k}개를 뽑는 방법: 나머지 $${n - 1}$ 개 중 $${k - 1}$ 개를 뽑으므로 $${nCr(n - 1, k - 1)}=${C(n - 1, k - 1)}$`, r`뽑은 ${k}개를 일렬로 나열: $${k}!=${fact(k)}$`, r`$${C(n - 1, k - 1)}\times${fact(k)}=${v}$`], v) };

  };

  const K2 = {
    1: [
      () => {
        const n = R(5, 10), k = R(2, 4);
        const num = Array.from({ length: k }, (_, i) => n - i).join('\\times'), den = Array.from({ length: k }, (_, i) => k - i).join('\\times');

      },
      () => {
        const n = R(8, 12), k = n - R(1, 2), s = n - k, den = s === 1 ? '1' : '2\\times1', num = s === 1 ? `${n}` : `${n}\\times${n - 1}`;
        return { q: r`$${nCr(n, k)}$ 의 값을 구하시오.`,
          a: sol([r`$${nCr(n, k)}=${nCr(n, s)}$ 임을 이용하면 계산이 쉽습니다.`, r`$${nCr(n, s)}=\dfrac{${num}}{${den}}=${C(n, k)}$`], C(n, k)) };
      }
    ],
    2: [
      () => {
        const n = R(6, 10), k = R(3, 4), v = C(n - 1, k - 1);
        return { q: r`${n}명 중에서 ${k}명을 뽑을 때, 특정한 한 명이 반드시 뽑히는 경우의 수를 구하시오.`,
          a: sol([r`특정한 한 명은 이미 뽑혔다고 생각하고 나머지 $${n - 1}$ 명 중 $${k - 1}$ 명을 뽑습니다.`, r`$${nCr(n - 1, k - 1)}=${v}$`], v) };
      },
      () => {
        const m = R(4, 6), f = R(3, 5), a = R(1, 3), b = R(1, 2), v = C(m, a) * C(f, b);
        return { q: r`남학생 ${m}명, 여학생 ${f}명 중에서 남학생 ${a}명, 여학생 ${b}명을 뽑는 경우의 수를 구하시오.`,
          a: sol([r`남학생 뽑기: $${nCr(m, a)}=${C(m, a)}$,　여학생 뽑기: $${nCr(f, b)}=${C(f, b)}$`, r`곱의 법칙: $${C(m, a)}\times${C(f, b)}=${v}$`], v) };
      },
      () => {
        const m = R(3, 5), f = R(3, 5), k = 3, v = C(m + f, k) - C(f, k);
        return { q: r`남학생 ${m}명, 여학생 ${f}명 중에서 ${k}명을 뽑을 때, 남학생이 적어도 한 명 포함되는 경우의 수를 구하시오.`,
          a: sol([r`여사건(남학생이 한 명도 없는 경우 = 모두 여학생)을 이용합니다.`, r`전체: $${nCr(m + f, k)}=${C(m + f, k)}$,　모두 여학생: $${nCr(f, k)}=${C(f, k)}$`, r`$${C(m + f, k)}-${C(f, k)}=${v}$`], v) };
      },
      () => {
        const n = R(5, 12), v = n * (n - 1) / 2;
        return { q: r`$${nCr('n', 2)}=${v}$ 일 때, 자연수 $n$ 의 값을 구하시오.`,
          a: sol([r`$\dfrac{n(n-1)}{2}=${v}$ 이므로 $n(n-1)=${2 * v}=${n}\times${n - 1}$`], n) };
      }
    ],
    3: [
      () => {
        const m = R(3, 5), n = R(3, 5), v = C(m, 2) * C(n, 2);
        return { q: r`평행한 직선 ${m}개와 이 직선들과 만나는 또 다른 평행한 직선 ${n}개로 만들어지는 평행사변형의 개수를 구하시오.`,
          a: sol([r`첫째 평행선 묶음에서 $2$ 개: $${nCr(m, 2)}=${C(m, 2)}$,　둘째 묶음에서 $2$ 개: $${nCr(n, 2)}=${C(n, 2)}$`, r`곱의 법칙: $${C(m, 2)}\times${C(n, 2)}=${v}$`], v) };
      },
      () => {
        const n = R(5, 12), v = n * (n - 3) / 2;
        return { q: r`볼록 ${n}각형의 대각선의 개수를 구하시오.`,
          a: sol([r`꼭짓점 $${n}$ 개 중 $2$ 개를 이어 만든 선분: $${nCr(n, 2)}=${C(n, 2)}$`, r`이 중 변의 개수 $${n}$ 을 빼면 $${C(n, 2)}-${n}=${v}$`], v) };
      },
      () => {
        const n = R(6, 9), k = R(3, 4), v = C(n, 3) - C(k, 3);
        return { q: r`평면 위에 ${n}개의 점이 있다. 이 중 ${k}개의 점은 한 직선 위에 있고, 그 외에는 어느 세 점도 한 직선 위에 있지 않을 때, 세 점을 꼭짓점으로 하는 삼각형의 개수를 구하시오.`,
          a: sol([r`세 점을 뽑는 모든 경우: $${nCr(n, 3)}=${C(n, 3)}$`, r`한 직선 위의 ${k}개 점에서 세 점을 뽑으면 삼각형이 되지 않으므로 $${nCr(k, 3)}=${C(k, 3)}$ 를 뺍니다.`, r`$${C(n, 3)}-${C(k, 3)}=${v}$`], v) };
      },
      () => {
        const n = R(6, 9), v = C(n, 3) - C(n - 2, 3);
        return { q: r`${n}명 중에서 ${3}명의 위원을 뽑을 때, 특정한 두 사람 A, B 중 적어도 한 명이 포함되는 경우의 수를 구하시오.`,
          a: sol([r`여사건(A, B 모두 뽑히지 않는 경우)을 이용합니다.`, r`전체: $${nCr(n, 3)}=${C(n, 3)}$,　A, B 를 제외한 $${n - 2}$ 명 중 $3$ 명: $${nCr(n - 2, 3)}=${C(n - 2, 3)}$`, r`$${C(n, 3)}-${C(n - 2, 3)}=${v}$`], v) };
      }
    ]
  };

  /* ───────── 4. 행렬 ───────── */

  const AF = [
    { t: 'i+j', f: (i, j) => i + j }, { t: 'i\\times j', f: (i, j) => i * j }, { t: '2i-j', f: (i, j) => 2 * i - j },
    { t: 'i^2-j', f: (i, j) => i * i - j }, { t: 'i-2j', f: (i, j) => i - 2 * j }, { t: '3i+j', f: (i, j) => 3 * i + j },
    { t: 'i+2j', f: (i, j) => i + 2 * j }, { t: 'i^2+j', f: (i, j) => i * i + j }, { t: '2i+3j', f: (i, j) => 2 * i + 3 * j },
    { t: 'j-i', f: (i, j) => j - i }, { t: 'i\\times j+1', f: (i, j) => i * j + 1 }, { t: '3i-j', f: (i, j) => 3 * i - j }
  ];
  const AFP = [
    { t: r`\begin{cases}i+j&(i\ge j)\\ i-j&(i<j)\end{cases}`, f: (i, j) => i >= j ? i + j : i - j },
    { t: r`\begin{cases}1&(i=j)\\ i+j&(i\ne j)\end{cases}`, f: (i, j) => i === j ? 1 : i + j },
    { t: r`\begin{cases}i\times j&(i\ge j)\\ 0&(i<j)\end{cases}`, f: (i, j) => i >= j ? i * j : 0 },
    { t: r`\begin{cases}i-j&(i\ge j)\\ 0&(i<j)\end{cases}`, f: (i, j) => i >= j ? i - j : 0 },
    { t: r`\begin{cases}2&(i=j)\\ i+j&(i\ne j)\end{cases}`, f: (i, j) => i === j ? 2 : i + j },
    { t: r`\begin{cases}i+j&(i+j\text{ 가 짝수})\\ 0&(i+j\text{ 가 홀수})\end{cases}`, f: (i, j) => (i + j) % 2 === 0 ? i + j : 0 }
  ];
  const build = (n, m, f) => Array.from({ length: n }, (_, i) => Array.from({ length: m }, (_, j) => f(i + 1, j + 1)));

  const M0 = {
    1: [
      () => {
        const o = pick(AF), M = build(2, 2, o.f);
        return { q: r`$i$ 행 $j$ 열의 성분 $a_{ij}$ 가 $a_{ij}=${o.t}$ 인 $2\times2$ 행렬 $A$ 를 구하시오.`,
          a: sol([r`$a_{11}=${M[0][0]},\ a_{12}=${M[0][1]},\ a_{21}=${M[1][0]},\ a_{22}=${M[1][1]}$`], mat(M)) };
      },
      () => {
        const o = pick(AF), M = build(2, 3, o.f);
        return { q: r`$i$ 행 $j$ 열의 성분 $a_{ij}$ 가 $a_{ij}=${o.t}$ 인 $2\times3$ 행렬 $A$ 를 구하시오.`,
          a: sol([r`행이 $2$ 개, 열이 $3$ 개이므로 $i=1,2$,　$j=1,2,3$ 을 차례로 대입합니다.`], mat(M)) };
      }
    ],
    2: [
      () => {
        const x = R(-5, 6), y = R(-5, 6), a = x + y, b = x - y, z = R(-4, 5);
        return { q: r`$\begin{pmatrix}x+y&2\\ ${z}&x-y\end{pmatrix}=\begin{pmatrix}${a}&2\\ ${z}&${b}\end{pmatrix}$ 일 때, 실수 $x,\ y$ 의 값을 구하시오.`,
          a: sol([r`두 행렬이 같으므로 대응하는 성분이 모두 같습니다. $x+y=${a},\ x-y=${b}$`, r`두 식을 더하면 $2x=${a + b}$, 빼면 $2y=${a - b}$`], `x=${x},\\ y=${y}`) };
      },
      () => {
        const o = pick(AF), M = build(3, 2, o.f);
        return { q: r`$i$ 행 $j$ 열의 성분 $a_{ij}$ 가 $a_{ij}=${o.t}$ 인 $3\times2$ 행렬 $A$ 를 구하시오.`,
          a: sol([r`행이 $3$ 개, 열이 $2$ 개입니다.`], mat(M)) };
      }
    ],
    3: [
      () => {
        const o = pick([...AF, ...AFP]), M = build(3, 3, o.f), s = M.flat().reduce((x, y) => x + y, 0);
        return { q: r`$i$ 행 $j$ 열의 성분 $a_{ij}$ 가 $a_{ij}=${o.t}$ 인 $3\times3$ 행렬 $A$ 의 모든 성분의 합을 구하시오.`,
          a: sol([r`$A=${mat(M)}$`, r`모든 성분을 더하면 $${M.map(row => row.reduce((x, y) => x + y, 0)).join('+')}$ (행별 합)`], s) };
      },
      () => {
        const o = pick([...AF, ...AFP]), M = build(3, 3, o.f), s = M[0][0] + M[1][1] + M[2][2];

          a: sol([r`$a_{11}=${M[0][0]},\ a_{22}=${M[1][1]},\ a_{33}=${M[2][2]}$`], s) };
      }
    ]
  };

  const M1 = {
    1: [
      () => {
        const A = rndM(2, 2, -5, 5), B = rndM(2, 2, -5, 5), k = pick([2, 3, -1, -2]), t = pick([0, 1, 2]);

        if (t === 1) return { q: r`$A=${mat(A)},\ B=${mat(B)}$ 일 때, $A-B$ 를 구하시오.`, a: sol([r`같은 위치의 성분끼리 뺍니다.`], mat(madd(A, B, -1))) };

    ],
    2: [
      () => {

          a: sol([r`$${a}A=${mat(mscl(A, a))},\ ${b}B=${mat(mscl(B, b))}$`], mat(res)) };
      },
      () => {
        const A = rndM(2, 2, -4, 4), X = rndM(2, 2, -4, 4), B = madd(A, X);
        return { q: r`$A=${mat(A)},\ B=${mat(B)}$ 일 때, $A+X=B$ 를 만족하는 행렬 $X$ 를 구하시오.`,
          a: sol([r`$X=B-A$ 이므로 같은 위치의 성분끼리 뺍니다.`], mat(X)) };
      }
    ],
    3: [
      () => {
        const A = rndM(2, 2, -4, 4), B = rndM(2, 2, -4, 4);
        if (Math.random() < 0.5) {
          const Pm = madd(A, B), Q = madd(A, B, -1);
          return { q: r`두 행렬 $A,\ B$ 에 대하여 $A+B=${mat(Pm)},\ A-B=${mat(Q)}$ 일 때, $A$ 와 $B$ 를 구하시오.`,
            a: sol([r`두 식을 더하면 $2A=${mat(madd(Pm, Q))}$ 이므로 $A=${mat(A)}$`, r`$B=(A+B)-A$ 에서 $B=${mat(B)}$`], r`$A=${mat(A)},\ B=${mat(B)}$`, true) };
        }
        const Pm = madd(mscl(A, 2), B), Q = madd(A, B, -1);
        return { q: r`두 행렬 $A,\ B$ 에 대하여 $2A+B=${mat(Pm)},\ A-B=${mat(Q)}$ 일 때, $A$ 와 $B$ 를 구하시오.`,
          a: sol([r`두 식을 더하면 $3A=${mat(madd(Pm, Q))}$ 이므로 $A=${mat(A)}$`, r`$B=A-(A-B)$ 에서 $B=${mat(B)}$`], r`$A=${mat(A)},\ B=${mat(B)}$`, true) };
      }
    ]
  };

  const M2 = {
    1: [
      () => {
        const A = rndM(2, 2, -2, 3), B = rndM(2, 2, -2, 3), M = mmul(A, B);
        return { q: r`$A=${mat(A)},\ B=${mat(B)}$ 일 때, $AB$ 를 구하시오.`,
          a: sol([r`$AB$ 의 $(i,j)$ 성분은 $A$ 의 $i$ 행과 $B$ 의 $j$ 열의 성분을 차례로 곱해 더한 값입니다.`, r`$(1,1)$ 성분: $${A[0][0]}\cdot${par(B[0][0])}+${par(A[0][1])}\cdot${par(B[1][0])}=${M[0][0]}$`], mat(M)) };
      }
    ],
    2: [
      () => {
        const A = rndM(2, 3, -2, 3), B = rndM(3, 2, -2, 3), M = mmul(A, B);
        return { q: r`$A=${mat(A)},\ B=${mat(B)}$ 일 때, $AB$ 를 구하시오.`,
          a: sol([r`$A$ 는 $2\times3$, $B$ 는 $3\times2$ 행렬이므로 $AB$ 는 $2\times2$ 행렬입니다.`], mat(M)) };
      },
      () => {
        const A = rndM(2, 2, -3, 3), M = mmul(A, A);
        return { q: r`$A=${mat(A)}$ 일 때, $A^2$ 을 구하시오.`, a: sol([r`$A^2=A\cdot A$ 를 계산합니다.`], mat(M)) };
      },
      () => {
        const A = rndM(2, 2, -2, 3), B = rndM(2, 2, -2, 3);
        return { q: r`$A=${mat(A)},\ B=${mat(B)}$ 일 때, $AB$ 와 $BA$ 를 각각 구하시오.`,
          a: sol([r`$AB=${mat(mmul(A, B))}$`, r`$BA=${mat(mmul(B, A))}$`], r`$AB=${mat(mmul(A, B))},\ BA=${mat(mmul(B, A))}$`, true) };
      }
    ],
    3: [
      () => {
        const k = nz(-3, 3), n = R(10, 100);

  /* ───────── 5. 도형의 방정식 ───────── */

  const pt = (n, x, y) => `\\mathrm{${n}}(${x},${y})`;

          a: sol([r`$P=\{${n}\text{의 배수}\},\ Q=\{${m}\text{의 배수}\}$`, k === 0 ? r`${n}의 배수는 모두 ${m}의 배수이므로 $P\subset Q$, 즉 $p\Rightarrow q$ 입니다. 역은 성립하지 않습니다.` : k === 1 ? r`${m}의 배수는 모두 ${n}의 배수이므로 $Q\subset P$, 즉 $q\Rightarrow p$ 입니다. $p\Rightarrow q$ 는 성립하지 않습니다.` : r`어느 쪽 포함관계도 성립하지 않으므로 $p\Rightarrow q,\ q\Rightarrow p$ 모두 거짓입니다.`], COND[k], true) };
      },
      () => {

            `${lo}\\le k\\le ${hi}`) };

            a: sol([r`$P\subset Q$ 이려면 $P=(${al},${be})$ 가 $Q=(-\infty,k)$ 에 포함되어야 하므로 $${be}\le k$`], `${be}`) }
          : { q: r`$p$: $${al}<x<${be}$,　$q$: $x>k$ 일 때, $p$ 가 $q$ 이기 위한 충분조건이 되도록 하는 실수 $k$ 의 최댓값을 구하시오.`,

  const S3 = {

  /* ───────── 7. 함수와 그래프 ───────── */

  const T1 = {

  const T2 = {
    1: [
      () => {

      () => {

          a: sol([r`분자를 분모로 나누면 $${lin(a, b)}=${a}(${lin(1, -p)})${sg(k)}$ 이므로`, r`$y=${a}+\dfrac{${k}}{${lin(1, -p)}}$ 로 변형됩니다. 점근선은 $x=${p},\ y=${a}$`], `x=${p},\\ y=${a}`) };
      }
    ],
    3: [

  /* ═════════════════ 기본 도형 ═════════════════ */

  <script>
/* 중1 문제 생성기 ④ 작도와 합동 · 평면도형 */
(function () {

          a: sol([r`컴퍼스로 길이를 옮기면 길이가 그대로 옮겨져요. $\overline{AB}$ 를 ${k}번 이어 놓은 것입니다.`, r`$${a}\times${k}=${a * k}$`], `${a * k}\\text{ cm}`) };

          a: sol([r`수직이등분선 위의 점은 선분의 양 끝점에서 같은 거리에 있어요.`, r`$\overline{P${P2}}=\overline{P${P1}}=${b}\text{ cm}$`], `${b}\\text{ cm}`) };
      },

          : r`직선 $l$ 밖의 한 점 $P$ 를 지나고 $l$ 에 평행한 직선 $m$ 을 동위각 $${deg(x)}$ 를 이용해 작도하였다. 이때 엇각의 크기를 구하시오.`;

    ],
    2: [

          : { q: r`반직선 $PX$ 위에 $\overline{PQ}=${a}\text{ cm}$ 가 되도록 점 $Q$ 를 잡고, $Q$ 에서 $P$ 쪽으로 $\overline{QR}=${b}\text{ cm}$ 가 되도록 점 $R$ 을 작도하였다. $\overline{PR}$ 의 길이를 구하시오.`,

          a: sol([r`$\overline{AC}=\overline{AB}=${a}$, $\overline{BC}=\overline{AB}=${a}$ 이므로 세 변의 길이가 모두 같은 정삼각형이에요.`, r`$${a}\times3=${3 * a}$`], `${3 * a}\\text{ cm}`) };
      },
      () => {

          a: sol([r`세 변을 $a\le b\le c$ 라 하고 $a+b+c=${P}$, $c\lt a+b$ 인 경우를 모두 찾습니다. (가장 긴 변은 $${P / 2}$ 미만)`, r`가능한 경우를 모두 찾으면 $${cnt}$ 가지입니다.`], `${cnt}\\text{ 가지}`) };
      },

  <script>
/* 쉬운 수학 학습 - 해시 라우팅 + 문제 풀기 (전체를 IIFE로 감싸 전역 충돌 방지) */

        <div class="group-title">${g.group}</div>

            ? `<a class="choice" href="#/math/${it.id}"><div class="name">${it.name}</div></a>`

        <div class="group-title">${p}</div>

    app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', ev => {

  }

  /* ---------- 시험지 ---------- */
  function viewPractice(gradeId, unitId, si, level) {
    const data = readyGrades()[gradeId];
    const unit = data && data.units.find(u => u.id === unitId);
    const sec = unit && unit.sections[si];
    if (!sec || !(window.GEN[unitId] && window.GEN[unitId][si])) return go('#/math');
    level = Math.min(2, Math.max(0, level | 0));
    setCrumbs([
      { label: '과목', href: '#/' }, { label: '수학', href: '#/math' },
      { label: data.gradeName, href: `#/math/${gradeId}` },
      { label: unit.title, href: `#/math/${gradeId}/${unitId}` }, { label: '문제 풀기' },

  function makeProblem(p, n) {
    const el = document.createElement('div');
    el.className = 'prob';
    el.innerHTML = `
      <div class="pq"><div class="pn">${n}.</div><div class="pt">${p.q}</div></div>
      <div class="tools">
        <button type="button" class="tool" data-t="pen">✏️ 연필</button>
        <button type="button" class="tool" data-t="eraser">🧽 지우개</button>
        <button type="button" class="tool" data-t="clear">전체 지우기</button>
        <button type="button" class="tool" data-t="grow">＋ 공간</button>
        <button type="button" class="tool solbtn" data-t="sol">정답·풀이 보기</button>
      </div>
      <div class="work"><span class="ph">여기에 풀이를 적어 보세요 (연필 버튼을 누르세요)</span><canvas class="ink"></canvas></div>
      <div class="sol" hidden>${p.a}</div>`;
    const work = el.querySelector('.work');
    const cv = el.querySelector('canvas');
    const ph = el.querySelector('.ph');
    const sol = el.querySelector('.sol');
    const ink = makeInk(cv, work);
    let mode = null; // 'pen' | 'eraser' | null

    function setMode(m) {
      mode = m;
      work.classList.toggle('pen', !!m);
      el.querySelector('[data-t="pen"]').classList.toggle('on', m === 'pen');
      el.querySelector('[data-t="eraser"]').classList.toggle('on', m === 'eraser');
      ink.setEraser(m === 'eraser');
    }
    el.querySelector('.tools').addEventListener('click', ev => {
      const b = ev.target.closest('.tool');
      if (!b) return;
      const t = b.dataset.t;
      if (t === 'pen') setMode(mode === 'pen' ? null : 'pen');
      else if (t === 'eraser') setMode(mode === 'eraser' ? null : 'eraser');
      else if (t === 'clear') { ink.clear(); ph.style.display = ''; }
      else if (t === 'grow') { work.style.height = (work.offsetHeight + 120) + 'px'; }
      else if (t === 'sol') {
        sol.hidden = !sol.hidden;

        if (!sol.hidden) typeset(sol);

    cv.addEventListener('pointerdown', () => { ph.style.display = 'none'; });
    return el;
  }

  /* 캔버스 필기: 포인터 이벤트, 크기 변화 시 그림 유지 */
  function makeInk(cv, wrap) {
    const ctx = cv.getContext('2d');
    let eraser = false, drawing = false, last = null, w = 0, h = 0, dpr = 1;

    function resize() {
      const rw = wrap.clientWidth, rh = wrap.clientHeight;
      if (!rw || !rh || (rw === w && rh === h)) return;
      const keep = document.createElement('canvas');
      keep.width = cv.width; keep.height = cv.height;
      if (cv.width) keep.getContext('2d').drawImage(cv, 0, 0);
      dpr = window.devicePixelRatio || 1;
      w = rw; h = rh;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (keep.width) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(keep, 0, 0); ctx.restore(); }
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
    window.addEventListener('resize', resize);
    setTimeout(resize, 0);

    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function style() {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = eraser ? 22 : 2.2;
    }
    cv.addEventListener('pointerdown', e => {
      resize();
      drawing = true; last = pos(e);
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      style(); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .01, last.y + .01); ctx.stroke();
      e.preventDefault();
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      style();
      for (const ev of (evs.length ? evs : [e])) {
        const p = pos(ev);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
      }
      e.preventDefault();
    });
    const end = () => { drawing = false; last = null; };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', end);

    return {
      setEraser(v) { eraser = v; },
      clear() { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); },
    };
  }

  /* ---------- 라우터 ---------- */
  function go(hash) { location.hash = hash; }

  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (parts.length === 0) viewSubjects();
    else if (parts[0] === 'math' && parts.length === 1) viewGrades();
    else if (parts[0] === 'math' && parts.length === 2) viewUnits(parts[1]);
    else if (parts[0] === 'math' && parts[3] === 'practice') viewPractice(parts[1], parts[2], +parts[4], +parts[5] || 0);
    else if (parts[0] === 'math' && parts.length >= 3) viewUnit(parts[1], parts[2]);
    else viewSubjects();
    window.scrollTo(0, 0);
    typeset();
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('load', route);
  document.addEventListener('DOMContentLoaded', () => setTimeout(() => typeset(), 300));
})();

  </script>
</body></html>
