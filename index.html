      }
    ],
    2: [
      () => {
        const a = R(-4, 5), b = nz(-4, 4), c = nz(-3, 3), d = nz(-3, 3), den = c * c + d * d;
        const re = F(a * c + b * d, den), im = F(b * c - a * d, den);

      },
      () => {

          a: sol([r`복소수가 서로 같을 조건에서 $x+y=${s},\ x-y=${t}$`, r`두 식을 더하면 $2x=${s + t}$, 빼면 $2y=${s - t}$`], `x=${x},\ y=${y}`) };
      },
      () => {

          a: sol([r`$(${cx(a, b)})^2=${a * a}${sg(2 * a * b)}i${sg(b * b)}i^2$`, r`$i^2=-1$ 이므로 $=${a * a - b * b}${sg(2 * a * b)}i$`], cx(a * a - b * b, 2 * a * b)) };
      }
    ],
    3: [
      () => {
        const n = R(10, 100), m = n % 4, ans = ['0', 'i', 'i-1', '-1'][m];
        return { q: r`$i+i^2+i^3+\cdots+i^{${n}}$ 의 값을 구하시오.`,
          a: sol([r`$i+i^2+i^3+i^4=i-1-i+1=0$ 이므로 연속한 4개의 합은 $0$ 입니다.`, r`$${n}=4\times${Math.floor(n / 4)}+${m}$ 이므로 남는 ${m}개의 항만 더하면 됩니다.`], ans) };

  /* 이차방정식과 판별식 */
  const E1 = {
    1: [
      () => {
        const [p, q] = [nz(-6, 6), nz(-6, 6)];

      }
    ],
    2: [
      () => {
        const a = R(1, 3), b = 2 * R(-4, 4), c = R(-5, 4), res = quadSol(a, b, c);
        return { q: r`이차방정식 $${poly([a, b, c])}=0$ 을 푸시오.`,
          a: sol([r`$D=b^2-4ac=${par(b)}^2-4\cdot${par(a)}\cdot${par(c)}=${res.D}$`, r`근의 공식 $x=\dfrac{-b\pm\sqrt{D}}{2a}$ 를 이용합니다.`], res.t) };
      },
      () => {
        const p = nz(-4, 4), kind = pick([0, 1, 2]), p2 = p * p;
        const eq = cat(poly([1, 2 * p, 0]), 'k') + '=0';

  const MULT = [2, 3, 4, 6, 8, 9, 12];
  const COND = ['충분조건이지만 필요조건은 아니다', '필요조건이지만 충분조건은 아니다', '필요충분조건이다', '충분조건도 필요조건도 아니다'];

    const pq = Q1[0] <= P1[0] && P1[1] <= Q1[1], qp = P1[0] <= Q1[0] && Q1[1] <= P1[1];

  };

  const S2 = {
    1: [
      () => {
        let n, m; do { n = pick(MULT); m = pick(MULT); } while (n === m);
        const ok = n % m === 0, ask = Math.random() < 0.5;

          a: sol([r`대우: 「$x$ 가 ${m}의 배수가 아니면 $x$ 는 ${n}의 배수가 아니다.」`, r`명제와 그 대우의 참, 거짓은 항상 같습니다. 원래 명제가 ${ok ? '참' : '거짓'}이므로 대우도 ${ok ? '참' : '거짓'}입니다.`], `대우는 ${ok ? '참' : '거짓'}`, true) };

    ],
    2: [
      () => {

        const k = n % m === 0 ? 0 : m % n === 0 ? 1 : 3;
        return { q: r`$p$: $x$ 는 ${n}의 배수,　$q$: $x$ 는 ${m}의 배수 일 때, $p$ 는 $q$ 이기 위한 어떤 조건인지 말하시오.`,
          a: sol([r`$P=\{${n}\text{의 배수}\},\ Q=\{${m}\text{의 배수}\}$`, k === 0 ? r`${n}의 배수는 모두 ${m}의 배수이므로 $P\subset Q$, 즉 $p\Rightarrow q$ 입니다. 역은 성립하지 않습니다.` : k === 1 ? r`${m}의 배수는 모두 ${n}의 배수이므로 $Q\subset P$, 즉 $q\Rightarrow p$ 입니다. $p\Rightarrow q$ 는 성립하지 않습니다.` : r`어느 쪽 포함관계도 성립하지 않으므로 $p\Rightarrow q,\ q\Rightarrow p$ 모두 거짓입니다.`], COND[k], true) };

  const S3 = {

      }
    ]
  };

  /* ───────── 7. 함수와 그래프 ───────── */

  const tail = n => n === 0 ? '' : sg(n);

  const T0 = {

            a > 0 ? r`$${expr([[p, 'a'], [1, 'b']])}=${u},\ ${expr([[q, 'a'], [1, 'b']])}=${v}$ 을 연립하여 $a=${a},\ b=${b}$` : r`$${expr([[p, 'a'], [1, 'b']])}=${v},\ ${expr([[q, 'a'], [1, 'b']])}=${u}$ 을 연립하여 $a=${a},\ b=${b}$`], a + b) };

  const T1 = {

        const a = pick([2, 3, -2, -3, 4]), b = R(-6, 6);
        return { q: r`일대일대응인 함수 $f(x)=${lin(a, b)}$ 의 역함수 $f^{-1}(x)$ 를 구하시오.`,
          a: sol([r`$y=${lin(a, b)}$ 에서 $x$ 에 대해 풀면 $x=\dfrac{y${tail(-b)}}{${a}}$`, r`$x$ 와 $y$ 를 서로 바꿉니다.`], `f^{-1}(x)=${lineY(F(1, a), F(-b, a)).slice(2)}`) };
      }
    ],
    3: [
      () => {
        const a = nz(-3, 3), b = R(-3, 3), c = R(-3, 3), d = R(-4, 4);
        const res = [a * a, 2 * a * b + c * a, b * b + c * b + d];
        return { q: r`$f(x)=${lin(a, b)},\ g(x)=${poly([1, c, d])}$ 일 때, $(g\circ f)(x)$ 를 구하시오.`,
          a: sol([r`$(g\circ f)(x)=g(f(x))=(${lin(a, b)})^2${c ? sg(c) + '(' + lin(a, b) + ')' : ''}${tail(d)}$`, r`전개하여 정리합니다.`], poly(res)) };
      },
      () => {
        const a = R(2, 4), b = nz(-4, 4), A = a * a, B = (a + 1) * b;
        return { q: r`함수 $f(x)=ax+b$ ($a>0$) 에 대하여 $(f\circ f)(x)=${lin(A, B)}$ 일 때, $a+b$ 의 값을 구하시오.`,
          a: sol([r`$(f\circ f)(x)=a(ax+b)+b=a^2x+(a+1)b$`, r`$a^2=${A}$ 이고 $a>0$ 이므로 $a=${a}$,　$(a+1)b=${B}$ 에서 $b=${b}$`], a + b) };
      },
      () => {
        const [a, b, c, d] = [pick([2, 3, -2, -3]), R(-4, 4), pick([2, 3, -2, -3]), R(-4, 4)], x0 = R(-3, 3), m = a * x0 + b, k = c * m + d;
        return { q: r`$f(x)=${lin(a, b)},\ g(x)=${lin(c, d)}$ 일 때, $(g\circ f)^{-1}(${k})$ 의 값을 구하시오.`,
          a: sol([r`$(g\circ f)^{-1}=f^{-1}\circ g^{-1}$ 이므로 $(g\circ f)^{-1}(${k})=f^{-1}(g^{-1}(${k}))$`, r`$g^{-1}(${k})=m$ 이면 $g(m)=${k}$: $${lin(c, d)}=${k}$ 에서 $m=${m}$`, r`$f^{-1}(${m})=n$ 이면 $f(n)=${m}$: $${lin(a, b)}=${m}$ 에서 $n=${x0}$`], x0) };
      }
    ]
  };

  const T2 = {
    1: [
      () => {
        const k = nz(-6, 6), p = R(-4, 4), q = R(-4, 4);
        const f = `\\dfrac{${k}}{${lin(1, -p)}}${tail(q)}`;
        return { q: r`함수 $y=${f}$ 의 그래프의 점근선의 방정식을 구하시오.`,
          a: sol([r`$y=\dfrac{k}{x-p}+q$ 꼴의 점근선은 $x=p,\ y=q$ 입니다.`], `x=${p},\\ y=${q}`) };
      },
      () => {
        const k = nz(-6, 6), p = R(-4, 4), q = R(-4, 4);
        return { q: r`함수 $y=\dfrac{${k}}{${lin(1, -p)}}${tail(q)}$ 의 정의역과 치역을 구하시오.`,
          a: sol([r`분모가 $0$ 이 되는 $x=${p}$ 는 정의역에서 제외되고, $y=${q}$ 는 함숫값이 될 수 없습니다.`], r`정의역 $\{x\mid x\ne${p}\}$, 치역 $\{y\mid y\ne${q}\}$`, true) };
      }
    ],
    2: [
      () => {
        const a = nz(-3, 3), p = R(-4, 4), k = nz(-6, 6), b = k - a * p;
        return { q: r`함수 $y=\dfrac{${lin(a, b)}}{${lin(1, -p)}}$ 의 그래프의 점근선의 방정식을 구하시오.`,
          a: sol([r`분자를 분모로 나누면 $${lin(a, b)}=${a}(${lin(1, -p)})${sg(k)}$ 이므로`, r`$y=${a}+\dfrac{${k}}{${lin(1, -p)}}$ 로 변형됩니다. 점근선은 $x=${p},\ y=${a}$`], `x=${p},\\ y=${a}`) };
      }
    ],
    3: [
      () => {
        let a, b, c, d;
        do { [a, b, c, d] = [nz(-4, 4), R(-4, 4), pick([2, 3, -2, -3]), R(-4, 4)]; } while (a * d - b * c === 0);
        const px = F(-d, c), qy = F(a, c);
        return { q: r`함수 $y=\dfrac{${lin(a, b)}}{${lin(c, d)}}$ 의 그래프의 점근선의 방정식을 구하시오.`,
          a: sol([r`분모가 $0$ 이 되는 값: $${lin(c, d)}=0$ 에서 $x=${ftex(px)}$ (세로 점근선)`, r`$x\to\infty$ 일 때 $y\to\dfrac{${a}}{${c}}=${ftex(qy)}$ (가로 점근선)`], `x=${ftex(px)},\\ y=${ftex(qy)}`) };
      },
      () => {
        const p = R(-3, 3), q = R(-3, 3), d = nz(-3, 3), m = nz(-4, 4), k = d * m, x0 = p + d, y0 = q + m;
        return { q: r`함수 $y=\dfrac{k}{x${tail(-p)}}${tail(q)}$ 의 그래프가 점 $(${x0},\ ${y0})$ 를 지날 때, 상수 $k$ 의 값을 구하시오.`,
          a: sol([r`$x=${x0},\ y=${y0}$ 를 대입하면 $${y0}=\dfrac{k}{${x0}${tail(-p)}}${tail(q)}=\dfrac{k}{${d}}${tail(q)}$`, r`$\dfrac{k}{${d}}=${m}$ 이므로 $k=${k}$`], k) };
      }
    ]
  };

  const sqrtT = (a, b) => `\\sqrt{${lin(1, a)}}${tail(b)}`;
  const mkEq = () => { // √(x+a) = x−b, 근 r1(참), r2(무연근)
    const b = R(-1, 3), r1 = b + R(2, 5), r2 = 2 * b + 1 - r1, a = b * b - r1 * r2;
    return { a, b, r1, r2 };
  };

  const T3 = {
    1: [
      () => {
        const a = R(-5, 5), b = R(-4, 4);
        return { q: r`함수 $y=${sqrtT(a, b)}$ 의 정의역과 치역을 구하시오.`,
          a: sol([r`근호 안이 $0$ 이상이어야 하므로 $${lin(1, a)}\ge0$ 에서 $x\ge${-a}$`, r`$\sqrt{\ }\ge0$ 이므로 $y\ge${b}$`], r`정의역 $\{x\mid x\ge${-a}\}$, 치역 $\{y\mid y\ge${b}\}$`, true) };
      },
      () => {
        const a = pick([2, 3, 4]), b = nz(-8, 8), bound = F(-b, a);
        return { q: r`함수 $y=\sqrt{${lin(a, b)}}$ 의 정의역을 구하시오.`,
          a: sol([r`$${lin(a, b)}\ge0$ 이므로 $${a}x\ge${-b}$`], `x\\ge ${ftex(bound)}`) };
      },
      () => {
        const a = R(-4, 5), b = R(-4, 4);
        return { q: r`함수 $y=\sqrt{${lin(-1, a)}}${tail(b)}$ 의 정의역과 치역을 구하시오.`,
          a: sol([r`$${lin(-1, a)}\ge0$ 에서 $x\le${a}$`, r`$y\ge${b}$`], r`정의역 $\{x\mid x\le${a}\}$, 치역 $\{y\mid y\ge${b}\}$`, true) };
      }
    ],
    2: [
      () => {
        const { a, b, r1, r2 } = mkEq();
        return { q: r`무리방정식 $\sqrt{${lin(1, a)}}=${lin(1, -b)}$ 을 푸시오.`,
          a: sol([r`양변을 제곱하면 $${lin(1, a)}=(${lin(1, -b)})^2$ 이므로 $${poly([1, -(2 * b + 1), b * b - a])}=0$`, r`$${facs([r1, r2])}=0$ 에서 $x=${Math.min(r1, r2)}$ 또는 $x=${Math.max(r1, r2)}$`, r`검산: $${lin(1, -b)}\ge0$ 이어야 하므로 $x\ge${b}$. $x=${r2}$ 는 $${r2 - b}<0$ 이므로 무연근입니다.`], `x=${r1}`) };
      },
      () => {
        const p = R(-4, 4), q = R(-4, 4);
        return { q: r`함수 $y=\sqrt{${lin(1, -p)}}${tail(q)}$ 의 그래프는 $y=\sqrt{x}$ 의 그래프를 평행이동한 것이다. 그래프의 시작점의 좌표를 구하시오.`,
          a: sol([r`$y=\sqrt{x}$ 를 $x$ 축 방향으로 $${p}$, $y$ 축 방향으로 $${q}$ 만큼 평행이동한 그래프이므로 시작점 $(0,0)$ 이 옮겨집니다.`], `(${p},\\ ${q})`) };
      },
      () => {
        const a = R(-4, 4), b = R(-3, 3), s = R(1, 4), x0 = s * s - a, y0 = s + b;
        return { q: r`함수 $y=\sqrt{x+a}${tail(b)}$ 의 그래프가 점 $(${x0},\ ${y0})$ 를 지날 때, 상수 $a$ 의 값을 구하시오.`,
          a: sol([r`$x=${x0},\ y=${y0}$ 를 대입하면 $\sqrt{${x0}+a}${tail(b)}=${y0}$`, r`$\sqrt{${x0}+a}=${s}$ 의 양변을 제곱하면 $${x0}+a=${s * s}$`], a) };
      }
    ],
    3: [
      () => {
        const a = R(-4, 4), b = R(-3, 3), inv = `${b === 0 ? 'x^2' : `(${lin(1, -b)})^2`}${tail(-a)}`;
        return { q: r`함수 $f(x)=${sqrtT(a, b)}$ 의 역함수 $f^{-1}(x)$ 와 그 정의역을 구하시오.`,
          a: sol([r`$y=${sqrtT(a, b)}$ 에서 $y${tail(-b)}=\sqrt{${lin(1, a)}}$ 이므로 양변을 제곱하면 $(y${tail(-b)})^2=${lin(1, a)}$`, r`$x=(y${tail(-b)})^2${tail(-a)}$ 에서 $x$ 와 $y$ 를 바꿉니다. 역함수의 정의역은 $f$ 의 치역 $y\ge${b}$ 입니다.`], r`$f^{-1}(x)=${inv}\ (x\ge${b})$`, true) };
      },
      () => {
        const { a, b, r1, r2 } = mkEq();
        return { q: r`함수 $f(x)=${sqrtT(a, b)}$ 의 그래프와 그 역함수 $y=f^{-1}(x)$ 의 그래프가 만나는 점의 $x$ 좌표를 구하시오.`,
          a: sol([r`$f$ 는 증가함수이므로 $f$ 와 $f^{-1}$ 의 교점은 직선 $y=x$ 위에 있습니다.`, r`$\sqrt{${lin(1, a)}}${tail(b)}=x$, 즉 $\sqrt{${lin(1, a)}}=${lin(1, -b)}$ 를 풉니다.`, r`양변을 제곱하면 $${poly([1, -(2 * b + 1), b * b - a])}=0$ 이므로 $x=${Math.min(r1, r2)}$ 또는 $x=${Math.max(r1, r2)}$`, r`$${lin(1, -b)}\ge0$ 이어야 하므로 $x=${r2}$ 는 무연근입니다.`], r1) };
      }
    ]
  };

  Object.assign(window.GEN, {
    logic: [S0, S1, S2, S3],
    function: [T0, T1, T2, T3]
  });
})();

  <script>
/* 쉬운 수학 학습 - 해시 라우팅 + 문제 풀기 (전체를 IIFE로 감싸 전역 충돌 방지) */
(function () {
  const H = window.H;
  const fix = html => H.fixMath(html || '');

  const SUBJECTS = [
    { id: 'math', name: '수학', desc: '개념과 계산 TIP', ready: true },
    { id: 'korean', name: '국어', desc: '', ready: false },
    { id: 'english', name: '영어', desc: '', ready: false },
    { id: 'science', name: '과학', desc: '', ready: false },
  ];
  const MATH_GRADES = [
    { group: '초등학교', items: ['초1', '초2', '초3', '초4', '초5', '초6'].map((n, i) => ({ id: 'e' + (i + 1), name: n })) },
    { group: '중학교', items: ['중1', '중2', '중3'].map((n, i) => ({ id: 'm' + (i + 1), name: n })) },
    { group: '고등학교', items: ['고1', '고2', '고3'].map((n, i) => ({ id: 'h' + (i + 1), name: n })) },
  ];
  const LEVELS = ['기초', '응용', '심화'];
  const TOTAL = 20, STEP = 5;

  function readyGrades() {
    const g = {};
    if (window.MATH_HIGH1) g.h1 = window.MATH_HIGH1;
    return g;
  }

  const app = document.getElementById('app');
  const crumbs = document.getElementById('crumbs');

  function setCrumbs(list) {
    crumbs.innerHTML = list.map((c, i) => {
      const sep = i > 0 ? '<span class="sep">/</span>' : '';
      return sep + (c.href ? `<a href="${c.href}">${c.label}</a>` : `<span>${c.label}</span>`);
    }).join('');
  }

  function typeset(root) {
    if (window.renderMathInElement) {
      window.renderMathInElement(root || app, {
        delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
        throwOnError: false,
      });
    }
  }

  /* ---------- 화면 ---------- */
  function viewSubjects() {
    setCrumbs([]);
    app.innerHTML = `
      <h1>무엇을 공부할까요?</h1>
      <p class="lead">과목을 선택하세요.</p>
      <div class="grid">
        ${SUBJECTS.map(s => s.ready
          ? `<a class="choice" href="#/${s.id}"><div class="name">${s.name}</div><div class="meta">${s.desc}</div></a>`
          : `<div class="choice disabled"><div class="name">${s.name}</div><span class="badge">준비 중</span></div>`).join('')}
      </div>`;
  }

  function viewGrades() {
    setCrumbs([{ label: '과목', href: '#/' }, { label: '수학' }]);
    const ready = readyGrades();
    app.innerHTML = `
      <h1>수학</h1>
      <p class="lead">학년을 선택하세요.</p>
      ${MATH_GRADES.map(g => `
        <div class="group-title">${g.group}</div>
        <div class="grid">
          ${g.items.map(it => ready[it.id]
            ? `<a class="choice" href="#/math/${it.id}"><div class="name">${it.name}</div></a>`
            : `<div class="choice disabled"><div class="name">${it.name}</div><span class="badge">준비 중</span></div>`).join('')}
        </div>`).join('')}`;
  }

  function viewUnits(gradeId) {
    const data = readyGrades()[gradeId];
    if (!data) return go('#/math');
    setCrumbs([{ label: '과목', href: '#/' }, { label: '수학', href: '#/math' }, { label: data.gradeName }]);
    const parts = [...new Set(data.units.map(u => u.part))];
    app.innerHTML = `
      <h1>${data.gradeName} 수학</h1>
      <p class="lead">공부할 단원을 선택하세요.</p>
      ${parts.map(p => `
        <div class="group-title">${p}</div>
        <div class="grid wide">
          ${data.units.filter(u => u.part === p).map(u => `
            <a class="choice" href="#/math/${gradeId}/${u.id}">
              <div class="unit-num">${u.no}단원</div>
              <div class="name">${u.title}</div>
              <div class="meta">${u.summary}</div>
            </a>`).join('')}
        </div>`).join('')}`;
  }

  function viewUnit(gradeId, unitId) {
    const data = readyGrades()[gradeId];
    const unit = data && data.units.find(u => u.id === unitId);
    if (!unit) return go('#/math');
    setCrumbs([
      { label: '과목', href: '#/' }, { label: '수학', href: '#/math' },
      { label: data.gradeName, href: `#/math/${gradeId}` }, { label: unit.title },
    ]);
    const toc = unit.sections.map((s, i) => `<li><a href="#" data-jump="s${i}">${s.title}</a></li>`).join('');
    const hasGen = i => !!(window.GEN[unit.id] && window.GEN[unit.id][i]);

    app.innerHTML = fix(`
      <a class="back" href="#/math/${gradeId}">← 단원 목록</a>
      <div class="unit-head">
        <div class="part">${unit.part} · ${unit.no}단원</div>
        <h1>${unit.title}</h1>
        <p class="lead">${unit.summary}</p>
      </div>
      <ul class="toc">${toc}<li><a href="#" data-jump="ex">예제</a></li></ul>
      ${unit.sections.map((s, i) => `
        <section class="card" id="s${i}" data-si="${i}">
          <h2>${s.title}</h2>
          ${s.body}
          ${s.tip ? `<div class="tip"><strong class="label">TIP</strong>${s.tip}</div>` : ''}
          ${hasGen(i) ? `<a class="practice-btn" href="#/math/${gradeId}/${unit.id}/practice/${i}/0">✏️ 문제 풀기</a>` : ''}
        </section>`).join('')}
      <div class="section-label" id="ex">예제로 확인하기</div>
      ${unit.examples.map(e => `
        <details class="example">
          <summary>${e.q}<div class="hint">직접 풀어 본 뒤 눌러서 풀이를 확인하세요.</div></summary>
          <div class="answer">${e.a}</div>
        </details>`).join('')}
    `);

    app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', ev => {
      ev.preventDefault();
      document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  /* ---------- 시험지 ---------- */
  function viewPractice(gradeId, unitId, si, level) {
    const data = readyGrades()[gradeId];
    const unit = data && data.units.find(u => u.id === unitId);
    const sec = unit && unit.sections[si];
    if (!sec || !(window.GEN[unitId] && window.GEN[unitId][si])) return go('#/math');
    level = Math.min(2, Math.max(0, level | 0));
    setCrumbs([
      { label: '과목', href: '#/' }, { label: '수학', href: '#/math' },
      { label: data.gradeName, href: `#/math/${gradeId}` },
      { label: unit.title, href: `#/math/${gradeId}/${unitId}` }, { label: '문제 풀기' },
    ]);
    const pool = window.makePool(unitId, si, level + 1, TOTAL);
    const base = `#/math/${gradeId}/${unitId}/practice/${si}`;
    app.innerHTML = fix(`
      <a class="back" href="#/math/${gradeId}/${unitId}">← 개념으로 돌아가기</a>
      <div class="levels" style="margin-bottom:14px"><span class="lv-label">난이도</span>
        ${LEVELS.map((l, i) => `<a class="chip${i === level ? ' on' : ''}" href="${base}/${i}">${l}</a>`).join('')}
      </div>
      <article class="paper">
        <header class="paper-head">
          <div class="paper-title">${unit.title}</div>
          <div class="paper-sub">${sec.title} · ${LEVELS[level]}</div>
          <div class="paper-meta"><span>이름 ________</span><span>점수 ____ / ${pool.length}</span></div>
        </header>
        <div class="list"></div>
      </article>`);
    const list = app.querySelector('.list');
    let shown = 0;

    function showMore() {
      list.querySelectorAll('.more-row, .done-msg').forEach(n => n.remove());
      const to = Math.min(shown + STEP, pool.length);
      const frag = document.createDocumentFragment();
      for (let i = shown; i < to; i++) frag.appendChild(makeProblem(pool[i], i + 1));
      list.appendChild(frag);
      shown = to;
      const row = document.createElement('div');
      if (shown < pool.length) {
        row.className = 'more-row';
        row.innerHTML = `<button type="button" class="practice-btn">더 풀기 (${shown} / ${pool.length})</button>`;

      } else {
        row.className = 'done-msg';
        row.innerHTML = `🎉 ${LEVELS[level]} ${pool.length}문제를 모두 풀었어요!<br><a class="practice-btn ghost" href="${base}/${level}" onclick="setTimeout(function(){window.dispatchEvent(new HashChangeEvent('hashchange'))},0)">새 문제로 다시 풀기</a>`;
      }
      list.appendChild(row);
      typeset(list);
    }
    showMore();
  }

  function makeProblem(p, n) {
    const el = document.createElement('div');
    el.className = 'prob';
    el.innerHTML = `
      <div class="pq"><div class="pn">${n}.</div><div class="pt">${p.q}</div></div>
      <div class="tools">
        <button type="button" class="tool" data-t="pen">✏️ 연필</button>
        <button type="button" class="tool" data-t="eraser">🧽 지우개</button>
        <button type="button" class="tool" data-t="clear">전체 지우기</button>
        <button type="button" class="tool" data-t="grow">＋ 공간</button>
        <button type="button" class="tool solbtn" data-t="sol">정답·풀이 보기</button>
      </div>
      <div class="work"><span class="ph">여기에 풀이를 적어 보세요 (연필 버튼을 누르세요)</span><canvas class="ink"></canvas></div>
      <div class="sol" hidden>${p.a}</div>`;
    const work = el.querySelector('.work');
    const cv = el.querySelector('canvas');
    const ph = el.querySelector('.ph');
    const sol = el.querySelector('.sol');
    const ink = makeInk(cv, work);
    let mode = null; // 'pen' | 'eraser' | null

    function setMode(m) {
      mode = m;
      work.classList.toggle('pen', !!m);
      el.querySelector('[data-t="pen"]').classList.toggle('on', m === 'pen');
      el.querySelector('[data-t="eraser"]').classList.toggle('on', m === 'eraser');
      ink.setEraser(m === 'eraser');
    }
    el.querySelector('.tools').addEventListener('click', ev => {
      const b = ev.target.closest('.tool');
      if (!b) return;
      const t = b.dataset.t;
      if (t === 'pen') setMode(mode === 'pen' ? null : 'pen');
      else if (t === 'eraser') setMode(mode === 'eraser' ? null : 'eraser');
      else if (t === 'clear') { ink.clear(); ph.style.display = ''; }
      else if (t === 'grow') { work.style.height = (work.offsetHeight + 120) + 'px'; }
      else if (t === 'sol') {
        sol.hidden = !sol.hidden;
        b.textContent = sol.hidden ? '정답·풀이 보기' : '정답·풀이 숨기기';
        if (!sol.hidden) typeset(sol);
      }
    });
    cv.addEventListener('pointerdown', () => { ph.style.display = 'none'; });
    return el;
  }

  /* 캔버스 필기: 포인터 이벤트, 크기 변화 시 그림 유지 */
  function makeInk(cv, wrap) {
    const ctx = cv.getContext('2d');
    let eraser = false, drawing = false, last = null, w = 0, h = 0, dpr = 1;

    function resize() {
      const rw = wrap.clientWidth, rh = wrap.clientHeight;
      if (!rw || !rh || (rw === w && rh === h)) return;
      const keep = document.createElement('canvas');
      keep.width = cv.width; keep.height = cv.height;
      if (cv.width) keep.getContext('2d').drawImage(cv, 0, 0);
      dpr = window.devicePixelRatio || 1;
      w = rw; h = rh;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (keep.width) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(keep, 0, 0); ctx.restore(); }
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
    window.addEventListener('resize', resize);
    setTimeout(resize, 0);

    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function style() {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = eraser ? 22 : 2.2;
    }
    cv.addEventListener('pointerdown', e => {
      resize();
      drawing = true; last = pos(e);
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      style(); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .01, last.y + .01); ctx.stroke();
      e.preventDefault();
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      style();
      for (const ev of (evs.length ? evs : [e])) {
        const p = pos(ev);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
      }
      e.preventDefault();
    });
    const end = () => { drawing = false; last = null; };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', end);

    return {
      setEraser(v) { eraser = v; },
      clear() { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); },
    };
  }

  /* ---------- 라우터 ---------- */
  function go(hash) { location.hash = hash; }

  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (parts.length === 0) viewSubjects();
    else if (parts[0] === 'math' && parts.length === 1) viewGrades();
    else if (parts[0] === 'math' && parts.length === 2) viewUnits(parts[1]);
    else if (parts[0] === 'math' && parts[3] === 'practice') viewPractice(parts[1], parts[2], +parts[4], +parts[5] || 0);
    else if (parts[0] === 'math' && parts.length >= 3) viewUnit(parts[1], parts[2]);
    else viewSubjects();
    window.scrollTo(0, 0);
    typeset();
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('load', route);
  document.addEventListener('DOMContentLoaded', () => setTimeout(() => typeset(), 300));
})();

  </script>
